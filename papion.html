<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0d1f">
  <title>پاپیون — دیسکورد بدون محدودیت</title>
  <meta name="description" content="Papion: a free Windows app that opens up Discord, and more, without the hassle. It finds the fastest server by itself and keeps you connected.">
  <link rel="canonical" href="https://actually-aloy.github.io/site/papion">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Papion — Discord without limits">
  <meta property="og:description" content="A free Windows app that opens up Discord, and more, without the hassle. No limits. No cost. No hassle.">
  <meta property="og:url" content="https://actually-aloy.github.io/site/papion">
  <meta property="og:image" content="https://actually-aloy.github.io/site/papion-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Papion — Discord without limits">
  <meta name="twitter:description" content="A free Windows app that opens up Discord, and more, without the hassle. No limits. No cost. No hassle.">
  <meta name="twitter:image" content="https://actually-aloy.github.io/site/papion-og.jpg">
  <link rel="icon" href="papion-logo-on.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0d1f;
      --text: #f7f5ff;
      --muted: #bcb6d9;
      --line: rgba(226, 220, 255, 0.16);
      --violet: #7c5cfa;
      --violet-mid: #9a82ff;
      --violet-soft: #c9bcff;
      --indigo: #7c83fd;
      --teal: #4fd1c5;
      --pink: #ff7ab6;
      --ink: #14102a;
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 10%, rgba(124, 92, 250, 0.3), transparent 32%),
        radial-gradient(circle at 90% 14%, rgba(201, 188, 255, 0.1), transparent 28%),
        radial-gradient(circle at 52% 94%, rgba(79, 209, 197, 0.08), transparent 34%),
        var(--bg);
      animation: page-fade-in 0.4s ease-out;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    @keyframes page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    html[lang="fa"] body {
      font-family: Vazirmatn, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    .page {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .glass {
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 10px);
      background: linear-gradient(145deg, rgba(244, 241, 255, 0.105), rgba(244, 241, 255, 0.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(22px);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 400px);
      gap: 30px;
      padding: 28px;
      align-items: center;
    }

    .intro {
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .pill-btn:hover {
      background: rgba(244, 241, 255, 0.12);
      border-color: rgba(201, 188, 255, 0.45);
    }

    .pill-btn svg {
      width: 14px;
      height: 14px;
    }

    html[dir="rtl"] .pill-btn svg {
      transform: scaleX(-1);
    }

    .lang-toggle {
      margin-inline-start: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      width: 64px;
      height: 64px;
      flex: 0 0 auto;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(124, 92, 250, 0.45);
      -webkit-user-drag: none;
    }

    h1 {
      font-size: clamp(48px, 9vw, 92px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--violet-mid), var(--violet-soft), var(--pink), var(--violet-mid));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: enchant 6s linear infinite;
    }

    @keyframes enchant {
      to { background-position: -300% 0; }
    }

    .pitch {
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 6px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
    }

    .tag.hot {
      border-color: transparent;
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      color: var(--ink);
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 180ms ease, transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(244, 241, 255, 0.12);
      border-color: rgba(201, 188, 255, 0.45);
    }

    .btn.primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      color: var(--ink);
    }

    .btn.primary:hover {
      filter: brightness(1.06);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .btn:focus-visible,
    .pill-btn:focus-visible,
    .faq-q:focus-visible,
    .m-btn:focus-visible {
      outline: 2px solid var(--violet-soft);
      outline-offset: 3px;
    }

    .dl-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .dl-meta[hidden] {
      display: none;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 6% -6% 10%;
      z-index: 0;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(124, 92, 250, 0.5), rgba(124, 92, 250, 0));
      filter: blur(24px);
      pointer-events: none;
    }

    .mock {
      --a-bg: #14161c;
      --a-panel: #1b1e26;
      --a-panel-alt: #20232d;
      --a-border: #2a2e3a;
      --a-text: #e7e9f0;
      --a-muted: #8b90a3;
      --a-accent: #4fd1c5;
      --a-indigo: #7c83fd;
      --a-danger: #e0555f;
      --a-warn: #e0a83e;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      border: 1px solid var(--a-border);
      border-radius: 14px;
      background: var(--a-bg);
      color: var(--a-text);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(124, 92, 250, 0.18);
    }

    .m-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      background: var(--a-panel);
      border-bottom: 1px solid var(--a-border);
      direction: ltr;
    }

    .m-title-name {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-left: 10px;
      color: var(--a-muted);
      font-size: 11.5px;
      font-weight: 600;
    }

    .m-title-name img {
      width: 20px;
      height: 20px;
      display: block;
      transition: opacity 0.6s ease, filter 0.6s ease;
      -webkit-user-drag: none;
    }

    .mock[data-state="off"] .m-title-name img {
      opacity: 0.55;
      filter: saturate(0.35);
    }

    .m-title-btns {
      display: flex;
      height: 100%;
      color: var(--a-muted);
    }

    .m-title-btns span {
      width: 40px;
      display: grid;
      place-items: center;
    }

    .m-title-btns svg {
      width: 10px;
      height: 10px;
    }

    .m-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      padding: 30px 22px 22px;
      text-align: center;
    }

    .signal {
      position: relative;
      isolation: isolate;
      width: 104px;
      height: 104px;
      flex: none;
      margin: 6px 0 18px;
    }

    .signal::before {
      content: "";
      position: absolute;
      inset: -20px;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(closest-side, rgba(124, 92, 250, 0.55), rgba(124, 92, 250, 0));
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .signal img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-user-drag: none;
    }

    .signal .on-img {
      opacity: 0;
    }

    .signal.on .on-img {
      opacity: 1;
    }

    .signal.on::before {
      opacity: 1;
      transform: scale(1);
    }

    .signal.on {
      animation: settle 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .signal.busy::before {
      opacity: 0.5;
      transform: scale(0.92);
    }

    .signal.busy .on-img {
      animation: wake 1.8s ease-in-out infinite;
    }

    @keyframes wake {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.85; }
    }

    @keyframes settle {
      0% { transform: scale(0.94); }
      55% { transform: scale(1.045); }
      100% { transform: scale(1); }
    }

    @keyframes textin {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: none; }
    }

    .signal .ring {
      position: absolute;
      inset: 0;
      z-index: -1;
      border: 2px solid rgba(124, 92, 250, 0.6);
      border-radius: 26%;
      opacity: 0;
      pointer-events: none;
    }

    .signal.busy {
      animation: breathe 2.6s ease-in-out infinite;
    }

    .signal.busy .ring {
      animation: ripple 2.4s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
      will-change: transform, opacity;
    }

    .signal.busy .ring.r2 {
      animation-delay: 0.8s;
    }

    .signal.busy .ring.r3 {
      animation-delay: 1.6s;
    }

    .signal.on .ring {
      border-color: rgba(79, 209, 197, 0.75);
    }

    .signal.on .ring.r1 {
      animation: burst 1.1s ease-out 1 both;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    @keyframes ripple {
      0% { transform: scale(0.92); opacity: 0.5; }
      100% { transform: scale(1.85); opacity: 0; }
    }

    @keyframes burst {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    @keyframes sweep {
      to { transform: translateX(100%); }
    }

    .m-status {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }

    .m-sub {
      max-width: 320px;
      min-height: 44px;
      margin-top: 6px;
      color: var(--a-muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .m-status.swap,
    .m-sub.swap {
      animation: textin 0.4s ease both;
    }

    .m-btn {
      min-width: 220px;
      height: 46px;
      margin-top: 14px;
      padding: 0 28px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--a-accent);
      color: #08201d;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.35s, border-color 0.35s, color 0.35s;
    }

    .m-btn:hover {
      filter: brightness(1.08);
    }

    .m-btn.secondary {
      background: transparent;
      border-color: #3a3f4e;
      color: var(--a-text);
    }

    .m-btn.secondary:hover {
      filter: none;
      border-color: var(--a-danger);
      color: #f28b93;
    }

    .m-btn.hint {
      animation: ring 2.4s ease-out infinite;
    }

    .m-btn.busy {
      position: relative;
      overflow: hidden;
    }

    .m-btn.busy::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(100deg, transparent 25%, rgba(124, 131, 253, 0.28) 50%, transparent 75%);
      transform: translateX(-100%);
      animation: sweep 1.7s ease-in-out infinite;
    }

    @keyframes ring {
      0% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(79, 209, 197, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0); }
    }

    .m-slot {
      display: grid;
      justify-items: center;
      width: 100%;
      max-width: 340px;
      min-height: 84px;
      margin-top: 22px;
    }

    .m-slot > * {
      grid-area: 1 / 1;
    }

    .m-tagline {
      align-self: start;
      padding-top: 18px;
      visibility: hidden;
      color: var(--a-muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .m-tagline.show {
      visibility: visible;
    }

    .m-progress {
      align-self: start;
      width: 100%;
      padding-top: 18px;
      visibility: hidden;
    }

    .m-progress.show {
      visibility: visible;
    }

    .m-bar {
      height: 5px;
      overflow: hidden;
      border-radius: 3px;
      background: var(--a-panel-alt);
    }

    .m-bar span {
      position: relative;
      overflow: hidden;
      display: block;
      height: 100%;
      width: 0;
      border-radius: 3px;
      background: var(--a-indigo);
      transition: width 0.3s ease;
    }

    .m-bar span::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: translateX(-100%);
      animation: sweep 1.3s linear infinite;
    }

    .m-counts {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 9px;
      color: var(--a-muted);
      font-size: 12.5px;
    }

    .m-counts b {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .m-counts .ok b {
      color: var(--a-accent);
    }

    .m-counts .fail b {
      color: var(--a-danger);
    }

    .m-stats {
      display: flex;
      width: 100%;
      visibility: hidden;
      border: 1px solid var(--a-border);
      border-radius: 12px;
      background: var(--a-panel);
    }

    .m-stats.show {
      visibility: visible;
    }

    .m-cell {
      flex: 1;
      min-width: 0;
      padding: 10px 6px;
      text-align: center;
    }

    .m-cell + .m-cell {
      border-inline-start: 1px solid var(--a-border);
    }

    .m-cell .v {
      display: block;
      height: 21px;
      font-size: 15px;
      font-weight: 600;
      line-height: 21px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .m-cell .u {
      margin-inline-start: 3px;
      color: var(--a-muted);
      font-size: 10.5px;
      font-weight: 500;
    }

    .m-cell .k {
      display: block;
      margin-top: 2px;
      color: var(--a-muted);
      font-size: 12px;
    }

    .m-views {
      position: relative;
      height: 548px;
    }

    .m-view {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      visibility: hidden;
      opacity: 0;
      padding: 16px 18px 22px;
      scrollbar-width: thin;
      scrollbar-color: #2a2e3a transparent;
      transition: opacity 0.22s ease, visibility 0s linear 0.22s;
    }

    .mock[data-view="home"] #mv-home,
    .mock[data-view="dns"] #mv-dns,
    .mock[data-view="usage"] #mv-usage,
    .mock[data-view="set"] #mv-set {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.22s ease;
    }

    .m-view.m-home {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0;
    }

    .m-top {
      position: absolute;
      top: 12px;
      inset-inline: 14px;
      z-index: 2;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .m-round {
      flex: none;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--a-border);
      border-radius: 50%;
      background: var(--a-panel);
      color: var(--a-muted);
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.2, 1), color 0.15s, border-color 0.15s;
    }

    .m-round:hover {
      color: var(--a-text);
      border-color: var(--a-indigo);
      transform: scale(1.07);
    }

    .m-round:active {
      transform: scale(0.9);
    }

    .m-round svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .m-round:focus-visible,
    .m-back:focus-visible,
    .m-dns-tile:focus-visible,
    .m-dns-apply:focus-visible,
    .m-flush:focus-visible,
    .m-opt:focus-visible,
    .m-seg button:focus-visible {
      outline: 2px solid var(--a-indigo);
      outline-offset: 2px;
    }

    .m-home .m-body {
      flex: 1;
      min-height: 0;
      justify-content: center;
      padding: 44px 20px 4px;
    }

    .m-home .signal {
      margin: 0 0 14px;
    }

    .m-home .m-sub {
      min-height: 40px;
      margin-top: 4px;
      line-height: 1.55;
    }

    .m-home .m-btn {
      margin-top: 10px;
      height: 44px;
    }

    .m-home .m-slot {
      max-width: 360px;
      min-height: 118px;
      margin-top: 12px;
    }

    .m-home .m-tagline,
    .m-home .m-progress {
      padding-top: 12px;
    }

    .m-stats {
      flex-wrap: wrap;
    }

    .m-cell {
      padding: 8px 6px;
    }

    .m-cell .k {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .m-cell .k svg {
      width: 11px;
      height: 11px;
      flex: none;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .m-cell .k.dn svg {
      stroke: var(--a-indigo);
    }

    .m-cell .k.upl svg {
      stroke: var(--a-warn);
      transform: rotate(180deg);
    }

    .m-live {
      flex: 0 0 100%;
      padding: 8px 12px 6px;
      border-top: 1px solid var(--a-border);
    }

    .m-live svg {
      display: block;
      width: 100%;
      height: 30px;
      overflow: visible;
    }

    .m-live .lbase {
      stroke: var(--a-border);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .m-live .ll {
      fill: none;
      stroke-width: 1.7;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .m-live .ll.dn {
      stroke: var(--a-indigo);
    }

    .m-live .ll.upl {
      stroke: var(--a-warn);
    }

    .m-live .la.dn {
      fill: var(--a-indigo);
      opacity: 0.16;
    }

    .m-live .la.upl {
      fill: var(--a-warn);
      opacity: 0.12;
    }

    .m-live-cap {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 3px;
      direction: ltr;
      color: var(--a-muted);
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
    }

    .m-foot {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      margin: 0 20px 10px;
      padding-top: 5px;
      border-top: 1px solid var(--a-border);
    }

    .m-ver {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      direction: ltr;
      color: var(--a-muted);
      font-size: 9.5px;
      font-variant-numeric: tabular-nums;
    }

    .m-ver span:first-child {
      unicode-bidi: plaintext;
    }

    .m-ver-tag {
      padding: 0 8px;
      border: 1px solid #2f8f87;
      border-radius: 999px;
      background: rgba(79, 209, 197, 0.08);
      color: var(--a-accent);
      font-size: 9.5px;
      line-height: 1.6;
      unicode-bidi: plaintext;
    }

    .m-links {
      display: flex;
      gap: 16px;
      color: var(--a-muted);
    }

    .m-links svg {
      width: 18px;
      height: 18px;
      display: block;
      padding: 3px;
      box-sizing: content-box;
    }

    .m-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .m-head-title {
      font-size: 15px;
      font-weight: 600;
    }

    .m-back {
      position: relative;
      flex: none;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--a-border);
      border-radius: 50%;
      background: var(--a-panel);
      color: var(--a-muted);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.2, 1), border-color 0.15s, color 0.15s;
    }

    .m-back:hover {
      color: var(--a-text);
      border-color: var(--a-indigo);
      transform: scale(1.09);
    }

    .m-back:active {
      transform: scale(0.86);
    }

    .m-back svg {
      width: 14px;
      height: 14px;
    }

    [dir="rtl"] .m-back svg {
      transform: scaleX(-1);
    }

    .m-seg {
      position: relative;
      display: flex;
      flex: none;
      padding: 2px;
      gap: 3px;
      border: 1px solid var(--a-border);
      border-radius: 9px;
      background: var(--a-panel);
    }

    .m-seg::before {
      content: "";
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: var(--pill-x, 2px);
      width: var(--pill-w, 0px);
      border-radius: 7px;
      background: var(--a-indigo);
      box-shadow: 0 2px 8px -2px rgba(124, 131, 253, 0.55);
      transition: left 0.32s cubic-bezier(0.3, 0.8, 0.2, 1), width 0.32s cubic-bezier(0.3, 0.8, 0.2, 1);
    }

    .m-seg button {
      position: relative;
      z-index: 1;
      padding: 5px 13px;
      border: 0;
      border-radius: 7px;
      background: none;
      color: var(--a-muted);
      font-family: inherit;
      font-size: 11.5px;
      cursor: pointer;
      transition: color 0.25s;
    }

    .m-seg button.active {
      color: #fff;
    }

    .m-dns-hero {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      padding: 12px 14px;
      border: 1px solid var(--a-border);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(124, 131, 253, 0.1), rgba(79, 209, 197, 0.06));
    }

    .m-dns-hero.flash {
      animation: mFlash 0.9s ease-out;
    }

    @keyframes mFlash {
      0% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.55); }
      100% { box-shadow: 0 0 0 14px rgba(79, 209, 197, 0); }
    }

    .m-dns-ic {
      position: relative;
      flex: none;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(79, 209, 197, 0.16);
      color: var(--a-accent);
    }

    .m-dns-ic::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid currentColor;
      border-radius: 12px;
      opacity: 0;
      animation: mPulse 2.4s ease-out infinite;
    }

    @keyframes mPulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    .m-dns-ic svg {
      width: 19px;
      height: 19px;
    }

    .m-dns-txt {
      flex: 1;
      min-width: 0;
    }

    .m-dns-label {
      color: var(--a-muted);
      font-size: 11px;
    }

    .m-dns-cur {
      min-height: 25px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
    }

    .m-dns-curips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 15px;
      color: var(--a-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .m-dns-curips span,
    .m-dns-ips span {
      direction: ltr;
      unicode-bidi: isolate;
    }

    .m-flush {
      flex: none;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--a-border);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      color: var(--a-muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, transform 0.2s;
    }

    .m-flush:hover {
      color: var(--a-text);
      border-color: var(--a-indigo);
      transform: scale(1.07);
    }

    .m-flush svg {
      width: 15px;
      height: 15px;
    }

    .m-flush.spin svg {
      animation: mSpin 0.65s cubic-bezier(0.4, 0.1, 0.3, 1);
    }

    @keyframes mSpin {
      to { transform: rotate(360deg); }
    }

    .m-help {
      margin: 0 4px 12px;
      color: var(--a-muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .m-dns-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .m-dns-tile {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--a-border);
      border-radius: 14px;
      background: var(--a-panel);
      color: var(--a-text);
      font-family: inherit;
      text-align: start;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, transform 0.2s cubic-bezier(0.3, 0.7, 0.2, 1), box-shadow 0.22s;
    }

    .m-dns-tile:hover {
      border-color: #3a3f4e;
      transform: translateY(-2px);
    }

    .m-dns-tile:active {
      transform: scale(0.985);
    }

    .m-dns-tile.sel {
      border-color: var(--a-accent);
      background: rgba(79, 209, 197, 0.08);
      box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.12);
    }

    .m-dns-badge {
      flex: none;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s cubic-bezier(0.3, 1.5, 0.4, 1);
    }

    .m-dns-badge.sm {
      font-size: 10.5px;
    }

    .m-dns-tile.sel .m-dns-badge {
      transform: scale(1.1) rotate(-5deg);
    }

    .m-dns-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .m-dns-name {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 12.5px;
      font-weight: 600;
    }

    .m-dns-name span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .m-dns-tile.cur .m-dns-name::before {
      content: "";
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--a-accent);
    }

    .m-dns-ips {
      display: flex;
      flex-direction: column;
      color: var(--a-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
    }

    .m-dns-apply {
      position: relative;
      width: 100%;
      height: 40px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: var(--a-indigo);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, opacity 0.2s, transform 0.15s;
    }

    .m-dns-apply:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .m-dns-apply:active:not(:disabled) {
      transform: scale(0.985);
    }

    .m-dns-apply i {
      display: none;
      width: 14px;
      height: 14px;
      flex: none;
    }

    .m-dns-apply.loading i {
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: mSpin 0.7s linear infinite;
    }

    .m-dns-apply.loading:disabled {
      opacity: 0.85;
    }

    .m-dns-apply.done {
      background: var(--a-accent);
      color: #08201d;
      opacity: 1;
    }

    .m-dns-apply.done i {
      display: block;
    }

    .m-dns-apply.done i::before {
      content: "";
      display: block;
      width: 12px;
      height: 6px;
      border-bottom: 2.5px solid #08201d;
      border-left: 2.5px solid #08201d;
      transform: rotate(-45deg) translate(1px, -2px);
    }

    .m-dns-msg {
      min-height: 20px;
      margin: 10px 4px 0;
      color: var(--a-muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .m-dns-msg.ok {
      color: var(--a-accent);
    }

    .m-utop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 10px;
    }

    .m-ulive {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--a-muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .m-ulive i {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5b5f6e;
    }

    .m-ulive.on {
      color: var(--a-accent);
    }

    .m-ulive.on i {
      background: var(--a-accent);
      animation: mPulse 2s ease-out infinite;
    }

    .m-uhero {
      margin-bottom: 10px;
      padding: 14px 16px 12px;
      border: 1px solid var(--a-border);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(124, 131, 253, 0.1), rgba(79, 209, 197, 0.06));
    }

    .m-ulabel {
      color: var(--a-muted);
      font-size: 11.5px;
    }

    .m-unum {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 7px;
      margin: 2px 0 12px;
      direction: ltr;
      font-weight: 700;
    }

    [dir="rtl"] .m-unum {
      justify-content: flex-end;
    }

    .m-unum b {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .m-unum span {
      color: var(--a-muted);
      font-size: 14px;
      font-weight: 600;
    }

    .m-ratio + .m-ratio {
      margin-top: 10px;
    }

    .m-ratio-title {
      margin-bottom: 5px;
      color: var(--a-muted);
      font-size: 11px;
    }

    .m-ratio-bar {
      display: flex;
      height: 9px;
      overflow: hidden;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      direction: ltr;
    }

    .m-ratio-bar span {
      display: block;
      width: 0;
      height: 100%;
      transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .m-ratio-bar .b {
      margin-inline-start: 2px;
    }

    .m-ratio-legend {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 6px;
      font-size: 11.5px;
    }

    .m-lg {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .m-lg i {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 3px;
    }

    .m-lg em {
      color: var(--a-muted);
      font-style: normal;
      font-variant-numeric: tabular-nums;
    }

    #m-rroute .m-ratio-bar .a,
    #m-rroute .m-lg.a i,
    .m-uchart.m-route .m-ub-stack i:nth-child(1) {
      background: #4fd1c5;
    }

    #m-rroute .m-ratio-bar .b,
    #m-rroute .m-lg.b i,
    .m-uchart.m-route .m-ub-stack i:nth-child(2) {
      background: #6b7390;
    }

    #m-rdir .m-ratio-bar .a,
    #m-rdir .m-lg.a i,
    .m-uchart.m-dir .m-ub-stack i:nth-child(1) {
      background: #7c83fd;
    }

    #m-rdir .m-ratio-bar .b,
    #m-rdir .m-lg.b i,
    .m-uchart.m-dir .m-ub-stack i:nth-child(2) {
      background: #e0a83e;
    }

    .m-ucard {
      margin-bottom: 10px;
      padding: 12px 12px 10px;
      border: 1px solid var(--a-border);
      border-radius: 16px;
      background: var(--a-panel);
    }

    .m-ucard-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .m-umax {
      color: var(--a-muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .m-uplot {
      position: relative;
    }

    .m-uchart {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 3px;
      align-items: end;
      height: 120px;
      direction: ltr;
      background: repeating-linear-gradient(to top, transparent 0, transparent calc(25% - 1px), rgba(255, 255, 255, 0.06) calc(25% - 1px), rgba(255, 255, 255, 0.06) 25%);
    }

    .m-uaxis {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 3px;
      margin-top: 6px;
      direction: ltr;
      color: var(--a-muted);
      font-size: 10px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .m-uaxis span {
      min-width: 0;
      white-space: nowrap;
    }

    .m-ub {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
    }

    .m-ub::before {
      content: "";
      position: absolute;
      inset: 0 -1px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0);
      transition: background 0.15s;
    }

    .m-ub:hover::before {
      background: rgba(255, 255, 255, 0.06);
    }

    .m-ub-stack {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column-reverse;
      overflow: hidden;
      border-radius: 4px 4px 0 0;
      transform-origin: bottom;
      animation: mBarIn 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      animation-delay: calc(var(--i, 0) * 14ms);
    }

    .m-ub-stack i {
      display: block;
      width: 100%;
      transition: flex-grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes mBarIn {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    .m-utip {
      position: absolute;
      z-index: 5;
      min-width: 124px;
      padding: 7px 10px;
      border: 1px solid var(--a-border);
      border-radius: 10px;
      background: #0e1015;
      box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.8);
      font-size: 11px;
      line-height: 1.7;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.12s, transform 0.12s;
    }

    .m-utip.show {
      opacity: 1;
      transform: none;
    }

    .m-utip b {
      display: block;
      font-weight: 700;
    }

    .m-utip div {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--a-muted);
    }

    .m-utip div i {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 3px;
    }

    .m-utip div span {
      margin-inline-start: auto;
      padding-inline-start: 10px;
      color: var(--a-text);
      font-variant-numeric: tabular-nums;
    }

    .m-sites-title {
      font-size: 13px;
      font-weight: 700;
    }

    .m-site {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      overflow: hidden;
      border-radius: 9px;
    }

    .m-site::before {
      content: "";
      position: absolute;
      inset: 0;
      width: var(--w, 0%);
      border-radius: 9px;
      background: rgba(124, 131, 253, 0.1);
    }

    .m-site > * {
      position: relative;
    }

    .m-site-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-align: start;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .m-site-size {
      flex: none;
      color: var(--a-muted);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
    }

    .m-sites-empty {
      padding: 10px 4px 4px;
      color: var(--a-muted);
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    .m-unote {
      margin: 10px 4px 0;
      color: var(--a-muted);
      font-size: 11px;
      line-height: 1.8;
    }

    .m-sec {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 4px 9px;
      color: var(--a-muted);
      font-size: 11.5px;
      font-weight: 700;
    }

    .m-sec:first-of-type {
      margin-top: 2px;
    }

    .m-sec::before {
      content: "";
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--a-accent);
    }

    .m-group {
      overflow: hidden;
      border: 1px solid var(--a-border);
      border-radius: 14px;
      background: var(--a-panel);
    }

    .m-row {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 48px;
      padding: 9px 14px;
    }

    .m-row + .m-row {
      border-top: 1px solid var(--a-border);
    }

    .m-ri {
      flex: none;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
    }

    .m-ri svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .m-ri.teal {
      background: rgba(79, 209, 197, 0.13);
      color: var(--a-accent);
    }

    .m-ri.violet {
      background: rgba(124, 131, 253, 0.14);
      color: var(--a-indigo);
    }

    .m-ri.amber {
      background: rgba(224, 168, 62, 0.14);
      color: var(--a-warn);
    }

    .m-rt {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: start;
    }

    .m-rtitle {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.5;
    }

    .m-rsub {
      color: var(--a-muted);
      font-size: 10.5px;
      line-height: 1.7;
    }

    .m-switch {
      position: relative;
      flex: none;
      width: 38px;
      height: 22px;
    }

    .m-switch input {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .m-slider {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: var(--a-border);
      transition: background 0.2s;
    }

    .m-slider::before {
      content: "";
      position: absolute;
      top: 3px;
      inset-inline-start: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: inset-inline-start 0.22s cubic-bezier(0.3, 0.8, 0.3, 1), background 0.2s;
    }

    .m-switch input:checked + .m-slider {
      background: #2f8f87;
    }

    .m-switch input:checked + .m-slider::before {
      inset-inline-start: 19px;
      background: var(--a-accent);
    }

    .m-switch input:focus-visible + .m-slider {
      outline: 2px solid var(--a-indigo);
      outline-offset: 2px;
    }

    .m-modes {
      display: grid;
      gap: 8px;
    }

    .m-opt {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 11px 14px 10px;
      border: 1px solid var(--a-border);
      border-radius: 14px;
      background: var(--a-panel);
      color: var(--a-text);
      font-family: inherit;
      text-align: start;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.12s;
    }

    .m-opt:hover {
      border-color: #3a3f4e;
    }

    .m-opt:active {
      transform: scale(0.99);
    }

    .m-opt.active {
      border-color: var(--a-accent);
      background: linear-gradient(180deg, rgba(79, 209, 197, 0.11), rgba(79, 209, 197, 0.03));
    }

    .m-opt b {
      padding-inline-end: 24px;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.5;
    }

    .m-opt span {
      color: var(--a-muted);
      font-size: 10.5px;
      line-height: 1.7;
    }

    .m-opt::after {
      content: "";
      position: absolute;
      top: 12px;
      inset-inline-end: 12px;
      width: 16px;
      height: 16px;
      box-sizing: border-box;
      border: 2px solid var(--a-border);
      border-radius: 50%;
      transition: border-color 0.2s, background 0.2s;
    }

    .m-opt.active::after {
      border-color: var(--a-accent);
      background: radial-gradient(circle, var(--a-accent) 0 36%, transparent 40%);
    }

    .mock-note {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
    }

    section.block {
      margin-top: 38px;
      scroll-margin-top: 18px;
    }

    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 4px 14px;
    }

    .head h2 {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .head span {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .grid.three {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .grid.four {
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
    }

    .grid.cols3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    @media (max-width: 900px) {
      .grid.cols3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .grid.cols3 {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(244, 241, 255, 0.09), rgba(244, 241, 255, 0.04));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(18px);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(201, 188, 255, 0.42);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      position: relative;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: var(--ink);
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      box-shadow: 0 14px 30px rgba(124, 92, 250, 0.3);
    }

    .icon.teal {
      background: linear-gradient(135deg, var(--teal), var(--violet-soft));
      box-shadow: 0 14px 30px rgba(79, 209, 197, 0.2);
    }

    .icon svg {
      width: 22px;
      height: 22px;
    }

    .step-num {
      margin-inline-start: auto;
      color: rgba(201, 188, 255, 0.28);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .card-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-desc {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.75;
    }

    .services {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 24px;
    }

    .services p {
      max-width: 640px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .chip.main {
      border-color: transparent;
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      color: var(--ink);
    }

    .chip[hidden] {
      display: none;
    }

    .chip.pop {
      animation: chip-in 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: var(--d, 0ms);
    }

    .chip mark {
      background: none;
      color: var(--violet-soft);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .chip.main mark {
      color: var(--ink);
    }

    .svc-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
    }

    .svc-search {
      position: relative;
      flex: 1 1 280px;
      max-width: 380px;
    }

    .svc-search > svg {
      position: absolute;
      top: 50%;
      inset-inline-start: 15px;
      width: 17px;
      height: 17px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      transition: color 200ms ease;
    }

    .svc-search:focus-within > svg {
      color: var(--violet-soft);
    }

    .svc-search input {
      width: 100%;
      height: 44px;
      padding: 0 44px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.07);
      color: var(--text);
      font-family: inherit;
      font-size: 14.5px;
      outline: none;
      transition: border-color 200ms ease, box-shadow 200ms ease, background 200ms ease;
    }

    .svc-search input::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    .svc-search input:focus {
      border-color: var(--violet-mid);
      background: rgba(244, 241, 255, 0.1);
      box-shadow: 0 0 0 4px rgba(124, 92, 250, 0.2);
    }

    .svc-search input::-webkit-search-cancel-button,
    .svc-search input::-webkit-search-decoration {
      display: none;
      -webkit-appearance: none;
    }

    .svc-clear {
      position: absolute;
      top: 50%;
      inset-inline-end: 8px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: rgba(244, 241, 255, 0.1);
      color: var(--text);
      cursor: pointer;
      transition: background 180ms ease;
    }

    .svc-clear[hidden] {
      display: none;
    }

    .svc-clear:hover {
      background: rgba(244, 241, 255, 0.2);
    }

    .svc-clear svg {
      width: 13px;
      height: 13px;
    }

    .svc-count {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .svc-count.tick {
      animation: tick 240ms ease;
    }

    .svc-area {
      position: relative;
    }

    .svc-empty {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 6px;
      padding: 8px;
      text-align: center;
      animation: chip-in 300ms ease both;
    }

    .svc-empty[hidden] {
      display: none;
    }

    .svc-none {
      font-size: 15px;
      font-weight: 700;
    }

    .svc-none-hint {
      color: var(--muted);
      font-size: 13.5px;
    }

    @keyframes chip-in {
      from { opacity: 0; transform: translateY(8px) scale(0.92); }
      to { opacity: 1; transform: none; }
    }

    @keyframes tick {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: none; }
    }

    .faq {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .faq-item {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(244, 241, 255, 0.05);
      transition: border-color 240ms ease, background 240ms ease;
    }

    .faq-item:hover {
      border-color: rgba(201, 188, 255, 0.28);
    }

    .faq-item.open {
      border-color: rgba(201, 188, 255, 0.4);
      background: rgba(244, 241, 255, 0.08);
    }

    .faq-q {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      border: none;
      border-radius: 20px;
      background: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-align: start;
      cursor: pointer;
    }

    .faq-q:focus-visible {
      outline-offset: -2px;
    }

    .faq-icon {
      position: relative;
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      transition: transform 340ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .faq-icon::before,
    .faq-icon::after {
      content: "";
      position: absolute;
      inset-inline: 0;
      top: 50%;
      height: 2px;
      margin-top: -1px;
      border-radius: 2px;
      background: var(--violet-soft);
      transition: transform 340ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .faq-icon::after {
      transform: rotate(90deg);
    }

    .faq-item.open .faq-icon {
      transform: rotate(180deg);
    }

    .faq-item.open .faq-icon::after {
      transform: rotate(0deg);
    }

    .faq-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition: grid-template-rows 360ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 240ms ease, visibility 0s linear 360ms;
    }

    .faq-item.open .faq-panel {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
      transition: grid-template-rows 360ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 300ms ease 60ms, visibility 0s;
    }

    .faq-inner {
      min-height: 0;
      overflow: hidden;
    }

    .faq .answer {
      padding: 0 20px 18px;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.8;
    }

    .closing {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 28px;
    }

    .closing img {
      width: 72px;
      height: 72px;
      flex: 0 0 auto;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(124, 92, 250, 0.45);
      -webkit-user-drag: none;
    }

    .closing-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .closing h2 {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .closing p {
      max-width: 520px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .closing .cta-row {
      margin-top: 8px;
    }

    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 40px;
      text-align: center;
    }

    .made {
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }

    .heart {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin: 0 3px;
      vertical-align: -2px;
      color: var(--pink);
      animation: beat 1.8s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 60%, 100% { transform: scale(1); }
      20% { transform: scale(1.22); }
      40% { transform: scale(1.06); }
    }

    .legal {
      color: var(--muted);
      font-size: 12.5px;
      opacity: 0.8;
    }

    .home-link {
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(226, 220, 255, 0.24);
      color: var(--muted);
      font-size: 15px;
      letter-spacing: -0.01em;
      transition: color 180ms ease, border-color 180ms ease;
    }

    .home-link:hover {
      color: var(--text);
      border-color: rgba(201, 188, 255, 0.55);
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
      .gradient-text { animation: none; }
      .signal.on { animation: none; }
      .signal.busy .on-img { animation: none; opacity: 0.5; }
      .signal.busy, .signal.busy .ring, .signal.on .ring.r1, .m-btn.busy::after, .m-bar span::after { animation: none !important; }
      .signal .ring { display: none; }
      .m-status.swap, .m-sub.swap { animation: none; }
      .m-btn.hint { animation: none; }
      .chip.pop, .svc-count.tick, .svc-empty { animation: none; }
      .svc-search input, .svc-search > svg, .svc-clear { transition: none; }
      .heart { animation: none; }
      .m-bar span { transition: none; }
      .faq-item, .faq-icon, .faq-icon::before, .faq-icon::after, .faq-panel, .card, .btn {
        transition: none !important;
      }
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 22px, 1080px);
        padding-top: 18px;
      }

      .hero,
      .closing {
        padding: 16px;
        border-radius: 28px;
      }

      .intro {
        gap: 18px;
      }

      .head {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }

      .btn {
        width: 100%;
      }

      .closing {
        flex-direction: column;
        align-items: flex-start;
      }

      .services {
        padding: 18px;
      }
    }
  </style>
</head>

      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      const num = i === 0 ? String(Math.floor(v)) : (v < 10 ? v.toFixed(1) : String(Math.round(v)));
      return [fmt(num.replace('.', currentLang === 'fa' ? '٫' : '.')), units[i]];
    }

    function bytes(n, units) {
      const [a, b] = split(n, units);
      return '<span>' + a + '</span><span class="u">' + b + '</span>';
    }

    function plain(n, units) {
      const [a, b] = split(n, units);
      return a + ' ' + b;
    }

    function clock(s) {
      const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
      const two = n => (n < 10 ? '0' : '') + n;
      return fmt((h ? two(h) + ':' : '') + two(m) + ':' + two(x));
    }

      const line = 'M' + pts.join('L');

    function rng(seed) {
      let s = seed;
      return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    }

    function usageBuckets(range) {
      const n = range === 'day' ? 24 : range === 'week' ? 7 : 30;
      const r = rng(range === 'day' ? 11 : range === 'week' ? 29 : 47);
      const scale = range === 'day' ? 420e6 : range === 'week' ? 5.4e9 : 3.2e9;
      const nowH = new Date().getHours();
      const out = [];
      for (let i = 0; i < n; i++) {
        let w = 0.35 + r() * 0.65;
        if (range === 'day') {
          const h = (nowH - (n - 1) + i + 24) % 24;
          w = h < 6 ? 0.06 + r() * 0.12 : h < 10 ? 0.25 + r() * 0.3 : h < 17 ? 0.4 + r() * 0.35 : 0.7 + r() * 0.3;
        }
        const total = Math.round(w * scale);
        const p = 0.55 + r() * 0.3;
        const d = 0.86 + r() * 0.07;
        out.push({ total, a: total * p, b: total * (1 - p), down: total * d, up: total * (1 - d) });
      }
      return out;
    }

    function usageLabels(range, t) {
      const loc = currentLang === 'fa' ? 'fa-IR' : 'en-US';
      const n = range === 'day' ? 24 : range === 'week' ? 7 : 30;
      const now = new Date();
      const out = [];
      for (let i = 0; i < n; i++) {
        if (range === 'day') {
          const h = (now.getHours() - (n - 1) + i + 24) % 24;
          const two = x => fmt((x < 10 ? '0' : '') + x);
          out.push({ axis: i % 4 === 3 ? two(h) : '', tip: two(h) + ':00 – ' + two((h + 1) % 24) + ':00' });
        } else {
          const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (n - 1 - i));
          const full = d.toLocaleDateString(loc, { weekday: 'short', day: 'numeric', month: 'short' });
          const axis = range === 'week' ? d.toLocaleDateString(loc, { weekday: 'short' }) : ((n - 1 - i) % 5 === 0 ? d.toLocaleDateString(loc, { day: 'numeric' }) : '');
          out.push({ axis, tip: full });
        }
      }
      return out;
    }

    function paintChartParts() {
      const route = U.mode === 'route';
      const max = Math.max(...U.buckets.map(x => x.total));
      const stacks = $('m-uchart').querySelectorAll('.m-ub-stack');
      U.buckets.forEach((x, i) => {
        const s = stacks[i];

        s.style.height = (x.total / max * 100) + '%';
        s.children[0].style.flexGrow = route ? x.a : x.down;
        s.children[1].style.flexGrow = route ? x.b : x.up;
      });

    }

      const [n, u] = split(total, t.units);

      $('m-umax').textContent = t.max(plain(max, t.units));
      $('m-uchart').innerHTML = U.buckets.map((x, i) => '<div class="m-ub" data-i="' + i + '"><div class="m-ub-stack" style="--i:' + i + '"><i></i><i></i></div></div>').join('');

      buildSeg('m-umode', [['route', t.route], ['dir', t.direction]], U.mode, k => { U.mode = k; paintChartParts(); });

      paintUsageLive();
    }

    function stopTimer() {

    function startOn() {
      stopTimer();
      mock.state = 'on';
      mock.secs = 0;
      mock.down = 0;
      mock.up = 0;
      mock.hd = zeros();
      mock.hu = zeros();
      mock.timer = setInterval(() => {
        mock.secs++;
        const s = mock.secs;
        const wave = 0.5 + 0.5 * Math.sin(s * 0.55) * Math.cos(s * 0.21);
        const burst = s % 13 < 3 ? 1.8 : 1;
        const dr = Math.round((250000 + (s * 37311) % 260000 + wave * 900000) * burst);
        const ur = Math.round((18000 + (s * 7919) % 42000 + wave * 60000) * (burst > 1 ? 1.5 : 1));
        mock.hd.push(dr);
        mock.hd.shift();
        mock.hu.push(ur);
        mock.hu.shift();
        mock.down += dr;
        mock.up += ur;
        paintMock();
        if (mock.view === 'usage') {
          if (!$('m-sites').children.length) buildSites(); else paintSites();
        }
      }, 1000);
      paintMock();
    }

    function startWorking() {
      stopTimer();
      mock.state = 'working';
      mock.tested = 0;
      mock.ok = 0;
      mock.fail = 0;
      mock.timer = setInterval(() => {
        mock.tested++;
        if (OK_PATTERN[mock.tested - 1]) mock.ok++; else mock.fail++;
        if (mock.tested >= TOTAL) { startOn(); return; }
        paintMock();
      }, reduceMotion ? 60 : 170);
      paintMock();
    }

    const SVC_ALIASES = {
      'YouTube': ['یوتیوب', 'yt'],
      'Twitch': ['توییچ', 'تویچ'],
      'Instagram': ['اینستاگرام', 'اینستا', 'ig'],
      'Threads': ['تردز', 'ترد'],
      'X': ['twitter', 'tweet', 'توییتر', 'ایکس'],
      'WhatsApp': ['واتساپ', 'واتس اپ', 'wa'],
      'ChatGPT': ['چت جی پی تی', 'چت', 'gpt', 'openai'],
      'Gemini': ['جمینای', 'google', 'گوگل', 'bard'],
      'Reddit': ['ردیت'],
      'Bluesky': ['بلواسکای', 'bsky'],
      'Mega.nz': ['مگا', 'mega'],
      'NotebookLM': ['نوت بوک', 'notebook', 'google'],
      'Claude': ['کلود', 'anthropic'],
      'Kryptex': ['کریپتکس', 'miner'],
      'Pinterest': ['پینترست'],
      'DeviantArt': ['دویانت آرت', 'دیویانت', 'deviant'],
      'Kimi': ['کیمی', 'moonshot'],
      'LM Studio': ['ال ام استودیو', 'lmstudio'],
      'Epic Games': ['اپیک گیمز', 'اپیک', 'epic'],
      'GTA5-Mods': ['gta', 'جی تی ای', 'mods', 'مد'],
      'hCaptcha': ['کپچا', 'captcha'],
      'Java': ['جاوا'],
      'Spotify': ['اسپاتیفای'],
      'Giphy': ['گیفی', 'گیف', 'gif'],
      'Tenor': ['تنور', 'gif', 'گیف'],
      'Microsoft': ['مایکروسافت', 'ms'],
      'Telegram': ['تلگرام', 'tg']
    };

    const norm = s => String(s).toLowerCase().replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/[\u200c\u200d\u00a0\s._\-+]/g, '');

    let svcEntries = [];
    let svcSig = '';

    function hl(label, raw) {
      const r = raw.trim().toLowerCase();
      const i = r ? label.toLowerCase().indexOf(r) : -1;
      if (i < 0) return esc(label);
      return esc(label.slice(0, i)) + '<mark>' + esc(label.slice(i, i + r.length)) + '</mark>' + esc(label.slice(i + r.length));
    }

    function filterServices(init) {
      const t = I18N[currentLang];
      const input = $('svc-q'), area = $('svc-area'), chipsEl = $('svc-chips');
      const raw = input.value, q = norm(raw);
      const chips = Array.prototype.slice.call(chipsEl.children);
      area.style.minHeight = '';
      if (q) {
        chips.forEach(c => { c.hidden = false; });
        area.style.minHeight = area.offsetHeight + 'px';
      }
      const visible = [];
      chips.forEach((c, i) => {
        const hit = !q || svcEntries[i].keys.some(k => k.indexOf(q) !== -1);
        c.hidden = !hit;
        if (hit) {
          c.innerHTML = hl(svcEntries[i].label, raw);
          visible.push(c);
        }
      });
      $('svc-clear').hidden = !raw;
      const empty = visible.length === 0;
      $('svc-empty').hidden = !empty;
      if (empty) {
        const none = $('svc-none');
        const shown = raw.trim().length > 24 ? raw.trim().slice(0, 24) + '…' : raw.trim();
        const word = document.createElement('bdi');
        word.textContent = shown;
        none.textContent = '';
        none.append(t.svcNone[0], word, t.svcNone[1]);
        $('svc-none-hint').textContent = t.svcNoneHint;
      }
      const sig = visible.map(c => c.dataset.i).join(',');
      const count = $('svc-count');
      count.textContent = t.svcCount(fmt(visible.length), fmt(chips.length));
      if (!init && sig !== svcSig && !reduceMotion) {
        visible.forEach((c, k) => {
          c.classList.remove('pop');
          c.style.setProperty('--d', Math.min(k, 16) * 22 + 'ms');
        });
        void chipsEl.offsetWidth;
        visible.forEach(c => c.classList.add('pop'));
        count.classList.remove('tick');
        void count.offsetWidth;
        count.classList.add('tick');
      }
      svcSig = sig;
    }

    function renderServices(t) {
      const prev = $('svc-q') ? $('svc-q').value : '';
      svcEntries = [{ label: t.svcMain, main: true, keys: ['discord', 'دیسکورد'].map(norm) }].concat(
        SERVICES.map(s => ({ label: s, main: false, keys: [s].concat(SVC_ALIASES[s] || []).map(norm) }))
      );
      $('svc-card').innerHTML = `
        <p>${tx(t.svcText)}</p>
        <div class="svc-tools" role="search">
          <div class="svc-search">
            ${svg('search')}
            <input id="svc-q" type="search" placeholder="${esc(t.svcSearch)}" aria-label="${esc(t.svcSearch)}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
            <button type="button" class="svc-clear" id="svc-clear" aria-label="${esc(t.svcClear)}" hidden>${svg('close')}</button>
          </div>
          <span class="svc-count" id="svc-count" aria-live="polite"></span>
        </div>
        <div class="svc-area" id="svc-area">
          <div class="chips" id="svc-chips">
            ${svcEntries.map((e, i) => `<span class="chip${e.main ? ' main' : ''}"${e.main ? '' : ' dir="ltr"'} data-i="${i}">${esc(e.label)}</span>`).join('')}
          </div>
          <div class="svc-empty" id="svc-empty" hidden>
            <div class="svc-none" id="svc-none"></div>
            <div class="svc-none-hint" id="svc-none-hint"></div>
          </div>
        </div>
      `;
      const input = $('svc-q');
      input.value = prev;
      input.addEventListener('input', () => filterServices(false));
      input.addEventListener('keydown', e => {
        if (e.key === 'Escape' && input.value) {
          e.preventDefault();
          input.value = '';
          filterServices(false);
        }
      });
      $('svc-clear').addEventListener('click', () => {
        input.value = '';
        filterServices(false);
        input.focus();
      });
      svcSig = '';
      filterServices(true);
    }

    function renderFaq(t) {
      $('faq-list').innerHTML = t.faq.map(([q, a], i) => `
        <div class="faq-item">
          <button type="button" class="faq-q" id="faq-q-${i}" aria-expanded="false" aria-controls="faq-a-${i}">
            <span>${tx(q)}</span>
            <span class="faq-icon" aria-hidden="true"></span>
          </button>
          <div class="faq-panel" id="faq-a-${i}" role="region" aria-labelledby="faq-q-${i}">
            <div class="faq-inner"><div class="answer">${tx(a)}</div></div>
          </div>
        </div>`).join('');
    }

    $('faq-list').addEventListener('click', e => {
      const btn = e.target.closest('.faq-q');
      if (!btn) return;
      const item = btn.parentElement;
      const open = item.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    });

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      const t = I18N[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;
      document.title = t.docTitle;

      setTx('back-text', t.back);
      setTx('hero-title', t.heroTitle);
      setTx('hero-pitch', t.pitch);
      $('hero-tags').innerHTML = t.tags.map((x, i) => `<span class="tag${i === 0 ? ' hot' : ''}">${tx(x)}</span>`).join('');
      document.querySelectorAll('[data-dl-label]').forEach(el => { el.textContent = t.download; });
      setTx('cta-github', t.github);
      paintRelease();
      paintMock();

      setTx('how-title', t.howTitle);
      setTx('how-sub', t.howSub);
      renderHow(t);

      setTx('feat-title', t.featTitle);
      setTx('feat-sub', t.featSub);
      renderFeatures(t);

      setTx('svc-title', t.svcTitle);
      setTx('svc-sub', t.svcSub);
      renderServices(t);

      setTx('faq-title', t.faqTitle);
      setTx('faq-sub', t.faqSub);
      renderFaq(t);

      setTx('end-title', t.endTitle);
      setTx('end-text', t.endText);
      setTx('end-discord', t.endDiscord);
      setTx('end-telegram', t.endTelegram);
      setTx('footer-home', t.footerHome);
      $('made-by').innerHTML = t.madeBy.split('{heart}').map(tx).join(HEART);
    }

    $('lang-toggle').addEventListener('click', () => {
      $('lang-toggle').blur();
      applyLanguage(currentLang === 'en' ? 'fa' : 'en');
    });

    applyLanguage(currentLang);

    LatestRelease.latest(REPO).then(d => {
      release = d;
      paintRelease();
    });
  </script>
</body>
</html>

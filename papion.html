<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0d1f">
  <title>پاپیون — دیسکورد بدون محدودیت</title>

  <link rel="canonical" href="https://actually-aloy.github.io/site/papion">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:title" content="پاپیون — دیسکورد بدون محدودیت">
  <meta property="og:description" content="برنامه‌ی رایگان ویندوز برای باز کردن دیسکورد و خیلی سرویس دیگه، بدون دردسر. بدون محدودیت، بدون هزینه، بدون دردسر.">
  <meta property="og:url" content="https://actually-aloy.github.io/site/papion">
  <meta property="og:image" content="https://actually-aloy.github.io/site/papion-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="پاپیون — دیسکورد بدون محدودیت">
  <meta name="twitter:description" content="برنامه‌ی رایگان ویندوز برای باز کردن دیسکورد و خیلی سرویس دیگه، بدون دردسر. بدون محدودیت، بدون هزینه، بدون دردسر.">
  <meta name="twitter:image" content="https://actually-aloy.github.io/site/papion-og.jpg">
  <link rel="icon" href="papion-logo-on.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0d1f;
      --text: #f7f5ff;
      --muted: #bcb6d9;
      --line: rgba(226, 220, 255, 0.16);
      --violet: #7c5cfa;
      --violet-mid: #9a82ff;
      --violet-soft: #c9bcff;
      --indigo: #7c83fd;
      --teal: #4fd1c5;
      --pink: #ff7ab6;
      --ink: #14102a;
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 10%, rgba(124, 92, 250, 0.3), transparent 32%),
        radial-gradient(circle at 90% 14%, rgba(201, 188, 255, 0.1), transparent 28%),
        radial-gradient(circle at 52% 94%, rgba(79, 209, 197, 0.08), transparent 34%),
        var(--bg);
      animation: page-fade-in 0.4s ease-out;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    @keyframes page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    html[lang="fa"] body {
      font-family: Vazirmatn, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    .page {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .glass {
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 10px);
      background: linear-gradient(145deg, rgba(244, 241, 255, 0.105), rgba(244, 241, 255, 0.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(22px);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 26px;
      padding: 28px;
      align-items: center;
    }

    .intro {
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .pill-btn:hover {
      background: rgba(244, 241, 255, 0.12);
      border-color: rgba(201, 188, 255, 0.45);
    }

    .pill-btn svg {
      width: 14px;
      height: 14px;
    }

    html[dir="rtl"] .pill-btn svg {
      transform: scaleX(-1);
    }

    .lang-toggle {
      margin-inline-start: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      width: 64px;
      height: 64px;
      flex: 0 0 auto;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(124, 92, 250, 0.45);
      -webkit-user-drag: none;
    }

    h1 {
      font-size: clamp(48px, 9vw, 92px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--violet-mid), var(--violet-soft), var(--pink), var(--violet-mid));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: enchant 6s linear infinite;
    }

    @keyframes enchant {
      to { background-position: -300% 0; }
    }

    .pitch {
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 6px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
    }

    .tag.hot {
      border-color: transparent;
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      color: var(--ink);
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 180ms ease, transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(244, 241, 255, 0.12);
      border-color: rgba(201, 188, 255, 0.45);
    }

    .btn.primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      color: var(--ink);
    }

    .btn.primary:hover {
      filter: brightness(1.06);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .btn:focus-visible,
    .pill-btn:focus-visible,
    .faq-q:focus-visible {
      outline: 2px solid var(--violet-soft);
      outline-offset: 3px;
    }

    .dl-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .dl-meta[hidden] {
      display: none;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 6% -6% 10%;
      z-index: 0;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(124, 92, 250, 0.5), rgba(124, 92, 250, 0));
      filter: blur(24px);
      pointer-events: none;
    }

    .app-demo {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      height: 660px;
      overflow: hidden;
      direction: ltr;
      border: 1px solid rgba(244, 241, 255, 0.14);
      border-radius: 14px;
      background: #14161c;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    .app-frame {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 720px;
      height: 660px;
      max-width: none;
      border: 0;
      background: #14161c;
      transform-origin: 0 0;
    }

    .demo-note {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
    }

    section.block {
      margin-top: 38px;
      scroll-margin-top: 18px;
    }

    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 4px 14px;
    }

    .head h2 {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .head span {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .grid.three {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .grid.four {
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
    }

    .grid.cols3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    @media (max-width: 900px) {
      .grid.cols3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .grid.cols3 {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(244, 241, 255, 0.09), rgba(244, 241, 255, 0.04));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(18px);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(201, 188, 255, 0.42);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      position: relative;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: var(--ink);
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      box-shadow: 0 14px 30px rgba(124, 92, 250, 0.3);
    }

    .icon.teal {
      background: linear-gradient(135deg, var(--teal), var(--violet-soft));
      box-shadow: 0 14px 30px rgba(79, 209, 197, 0.2);
    }

    .icon svg {
      width: 22px;
      height: 22px;
    }

    .step-num {
      margin-inline-start: auto;
      color: rgba(201, 188, 255, 0.28);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .card-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-desc {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.75;
    }

    .services {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 24px;
    }

    .services p {
      max-width: 640px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .chip.main {
      border-color: transparent;
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      color: var(--ink);
    }

    .chip[hidden] {
      display: none;
    }

    .chip.pop {
      animation: chip-in 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: var(--d, 0ms);
    }

    .chip mark {
      background: none;
      color: var(--violet-soft);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .chip.main mark {
      color: var(--ink);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding-block: 6px;
      padding-inline: 6px 14px;
      border-radius: 14px;
    }

    .chip-badge {
      flex: none;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .chip-badge svg {
      width: 16px;
      height: 16px;
      display: block;
      fill: #fff;
    }

    .chip-label {
      white-space: nowrap;
    }

    .svc-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
    }

    .svc-search {
      position: relative;
      flex: 1 1 280px;
      max-width: 380px;
    }

    .svc-search > svg {
      position: absolute;
      top: 50%;
      inset-inline-start: 15px;
      width: 17px;
      height: 17px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      transition: color 200ms ease;
    }

    .svc-search:focus-within > svg {
      color: var(--violet-soft);
    }

    .svc-search input {
      width: 100%;
      height: 44px;
      padding: 0 44px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.07);
      color: var(--text);
      font-family: inherit;
      font-size: 14.5px;
      outline: none;
      transition: border-color 200ms ease, box-shadow 200ms ease, background 200ms ease;
    }

    .svc-search input::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    .svc-search input:focus {
      border-color: var(--violet-mid);
      background: rgba(244, 241, 255, 0.1);
      box-shadow: 0 0 0 4px rgba(124, 92, 250, 0.2);
    }

    .svc-search input::-webkit-search-cancel-button,
    .svc-search input::-webkit-search-decoration {
      display: none;
      -webkit-appearance: none;
    }

    .svc-clear {
      position: absolute;
      top: 50%;
      inset-inline-end: 8px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: rgba(244, 241, 255, 0.1);
      color: var(--text);
      cursor: pointer;
      transition: background 180ms ease;
    }

    .svc-clear[hidden] {
      display: none;
    }

    .svc-clear:hover {
      background: rgba(244, 241, 255, 0.2);
    }

    .svc-clear svg {
      width: 13px;
      height: 13px;
    }

    .svc-count {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .svc-count.tick {
      animation: tick 240ms ease;
    }

    .svc-area {
      position: relative;
    }

    .svc-empty {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 6px;
      padding: 8px;
      text-align: center;
      animation: chip-in 300ms ease both;
    }

    .svc-empty[hidden] {
      display: none;
    }

    .svc-none {
      font-size: 15px;
      font-weight: 700;
    }

    .svc-none-hint {
      color: var(--muted);
      font-size: 13.5px;
    }

    @keyframes chip-in {
      from { opacity: 0; transform: translateY(8px) scale(0.92); }
      to { opacity: 1; transform: none; }
    }

    @keyframes tick {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: none; }
    }

    .faq {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .faq-item {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(244, 241, 255, 0.05);
      transition: border-color 240ms ease, background 240ms ease;
    }

    .faq-item:hover {
      border-color: rgba(201, 188, 255, 0.28);
    }

    .faq-item.open {
      border-color: rgba(201, 188, 255, 0.4);
      background: rgba(244, 241, 255, 0.08);
    }

    .faq-q {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      border: none;
      border-radius: 20px;
      background: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-align: start;
      cursor: pointer;
    }

    .faq-q:focus-visible {
      outline-offset: -2px;
    }

    .faq-icon {
      position: relative;
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      transition: transform 340ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .faq-icon::before,
    .faq-icon::after {
      content: "";
      position: absolute;
      inset-inline: 0;
      top: 50%;
      height: 2px;
      margin-top: -1px;
      border-radius: 2px;
      background: var(--violet-soft);
      transition: transform 340ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .faq-icon::after {
      transform: rotate(90deg);
    }

    .faq-item.open .faq-icon {
      transform: rotate(180deg);
    }

    .faq-item.open .faq-icon::after {
      transform: rotate(0deg);
    }

    .faq-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition: grid-template-rows 360ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 240ms ease, visibility 0s linear 360ms;
    }

    .faq-item.open .faq-panel {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
      transition: grid-template-rows 360ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 300ms ease 60ms, visibility 0s;
    }

    .faq-inner {
      min-height: 0;
      overflow: hidden;
    }

    .faq .answer {
      padding: 0 20px 18px;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.8;
    }

    .closing {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 28px;
    }

    .closing img {
      width: 72px;
      height: 72px;
      flex: 0 0 auto;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(124, 92, 250, 0.45);
      -webkit-user-drag: none;
    }

    .closing-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .closing h2 {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .closing p {
      max-width: 520px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .closing .cta-row {
      margin-top: 8px;
    }

    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 40px;
      text-align: center;
    }

    .made {
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }

    .heart {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin: 0 3px;
      vertical-align: -2px;
      color: var(--pink);
      animation: beat 1.8s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 60%, 100% { transform: scale(1); }
      20% { transform: scale(1.22); }
      40% { transform: scale(1.06); }
    }

    .legal {
      color: var(--muted);
      font-size: 12.5px;
      opacity: 0.8;
    }

    .home-link {
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(226, 220, 255, 0.24);
      color: var(--muted);
      font-size: 15px;
      letter-spacing: -0.01em;
      transition: color 180ms ease, border-color 180ms ease;
    }

    .home-link:hover {
      color: var(--text);
      border-color: rgba(201, 188, 255, 0.55);
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
      .gradient-text { animation: none; }
      .chip.pop, .svc-count.tick, .svc-empty { animation: none; }
      .svc-search input, .svc-search > svg, .svc-clear { transition: none; }
      .heart { animation: none; }
      .faq-item, .faq-icon, .faq-icon::before, .faq-icon::after, .faq-panel, .card, .btn {
        transition: none !important;
      }
    }

      if (i < 0) return esc(label);
      return esc(label.slice(0, i)) + '<mark>' + esc(label.slice(i, i + r.length)) + '</mark>' + esc(label.slice(i + r.length));
    }

    function filterServices(init) {
      const t = I18N[currentLang];
      const input = $('svc-q'), area = $('svc-area'), chipsEl = $('svc-chips');
      const raw = input.value, q = norm(raw);
      const chips = Array.prototype.slice.call(chipsEl.children);
      area.style.minHeight = '';
      if (q) {
        chips.forEach(c => { c.hidden = false; });
        area.style.minHeight = area.offsetHeight + 'px';
      }
      const visible = [];
      chips.forEach((c, i) => {
        const hit = !q || svcEntries[i].keys.some(k => k.indexOf(q) !== -1);
        c.hidden = !hit;
        if (hit) {
          c.querySelector('.chip-label').innerHTML = hl(svcEntries[i].label, raw);
          visible.push(c);
        }
      });
      $('svc-clear').hidden = !raw;
      const empty = visible.length === 0;
      $('svc-empty').hidden = !empty;
      if (empty) {
        const none = $('svc-none');
        const shown = raw.trim().length > 24 ? raw.trim().slice(0, 24) + '…' : raw.trim();
        const word = document.createElement('bdi');
        word.textContent = shown;
        none.textContent = '';
        none.append(t.svcNone[0], word, t.svcNone[1]);
        $('svc-none-hint').textContent = t.svcNoneHint;
      }
      const sig = visible.map(c => c.dataset.i).join(',');
      const count = $('svc-count');
      count.textContent = t.svcCount(fmt(visible.length), fmt(chips.length));
      if (!init && sig !== svcSig && !reduceMotion) {
        visible.forEach((c, k) => {
          c.classList.remove('pop');
          c.style.setProperty('--d', Math.min(k, 16) * 22 + 'ms');
        });
        void chipsEl.offsetWidth;
        visible.forEach(c => c.classList.add('pop'));
        count.classList.remove('tick');
        void count.offsetWidth;
        count.classList.add('tick');
      }
      svcSig = sig;
    }

    function renderServices(t) {
      const prev = $('svc-q') ? $('svc-q').value : '';
      svcEntries = [{ label: t.svcMain, main: true, color: '#5865f2', path: DISCORD_PATH, eo: 0, keys: ['discord', 'دیسکورد'].map(norm) }].concat(
        SVC.map(r => ({ label: r[1], main: false, color: r[2], path: r[3], eo: r[4], keys: [r[1], r[0]].concat(SVC_ALIASES[r[0]] || []).map(norm) }))
      );
      $('svc-card').innerHTML = `
        <p>${tx(t.svcText)}</p>
        <div class="svc-tools" role="search">
          <div class="svc-search">
            ${svg('search')}
            <input id="svc-q" type="search" placeholder="${esc(t.svcSearch)}" aria-label="${esc(t.svcSearch)}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
            <button type="button" class="svc-clear" id="svc-clear" aria-label="${esc(t.svcClear)}" hidden>${svg('close')}</button>
          </div>
          <span class="svc-count" id="svc-count" aria-live="polite"></span>
        </div>
        <div class="svc-area" id="svc-area">
          <div class="chips" id="svc-chips">
            ${svcEntries.map((e, i) => `<span class="chip${e.main ? ' main' : ''}"${e.main ? '' : ' dir="ltr"'} data-i="${i}"><span class="chip-badge" style="background:${e.color}">${svcGlyph(e.path, e.eo)}</span><span class="chip-label">${esc(e.label)}</span></span>`).join('')}
          </div>
          <div class="svc-empty" id="svc-empty" hidden>
            <div class="svc-none" id="svc-none"></div>
            <div class="svc-none-hint" id="svc-none-hint"></div>
          </div>
        </div>
      `;
      const input = $('svc-q');
      input.value = prev;
      input.addEventListener('input', () => filterServices(false));
      input.addEventListener('keydown', e => {
        if (e.key === 'Escape' && input.value) {
          e.preventDefault();
          input.value = '';
          filterServices(false);
        }
      });
      $('svc-clear').addEventListener('click', () => {
        input.value = '';
        filterServices(false);
        input.focus();
      });
      svcSig = '';
      filterServices(true);
    }

    function renderFaq(t) {
      $('faq-list').innerHTML = t.faq.map(([q, a], i) => `
        <div class="faq-item">
          <button type="button" class="faq-q" id="faq-q-${i}" aria-expanded="false" aria-controls="faq-a-${i}">
            <span>${tx(q)}</span>
            <span class="faq-icon" aria-hidden="true"></span>
          </button>
          <div class="faq-panel" id="faq-a-${i}" role="region" aria-labelledby="faq-q-${i}">
            <div class="faq-inner"><div class="answer">${tx(a)}</div></div>
          </div>
        </div>`).join('');
    }

    $('faq-list').addEventListener('click', e => {
      const btn = e.target.closest('.faq-q');
      if (!btn) return;
      const item = btn.parentElement;
      const open = item.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    });

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      const t = I18N[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;
      document.title = t.docTitle;

      setTx('back-text', t.back);
      setTx('hero-title', t.heroTitle);
      setTx('hero-pitch', t.pitch);
      $('hero-tags').innerHTML = t.tags.map((x, i) => `<span class="tag${i === 0 ? ' hot' : ''}">${tx(x)}</span>`).join('');
      document.querySelectorAll('[data-dl-label]').forEach(el => { el.textContent = t.download; });
      setTx('cta-github', t.github);
      paintRelease();
      setTx('demo-note', t.demoNote);

      setTx('how-title', t.howTitle);
      setTx('how-sub', t.howSub);
      renderHow(t);

      setTx('feat-title', t.featTitle);
      setTx('feat-sub', t.featSub);
      renderFeatures(t);

      setTx('svc-title', t.svcTitle);
      setTx('svc-sub', t.svcSub);
      renderServices(t);

      setTx('faq-title', t.faqTitle);
      setTx('faq-sub', t.faqSub);
      renderFaq(t);

      setTx('end-title', t.endTitle);
      setTx('end-text', t.endText);
      setTx('end-discord', t.endDiscord);
      setTx('end-telegram', t.endTelegram);
      setTx('footer-home', t.footerHome);
      $('made-by').innerHTML = t.madeBy.split('{heart}').map(tx).join(HEART);
    }

    $('lang-toggle').addEventListener('click', () => {
      $('lang-toggle').blur();
      applyLanguage(currentLang === 'en' ? 'fa' : 'en');
    });

    applyLanguage(currentLang);

    const demo = $('app-demo'), frame = $('app-frame');
    function fitDemo() {
      const w = demo.clientWidth;
      if (!w) return;
      const inner = Math.max(560, Math.min(720, w));
      const k = w / inner;
      frame.style.width = inner + 'px';
      frame.style.transform = 'scale(' + k + ')';
      demo.style.height = Math.round(660 * k) + 'px';
    }
    fitDemo();
    if (window.ResizeObserver) new ResizeObserver(fitDemo).observe(demo); else window.addEventListener('resize', fitDemo);
    frame.src = 'papion-app.html?lang=' + currentLang;

    LatestRelease.latest(REPO).then(d => {
      release = d;
      paintRelease();
    });
  </script>
</body>
</html>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0d1f;
      --text: #f7f5ff;
      --muted: #bcb6d9;
      --line: rgba(226, 220, 255, 0.16);
      --violet: #7c5cfa;
      --violet-mid: #9a82ff;
      --violet-soft: #c9bcff;
      --indigo: #7c83fd;
      --teal: #4fd1c5;
      --pink: #ff7ab6;
      --ink: #14102a;
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 10%, rgba(124, 92, 250, 0.3), transparent 32%),
        radial-gradient(circle at 90% 14%, rgba(201, 188, 255, 0.1), transparent 28%),
        radial-gradient(circle at 52% 94%, rgba(79, 209, 197, 0.08), transparent 34%),
        var(--bg);
      animation: page-fade-in 0.4s ease-out;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    @keyframes page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    html[lang="fa"] body {
      font-family: Vazirmatn, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    .page {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .glass {
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 10px);
      background: linear-gradient(145deg, rgba(244, 241, 255, 0.105), rgba(244, 241, 255, 0.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(22px);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 400px);
      gap: 30px;
      padding: 28px;
      align-items: center;
    }

    .intro {
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .pill-btn:hover {
      background: rgba(244, 241, 255, 0.12);
      border-color: rgba(201, 188, 255, 0.45);
    }

    .pill-btn svg {
      width: 14px;
      height: 14px;
    }

    html[dir="rtl"] .pill-btn svg {
      transform: scaleX(-1);
    }

    .lang-toggle {
      margin-inline-start: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      width: 64px;
      height: 64px;
      flex: 0 0 auto;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(124, 92, 250, 0.45);
      -webkit-user-drag: none;
    }

    h1 {
      font-size: clamp(48px, 9vw, 92px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--violet-mid), var(--violet-soft), var(--pink), var(--violet-mid));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: enchant 6s linear infinite;
    }

    @keyframes enchant {
      to { background-position: -300% 0; }
    }

    .pitch {
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 6px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
    }

    .tag.hot {
      border-color: transparent;
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      color: var(--ink);
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 180ms ease, transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(244, 241, 255, 0.12);
      border-color: rgba(201, 188, 255, 0.45);
    }

    .btn.primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      color: var(--ink);
    }

    .btn.primary:hover {
      filter: brightness(1.06);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .btn:focus-visible,
    .pill-btn:focus-visible,
    .faq-q:focus-visible,
    .m-btn:focus-visible {
      outline: 2px solid var(--violet-soft);
      outline-offset: 3px;
    }

    .dl-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .dl-meta[hidden] {
      display: none;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 6% -6% 10%;
      z-index: 0;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(124, 92, 250, 0.5), rgba(124, 92, 250, 0));
      filter: blur(24px);
      pointer-events: none;
    }

    .mock {
      --a-bg: #14161c;
      --a-panel: #1b1e26;
      --a-panel-alt: #20232d;
      --a-border: #2a2e3a;
      --a-text: #e7e9f0;
      --a-muted: #8b90a3;
      --a-accent: #4fd1c5;
      --a-indigo: #7c83fd;
      --a-danger: #e0555f;
      --a-warn: #e0a83e;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      border: 1px solid var(--a-border);
      border-radius: 14px;
      background: var(--a-bg);
      color: var(--a-text);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(124, 92, 250, 0.18);
    }

    .m-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      background: var(--a-panel);
      border-bottom: 1px solid var(--a-border);
      direction: ltr;
    }

    .m-title-name {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-left: 10px;
      color: var(--a-muted);
      font-size: 11.5px;
      font-weight: 600;
    }

    .m-title-name img {
      width: 20px;
      height: 20px;
      display: block;
      transition: opacity 0.6s ease, filter 0.6s ease;
      -webkit-user-drag: none;
    }

    .mock[data-state="off"] .m-title-name img {
      opacity: 0.55;
      filter: saturate(0.35);
    }

    .m-title-btns {
      display: flex;
      height: 100%;
      color: var(--a-muted);
    }

    .m-title-btns span {
      width: 40px;
      display: grid;
      place-items: center;
    }

    .m-title-btns svg {
      width: 10px;
      height: 10px;
    }

    .m-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      padding: 30px 22px 22px;
      text-align: center;
    }

    .signal {
      position: relative;
      isolation: isolate;
      width: 104px;
      height: 104px;
      flex: none;
      margin: 6px 0 18px;
    }

    .signal::before {
      content: "";
      position: absolute;
      inset: -20px;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(closest-side, rgba(124, 92, 250, 0.55), rgba(124, 92, 250, 0));
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .signal img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-user-drag: none;
    }

    .signal .on-img {
      opacity: 0;
    }

    .signal.on .on-img {
      opacity: 1;
    }

    .signal.on::before {
      opacity: 1;
      transform: scale(1);
    }

    .signal.on {
      animation: settle 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .signal.busy::before {
      opacity: 0.5;
      transform: scale(0.92);
    }

    .signal.busy .on-img {
      animation: wake 1.8s ease-in-out infinite;
    }

    @keyframes wake {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.85; }
    }

    @keyframes settle {
      0% { transform: scale(0.94); }
      55% { transform: scale(1.045); }
      100% { transform: scale(1); }
    }

    @keyframes textin {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: none; }
    }

    .signal .ring {
      position: absolute;
      inset: 0;
      z-index: -1;
      border: 2px solid rgba(124, 92, 250, 0.6);
      border-radius: 26%;
      opacity: 0;
      pointer-events: none;
    }

    .signal.busy {
      animation: breathe 2.6s ease-in-out infinite;
    }

    .signal.busy .ring {
      animation: ripple 2.4s cubic-bezier(0.2, 0.6, 0.3, 1) infinite;
      will-change: transform, opacity;
    }

    .signal.busy .ring.r2 {
      animation-delay: 0.8s;
    }

    .signal.busy .ring.r3 {
      animation-delay: 1.6s;
    }

    .signal.on .ring {
      border-color: rgba(79, 209, 197, 0.75);
    }

    .signal.on .ring.r1 {
      animation: burst 1.1s ease-out 1 both;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    @keyframes ripple {
      0% { transform: scale(0.92); opacity: 0.5; }
      100% { transform: scale(1.85); opacity: 0; }
    }

    @keyframes burst {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    @keyframes sweep {
      to { transform: translateX(100%); }
    }

    .m-status {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }

    .m-sub {
      max-width: 320px;
      min-height: 44px;
      margin-top: 6px;
      color: var(--a-muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .m-status.swap,
    .m-sub.swap {
      animation: textin 0.4s ease both;
    }

    .m-btn {
      min-width: 220px;
      height: 46px;
      margin-top: 14px;
      padding: 0 28px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--a-accent);
      color: #08201d;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.35s, border-color 0.35s, color 0.35s;
    }

    .m-btn:hover {
      filter: brightness(1.08);
    }

    .m-btn.secondary {
      background: transparent;
      border-color: #3a3f4e;
      color: var(--a-text);
    }

    .m-btn.secondary:hover {
      filter: none;
      border-color: var(--a-danger);
      color: #f28b93;
    }

    .m-btn.hint {
      animation: ring 2.4s ease-out infinite;
    }

    .m-btn.busy {
      position: relative;
      overflow: hidden;
    }

    .m-btn.busy::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(100deg, transparent 25%, rgba(124, 131, 253, 0.28) 50%, transparent 75%);
      transform: translateX(-100%);
      animation: sweep 1.7s ease-in-out infinite;
    }

    @keyframes ring {
      0% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(79, 209, 197, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0); }
    }

    .m-slot {
      display: grid;
      justify-items: center;
      width: 100%;
      max-width: 340px;
      min-height: 84px;
      margin-top: 22px;
    }

    .m-slot > * {
      grid-area: 1 / 1;
    }

    .m-tagline {
      align-self: start;
      padding-top: 18px;
      visibility: hidden;
      color: var(--a-muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .m-tagline.show {
      visibility: visible;
    }

    .m-progress {
      align-self: start;
      width: 100%;
      padding-top: 18px;
      visibility: hidden;
    }

    .m-progress.show {
      visibility: visible;
    }

    .m-bar {
      height: 5px;
      overflow: hidden;
      border-radius: 3px;
      background: var(--a-panel-alt);
    }

    .m-bar span {
      position: relative;
      overflow: hidden;
      display: block;
      height: 100%;
      width: 0;
      border-radius: 3px;
      background: var(--a-indigo);
      transition: width 0.3s ease;
    }

    .m-bar span::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: translateX(-100%);
      animation: sweep 1.3s linear infinite;
    }

    .m-counts {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 9px;
      color: var(--a-muted);
      font-size: 12.5px;
    }

    .m-counts b {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .m-counts .ok b {
      color: var(--a-accent);
    }

    .m-counts .fail b {
      color: var(--a-danger);
    }

    .m-stats {
      display: flex;
      width: 100%;
      visibility: hidden;
      border: 1px solid var(--a-border);
      border-radius: 12px;
      background: var(--a-panel);
    }

    .m-stats.show {
      visibility: visible;
    }

    .m-cell {
      flex: 1;
      min-width: 0;
      padding: 10px 6px;
      text-align: center;
    }

    .m-cell + .m-cell {
      border-inline-start: 1px solid var(--a-border);
    }

    .m-cell .v {
      display: block;
      height: 21px;
      font-size: 15px;
      font-weight: 600;
      line-height: 21px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .m-cell .u {
      margin-inline-start: 3px;
      color: var(--a-muted);
      font-size: 10.5px;
      font-weight: 500;
    }

    .m-cell .k {
      display: block;
      margin-top: 2px;
      color: var(--a-muted);
      font-size: 12px;
    }

    .m-views {
      position: relative;
      height: 600px;
    }

    .m-view {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      visibility: hidden;
      opacity: 0;
      padding: 16px 18px 22px;
      scrollbar-width: thin;
      scrollbar-color: #2a2e3a transparent;
      transition: opacity 0.22s ease, visibility 0s linear 0.22s;
    }

    .mock[data-view="home"] #mv-home,
    .mock[data-view="dns"] #mv-dns,
    .mock[data-view="usage"] #mv-usage,
    .mock[data-view="set"] #mv-set {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.22s ease;
    }

    .m-view.m-home {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0;
    }

    .m-top {
      position: absolute;
      top: 12px;
      inset-inline: 14px;
      z-index: 2;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .m-round {
      flex: none;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--a-border);
      border-radius: 50%;
      background: var(--a-panel);
      color: var(--a-muted);
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.2, 1), color 0.15s, border-color 0.15s;
    }

    .m-round:hover {
      color: var(--a-text);
      border-color: var(--a-indigo);
      transform: scale(1.07);
    }

    .m-round:active {
      transform: scale(0.9);
    }

    .m-round svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .m-round:focus-visible,
    .m-back:focus-visible,
    .m-dns-tile:focus-visible,
    .m-dns-apply:focus-visible,
    .m-flush:focus-visible,
    .m-opt:focus-visible,
    .m-seg button:focus-visible {
      outline: 2px solid var(--a-indigo);
      outline-offset: 2px;
    }

    .m-home .m-body {
      flex: 1;
      min-height: 0;
      justify-content: center;
      padding: 44px 20px 4px;
    }

    .m-home .signal {
      margin: 0 0 14px;
    }

    .m-home .m-sub {
      min-height: 40px;
      margin-top: 4px;
      line-height: 1.55;
    }

    .m-home .m-btn {
      margin-top: 10px;
      height: 44px;
    }

    .m-home .m-slot {
      max-width: 360px;
      min-height: 118px;
      margin-top: 12px;
    }

    .m-home .m-tagline,
    .m-home .m-progress {
      padding-top: 12px;
    }

    .m-stats {
      flex-wrap: wrap;
    }

    .m-cell {
      padding: 8px 6px;
    }

    .m-cell .k {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .m-cell .k svg {
      width: 11px;
      height: 11px;
      flex: none;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .m-cell .k.dn svg {
      stroke: var(--a-indigo);
    }

    .m-cell .k.upl svg {
      stroke: var(--a-warn);
      transform: rotate(180deg);
    }

    .m-live {
      flex: 0 0 100%;
      padding: 8px 12px 6px;
      border-top: 1px solid var(--a-border);
    }

    .m-live svg {
      display: block;
      width: 100%;
      height: 30px;
      overflow: visible;
    }

    .m-live .lbase {
      stroke: var(--a-border);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .m-live .ll {
      fill: none;
      stroke-width: 1.7;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .m-live .ll.dn {
      stroke: var(--a-indigo);
    }

    .m-live .ll.upl {
      stroke: var(--a-warn);
    }

    .m-live .la.dn {
      fill: var(--a-indigo);
      opacity: 0.16;
    }

    .m-live .la.upl {
      fill: var(--a-warn);
      opacity: 0.12;
    }

    .m-live-cap {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 3px;
      direction: ltr;
      color: var(--a-muted);
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
    }

    .m-foot {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      margin: 0 20px 10px;
      padding-top: 5px;
      border-top: 1px solid var(--a-border);
    }

    .m-ver {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      direction: ltr;
      color: var(--a-muted);
      font-size: 9.5px;
      font-variant-numeric: tabular-nums;
    }

    .m-ver span:first-child {
      unicode-bidi: plaintext;
    }

    .m-ver-tag {
      padding: 0 8px;
      border: 1px solid #2f8f87;
      border-radius: 999px;
      background: rgba(79, 209, 197, 0.08);
      color: var(--a-accent);
      font-size: 9.5px;
      line-height: 1.6;
      unicode-bidi: plaintext;
    }

    .m-links {
      display: flex;
      gap: 16px;
      color: var(--a-muted);
    }

    .m-links svg {
      width: 18px;
      height: 18px;
      display: block;
      padding: 3px;
      box-sizing: content-box;
    }

    .m-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .m-head-title {
      font-size: 15px;
      font-weight: 600;
    }

    .m-back {
      position: relative;
      flex: none;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--a-border);
      border-radius: 50%;
      background: var(--a-panel);
      color: var(--a-muted);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.2, 1), border-color 0.15s, color 0.15s;
    }

    .m-back:hover {
      color: var(--a-text);
      border-color: var(--a-indigo);
      transform: scale(1.09);
    }

    .m-back:active {
      transform: scale(0.86);
    }

    .m-back svg {
      width: 14px;
      height: 14px;
    }

    [dir="rtl"] .m-back svg {
      transform: scaleX(-1);
    }

    .m-seg {
      position: relative;
      display: flex;
      flex: none;
      padding: 2px;
      gap: 3px;
      border: 1px solid var(--a-border);
      border-radius: 9px;
      background: var(--a-panel);
    }

    .m-seg::before {
      content: "";
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: var(--pill-x, 2px);
      width: var(--pill-w, 0px);
      border-radius: 7px;
      background: var(--a-indigo);
      box-shadow: 0 2px 8px -2px rgba(124, 131, 253, 0.55);
      transition: left 0.32s cubic-bezier(0.3, 0.8, 0.2, 1), width 0.32s cubic-bezier(0.3, 0.8, 0.2, 1);
    }

    .m-seg button {
      position: relative;
      z-index: 1;
      padding: 5px 13px;
      border: 0;
      border-radius: 7px;
      background: none;
      color: var(--a-muted);
      font-family: inherit;
      font-size: 11.5px;
      cursor: pointer;
      transition: color 0.25s;
    }

    .m-seg button.active {
      color: #fff;
    }

    .m-dns-hero {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      padding: 12px 14px;
      border: 1px solid var(--a-border);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(124, 131, 253, 0.1), rgba(79, 209, 197, 0.06));
    }

    .m-dns-hero.flash {
      animation: mFlash 0.9s ease-out;
    }

    @keyframes mFlash {
      0% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.55); }
      100% { box-shadow: 0 0 0 14px rgba(79, 209, 197, 0); }
    }

    .m-dns-ic {
      position: relative;
      flex: none;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(79, 209, 197, 0.16);
      color: var(--a-accent);
    }

    .m-dns-ic::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid currentColor;
      border-radius: 12px;
      opacity: 0;
      animation: mPulse 2.4s ease-out infinite;
    }

    @keyframes mPulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    .m-dns-ic svg {
      width: 19px;
      height: 19px;
    }

    .m-dns-txt {
      flex: 1;
      min-width: 0;
    }

    .m-dns-label {
      color: var(--a-muted);
      font-size: 11px;
    }

    .m-dns-cur {
      min-height: 25px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
    }

    .m-dns-curips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 15px;
      color: var(--a-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .m-dns-curips span,
    .m-dns-ips span {
      direction: ltr;
      unicode-bidi: isolate;
    }

    .m-flush {
      flex: none;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--a-border);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      color: var(--a-muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, transform 0.2s;
    }

    .m-flush:hover {
      color: var(--a-text);
      border-color: var(--a-indigo);
      transform: scale(1.07);
    }

    .m-flush svg {
      width: 15px;
      height: 15px;
    }

    .m-flush.spin svg {
      animation: mSpin 0.65s cubic-bezier(0.4, 0.1, 0.3, 1);
    }

    @keyframes mSpin {
      to { transform: rotate(360deg); }
    }

    .m-help {
      margin: 0 4px 12px;
      color: var(--a-muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .m-dns-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .m-dns-tile {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--a-border);
      border-radius: 14px;
      background: var(--a-panel);
      color: var(--a-text);
      font-family: inherit;
      text-align: start;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, transform 0.2s cubic-bezier(0.3, 0.7, 0.2, 1), box-shadow 0.22s;
    }

    .m-dns-tile:hover {
      border-color: #3a3f4e;
      transform: translateY(-2px);
    }

    .m-dns-tile:active {
      transform: scale(0.985);
    }

    .m-dns-tile.sel {
      border-color: var(--a-accent);
      background: rgba(79, 209, 197, 0.08);
      box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.12);
    }

    .m-dns-badge {
      flex: none;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s cubic-bezier(0.3, 1.5, 0.4, 1);
    }

    .m-dns-badge.sm {
      font-size: 10.5px;
    }

    .m-dns-tile.sel .m-dns-badge {
      transform: scale(1.1) rotate(-5deg);
    }

    .m-dns-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .m-dns-name {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 12.5px;
      font-weight: 600;
    }

    .m-dns-name span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .m-dns-tile.cur .m-dns-name::before {
      content: "";
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--a-accent);
    }

    .m-dns-ips {
      display: flex;
      flex-direction: column;
      color: var(--a-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
    }

    .m-dns-apply {
      position: relative;
      width: 100%;
      height: 40px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: var(--a-indigo);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, opacity 0.2s, transform 0.15s;
    }

    .m-dns-apply:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .m-dns-apply:active:not(:disabled) {
      transform: scale(0.985);
    }

    .m-dns-apply i {
      display: none;
      width: 14px;
      height: 14px;
      flex: none;
    }

    .m-dns-apply.loading i {
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: mSpin 0.7s linear infinite;
    }

    .m-dns-apply.loading:disabled {
      opacity: 0.85;
    }

    .m-dns-apply.done {
      background: var(--a-accent);
      color: #08201d;
      opacity: 1;
    }

    .m-dns-apply.done i {
      display: block;
    }

    .m-dns-apply.done i::before {
      content: "";
      display: block;
      width: 12px;
      height: 6px;
      border-bottom: 2.5px solid #08201d;
      border-left: 2.5px solid #08201d;
      transform: rotate(-45deg) translate(1px, -2px);
    }

    .m-dns-msg {
      min-height: 20px;
      margin: 10px 4px 0;
      color: var(--a-muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .m-dns-msg.ok {
      color: var(--a-accent);
    }

    .m-utop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 10px;
    }

    .m-ulive {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--a-muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .m-ulive i {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5b5f6e;
    }

    .m-ulive.on {
      color: var(--a-accent);
    }

    .m-ulive.on i {
      background: var(--a-accent);
      animation: mPulse 2s ease-out infinite;
    }

    .m-uhero {
      margin-bottom: 10px;
      padding: 14px 16px 12px;
      border: 1px solid var(--a-border);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(124, 131, 253, 0.1), rgba(79, 209, 197, 0.06));
    }

    .m-ulabel {
      color: var(--a-muted);
      font-size: 11.5px;
    }

    .m-unum {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 7px;
      margin: 2px 0 12px;
      direction: ltr;
      font-weight: 700;
    }

    [dir="rtl"] .m-unum {
      justify-content: flex-end;
    }

    .m-unum b {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .m-unum span {
      color: var(--a-muted);
      font-size: 14px;
      font-weight: 600;
    }

    .m-ratio + .m-ratio {
      margin-top: 10px;
    }

    .m-ratio-title {
      margin-bottom: 5px;
      color: var(--a-muted);
      font-size: 11px;
    }

    .m-ratio-bar {
      display: flex;
      height: 9px;
      overflow: hidden;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      direction: ltr;
    }

    .m-ratio-bar span {
      display: block;
      width: 0;
      height: 100%;
      transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .m-ratio-bar .b {
      margin-inline-start: 2px;
    }

    .m-ratio-legend {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 6px;
      font-size: 11.5px;
    }

    .m-lg {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .m-lg i {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 3px;
    }

    .m-lg em {
      color: var(--a-muted);
      font-style: normal;
      font-variant-numeric: tabular-nums;
    }

    #m-rroute .m-ratio-bar .a,
    #m-rroute .m-lg.a i,
    .m-uchart.m-route .m-ub-stack i:nth-child(1) {
      background: #4fd1c5;
    }

    #m-rroute .m-ratio-bar .b,
    #m-rroute .m-lg.b i,
    .m-uchart.m-route .m-ub-stack i:nth-child(2) {
      background: #6b7390;
    }

    #m-rdir .m-ratio-bar .a,
    #m-rdir .m-lg.a i,
    .m-uchart.m-dir .m-ub-stack i:nth-child(1) {
      background: #7c83fd;
    }

    #m-rdir .m-ratio-bar .b,
    #m-rdir .m-lg.b i,
    .m-uchart.m-dir .m-ub-stack i:nth-child(2) {
      background: #e0a83e;
    }

    .m-ucard {
      margin-bottom: 10px;
      padding: 12px 12px 10px;
      border: 1px solid var(--a-border);
      border-radius: 16px;
      background: var(--a-panel);
    }

    .m-ucard-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .m-umax {
      color: var(--a-muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .m-uplot {
      position: relative;
    }

    .m-uchart {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 3px;
      align-items: end;
      height: 120px;
      direction: ltr;
      background: repeating-linear-gradient(to top, transparent 0, transparent calc(25% - 1px), rgba(255, 255, 255, 0.06) calc(25% - 1px), rgba(255, 255, 255, 0.06) 25%);
    }

    .m-uaxis {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 3px;
      margin-top: 6px;
      direction: ltr;
      color: var(--a-muted);
      font-size: 10px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .m-uaxis span {
      min-width: 0;
      white-space: nowrap;
    }

    .m-ub {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
    }

    .m-ub::before {
      content: "";
      position: absolute;
      inset: 0 -1px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0);
      transition: background 0.15s;
    }

    .m-ub:hover::before {
      background: rgba(255, 255, 255, 0.06);
    }

    .m-ub-stack {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column-reverse;
      overflow: hidden;
      border-radius: 4px 4px 0 0;
      transform-origin: bottom;
      animation: mBarIn 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      animation-delay: calc(var(--i, 0) * 14ms);
    }

    .m-ub-stack i {
      display: block;
      width: 100%;
      transition: flex-grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes mBarIn {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    .m-utip {
      position: absolute;
      z-index: 5;
      min-width: 124px;
      padding: 7px 10px;
      border: 1px solid var(--a-border);
      border-radius: 10px;
      background: #0e1015;
      box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.8);
      font-size: 11px;
      line-height: 1.7;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.12s, transform 0.12s;
    }

    .m-utip.show {
      opacity: 1;
      transform: none;
    }

    .m-utip b {
      display: block;
      font-weight: 700;
    }

    .m-utip div {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--a-muted);
    }

    .m-utip div i {
      flex: none;
      width: 8px;
      height: 8px;
      border-radius: 3px;
    }

    .m-utip div span {
      margin-inline-start: auto;
      padding-inline-start: 10px;
      color: var(--a-text);
      font-variant-numeric: tabular-nums;
    }

    .m-sites-title {
      font-size: 13px;
      font-weight: 700;
    }

    .m-site {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      overflow: hidden;
      border-radius: 9px;
    }

    .m-site::before {
      content: "";
      position: absolute;
      inset: 0;
      width: var(--w, 0%);
      border-radius: 9px;
      background: rgba(124, 131, 253, 0.1);
    }

    .m-site > * {
      position: relative;
    }

    .m-site-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-align: start;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .m-site-size {
      flex: none;
      color: var(--a-muted);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
    }

    .m-sites-empty {
      padding: 10px 4px 4px;
      color: var(--a-muted);
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    .m-unote {
      margin: 10px 4px 0;
      color: var(--a-muted);
      font-size: 11px;
      line-height: 1.8;
    }

    .m-sec {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 16px 4px 9px;
      color: var(--a-muted);
      font-size: 11.5px;
      font-weight: 700;
    }

    .m-sec:first-of-type {
      margin-top: 2px;
    }

    .m-sec::before {
      content: "";
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--a-accent);
    }

    .m-group {
      overflow: hidden;
      border: 1px solid var(--a-border);
      border-radius: 14px;
      background: var(--a-panel);
    }

    .m-row {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 48px;
      padding: 9px 14px;
    }

    .m-row + .m-row {
      border-top: 1px solid var(--a-border);
    }

    .m-ri {
      flex: none;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
    }

    .m-ri svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .m-ri.teal {
      background: rgba(79, 209, 197, 0.13);
      color: var(--a-accent);
    }

    .m-ri.violet {
      background: rgba(124, 131, 253, 0.14);
      color: var(--a-indigo);
    }

    .m-ri.amber {
      background: rgba(224, 168, 62, 0.14);
      color: var(--a-warn);
    }

    .m-rt {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: start;
    }

    .m-rtitle {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.5;
    }

    .m-rsub {
      color: var(--a-muted);
      font-size: 10.5px;
      line-height: 1.7;
    }

    .m-switch {
      position: relative;
      flex: none;
      width: 38px;
      height: 22px;
    }

    .m-switch input {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .m-slider {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: var(--a-border);
      transition: background 0.2s;
    }

    .m-slider::before {
      content: "";
      position: absolute;
      top: 3px;
      inset-inline-start: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: inset-inline-start 0.22s cubic-bezier(0.3, 0.8, 0.3, 1), background 0.2s;
    }

    .m-switch input:checked + .m-slider {
      background: #2f8f87;
    }

    .m-switch input:checked + .m-slider::before {
      inset-inline-start: 19px;
      background: var(--a-accent);
    }

    .m-switch input:focus-visible + .m-slider {
      outline: 2px solid var(--a-indigo);
      outline-offset: 2px;
    }

    .m-modes {
      display: grid;
      gap: 8px;
    }

    .m-opt {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 11px 14px 10px;
      border: 1px solid var(--a-border);
      border-radius: 14px;
      background: var(--a-panel);
      color: var(--a-text);
      font-family: inherit;
      text-align: start;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.12s;
    }

    .m-opt:hover {
      border-color: #3a3f4e;
    }

    .m-opt:active {
      transform: scale(0.99);
    }

    .m-opt.active {
      border-color: var(--a-accent);
      background: linear-gradient(180deg, rgba(79, 209, 197, 0.11), rgba(79, 209, 197, 0.03));
    }

    .m-opt b {
      padding-inline-end: 24px;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.5;
    }

    .m-opt span {
      color: var(--a-muted);
      font-size: 10.5px;
      line-height: 1.7;
    }

    .m-opt::after {
      content: "";
      position: absolute;
      top: 12px;
      inset-inline-end: 12px;
      width: 16px;
      height: 16px;
      box-sizing: border-box;
      border: 2px solid var(--a-border);
      border-radius: 50%;
      transition: border-color 0.2s, background 0.2s;
    }

    .m-opt.active::after {
      border-color: var(--a-accent);
      background: radial-gradient(circle, var(--a-accent) 0 36%, transparent 40%);
    }

    .m-nudge {
      --ease: cubic-bezier(0.22, 0.8, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      max-height: 96px;
      margin-top: 12px;
      padding: 9px 11px;
      overflow: hidden;
      border: 1px solid #2f8f87;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(79, 209, 197, 0.17), rgba(124, 131, 253, 0.15));
      box-shadow: 0 0 0 1px rgba(79, 209, 197, 0.06), 0 6px 18px -8px rgba(79, 209, 197, 0.45);
      text-align: start;
      transition: max-height 0.55s var(--ease), margin-top 0.55s var(--ease), padding 0.55s var(--ease), opacity 0.4s ease, transform 0.55s var(--ease), background 0.5s ease, visibility 0s;
    }

    .m-nudge.collapsed {
      max-height: 0;
      margin-top: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-color: transparent;
      box-shadow: none;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transform: translateY(-10px) scale(0.97);
      transition: max-height 0.55s var(--ease), margin-top 0.55s var(--ease), padding 0.55s var(--ease), opacity 0.4s ease, transform 0.55s var(--ease), visibility 0s linear 0.55s;
    }

    .m-nudge-ic {
      position: relative;
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--a-accent);
      color: #0c1a19;
      animation: mNudgeGlow 2.6s ease-in-out infinite;
      transition: background 0.4s ease, transform 0.4s var(--ease);
    }

    .m-nudge-ic svg {
      position: absolute;
      inset: 6.5px;
      width: 17px;
      height: 17px;
      transition: opacity 0.3s ease, transform 0.45s var(--ease);
    }

    .m-nudge-ic .ck {
      opacity: 0;
      transform: scale(0.4) rotate(-25deg);
    }

    .m-nudge-text {
      flex: 1;
      min-width: 0;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.55;
    }

    .m-nudge-btn {
      flex: none;
      max-width: 130px;
      overflow: hidden;
      padding: 6px 14px;
      border: 0;
      border-radius: 9px;
      background: var(--a-accent);
      color: #0c1a19;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: max-width 0.4s var(--ease), padding 0.4s var(--ease), margin 0.4s var(--ease), opacity 0.25s ease, transform 0.12s, filter 0.15s;
    }

    .m-nudge-btn:hover {
      filter: brightness(1.1);
    }

    .m-nudge-btn:active {
      transform: scale(0.95);
    }

    .m-nudge.done {
      background: linear-gradient(135deg, rgba(79, 209, 197, 0.26), rgba(79, 209, 197, 0.12));
    }

    .m-nudge.done .m-nudge-ic {
      animation: none;
      transform: scale(1.06);
    }

    .m-nudge.done .gl {
      opacity: 0;
      transform: scale(0.4) rotate(25deg);
    }

    .m-nudge.done .ck {
      opacity: 1;
      transform: none;
    }

    .m-nudge.done .m-nudge-btn {
      max-width: 0;
      padding-left: 0;
      padding-right: 0;
      margin-inline-start: -10px;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes mNudgeGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(79, 209, 197, 0.45); }
      50% { box-shadow: 0 0 0 6px rgba(79, 209, 197, 0); }
    }

    .m-svc {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--a-border);
      border-radius: 14px;
      background: var(--a-panel);
      transition: opacity 0.25s, filter 0.25s;
    }

    .m-svc.dis {
      opacity: 0.36;
      filter: saturate(0.3);
      pointer-events: none;
    }

    .m-svc-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .m-svc-search {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .m-svc-search svg {
      position: absolute;
      top: 50%;
      inset-inline-start: 10px;
      width: 13px;
      height: 13px;
      transform: translateY(-50%);
      fill: none;
      stroke: #6b7080;
      stroke-width: 2;
      stroke-linecap: round;
      pointer-events: none;
    }

    .m-svc-search input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      padding-inline-start: 30px;
      border: 1px solid var(--a-border);
      border-radius: 9px;
      background: #0e1015;
      color: var(--a-text);
      font-family: inherit;
      font-size: 11.5px;
      outline: none;
      transition: border-color 0.15s;
    }

    .m-svc-search input:focus {
      border-color: var(--a-indigo);
    }

    .m-svc-all {
      flex: none;
      height: 32px;
      padding: 0 11px;
      border: 1px solid var(--a-border);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--a-text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .m-svc-all:hover {
      border-color: var(--a-accent);
    }

    .m-svc-count {
      margin: 9px 2px 8px;
      color: var(--a-muted);
      font-size: 11px;
    }

    .m-svc-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .m-svc-tile {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      padding: 6px 7px;
      border: 1px solid var(--a-border);
      border-radius: 11px;
      background: #0c0e13;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.12s;
    }

    .m-svc-tile:hover {
      border-color: #3a3f4e;
    }

    .m-svc-tile:active {
      transform: scale(0.985);
    }

    .m-svc-tile.on {
      border-color: #2f8f87;
      background: rgba(79, 209, 197, 0.08);
    }

    .m-svc-tile.filtered {
      display: none;
    }

    .m-svc-tile:focus-within {
      outline: 2px solid var(--a-indigo);
      outline-offset: 1px;
    }

    .m-svc-tile input {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .m-svc-badge {
      flex: none;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
    }

    .m-svc-badge svg {
      width: 14px;
      height: 14px;
      display: block;
      fill: #fff;
    }

    .m-svc-label {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      font-size: 10.5px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
      direction: ltr;
    }

    .m-info {
      flex: none;
      display: flex;
      padding: 1px;
      border: 0;
      background: none;
      color: var(--a-muted);
      cursor: pointer;
    }

    .m-info:hover,
    .m-info[aria-expanded="true"] {
      color: var(--a-text);
    }

    .m-info svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .m-svc-check {
      flex: none;
      width: 15px;
      height: 15px;
      margin-inline-start: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--a-border);
      border-radius: 50%;
      transition: background 0.18s, border-color 0.18s;
    }

    .m-svc-check svg {
      width: 10px;
      height: 10px;
      fill: none;
      stroke: #08201d;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.15s, transform 0.2s cubic-bezier(0.3, 0.9, 0.3, 1.4);
    }

    .m-svc-tile.on .m-svc-check {
      border-color: var(--a-accent);
      background: var(--a-accent);
    }

    .m-svc-tile.on .m-svc-check svg {
      opacity: 1;
      transform: scale(1);
    }

    .m-svc-empty {
      padding: 14px 0 6px;
      color: var(--a-muted);
      font-size: 11.5px;
      text-align: center;
    }

    .m-svc-note {
      margin-top: 9px;
      padding: 9px 11px;
      border: 1px solid var(--a-border);
      border-radius: 11px;
      background: #0e1015;
      color: var(--a-muted);
      font-size: 11px;
      line-height: 1.8;
      animation: mNoteIn 0.25s ease both;
    }

    .m-svc-note b {
      display: block;
      margin-bottom: 2px;
      color: var(--a-text);
      font-size: 11.5px;
    }

    @keyframes mNoteIn {
      from { opacity: 0; transform: translateY(-4px); }
    }

    .m-callout {
      display: flex;
      gap: 9px;
      margin-top: 8px;
      padding: 9px 11px;
      border: 1px solid var(--a-border);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.025);
      color: var(--a-muted);
      font-size: 10.5px;
      line-height: 1.8;
    }

    .m-callout.hidden {
      display: none;
    }

    .m-callout svg {
      flex: none;
      width: 14px;
      height: 14px;
      margin-top: 3px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .m-ver-row {
      gap: 8px;
    }

    .m-kv {
      flex: none;
      direction: ltr;
      color: var(--a-muted);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
    }

    .m-vstatus {
      flex: none;
      padding: 1px 9px;
      border: 1px solid var(--a-border);
      border-radius: 999px;
      color: var(--a-muted);
      font-size: 10.5px;
      line-height: 1.6;
      white-space: nowrap;
      unicode-bidi: plaintext;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .m-vstatus.ok {
      border-color: #2f8f87;
      background: rgba(79, 209, 197, 0.08);
      color: var(--a-accent);
    }

    .m-vstatus.busy {
      opacity: 0.75;
    }

    .m-mini-ic {
      flex: none;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--a-border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--a-muted);
      cursor: pointer;
    }

    .m-mini-ic:hover {
      border-color: var(--a-accent);
      color: var(--a-text);
    }

    .m-mini-ic svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .m-mini-ic.spin svg {
      animation: mSpin 1s linear infinite;
    }

    .m-foot-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .m-fbtn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 6px 8px;
      border: 1px solid var(--a-border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
    }

    .m-fbtn.danger {
      border-color: rgba(224, 85, 95, 0.55);
      background: rgba(224, 85, 95, 0.1);
      color: #f08a92;
    }

    .m-adv {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 14px;
      padding: 10px 14px;
      border: 1px solid var(--a-border);
      border-radius: 12px;
      background: var(--a-panel);
      color: var(--a-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .m-adv:hover {
      border-color: #3a3f4e;
      color: var(--a-text);
    }

    .m-adv svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      transition: transform 0.3s;
    }

    .m-adv[aria-expanded="true"] svg {
      transform: rotate(180deg);
    }

    .m-adv-box {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s cubic-bezier(0.3, 0.8, 0.3, 1);
    }

    .m-adv-box.open {
      grid-template-rows: 1fr;
    }

    .m-adv-in {
      min-height: 0;
      overflow: hidden;
    }

    .m-row.m-col {
      flex-direction: column;
      align-items: stretch;
      gap: 9px;
    }

    .m-row-top {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .m-ta {
      width: 100%;
      min-height: 58px;
      resize: vertical;
      padding: 8px 10px;
      border: 1px solid var(--a-border);
      border-radius: 10px;
      background: #0e1015;
      color: var(--a-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      line-height: 1.5;
      text-align: left;
      outline: none;
    }

    .m-ta:focus {
      border-color: var(--a-indigo);
    }

    .m-svc-tile:focus-within,
    .m-nudge-btn:focus-visible,
    .m-adv:focus-visible,
    .m-mini-ic:focus-visible,
    .m-svc-all:focus-visible {
      outline: 2px solid var(--a-indigo);
      outline-offset: 2px;
    }

    .mock-note {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
    }

    section.block {
      margin-top: 38px;
      scroll-margin-top: 18px;
    }

    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 4px 14px;
    }

    .head h2 {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .head span {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .grid.three {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .grid.four {
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
    }

    .grid.cols3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    @media (max-width: 900px) {
      .grid.cols3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .grid.cols3 {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(244, 241, 255, 0.09), rgba(244, 241, 255, 0.04));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(18px);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(201, 188, 255, 0.42);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      position: relative;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: var(--ink);
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      box-shadow: 0 14px 30px rgba(124, 92, 250, 0.3);
    }

    .icon.teal {
      background: linear-gradient(135deg, var(--teal), var(--violet-soft));
      box-shadow: 0 14px 30px rgba(79, 209, 197, 0.2);
    }

    .icon svg {
      width: 22px;
      height: 22px;
    }

    .step-num {
      margin-inline-start: auto;
      color: rgba(201, 188, 255, 0.28);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .card-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-desc {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.75;
    }

    .services {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 24px;
    }

    .services p {
      max-width: 640px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.06);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }

    .chip.main {
      border-color: transparent;
      background: linear-gradient(135deg, var(--violet-mid), var(--violet-soft));
      color: var(--ink);
    }

    .chip[hidden] {
      display: none;
    }

    .chip.pop {
      animation: chip-in 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: var(--d, 0ms);
    }

    .chip mark {
      background: none;
      color: var(--violet-soft);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .chip.main mark {
      color: var(--ink);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding-block: 6px;
      padding-inline: 6px 14px;
      border-radius: 14px;
    }

    .chip-badge {
      flex: none;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .chip-badge svg {
      width: 16px;
      height: 16px;
      display: block;
      fill: #fff;
    }

    .chip-label {
      white-space: nowrap;
    }

    .svc-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
    }

    .svc-search {
      position: relative;
      flex: 1 1 280px;
      max-width: 380px;
    }

    .svc-search > svg {
      position: absolute;
      top: 50%;
      inset-inline-start: 15px;
      width: 17px;
      height: 17px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      transition: color 200ms ease;
    }

    .svc-search:focus-within > svg {
      color: var(--violet-soft);
    }

    .svc-search input {
      width: 100%;
      height: 44px;
      padding: 0 44px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(244, 241, 255, 0.07);
      color: var(--text);
      font-family: inherit;
      font-size: 14.5px;
      outline: none;
      transition: border-color 200ms ease, box-shadow 200ms ease, background 200ms ease;
    }

    .svc-search input::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    .svc-search input:focus {
      border-color: var(--violet-mid);
      background: rgba(244, 241, 255, 0.1);
      box-shadow: 0 0 0 4px rgba(124, 92, 250, 0.2);
    }

    .svc-search input::-webkit-search-cancel-button,
    .svc-search input::-webkit-search-decoration {
      display: none;
      -webkit-appearance: none;
    }

    .svc-clear {
      position: absolute;
      top: 50%;
      inset-inline-end: 8px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: rgba(244, 241, 255, 0.1);
      color: var(--text);
      cursor: pointer;
      transition: background 180ms ease;
    }

    .svc-clear[hidden] {
      display: none;
    }

    .svc-clear:hover {
      background: rgba(244, 241, 255, 0.2);
    }

    .svc-clear svg {
      width: 13px;
      height: 13px;
    }

    .svc-count {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .svc-count.tick {
      animation: tick 240ms ease;
    }

    .svc-area {
      position: relative;
    }

    .svc-empty {
      position: absolute;
      inset: 0;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 6px;
      padding: 8px;
      text-align: center;
      animation: chip-in 300ms ease both;
    }

    .svc-empty[hidden] {
      display: none;
    }

    .svc-none {
      font-size: 15px;
      font-weight: 700;
    }

    .svc-none-hint {
      color: var(--muted);
      font-size: 13.5px;
    }

    @keyframes chip-in {
      from { opacity: 0; transform: translateY(8px) scale(0.92); }
      to { opacity: 1; transform: none; }
    }

    @keyframes tick {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: none; }
    }

    .faq {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .faq-item {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(244, 241, 255, 0.05);
      transition: border-color 240ms ease, background 240ms ease;
    }

    .faq-item:hover {
      border-color: rgba(201, 188, 255, 0.28);
    }

    .faq-item.open {
      border-color: rgba(201, 188, 255, 0.4);
      background: rgba(244, 241, 255, 0.08);
    }

    .faq-q {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      border: none;
      border-radius: 20px;
      background: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-align: start;
      cursor: pointer;
    }

    .faq-q:focus-visible {
      outline-offset: -2px;
    }

    .faq-icon {
      position: relative;
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      transition: transform 340ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .faq-icon::before,
    .faq-icon::after {
      content: "";
      position: absolute;
      inset-inline: 0;
      top: 50%;
      height: 2px;
      margin-top: -1px;
      border-radius: 2px;
      background: var(--violet-soft);
      transition: transform 340ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .faq-icon::after {
      transform: rotate(90deg);
    }

    .faq-item.open .faq-icon {
      transform: rotate(180deg);
    }

    .faq-item.open .faq-icon::after {
      transform: rotate(0deg);
    }

    .faq-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition: grid-template-rows 360ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 240ms ease, visibility 0s linear 360ms;
    }

    .faq-item.open .faq-panel {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
      transition: grid-template-rows 360ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 300ms ease 60ms, visibility 0s;
    }

    .faq-inner {
      min-height: 0;
      overflow: hidden;
    }

    .faq .answer {
      padding: 0 20px 18px;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.8;
    }

    .closing {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 28px;
    }

    .closing img {
      width: 72px;
      height: 72px;
      flex: 0 0 auto;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(124, 92, 250, 0.45);
      -webkit-user-drag: none;
    }

    .closing-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .closing h2 {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .closing p {
      max-width: 520px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .closing .cta-row {
      margin-top: 8px;
    }

    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 40px;
      text-align: center;
    }

    .made {
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }

    .heart {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin: 0 3px;
      vertical-align: -2px;
      color: var(--pink);
      animation: beat 1.8s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 60%, 100% { transform: scale(1); }
      20% { transform: scale(1.22); }
      40% { transform: scale(1.06); }
    }

    .legal {
      color: var(--muted);
      font-size: 12.5px;
      opacity: 0.8;
    }

    .home-link {
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(226, 220, 255, 0.24);
      color: var(--muted);
      font-size: 15px;
      letter-spacing: -0.01em;
      transition: color 180ms ease, border-color 180ms ease;
    }

    .home-link:hover {
      color: var(--text);
      border-color: rgba(201, 188, 255, 0.55);
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
      .gradient-text { animation: none; }
      .signal.on { animation: none; }
      .signal.busy .on-img { animation: none; opacity: 0.5; }
      .signal.busy, .signal.busy .ring, .signal.on .ring.r1, .m-btn.busy::after, .m-bar span::after { animation: none !important; }
      .signal .ring { display: none; }
      .m-status.swap, .m-sub.swap { animation: none; }
      .m-btn.hint { animation: none; }
      .chip.pop, .svc-count.tick, .svc-empty { animation: none; }
      .svc-search input, .svc-search > svg, .svc-clear { transition: none; }
      .heart { animation: none; }
      .m-bar span { transition: none; }
      .faq-item, .faq-icon, .faq-icon::before, .faq-icon::after, .faq-panel, .card, .btn {
        transition: none !important;
      }
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 22px, 1080px);
        padding-top: 18px;
      }

      .hero,
      .closing {
        padding: 16px;
        border-radius: 28px;
      }

      .intro {
        gap: 18px;
      }

      .head {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }

      .btn {
        width: 100%;
      }

      .closing {
        flex-direction: column;
        align-items: flex-start;
      }

      .services {
        padding: 18px;
      }
    }

          ['Is it really free?', 'Yes. There is nothing to pay and no account to make.'],
          ['What does it run on?', 'Windows, for now.'],
          ['How do I install it?', 'There is nothing to install. Papion is portable: extract the zip anywhere and run the exe inside.'],
          ['It says Connected, but Discord will not load.', 'Discord usually only reads your proxy settings when it starts. If it was already open when Papion connected, it can keep using your normal connection and never go through the tunnel. Close Discord completely (right-click its icon next to the Windows clock and choose Quit Discord, closing the window is not enough) and open it again. Still stuck? Press Disconnect and then Connect so Papion picks another server, and turn off any other VPN or proxy that is running at the same time.'],
          ['Voice calls will not connect.', 'Turn on TUN mode: open Papion\'s Settings, switch on "TUN mode", press "Save settings", say Yes to the Windows admin prompt and connect again. Without TUN, voice calls connect directly instead of through the tunnel, and on some networks that does not work.'],
          ['Why does it ask for admin rights?', 'Only for TUN mode, which routes Discord at the network level so voice goes through the tunnel too. Without TUN, Papion does not need admin rights.'],
          ['Why is my ping so high in games?', 'Papion runs on free public servers. Lots of people share them and they are often far from you, so every packet takes a long detour. Games need a low and steady delay (ping), and free servers simply cannot give you that, so most of the time Papion is not a good fit for online gaming. It is great for everything where speed matters more than delay: downloading games and files, streaming, watching YouTube and Instagram, browsing the web, and chatting. For competitive or real-time games, a dedicated gaming connection is a better choice.'],
          ['Is it safe? What about my privacy?', 'Papion has no accounts and does not collect or send anything about you. It connects through free public servers published by other people, so treat it like any free proxy: Discord traffic is encrypted, but do not use it for anything sensitive.'],
          ['Where do the servers come from?', 'From public subscription lists. Papion tests them and keeps the ones that work. You can add your own links in Settings (vmess, vless, trojan and ss lists work).'],
          ['What is "Connected with Papion" on my Discord profile?', 'An optional status that shows only that you use Papion, and only while you are connected. It helps other people find out Papion exists, and you can turn it off in Settings.'],
          ['How do updates work?', 'Papion tells you when a new version or a new core is out and updates with one click ("Update & restart"). The download button on this page always points to the newest release.'],

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const PERSIAN_DIGITS = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    const LATIN_RE = /[A-Za-z][A-Za-z0-9._@\/-]*(?:[\u00a0 ][A-Za-z][A-Za-z0-9._@\/-]*)*/g;

    let currentLang = localStorage.getItem('lang') === 'en' ? 'en' : 'fa';

    const tx = s => {
      if (currentLang !== 'fa') return esc(s);
      let out = '', last = 0, m;
      LATIN_RE.lastIndex = 0;
      while ((m = LATIN_RE.exec(s))) {
        out += esc(s.slice(last, m.index)) + '<bdi>' + esc(m[0]) + '</bdi>';
        last = m.index + m[0].length;
      }
      return out + esc(s.slice(last));
    };
    const setTx = (id, s) => { $(id).innerHTML = tx(s); };
    const fmt = n => currentLang === 'fa' ? String(n).replace(/[0-9]/g, d => PERSIAN_DIGITS[d]) : String(n);

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const zeros = () => new Array(HIST).fill(0);
    mock.hd = zeros();
    mock.hu = zeros();

    const DNS_LIST = [
      ['google', 'Google', ['8.8.8.8', '8.8.4.4'], '#4285f4'],

    function split(n, units) {
      let i = 0, v = n;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      const num = i === 0 ? String(Math.floor(v)) : (v < 10 ? v.toFixed(1) : String(Math.round(v)));
      return [fmt(num.replace('.', currentLang === 'fa' ? '٫' : '.')), units[i]];
    }

    function bytes(n, units) {
      const [a, b] = split(n, units);
      return '<span>' + a + '</span><span class="u">' + b + '</span>';
    }

    function plain(n, units) {
      const [a, b] = split(n, units);
      return a + ' ' + b;
    }

    function clock(s) {
      const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
      const two = n => (n < 10 ? '0' : '') + n;
      return fmt((h ? two(h) + ':' : '') + two(m) + ':' + two(x));
    }

    function swap(el) {
      el.classList.remove('swap');
      void el.offsetWidth;
      el.classList.add('swap');
    }

    function placePill(seg) {
      const a = seg.querySelector('.active');
      if (!a) return;
      seg.style.setProperty('--pill-x', a.offsetLeft + 'px');
      seg.style.setProperty('--pill-w', a.offsetWidth + 'px');
    }

    function buildSeg(id, items, current, onPick) {
      const seg = $(id);
      seg.innerHTML = items.map(([k, label]) => '<button type="button" data-k="' + k + '" class="' + (k === current ? 'active' : '') + '">' + esc(label) + '</button>').join('');
      seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        seg.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
        placePill(seg);
        onPick(b.dataset.k);
      }));
      placePill(seg);
    }

    function setView(v) {
      mock.view = v;
      $('mock').dataset.view = v;
      const el = $('mv-' + v);
      if (el) el.scrollTop = 0;
      if (v === 'usage') renderUsage();
      if (v === 'set') requestAnimationFrame(() => document.querySelectorAll('#mv-set .m-seg').forEach(placePill));
      if (v === 'dns') paintDns();
    }

    function livePath(arr, peak, area) {
      const pts = arr.map((v, i) => (i / (HIST - 1) * 300).toFixed(1) + ' ' + (43 - v / peak * 39).toFixed(1));
      const line = 'M' + pts.join('L');
      return area ? line + 'L300 43.5L0 43.5Z' : line;
    }

    function paintLive() {
      const t = I18N[currentLang].mock;
      const on = mock.state === 'on';
      const peak = Math.max(1, ...mock.hd, ...mock.hu);
      const last = HIST - 1;
      $('m-down').innerHTML = bytes(mock.hd[last], t.rateUnits);
      $('m-up').innerHTML = bytes(mock.hu[last], t.rateUnits);
      $('m-ad').setAttribute('d', on ? livePath(mock.hd, peak, true) : '');
      $('m-ld').setAttribute('d', on ? livePath(mock.hd, peak, false) : '');
      $('m-au').setAttribute('d', on ? livePath(mock.hu, peak, true) : '');
      $('m-lu').setAttribute('d', on ? livePath(mock.hu, peak, false) : '');
      $('m-peak').textContent = on && mock.secs > 0 ? t.peak(plain(peak, t.rateUnits)) : '';
    }

    function dnsName(k) {
      const t = I18N[currentLang].mock;
      const row = DNS_LIST.find(r => r[0] === k);
      return k === 'auto' ? t.dnsAuto : row[1];
    }

    function buildDns() {
      $('m-dns-grid').innerHTML = DNS_LIST.map(([k, label, ips, color]) => {
        const letter = k === '403' ? '403' : label.charAt(0).toUpperCase();
        return '<button type="button" class="m-dns-tile" data-k="' + k + '"><span class="m-dns-badge' + (letter.length > 1 ? ' sm' : '') + '" style="background:' + color + '">' + letter + '</span><span class="m-dns-text"><span class="m-dns-name"><span>' + tx(dnsName(k)) + '</span></span><span class="m-dns-ips">' + ips.map(ip => '<span>' + ip + '</span>').join('') + '</span></span></button>';
      }).join('');
      $('m-dns-grid').querySelectorAll('.m-dns-tile').forEach(b => b.addEventListener('click', () => {
        if (dns.busy) return;
        dns.sel = b.dataset.k;
        dns.done = false;
        paintDns();
      }));
    }

    function paintDns() {
      const t = I18N[currentLang].mock;
      const row = DNS_LIST.find(r => r[0] === dns.cur);
      $('m-dns-title').textContent = t.dnsTitle;
      $('m-dns-now').textContent = t.dnsNow;
      $('m-dns-help').textContent = t.dnsHelp;
      $('m-dns-cur').innerHTML = tx(dnsName(dns.cur));
      $('m-dns-curips').innerHTML = row[2].map(ip => '<span>' + ip + '</span>').join('');
      $('m-flush').title = t.dnsFlush;
      $('m-flush').setAttribute('aria-label', t.dnsFlush);
      document.querySelectorAll('.m-dns-tile').forEach(b => {
        b.classList.toggle('sel', b.dataset.k === dns.sel);
        b.classList.toggle('cur', b.dataset.k === dns.cur);
      });
      const btn = $('m-dns-apply');
      btn.disabled = dns.busy || dns.done || !dns.sel || dns.sel === dns.cur;
      btn.classList.toggle('loading', dns.busy);
      btn.classList.toggle('done', dns.done);
      $('m-dns-apply-lbl').textContent = dns.busy ? t.dnsApplying : dns.done ? t.dnsDoneShort : t.dnsApply;
      const msg = $('m-dns-msg');
      msg.textContent = dns.msg ? (dns.msg.k === 'done' ? t.dnsDone(dnsName(dns.msg.v)) : t.dnsFlushed) : '';
      msg.classList.toggle('ok', !!dns.msg);
    }

    $('m-dns-apply').addEventListener('click', () => {
      if (dns.busy || !dns.sel || dns.sel === dns.cur) return;
      dns.busy = true;
      dns.msg = null;
      paintDns();
      setTimeout(() => {
        dns.busy = false;
        dns.done = true;
        dns.cur = dns.sel;
        dns.msg = { k: 'done', v: dns.cur };
        const hero = $('m-dns-hero');
        hero.classList.remove('flash');
        void hero.offsetWidth;
        hero.classList.add('flash');
        paintDns();
        setTimeout(() => { dns.done = false; paintDns(); }, 1700);
      }, reduceMotion ? 150 : 1300);
    });

      const b = $('m-flush');
      b.classList.remove('spin');
      void b.offsetWidth;
      b.classList.add('spin');
      dns.msg = { k: 'flush' };

    function rng(seed) {
      let s = seed;
      return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    }

    function usageBuckets(range) {
      const n = range === 'day' ? 24 : range === 'week' ? 7 : 30;
      const r = rng(range === 'day' ? 11 : range === 'week' ? 29 : 47);
      const scale = range === 'day' ? 420e6 : range === 'week' ? 5.4e9 : 3.2e9;
      const nowH = new Date().getHours();
      const out = [];
      for (let i = 0; i < n; i++) {
        let w = 0.35 + r() * 0.65;
        if (range === 'day') {
          const h = (nowH - (n - 1) + i + 24) % 24;
          w = h < 6 ? 0.06 + r() * 0.12 : h < 10 ? 0.25 + r() * 0.3 : h < 17 ? 0.4 + r() * 0.35 : 0.7 + r() * 0.3;
        }
        const total = Math.round(w * scale);
        const p = 0.55 + r() * 0.3;
        const d = 0.86 + r() * 0.07;
        out.push({ total, a: total * p, b: total * (1 - p), down: total * d, up: total * (1 - d) });
      }
      return out;
    }

    function usageLabels(range, t) {
      const loc = currentLang === 'fa' ? 'fa-IR' : 'en-US';
      const n = range === 'day' ? 24 : range === 'week' ? 7 : 30;
      const now = new Date();
      const out = [];
      for (let i = 0; i < n; i++) {
        if (range === 'day') {
          const h = (now.getHours() - (n - 1) + i + 24) % 24;
          const two = x => fmt((x < 10 ? '0' : '') + x);
          out.push({ axis: i % 4 === 3 ? two(h) : '', tip: two(h) + ':00 – ' + two((h + 1) % 24) + ':00' });
        } else {
          const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (n - 1 - i));
          const full = d.toLocaleDateString(loc, { weekday: 'short', day: 'numeric', month: 'short' });
          const axis = range === 'week' ? d.toLocaleDateString(loc, { weekday: 'short' }) : ((n - 1 - i) % 5 === 0 ? d.toLocaleDateString(loc, { day: 'numeric' }) : '');
          out.push({ axis, tip: full });
        }
      }
      return out;
    }

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141018">
  <title>404 — Aloy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding-bottom: 12vh;
      background: #141018;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      animation: page-fade-in 0.4s ease-out;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    @keyframes page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        animation: none;
      }
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(72px, 20vw, 200px);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, #ff7ab6, #ffd1e7, #5bcefa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .home-link {
      color: #cdb8c7;
      font-size: 15px;
      letter-spacing: -0.01em;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 239, 247, 0.24);
      padding-bottom: 2px;
      transition: color 180ms ease, border-color 180ms ease;
    }

    .home-link:hover {
      color: #fff7fb;
      border-color: rgba(255, 209, 231, 0.5);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <a class="home-link" href="https://actually-aloy.github.io/site">back to home</a>
  </div>
</body>
</html>

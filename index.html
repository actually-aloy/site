  <style>
    :root {
      --bg: #141018;
      --text: #fff7fb;
      --muted: #cdb8c7;
      --line: rgba(255, 239, 247, 0.16);
      --pink: #ff7ab6;
      --pink-soft: #ffd1e7;
      --blue: #5bcefa;
      --surface: rgba(255, 244, 249, 0.07);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 122, 182, 0.15), transparent 30%),
        radial-gradient(circle at 88% 16%, rgba(255, 209, 231, 0.08), transparent 28%),
        radial-gradient(circle at 50% 92%, rgba(91, 206, 250, 0.08), transparent 34%),
        var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(310px, 410px);
      gap: 18px;
      padding: 24px;
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 10px);
      background: linear-gradient(145deg, rgba(255, 244, 249, 0.105), rgba(255, 244, 249, 0.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(22px);
    }

    .intro {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      min-width: 0;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .flag {
      width: 48px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 14px 30px rgba(255, 122, 182, 0.16);
      background:
        linear-gradient(
          #5bcefa 0 20%,
          #f5a9b8 20% 40%,
          #ffffff 40% 60%,
          #f5a9b8 60% 80%,
          #5bcefa 80% 100%
        );
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 11vw, 118px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .gradient-text {
      color: var(--pink-soft);
    }

    .bio {
      max-width: 560px;
      margin: 0;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin: 0;
      padding: 7px 14px 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 244, 249, 0.06);
      color: var(--muted);
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 0 3px rgba(255, 122, 182, 0.18);
    }

    .socials {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .social {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      min-height: 78px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 23px;
      background: rgba(255, 244, 249, 0.06);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .social:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 209, 231, 0.4);
      background: rgba(255, 244, 249, 0.1);
    }

    .social-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: #141018;
      background: linear-gradient(135deg, var(--pink), var(--pink-soft));
      box-shadow: 0 16px 34px rgba(255, 122, 182, 0.18);
    }

    .social-icon svg {
      width: 26px;
      height: 26px;
      color: #141018;
    }

    .social strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
    }

    .social span:last-child {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .oc-panel {
      position: relative;
      overflow: hidden;
      min-height: 470px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 24% 16%, rgba(255, 209, 231, 0.16), transparent 34%),
        rgba(255, 244, 249, 0.055);
    }

    .oc-image {
      width: 100%;
      height: 100%;
      min-height: 470px;
      object-fit: cover;
      display: block;
    }

    .oc-placeholder {
      width: 100%;
      height: 100%;
      min-height: 470px;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
    }

    .oc-placeholder-inner {
      width: min(260px, 100%);
      aspect-ratio: 1 / 1.18;
      display: grid;
      place-items: center;
      border: 1.5px dashed rgba(255, 209, 231, 0.42);
      border-radius: 30px;
      background: rgba(255, 244, 249, 0.055);
    }

    .oc-placeholder p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .oc-placeholder strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 22px;
      letter-spacing: -0.04em;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .oc-panel,
      .oc-image,
      .oc-placeholder {
        min-height: 380px;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 22px, 1080px);
        padding-top: 18px;
      }

      .hero {
        padding: 16px;
        border-radius: 28px;
      }

      .socials {
        grid-template-columns: 1fr;
      }

      .intro {
        gap: 18px;
      }
    }
  </style>
</head>

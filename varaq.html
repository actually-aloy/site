<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14100c">
  <title>ورق — یه PDF‌خوان آروم</title>
  <meta name="description" content="Varaq: a quiet, free PDF reader for Windows. It opens fast, remembers where you stopped, and lets you highlight and take notes without getting in your way.">
  <link rel="canonical" href="https://actually-aloy.github.io/site/varaq">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Varaq — a quiet PDF reader">
  <meta property="og:description" content="A free, portable PDF reader for Windows. Highlights, notes, dark mode and your place remembered. No installer, no account.">
  <meta property="og:url" content="https://actually-aloy.github.io/site/varaq">
  <meta property="og:image" content="https://actually-aloy.github.io/site/varaq-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Varaq — a quiet PDF reader">
  <meta name="twitter:description" content="A free, portable PDF reader for Windows. Highlights, notes, dark mode and your place remembered. No installer, no account.">
  <meta name="twitter:image" content="https://actually-aloy.github.io/site/varaq-og.jpg">
  <link rel="icon" href="varaq-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #14100c;
      --text: #fbf6ee;
      --muted: #cbbfae;
      --line: rgba(255, 236, 214, 0.16);
      --orange: #d1581f;
      --orange-mid: #ee7a3e;
      --orange-soft: #ffc18f;
      --gold: #ffd23f;
      --pink: #ff7ab6;
      --ink: #1d1c1a;
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 10%, rgba(209, 88, 31, 0.3), transparent 32%),
        radial-gradient(circle at 90% 14%, rgba(255, 193, 143, 0.1), transparent 28%),
        radial-gradient(circle at 52% 94%, rgba(255, 210, 63, 0.07), transparent 34%),
        var(--bg);
      animation: page-fade-in 0.4s ease-out;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    @keyframes page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    html[lang="fa"] body {
      font-family: Vazirmatn, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .glass {
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 10px);
      background: linear-gradient(145deg, rgba(255, 244, 232, 0.105), rgba(255, 244, 232, 0.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(22px);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 440px);
      gap: 30px;
      padding: 28px;
      align-items: center;
    }

    .intro {
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 244, 232, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .pill-btn:hover {
      background: rgba(255, 244, 232, 0.12);
      border-color: rgba(255, 193, 143, 0.45);
    }

    .pill-btn svg {
      width: 14px;
      height: 14px;
    }

    html[dir="rtl"] .pill-btn svg {
      transform: scaleX(-1);
    }

    .lang-toggle {
      margin-inline-start: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      width: 64px;
      height: 64px;
      flex: 0 0 auto;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(209, 88, 31, 0.45);
      -webkit-user-drag: none;
    }

    h1 {
      font-size: clamp(48px, 9vw, 92px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--orange-mid), var(--orange-soft), var(--pink), var(--orange-mid));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: enchant 6s linear infinite;
    }

    @keyframes enchant {
      to { background-position: -300% 0; }
    }

    .pitch {
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 6px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 244, 232, 0.06);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
    }

    .tag.hot {
      border-color: transparent;
      background: linear-gradient(135deg, var(--orange-mid), var(--orange-soft));
      color: var(--ink);
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 244, 232, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 180ms ease, transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 244, 232, 0.12);
      border-color: rgba(255, 193, 143, 0.45);
    }

    .btn.primary {
      border-color: transparent;
      background: linear-gradient(135deg, var(--orange-mid), var(--orange-soft));
      color: var(--ink);
    }

    .btn.primary:hover {
      filter: brightness(1.06);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .btn:focus-visible,
    .pill-btn:focus-visible,
    .faq-q:focus-visible {
      outline: 2px solid var(--orange-soft);
      outline-offset: 3px;
    }

    .dl-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 6% -6% 10%;
      z-index: 0;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(209, 88, 31, 0.5), rgba(209, 88, 31, 0));
      filter: blur(24px);
      pointer-events: none;
    }

    .mock {
      --m-bg: #ecebe6;
      --m-panel: #fbfaf7;
      --m-panel2: #f3f2ed;
      --m-ink: #1d1c1a;
      --m-ink2: #5d5a53;
      --m-ink3: #948f85;
      --m-line: rgba(0, 0, 0, 0.1);
      --m-page: #ffffff;
      --m-pageink: #26241f;
      --m-ar: 209, 88, 31;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      border: 1px solid var(--m-line);
      border-radius: 14px;
      background: var(--m-bg);
      color: var(--m-ink);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(209, 88, 31, 0.2);
      transition: background 0.35s ease, color 0.35s ease;
    }

    .mock[data-theme="sepia"] {
      --m-bg: #e4d8bf;
      --m-panel: #f1e8d3;
      --m-panel2: #eadfc6;
      --m-ink: #3a3125;
      --m-ink2: #6b5d47;
      --m-ink3: #9a8a6e;
      --m-line: rgba(58, 49, 37, 0.14);
      --m-page: #f7f0de;
      --m-pageink: #3a3125;
    }

    .mock[data-theme="dark"] {
      --m-bg: #141418;
      --m-panel: #1c1c21;
      --m-panel2: #242429;
      --m-ink: #ececf0;
      --m-ink2: #a4a4ae;
      --m-ink3: #6f6f7a;
      --m-line: rgba(255, 255, 255, 0.1);
      --m-page: #202024;
      --m-pageink: #dcdce0;
    }

    .m-title {
      display: flex;
      align-items: center;
      height: 32px;
      background: var(--m-panel);
      border-bottom: 1px solid var(--m-line);
      direction: ltr;
      transition: background 0.35s ease;
    }

    .m-title-name {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-left: 10px;
      min-width: 0;
      color: var(--m-ink2);
      font-size: 11.5px;
      font-weight: 600;
    }

    .m-title-name img {
      width: 18px;
      height: 18px;
      display: block;
      -webkit-user-drag: none;
    }

    .m-title-name span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .m-title-name i {
      font-style: normal;
      font-weight: 500;
      color: var(--m-ink3);
    }

    .m-title-btns {
      display: flex;
      height: 100%;
      margin-left: auto;
      color: var(--m-ink3);
    }

    .m-title-btns span {
      width: 38px;
      display: grid;
      place-items: center;
    }

    .m-title-btns svg {
      width: 10px;
      height: 10px;
    }

    .m-tools {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 5px 8px;
      background: var(--m-panel);
      border-bottom: 1px solid var(--m-line);
      direction: ltr;
      transition: background 0.35s ease;
    }

    .m-ib {
      width: 28px;
      height: 28px;
      flex: none;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--m-ink2);
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }

    .m-ib:hover:not(:disabled) {
      background: rgba(127, 127, 127, 0.16);
      color: var(--m-ink);
    }

    .m-ib:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .m-ib.on {
      color: rgb(var(--m-ar));
    }

    .m-ib svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill 0.25s ease;
    }

    #m-mark.on svg {
      fill: rgba(var(--m-ar), 0.3);
    }

    .m-ib:focus-visible,
    .m-sw:focus-visible,
    .m-tab:focus-visible,
    .m-thumb:focus-visible,
    .m-hl-item:focus-visible,
    .m-c:focus-visible,
    .s:focus-visible {
      outline: 2px solid rgb(var(--m-ar));
      outline-offset: 1px;
    }

    .m-gap {
      flex: 1;
      min-width: 4px;
    }

    .m-val {
      min-width: 36px;
      color: var(--m-ink2);
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .m-swatches {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: 6px;
    }

    .m-sw {
      width: 15px;
      height: 15px;
      padding: 0;
      border: 1.5px solid var(--m-line);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .m-sw:hover {
      transform: scale(1.12);
    }

    .m-sw[data-t="light"] { background: #fbfaf7; }
    .m-sw[data-t="sepia"] { background: #eadfc6; }
    .m-sw[data-t="dark"] { background: #1c1c21; }

    .m-sw.on {
      outline: 2px solid rgb(var(--m-ar));
      outline-offset: 1px;
    }

    .m-main {
      position: relative;
      display: flex;
      height: 352px;
      direction: ltr;
    }

    .m-side {
      flex: none;
      width: 140px;
      overflow: hidden;
      background: var(--m-panel);
      border-right: 1px solid var(--m-line);
      transition: width 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.32s ease, background 0.35s ease;
    }

    .m-side.hide {
      width: 0;
      border-right-color: transparent;
    }

    .m-side-in {
      width: 140px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .m-tabs {
      display: flex;
      border-bottom: 1px solid var(--m-line);
    }

    .m-tab {
      flex: 1;
      min-width: 0;
      padding: 8px 2px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: none;
      color: var(--m-ink3);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .m-tab.on {
      color: var(--m-ink);
      border-bottom-color: rgb(var(--m-ar));
    }

    .m-badge {
      display: inline-block;
      min-width: 14px;
      margin-inline-start: 3px;
      padding: 0 4px;
      border-radius: 999px;
      background: rgb(var(--m-ar));
      color: #fff;
      font-size: 9.5px;
      line-height: 14px;
      animation: badge-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes badge-in {
      from { transform: scale(0.4); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    .m-thumbs,
    .m-hls {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      overflow-y: auto;
    }

    .m-thumb {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--m-ink3);
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
    }

    .m-th-pg {
      width: 62px;
      height: 80px;
      border-radius: 3px;
      background:
        repeating-linear-gradient(var(--m-line) 0 2px, transparent 2px 7px) 8px 18px / calc(100% - 16px) calc(100% - 28px) no-repeat,
        var(--m-page);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      outline: 2px solid transparent;
      outline-offset: 2px;
      transition: outline-color 0.2s ease, transform 0.2s ease;
    }

    .m-thumb:hover .m-th-pg {
      transform: translateY(-1px);
    }

    .m-thumb.on .m-th-pg {
      outline-color: rgb(var(--m-ar));
    }

    .m-thumb.on {
      color: var(--m-ink);
      font-weight: 700;
    }

    .m-hls {
      align-items: stretch;
      gap: 7px;
      padding: 10px 8px;
    }

    .m-hl-item {
      display: block;
      width: 100%;
      padding: 6px 7px;
      border: 0;
      border-inline-start: 3px solid rgb(var(--hc));
      border-radius: 4px;
      background: var(--m-panel2);
      color: var(--m-ink2);
      font-family: inherit;
      font-size: 10.5px;
      line-height: 1.5;
      text-align: start;
      cursor: pointer;
      animation: hl-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .m-hl-item:hover {
      color: var(--m-ink);
    }

    .m-hl-item span {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @keyframes hl-in {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: none; }
    }

    .m-empty {
      padding: 6px 2px;
      color: var(--m-ink3);
      font-size: 10.5px;
      line-height: 1.7;
      text-align: center;
    }

    .m-view {
      position: relative;
      flex: 1;
      min-width: 0;
      padding: 16px 14px 18px;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--m-bg);
      transition: background 0.35s ease;
      scrollbar-width: thin;
    }

    .m-page {
      --z: 1;
      position: relative;
      padding: 22px 22px 18px;
      border-radius: 3px;
      background: var(--m-page);
      color: var(--m-pageink);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: calc(13.5px * var(--z));
      line-height: 1.8;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      transition: background 0.35s ease, color 0.35s ease, font-size 0.25s ease;
    }

    html[lang="fa"] .m-page {
      font-family: Vazirmatn, Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: calc(12.5px * var(--z));
      line-height: 2;
    }

    .m-page.swap {
      animation: page-in 0.36s ease both;
    }

    @keyframes page-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .m-page.bm::before {
      content: "";
      position: absolute;
      top: -1px;
      inset-inline-end: 18px;
      width: 12px;
      height: 22px;
      background: rgb(var(--m-ar));
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%);
      animation: ribbon 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes ribbon {
      from { transform: translateY(-100%); }
      to { transform: none; }
    }

    .m-page h3 {
      margin: 0 0 10px;
      font-size: 1.25em;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.4;
    }

    .m-page p {
      margin: 0;
    }

    .m-pn {
      margin-top: 14px;
      color: var(--m-ink3);
      font-family: Inter, system-ui, sans-serif;
      font-size: 10px;
      text-align: center;
    }

    .s {
      cursor: pointer;
      border-radius: 2px;
      background-color: transparent;
      background-image: linear-gradient(rgba(var(--hc), 0.45), rgba(var(--hc), 0.45));
      background-repeat: no-repeat;
      background-size: 0% 100%;
      background-position: 0 0;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      transition: background-size 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s ease;
    }

    html[dir="rtl"] .s {
      background-position: 100% 0;
    }

    .s:hover {
      background-color: rgba(127, 127, 127, 0.14);
    }

    .s.hl {
      background-size: 100% 100%;
    }

    .s.sel {
      outline: 1.5px solid rgba(var(--m-ar), 0.7);
      outline-offset: 1px;
    }

    .s.nudge {
      animation: nudge 2.2s ease-in-out 1.4s 3;
    }

    @keyframes nudge {
      0%, 100% { background-color: rgba(var(--m-ar), 0); }
      50% { background-color: rgba(var(--m-ar), 0.2); }
    }

    .m-pop {
      position: absolute;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      border: 1px solid var(--m-line);
      border-radius: 12px;
      background: var(--m-panel);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
      opacity: 0;
      transform: translateY(4px) scale(0.95);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .m-pop.open {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .m-c {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgb(var(--c));
      color: var(--m-ink2);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .m-c:hover {
      transform: scale(1.14);
    }

    .m-c.on {
      box-shadow: 0 0 0 2px var(--m-panel), 0 0 0 3.5px rgb(var(--c));
    }

    .m-c.x {
      background: none;
      border: 1.5px solid var(--m-ink3);
    }

    .m-c.x svg {
      width: 10px;
      height: 10px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .m-toast {

      left: 50%;
      bottom: 12px;
      z-index: 6;
      padding: 6px 13px;
      border-radius: 999px;
      background: var(--m-ink);
      color: var(--m-panel);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, 8px);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .m-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .mock-note {
      position: relative;
      z-index: 1;
      max-width: 400px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.7;
      text-align: center;
    }

      margin-top: 38px;
      scroll-margin-top: 18px;
    }

      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 4px 14px;
    }

    .head h2 {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .head span {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .grid.three {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .grid.cols3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    @media (max-width: 900px) {
      .grid.cols3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .grid.cols3 {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255, 244, 232, 0.09), rgba(255, 244, 232, 0.04));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(18px);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 193, 143, 0.42);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      position: relative;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: var(--ink);
      background: linear-gradient(135deg, var(--orange-mid), var(--orange-soft));
      box-shadow: 0 14px 30px rgba(209, 88, 31, 0.3);
    }

    .icon.gold {
      background: linear-gradient(135deg, var(--gold), var(--orange-soft));
      box-shadow: 0 14px 30px rgba(255, 210, 63, 0.18);
    }

    .icon svg {
      width: 22px;
      height: 22px;
    }

    .step-num {
      margin-inline-start: auto;
      color: rgba(255, 193, 143, 0.28);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .card-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-desc {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.75;
    }

    .keys-card {
      padding: 10px 22px;

    .keys {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 36px;

    .key-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;

      border-bottom: 0;
    }

    .keys-k {
      display: inline-flex;
      flex: none;
      gap: 4px;
      direction: ltr;
    }

    kbd {
      display: inline-block;
      min-width: 26px;
      padding: 3px 8px;

      border-bottom-width: 2px;
      border-radius: 7px;
      background: rgba(255, 244, 232, 0.07);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;

        grid-template-columns: minmax(0, 1fr);

        border-bottom: 1px solid var(--line);
      }

    .faq {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .faq-item {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 244, 232, 0.05);
      transition: border-color 240ms ease, background 240ms ease;

    .faq-item:hover {
      border-color: rgba(255, 193, 143, 0.28);
    }

    .faq-item.open {
      border-color: rgba(255, 193, 143, 0.4);
      background: rgba(255, 244, 232, 0.08);
    }

    .faq-q {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      border: none;
      border-radius: 20px;
      background: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-align: start;
      cursor: pointer;
    }

    .faq-q:focus-visible {
      outline-offset: -2px;
    }

    .faq-icon {
      position: relative;
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      transition: transform 340ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .faq-icon::before,
    .faq-icon::after {
      content: "";
      position: absolute;
      inset-inline: 0;
      top: 50%;
      height: 2px;
      margin-top: -1px;
      border-radius: 2px;
      background: var(--orange-soft);
      transition: transform 340ms cubic-bezier(0.2, 0.8, 0.2, 1);

    .faq-icon::after {
      transform: rotate(90deg);

      transform: rotate(180deg);
    }

    .faq-item.open .faq-icon::after {
      transform: rotate(0deg);
    }

    .faq-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition: grid-template-rows 360ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 240ms ease, visibility 0s linear 360ms;

      visibility: visible;

      line-height: 1.8;

    .made {

    .heart {

    const LATIN_RE = /[A-Za-z][A-Za-z0-9._@+\/-]*(?:[  ][A-Za-z][A-Za-z0-9._@+\/-]*)*/g;

      while ((m = LATIN_RE.exec(s))) {
        out += esc(s.slice(last, m.index)) + '<bdi>' + esc(m[0]) + '</bdi>';
        last = m.index + m[0].length;

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const HC = ['255,210,63', '92,214,128', '98,178,255', '255,130,178'];
    const ZOOMS = [0.8, 1, 1.25];
    const THEMES = ['light', 'sepia', 'dark'];
    const mk = { page: 0, zoom: 1, side: true, tab: 'pages', theme: 'light', marks: {}, sel: null, nudge: true, toastTimer: 0 };
    const hl = {};

    function setLabel(id, text) {
      const el = $(id);
      el.setAttribute('aria-label', text);
      el.title = text;
    }

    function toast(text) {
      const el = $('m-toast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(mk.toastTimer);
      mk.toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
    }

    function closePop() {
      $('m-pop').classList.remove('open');
      document.querySelectorAll('#m-page .s.sel').forEach(s => s.classList.remove('sel'));
      mk.sel = null;
    }

    function renderPage(animate) {
      const t = I18N[currentLang];
      const d = t.doc[mk.page];
      const el = $('m-page');
      el.style.setProperty('--z', ZOOMS[mk.zoom]);
      el.classList.toggle('bm', !!mk.marks[mk.page]);
      el.innerHTML = '<h3>' + tx(d.title) + '</h3><p>' + d.s.map((x, i) => {
        const c = hl[mk.page + ':' + i];
        const on = c !== undefined;
        const cls = 's' + (on ? ' hl' : '') + (mk.nudge && i === 0 && !on ? ' nudge' : '');
        return '<span class="' + cls + '" data-i="' + i + '" tabindex="0" role="button" aria-pressed="' + on + '" style="--hc:' + HC[on ? c : 0] + '">' + tx(x) + '</span>';
      }).join(' ') + '</p><div class="m-pn" aria-hidden="true">' + fmt(mk.page + 1) + '</div>';
      if (animate && !reduceMotion) {
        el.classList.remove('swap');
        void el.offsetWidth;
        el.classList.add('swap');
      }
    }

    function renderSide() {
      const t = I18N[currentLang].mock;
      const entries = Object.keys(hl).map(k => {
        const [p, i] = k.split(':').map(Number);
        return [p, i, hl[k]];
      }).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      $('m-tab-pages').textContent = t.tabPages;
      $('m-tab-hl').innerHTML = tx(t.tabHl) + (entries.length ? '<span class="m-badge">' + fmt(entries.length) + '</span>' : '');
      $('m-tab-pages').classList.toggle('on', mk.tab === 'pages');
      $('m-tab-hl').classList.toggle('on', mk.tab === 'hl');
      $('m-thumbs').hidden = mk.tab !== 'pages';
      $('m-hls').hidden = mk.tab !== 'hl';
      $('m-thumbs').innerHTML = [0, 1].map(i => '<button type="button" class="m-thumb' + (i === mk.page ? ' on' : '') + '" data-p="' + i + '" aria-label="' + esc(t.pageN(fmt(i + 1))) + '"><span class="m-th-pg"></span><span>' + fmt(i + 1) + '</span></button>').join('');
      const doc = I18N[currentLang].doc;
      $('m-hls').innerHTML = entries.length
        ? entries.map(([p, i, c]) => '<button type="button" class="m-hl-item" data-p="' + p + '" data-i="' + i + '" style="--hc:' + HC[c] + '"><span>' + tx(doc[p].s[i]) + '</span></button>').join('')
        : '<div class="m-empty">' + tx(t.empty) + '</div>';
    }

    function renderTools() {
      const t = I18N[currentLang].mock;
      $('m-side-btn').innerHTML = msvg('side');
      $('m-prev').innerHTML = msvg('left');
      $('m-next').innerHTML = msvg('right');
      $('m-zout').innerHTML = msvg('minus');
      $('m-zin').innerHTML = msvg('plus');
      $('m-mark').innerHTML = msvg('bookmark');
      setLabel('m-side-btn', t.sidebar);
      setLabel('m-prev', t.prev);
      setLabel('m-next', t.next);
      setLabel('m-zout', t.zoomOut);
      setLabel('m-zin', t.zoomIn);
      setLabel('m-mark', t.bookmark);
      $('m-pages').textContent = fmt(mk.page + 1) + t.of + fmt(2);
      $('m-zoom').textContent = fmt(Math.round(ZOOMS[mk.zoom] * 100)) + (currentLang === 'fa' ? '٪' : '%');
      $('m-prev').disabled = mk.page === 0;
      $('m-next').disabled = mk.page === 1;
      $('m-zout').disabled = mk.zoom === 0;
      $('m-zin').disabled = mk.zoom === ZOOMS.length - 1;
      $('m-side-btn').classList.toggle('on', mk.side);
      $('m-side-btn').setAttribute('aria-pressed', String(mk.side));
      $('m-side').classList.toggle('hide', !mk.side);
      $('m-mark').classList.toggle('on', !!mk.marks[mk.page]);
      $('m-mark').setAttribute('aria-pressed', String(!!mk.marks[mk.page]));
      $('m-swatches').innerHTML = THEMES.map(k => '<button type="button" class="m-sw' + (k === mk.theme ? ' on' : '') + '" data-t="' + k + '" aria-pressed="' + (k === mk.theme) + '" aria-label="' + esc(t.themes[k]) + '" title="' + esc(t.themes[k]) + '"></button>').join('');
      $('mock').dataset.theme = mk.theme;
    }

    function paintMock() {
      const t = I18N[currentLang].mock;
      $('m-title-text').innerHTML = 'Varaq <i>— <bdi dir="ltr">' + esc(t.file) + '</bdi></i>';
      $('m-pop').setAttribute('aria-label', t.tabHl);
      setTx('mock-note', t.note);
      closePop();
      renderTools();
      renderPage(false);
      renderSide();
    }

    function goPage(p, animate) {
      if (p < 0 || p > 1) return;
      const changed = p !== mk.page;
      mk.page = p;
      closePop();
      renderTools();
      renderPage(animate && changed);
      renderSide();
      if (changed) $('m-view').scrollTop = 0;
    }

    function endNudge() {
      if (!mk.nudge) return;
      mk.nudge = false;
      document.querySelectorAll('#m-page .s.nudge').forEach(s => s.classList.remove('nudge'));
    }

    function openPop(sp) {
      const t = I18N[currentLang].mock;
      const i = Number(sp.dataset.i);
      const key = mk.page + ':' + i;
      document.querySelectorAll('#m-page .s.sel').forEach(s => s.classList.remove('sel'));
      mk.sel = key;
      sp.classList.add('sel');
      const cur = hl[key];
      const pop = $('m-pop');
      pop.innerHTML = HC.map((c, ci) => '<button type="button" class="m-c' + (cur === ci ? ' on' : '') + '" data-c="' + ci + '" style="--c:' + c + '" aria-label="' + esc(t.colors[ci]) + '" title="' + esc(t.colors[ci]) + '"></button>').join('') +
        (cur !== undefined ? '<button type="button" class="m-c x" data-c="x" aria-label="' + esc(t.remove) + '" title="' + esc(t.remove) + '"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8"/><path d="M10 2 2 10"/></svg></button>' : '');
      const main = $('m-main').getBoundingClientRect();
      const r = sp.getBoundingClientRect();
      const w = pop.offsetWidth || 130;
      const h = pop.offsetHeight || 36;
      let left = r.left - main.left + r.width / 2 - w / 2;
      left = Math.max(8, Math.min(main.width - w - 8, left));
      let top = r.bottom - main.top + 8;
      if (top + h > main.height - 6) top = Math.max(6, r.top - main.top - h - 8);
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      pop.classList.add('open');
    }

    function applyHl(c) {
      if (!mk.sel) return;
      const key = mk.sel;
      const i = key.split(':')[1];
      const t = I18N[currentLang].mock;
      const sp = $('m-page').querySelector('.s[data-i="' + i + '"]');
      if (c === null) {
        delete hl[key];
        if (sp) { sp.classList.remove('hl'); sp.setAttribute('aria-pressed', 'false'); }
        toast(t.toastRm);
      } else {
        hl[key] = c;
        if (sp) { sp.style.setProperty('--hc', HC[c]); sp.classList.add('hl'); sp.setAttribute('aria-pressed', 'true'); }
        toast(t.toastHl);
      }
      closePop();
      renderSide();
    }

    $('m-page').addEventListener('click', e => {
      const sp = e.target.closest('.s');
      if (!sp) { closePop(); return; }
      endNudge();
      if (mk.sel === mk.page + ':' + sp.dataset.i && $('m-pop').classList.contains('open')) { closePop(); return; }
      openPop(sp);
    });

    $('m-page').addEventListener('keydown', e => {
      const sp = e.target.closest('.s');
      if (!sp || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      endNudge();
      openPop(sp);
    });

    $('m-pop').addEventListener('click', e => {
      const b = e.target.closest('.m-c');
      if (!b) return;
      applyHl(b.dataset.c === 'x' ? null : Number(b.dataset.c));
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('#m-pop') && !e.target.closest('#m-page')) closePop();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closePop();
    });

    $('m-view').addEventListener('scroll', closePop, { passive: true });

    $('m-prev').addEventListener('click', () => goPage(mk.page - 1, true));
    $('m-next').addEventListener('click', () => goPage(mk.page + 1, true));

    $('m-zout').addEventListener('click', () => { mk.zoom = Math.max(0, mk.zoom - 1); closePop(); renderTools(); renderPage(false); });
    $('m-zin').addEventListener('click', () => { mk.zoom = Math.min(ZOOMS.length - 1, mk.zoom + 1); closePop(); renderTools(); renderPage(false); });

    $('m-side-btn').addEventListener('click', () => { mk.side = !mk.side; closePop(); renderTools(); });

    $('m-mark').addEventListener('click', () => {
      const t = I18N[currentLang].mock;
      mk.marks[mk.page] = !mk.marks[mk.page];
      endNudge();
      closePop();
      renderTools();
      $('m-page').classList.toggle('bm', !!mk.marks[mk.page]);
      toast(mk.marks[mk.page] ? t.toastMark : t.toastUnmark);
    });

    $('m-swatches').addEventListener('click', e => {
      const b = e.target.closest('.m-sw');
      if (!b) return;
      mk.theme = b.dataset.t;
      closePop();
      renderTools();
    });

    $('m-tab-pages').addEventListener('click', () => { mk.tab = 'pages'; renderSide(); });
    $('m-tab-hl').addEventListener('click', () => { mk.tab = 'hl'; renderSide(); });

    $('m-thumbs').addEventListener('click', e => {
      const b = e.target.closest('.m-thumb');
      if (b) goPage(Number(b.dataset.p), true);
    });

    $('m-hls').addEventListener('click', e => {
      const b = e.target.closest('.m-hl-item');
      if (!b) return;
      const p = Number(b.dataset.p);
      const i = b.dataset.i;
      goPage(p, true);
      const sp = $('m-page').querySelector('.s[data-i="' + i + '"]');
      if (sp) sp.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
    });

    let release = null;

    function paintRelease() {
      const t = I18N[currentLang];
      document.querySelectorAll('a[data-dl]').forEach(a => {
        a.href = release ? release.url : LatestRelease.page(REPO);
      });
      const meta = $('dl-meta');
      if (!release) { meta.hidden = true; return; }
      const parts = [];
      if (release.tag) parts.push('<bdi dir="ltr">' + esc(release.tag) + '</bdi>');
      if (release.size) parts.push(fmt((release.size / 1048576).toFixed(1).replace('.', currentLang === 'fa' ? '٫' : '.')) + ' ' + t.sizeUnit);
      meta.innerHTML = parts.join(' · ');
      meta.hidden = parts.length === 0;
    }

    function renderHow(t) {
      $('how-grid').innerHTML = t.how.map(([icon, name, desc], i) => `
        <div class="card">
          <div class="card-top">
            <div class="icon">${svg(icon)}</div>
            <div class="card-name">${tx(name)}</div>
            <span class="step-num" aria-hidden="true">${fmt(i + 1)}</span>
          </div>
          <p class="card-desc">${tx(desc)}</p>
        </div>`).join('');
    }

    function renderFeatures(t) {
      $('feat-grid').innerHTML = t.feat.map(([icon, name, desc], i) => `
        <div class="card">
          <div class="card-top">
            <div class="icon${i % 2 ? ' gold' : ''}">${svg(icon)}</div>
            <div class="card-name">${tx(name)}</div>
          </div>
          <p class="card-desc">${tx(desc)}</p>
        </div>`).join('');
    }

    function renderKeys(t) {
      $('keys-list').innerHTML = t.keys.map(([k, label]) => `
        <div class="key-row">
          <span>${tx(label)}</span>
          <span class="keys-k">${k.map(x => '<kbd>' + esc(x) + '</kbd>').join('')}</span>
        </div>`).join('');
    }

    function renderFaq(t) {
      $('faq-list').innerHTML = t.faq.map(([q, a], i) => `
        <div class="faq-item">
          <button type="button" class="faq-q" id="faq-q-${i}" aria-expanded="false" aria-controls="faq-a-${i}">
            <span>${tx(q)}</span>
            <span class="faq-icon" aria-hidden="true"></span>
          </button>
          <div class="faq-panel" id="faq-a-${i}" role="region" aria-labelledby="faq-q-${i}">
            <div class="faq-inner"><div class="answer">${tx(a)}</div></div>
          </div>
        </div>`).join('');
    }

    $('faq-list').addEventListener('click', e => {
      const btn = e.target.closest('.faq-q');
      if (!btn) return;
      const item = btn.parentElement;
      const open = item.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    });

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      const t = I18N[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;
      document.title = t.docTitle;

      setTx('back-text', t.back);
      setTx('hero-title', t.heroTitle);
      setTx('hero-pitch', t.pitch);
      $('hero-tags').innerHTML = t.tags.map((x, i) => `<span class="tag${i === 0 ? ' hot' : ''}">${tx(x)}</span>`).join('');
      document.querySelectorAll('[data-dl-label]').forEach(el => { el.textContent = t.download; });
      setTx('cta-github', t.github);
      paintRelease();
      paintMock();

      setTx('how-title', t.howTitle);
      setTx('how-sub', t.howSub);
      renderHow(t);

      setTx('feat-title', t.featTitle);
      setTx('feat-sub', t.featSub);
      renderFeatures(t);

      setTx('keys-title', t.keysTitle);
      setTx('keys-sub', t.keysSub);
      renderKeys(t);

      setTx('faq-title', t.faqTitle);
      setTx('faq-sub', t.faqSub);
      renderFaq(t);

      setTx('end-title', t.endTitle);
      setTx('end-text', t.endText);
      setTx('end-discord', t.endDiscord);
      setTx('end-telegram', t.endTelegram);
      setTx('footer-home', t.footerHome);
      $('made-by').innerHTML = t.madeBy.split('{heart}').map(tx).join(HEART);
    }

    $('lang-toggle').addEventListener('click', () => {
      $('lang-toggle').blur();
      applyLanguage(currentLang === 'en' ? 'fa' : 'en');
    });

    applyLanguage(currentLang);

    LatestRelease.latest(REPO).then(d => {
      release = d;
      paintRelease();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141018">
  <title>Aloy's Arcade</title>
  <meta name="description" content="Aloy's arcade: tiny browser games. Snake, 2048, a reaction test and memory games: Memory, Sequence, Number Span and N-Back. No installs, no accounts.">
  <link rel="canonical" href="https://actually-aloy.github.io/site/arcade">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aloy's Arcade">
  <meta property="og:description" content="Tiny browser games. Snake, 2048, a reaction test and memory games: Memory, Sequence, Number Span and N-Back.">
  <meta property="og:url" content="https://actually-aloy.github.io/site/arcade">
  <meta property="og:image" content="https://actually-aloy.github.io/site/oc.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Aloy's Arcade">
  <meta name="twitter:description" content="Tiny browser games. Snake, 2048, a reaction test and memory games: Memory, Sequence, Number Span and N-Back.">
  <meta name="twitter:image" content="https://actually-aloy.github.io/site/oc.png">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141018;
      --text: #fff7fb;
      --muted: #cdb8c7;
      --line: rgba(255, 239, 247, 0.16);
      --pink: #ff7ab6;
      --pink-soft: #ffd1e7;
      --blue: #5bcefa;
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 122, 182, 0.15), transparent 30%),
        radial-gradient(circle at 88% 16%, rgba(255, 209, 231, 0.08), transparent 28%),
        radial-gradient(circle at 50% 92%, rgba(91, 206, 250, 0.08), transparent 34%),
        var(--bg);
      animation: page-fade-in 0.4s ease-out;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    html[lang="fa"] body {
      font-family: Vazirmatn, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @keyframes page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modal-fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes enchant {
      to { background-position: -300% 0; }
    }

    @keyframes appear {
      from { transform: scale(0.4); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes bump {
      0% { transform: scale(1); }
      50% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    a:focus-visible,
    button:focus-visible,
    [role="button"]:focus-visible {
      outline: 2px solid var(--pink-soft);
      outline-offset: 3px;
    }

    .page {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: 30px 0 56px;
    }

    .copyright {
      margin: 34px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
      opacity: 0.75;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 244, 249, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .pill-btn:hover {
      background: rgba(255, 244, 249, 0.12);
      border-color: rgba(255, 209, 231, 0.4);
    }

    .pill-btn svg {
      width: 14px;
      height: 14px;
    }

    html[dir="rtl"] .pill-btn svg {
      transform: scaleX(-1);
    }

    .lang-toggle {
      margin-inline-start: auto;
    }

    .head {
      margin: 6px 4px 20px;
    }

    .head h1 {
      font-size: clamp(36px, 7vw, 60px);
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .head p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--pink), var(--blue), var(--pink-soft), var(--pink));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: enchant 5s linear infinite;
    }

    .view[hidden] {
      display: none !important;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255, 244, 249, 0.09), rgba(255, 244, 249, 0.04));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(18px);
    }

    .hub-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .game-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 209, 231, 0.4);
    }

    .icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: #141018;
      background: linear-gradient(135deg, var(--pink), var(--blue));
      box-shadow: 0 14px 30px rgba(255, 122, 182, 0.18);
    }

    .icon svg {
      width: 26px;
      height: 26px;
    }

    .game-card h3 {
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .game-card p {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.6;
    }

    .best-line {
      min-height: 18px;
      color: var(--pink-soft);
      font-size: 12.5px;
      font-weight: 600;
    }

    .play {
      margin-top: auto;
      align-self: flex-start;
      padding: 9px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--pink), var(--pink-soft));
      color: #141018;
      font-size: 13px;
      font-weight: 700;
    }

    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .game .hint {
      margin: 0;
      padding: 0 18px 20px;
    }

    .statbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      padding: 18px 18px 0;
    }

    .stat {
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 244, 249, 0.06);
      color: var(--muted);
      font-size: 13px;
    }

    .stat b {
      margin-inline-start: 6px;
      color: var(--text);
      font-size: 14px;
      unicode-bidi: plaintext;
    }

    .ghost {
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 244, 249, 0.08);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, opacity 180ms ease;
    }

    .ghost:hover:not(:disabled) {
      background: rgba(255, 244, 249, 0.14);
      border-color: rgba(255, 209, 231, 0.4);
    }

    .ghost:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .btn {
      padding: 11px 22px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--pink), var(--pink-soft));
      color: #141018;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 180ms ease, transform 180ms ease;
    }

    .btn:hover {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }

    .stage-wrap {
      display: flex;
      justify-content: center;
      padding: 22px;
    }

    .stage {
      position: relative;
      width: min(420px, 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: rgba(255, 244, 249, 0.05);
    }

    .stage.swipe {
      touch-action: none;
    }

    .stage canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(20, 16, 24, 0.78);
      backdrop-filter: blur(4px);
      text-align: center;
      animation: modal-fade 180ms ease-out;
    }

    .overlay[hidden] {
      display: none;
    }

    .big {
      font-size: clamp(26px, 4vw, 36px);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .sub {
      margin: 10px 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .mem-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .m-card {
      position: relative;
      aspect-ratio: 1;
      border-radius: 16px;
      cursor: pointer;
      perspective: 700px;
    }

    .m-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 350ms ease;
    }

    .m-card.flip .m-inner {
      transform: rotateY(180deg);
    }

    .m-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .m-back {
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255, 122, 182, 0.22), rgba(91, 206, 250, 0.14));
      color: var(--pink-soft);
      font-size: clamp(18px, 4.5vw, 24px);
    }

    .m-card:hover:not(.flip) .m-back {
      border-color: rgba(255, 209, 231, 0.4);
    }

    .m-front {
      transform: rotateY(180deg);
      border: 1px solid rgba(255, 209, 231, 0.4);
      background: rgba(255, 244, 249, 0.1);
      font-size: clamp(24px, 7vw, 34px);
    }

    .m-card.match .m-front {
      background: linear-gradient(135deg, rgba(255, 122, 182, 0.3), rgba(255, 209, 231, 0.22));
      box-shadow: 0 0 0 2px rgba(255, 122, 182, 0.45) inset;
    }

    .board {
      aspect-ratio: 1;
      direction: ltr;
    }

    .slots {
      position: absolute;
      inset: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
    }

    .slot {
      border-radius: 14px;
      background: rgba(255, 244, 249, 0.06);
    }

    .tiles {
      position: absolute;
      inset: 10px;
    }

    .tile {
      position: absolute;
      left: 0;
      top: 0;
      width: calc((100% - 30px) / 4);
      height: calc((100% - 30px) / 4);
      transform: translate(calc(var(--c) * (100% + 10px)), calc(var(--r) * (100% + 10px)));
      transition: transform 110ms ease-out;
    }

    .face {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-size: clamp(20px, 7.2vw, 32px);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      background: rgba(255, 244, 249, 0.12);
    }

    .face.len3 { font-size: clamp(18px, 6.2vw, 28px); }
    .face.len4 { font-size: clamp(15px, 5vw, 24px); }
    .face.len5 { font-size: clamp(13px, 4.2vw, 20px); }
    .face.fresh { animation: appear 180ms 100ms ease-out backwards; }
    .face.bump { animation: bump 180ms ease-out; }

    .face.v2 { background: #ffd1e7; color: #141018; }
    .face.v4 { background: #ffb8dc; color: #141018; }
    .face.v8 { background: #ff9cc9; color: #141018; }
    .face.v16 { background: #ff7ab6; color: #141018; }
    .face.v32 { background: #f75e9f; color: #fff; }
    .face.v64 { background: #e94b8c; color: #fff; }
    .face.v128 { background: #d94fd4; color: #fff; }
    .face.v256 { background: #b45cf0; color: #fff; }
    .face.v512 { background: #8f6bff; color: #fff; }
    .face.v1024 { background: #6f8cff; color: #fff; }
    .face.v2048 { background: linear-gradient(135deg, #5bcefa, #ff7ab6); color: #141018; box-shadow: 0 0 24px rgba(91, 206, 250, 0.5); }
    .face.vbig { background: linear-gradient(135deg, #ff7ab6, #5bcefa); color: #141018; }

    .pad-wrap {
      padding: 22px;
    }

    .pad {
      display: grid;
      place-items: center;
      min-height: min(340px, 64vw);
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 24px;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .pad.idle { background: rgba(255, 244, 249, 0.06); }
    .pad.armed { background: rgba(91, 206, 250, 0.14); border-color: rgba(91, 206, 250, 0.4); }
    .pad.ready { background: linear-gradient(135deg, var(--pink), var(--pink-soft)); border-color: transparent; color: #141018; }
    .pad.fail { background: rgba(237, 66, 69, 0.2); border-color: rgba(237, 66, 69, 0.4); }
    .pad.result { background: rgba(59, 165, 93, 0.18); border-color: rgba(59, 165, 93, 0.4); }

    .msg {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 800;
      letter-spacing: -0.03em;
      unicode-bidi: plaintext;
    }

    .pad .sub {
      margin: 8px 0 0;
      unicode-bidi: plaintext;
    }

    .pad.ready .sub {
      color: rgba(20, 16, 24, 0.72);
    }

    .ghost[aria-pressed="true"] {
      background: rgba(255, 122, 182, 0.22);
      border-color: rgba(255, 209, 231, 0.5);
    }

    .seq-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px;
      direction: ltr;
    }

    .seq-pad {
      aspect-ratio: 1;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 244, 249, 0.06);
      color: inherit;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }

    .seq-pad:hover:not(.static) {
      border-color: rgba(255, 209, 231, 0.4);
    }

    .seq-pad.static,
    .seq-grid.locked .seq-pad {
      cursor: default;
    }

    .seq-pad.lit {
      background: linear-gradient(135deg, var(--pink), var(--pink-soft));
      border-color: transparent;
      box-shadow: 0 0 28px rgba(255, 122, 182, 0.55);
    }

    .seq-pad.tap {
      background: rgba(91, 206, 250, 0.28);
      border-color: rgba(91, 206, 250, 0.5);
    }

    .seq-pad.good {
      background: rgba(59, 165, 93, 0.4);
      border-color: rgba(59, 165, 93, 0.6);
      box-shadow: none;
    }

    .seq-pad.bad {
      background: rgba(237, 66, 69, 0.35);
      border-color: rgba(237, 66, 69, 0.55);
      box-shadow: none;
    }

    .phase {
      min-height: 26px;
      margin: 14px 18px 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      unicode-bidi: plaintext;
    }

    .num-screen {
      display: grid;
      place-items: center;
      min-height: 200px;
      padding: 16px;
      font-size: clamp(56px, 16vw, 96px);
      font-weight: 800;
      letter-spacing: -0.03em;
      direction: ltr;
    }

    .num-screen.small {
      color: var(--pink-soft);
      font-size: clamp(26px, 8vw, 40px);
      letter-spacing: 0.12em;
    }

    .num-form {
      display: flex;
      gap: 10px;
      padding: 0 14px 16px;
      direction: ltr;
    }

    .num-form[hidden] {
      display: none;
    }

    .num-input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 244, 249, 0.08);
      color: var(--text);
      font-family: inherit;
      font-size: 20px;
      letter-spacing: 0.14em;
      text-align: center;
      outline: none;
    }

    .num-input:focus {
      border-color: rgba(255, 209, 231, 0.5);
    }

    .act {
      display: flex;
      justify-content: center;
      padding: 4px 18px 0;
    }

    .act .btn {
      width: min(320px, 100%);
      padding: 16px 22px;
      font-size: 16px;
    }

    .act .btn:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
      filter: none;
    }

    .act + .hint {
      margin-top: 14px;
    }

    @media (max-width: 560px) {
      .page {
        width: min(100% - 22px, 1080px);
        padding-top: 18px;
      }

      .statbar {
        padding: 14px 12px 0;
      }

      .stage-wrap,
      .pad-wrap {
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .gradient-text,
      .overlay,
      .face.fresh,
      .face.bump {
        animation: none;
      }

      .m-inner,
      .tile,
      .seq-pad {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a class="pill-btn" id="back-link" href="index.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        <span id="back-label"></span>
      </a>
      <button type="button" class="pill-btn lang-toggle" id="lang-toggle" aria-label="Switch language">EN / فا</button>
    </div>

    <div class="head">
      <h1><span class="gradient-text" id="g-title"></span></h1>
      <p id="g-sub"></p>
    </div>

    <section class="view" id="view-hub">
      <div class="hub-grid" id="hub-grid"></div>
      <p class="hint" id="hub-hint"></p>
    </section>

    <section class="view card game" id="view-snake" hidden>
      <div class="statbar">
        <span class="stat"><span id="snake-score-label"></span><b id="snake-score">0</b></span>
        <span class="stat"><span id="snake-best-label"></span><b id="snake-best">0</b></span>
        <button type="button" class="ghost" id="snake-pause"></button>
        <button type="button" class="ghost" id="snake-restart"></button>
      </div>
      <div class="stage-wrap">
        <div class="stage swipe" id="snake-stage">
          <canvas id="snake-canvas" role="img"></canvas>
          <div class="overlay" id="snake-overlay">
            <div>
              <p class="big" id="snake-ov-t"></p>
              <p class="sub" id="snake-ov-s"></p>
              <button type="button" class="btn" id="snake-ov-btn"></button>
            </div>
          </div>
        </div>
      </div>
      <p class="hint" id="snake-hint"></p>
    </section>

    <section class="view card game" id="view-memory" hidden>
      <div class="statbar">
        <span class="stat"><span id="mem-moves-label"></span><b id="mem-moves">0</b></span>
        <span class="stat"><span id="mem-time-label"></span><b id="mem-time">0</b></span>
        <span class="stat"><span id="mem-best-label"></span><b id="mem-best">–</b></span>
        <button type="button" class="ghost" id="mem-restart"></button>
      </div>
      <div class="stage-wrap">
        <div class="stage" id="mem-stage">
          <div class="mem-grid" id="mem-grid"></div>
          <div class="overlay" id="mem-overlay" hidden>
            <div>
              <p class="big" id="mem-ov-t"></p>
              <p class="sub" id="mem-ov-s"></p>
              <button type="button" class="btn" id="mem-ov-btn"></button>
            </div>
          </div>
        </div>
      </div>
      <p class="hint" id="mem-hint"></p>
    </section>

    <section class="view card game" id="view-seq" hidden>
      <div class="statbar">
        <span class="stat"><span id="seq-len-label"></span><b id="seq-len">–</b></span>
        <span class="stat"><span id="seq-best-label"></span><b id="seq-best">–</b></span>
        <button type="button" class="ghost" id="seq-fwd" aria-pressed="true"></button>
        <button type="button" class="ghost" id="seq-back" aria-pressed="false"></button>
        <button type="button" class="ghost" id="seq-restart"></button>
      </div>
      <div class="stage-wrap">
        <div class="stage" id="seq-stage">
          <div class="seq-grid locked" id="seq-grid"></div>
          <div class="overlay" id="seq-overlay">
            <div>
              <p class="big" id="seq-ov-t"></p>

      const prog = makeProgress(2, 'arcade-seq');
      const pads = [];
      let state = 'idle', seq = [], expected = [], pos = 0, timers = [], statusKey = '';

      for (let i = 0; i < 9; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'seq-pad';
        b.addEventListener('pointerdown', e => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          e.preventDefault();
          tap(i);
        });
        b.addEventListener('click', e => {
          if (e.detail === 0) tap(i);
        });
        grid.appendChild(b);
        pads.push(b);
      }

      function later(fn, ms) {
        timers.push(setTimeout(fn, ms));
      }

      function clearTimers() {
        timers.forEach(clearTimeout);
        timers = [];
        pads.forEach(p => p.classList.remove('lit', 'tap', 'bad'));
      }

      function flash(i, cls, ms) {
        pads[i].classList.add(cls);
        later(() => pads[i].classList.remove(cls), ms);
      }

      function setStatus(key) {
        statusKey = key;
        const g = T.seq;
        statusEl.textContent = !key ? '' : key === 'yours' && prog.mode() === 'b' ? g.yoursBack : g[key];
      }

      function updHud() {
        const running = state !== 'idle' && state !== 'over';
        $('seq-len').textContent = running ? fmt(prog.len()) : '–';
        bestEl.textContent = prog.best() ? fmt(prog.best()) : '–';
      }

      function round() {
        const len = prog.len();
        seq = [];
        for (let k = 0; k < len; k++) {
          let p;
          do { p = Math.floor(Math.random() * 9); } while (k && p === seq[k - 1]);
          seq.push(p);
        }
        expected = prog.mode() === 'b' ? seq.slice().reverse() : seq.slice();
        pos = 0;
        state = 'show';
        grid.classList.add('locked');
        setStatus('watch');
        updHud();
        let t = 600;
        seq.forEach(p => {
          later(() => pads[p].classList.add('lit'), t);
          later(() => pads[p].classList.remove('lit'), t + 620);
          t += 920;
        });
        later(() => {
          state = 'input';
          grid.classList.remove('locked');
          setStatus('yours');
        }, t);
      }

      function finish() {
        state = 'over';
        setStatus('');
        grid.classList.add('locked');
        paint();
      }

      function tap(i) {
        if (state !== 'input') return;
        if (i === expected[pos]) {
          flash(i, 'tap', 200);
          pos++;
          if (pos === expected.length) {
            state = 'between';
            prog.pass();
            updHud();
            setStatus('ok');
            later(round, 1000);
          }
          return;
        }
        state = 'between';
        grid.classList.add('locked');
        flash(i, 'bad', 500);
        flash(expected[pos], 'lit', 600);
        if (prog.fail()) {
          later(finish, 900);
        } else {
          setStatus('retry');
          later(round, 1500);
        }
      }

      function start() {
        clearTimers();
        prog.reset();
        state = 'show';
        overlay.hidden = true;
        round();
      }

      function stop() {
        clearTimers();
        state = 'idle';
        statusKey = '';
        grid.classList.add('locked');
        statusEl.textContent = '';
        paint();
      }

      function paint() {
        const g = T.seq;
        $('seq-len-label').textContent = g.len;
        $('seq-best-label').textContent = g.best;
        fwdBtn.textContent = g.fwd;
        backBtn.textContent = g.back;
        fwdBtn.setAttribute('aria-pressed', String(prog.mode() === 'f'));
        backBtn.setAttribute('aria-pressed', String(prog.mode() === 'b'));
        $('seq-restart').textContent = g.restart;
        $('seq-hint').textContent = g.hint;
        pads.forEach((p, i) => p.setAttribute('aria-label', g.pad(fmt(i + 1))));
        setStatus(statusKey);
        if (state === 'idle') {
          overlay.hidden = false;
          ovT.textContent = g.idleT;
          ovS.textContent = g.idleS(prog.mode());
          ovBtn.textContent = g.play;
        } else if (state === 'over') {
          overlay.hidden = false;
          ovT.textContent = g.overT;
          ovS.textContent = g.overS(prog.span() ? fmt(prog.span()) : '', prog.record());
          ovBtn.textContent = g.again;
        } else {
          overlay.hidden = true;
        }
        updHud();
      }

      function setMode(m) {
        if (prog.mode() === m) return;
        prog.setMode(m);
        stop();
      }

      fwdBtn.addEventListener('click', () => setMode('f'));
      backBtn.addEventListener('click', () => setMode('b'));
      $('seq-restart').addEventListener('click', start);
      ovBtn.addEventListener('click', () => {
        ovBtn.blur();
        start();
      });
      document.addEventListener('keydown', e => {
        if (view !== 'seq' || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key >= '1' && e.key <= '9') tap(+e.key - 1);
      });

      return { paint, stop, bests: () => prog.bests() };
    })();

    const digitsGame = (function () {
      const screen = $('num-screen'), form = $('num-form'), input = $('num-input');
      const overlay = $('num-overlay'), statusEl = $('num-status');
      const ovT = $('num-ov-t'), ovS = $('num-ov-s'), ovBtn = $('num-ov-btn');
      const fwdBtn = $('num-fwd'), backBtn = $('num-back');
      const prog = makeProgress(3, 'arcade-digits');
      let state = 'idle', seq = [], expected = '', timers = [], statusKey = '';

      const normalize = s => String(s)
        .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
        .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
        .replace(/\D/g, '');

      function later(fn, ms) {
        timers.push(setTimeout(fn, ms));
      }

      function clearTimers() {
        timers.forEach(clearTimeout);
        timers = [];
      }

      function show(text, small) {
        screen.textContent = text;
        screen.classList.toggle('small', !!small);
      }

      function setStatus(key) {
        statusKey = key;
        const g = T.digits;
        statusEl.textContent = !key ? '' : key === 'yours' && prog.mode() === 'b' ? g.yoursBack : g[key];
      }

      function updHud() {
        const running = state !== 'idle' && state !== 'over';
        $('num-len').textContent = running ? fmt(prog.len()) : '–';
        $('num-best').textContent = prog.best() ? fmt(prog.best()) : '–';
      }

      function round() {
        seq = [];
        for (let k = 0; k < prog.len(); k++) {
          let d;
          do { d = Math.floor(Math.random() * 10); } while (k && d === seq[k - 1]);
          seq.push(d);
        }
        expected = (prog.mode() === 'b' ? seq.slice().reverse() : seq).join('');
        state = 'show';
        form.hidden = true;
        input.value = '';
        show('');
        setStatus('watch');
        updHud();
        let t = 700;
        seq.forEach(d => {
          later(() => show(fmt(d)), t);
          later(() => show(''), t + 800);
          t += 1100;
        });
        later(() => {
          state = 'input';
          form.hidden = false;
          setStatus('yours');
          input.focus();
        }, t);
      }

      function finish() {
        state = 'over';
        form.hidden = true;
        show('');
        setStatus('');
        paint();
      }

      function submit() {
        if (state !== 'input') return;
        const v = normalize(input.value);
        if (!v) return;
        state = 'between';
        form.hidden = true;
        if (v === expected) {
          prog.pass();
          updHud();
          show('✓');
          setStatus('ok');
          later(round, 1000);
          return;
        }
        show(seq.map(fmt).join(' '), true);
        if (prog.fail()) {
          later(finish, 1800);
        } else {
          setStatus('retry');
          later(round, 2200);
        }
      }

      function start() {
        clearTimers();
        prog.reset();
        state = 'show';
        overlay.hidden = true;
        round();
      }

      function stop() {
        clearTimers();
        state = 'idle';
        statusKey = '';
        form.hidden = true;
        show('');
        statusEl.textContent = '';
        paint();
      }

      function paint() {
        const g = T.digits;
        $('num-len-label').textContent = g.len;
        $('num-best-label').textContent = g.best;
        fwdBtn.textContent = g.fwd;
        backBtn.textContent = g.back;
        fwdBtn.setAttribute('aria-pressed', String(prog.mode() === 'f'));
        backBtn.setAttribute('aria-pressed', String(prog.mode() === 'b'));
        $('num-restart').textContent = g.restart;
        $('num-check').textContent = g.check;
        input.setAttribute('aria-label', g.input);
        $('num-hint').textContent = g.hint;
        setStatus(statusKey);
        if (state === 'idle') {
          overlay.hidden = false;
          ovT.textContent = g.idleT;
          ovS.textContent = g.idleS(prog.mode());
          ovBtn.textContent = g.play;
        } else if (state === 'over') {
          overlay.hidden = false;
          ovT.textContent = g.overT;
          ovS.textContent = g.overS(prog.span() ? fmt(prog.span()) : '', prog.record());
          ovBtn.textContent = g.again;
        } else {
          overlay.hidden = true;
        }
        updHud();
      }

      function setMode(m) {
        if (prog.mode() === m) return;
        prog.setMode(m);
        stop();
      }

      form.addEventListener('submit', e => {
        e.preventDefault();
        submit();
      });
      fwdBtn.addEventListener('click', () => setMode('f'));
      backBtn.addEventListener('click', () => setMode('b'));
      $('num-restart').addEventListener('click', start);
      ovBtn.addEventListener('click', () => {
        ovBtn.blur();
        start();
      });

      return { paint, stop, bests: () => prog.bests() };
    })();

    const nbackGame = (function () {
      const MAXN = 9, ON = 500, STEP = 2500;
      const grid = $('nb-grid'), overlay = $('nb-overlay'), statusEl = $('nb-status');
      const ovT = $('nb-ov-t'), ovS = $('nb-ov-s'), ovBtn = $('nb-ov-btn');
      const matchBtn = $('nb-match'), downBtn = $('nb-down'), upBtn = $('nb-up'), stopBtn = $('nb-stop');
      const pads = [];
      let n = Math.min(MAXN, Math.max(1, +store.get('arcade-nback-level') || 1));
      let best = +store.get('arcade-nback-best') || 0;
      let state = 'idle', arr = [], i = -1, total = 0, pressed = false;
      let hits = 0, fa = 0, misses = 0, targets = 0, verdict = 'same', timers = [];

      for (let k = 0; k < 9; k++) {
        const d = document.createElement('div');
        d.className = 'seq-pad static';
        grid.appendChild(d);
        pads.push(d);
      }

      function later(fn, ms) {
        timers.push(setTimeout(fn, ms));
      }

      function clearTimers() {
        timers.forEach(clearTimeout);
        timers = [];
        pads.forEach(p => p.classList.remove('lit', 'good', 'bad'));
      }

      function gen(count, level) {
        const a = [];
        for (let k = 0; k < count; k++) {
          let p;
          if (k >= level && Math.random() < 0.3) {
            p = a[k - level];
          } else {
            do { p = Math.floor(Math.random() * 9); }
            while ((k >= level && p === a[k - level]) || (k > 0 && p === a[k - 1]));
          }
          a.push(p);
        }
        return a;
      }

      const isTarget = k => k >= n && arr[k] === arr[k - n];

      function updHud() {
        $('nb-level').textContent = fmt(n);
        $('nb-trial').textContent = state === 'run' && i >= 0 ? fmt(i + 1) + '/' + fmt(total) : '–';
        $('nb-best').textContent = best ? fmt(best) : '–';
        const idle = state !== 'run';
        matchBtn.disabled = idle;
        downBtn.disabled = !idle || n <= 1;
        upBtn.disabled = !idle || n >= MAXN;
        stopBtn.disabled = idle;
      }

      function nextTrial() {
        i++;
        if (i >= total) {
          endSession();
          return;
        }
        pressed = false;
        const p = arr[i];
        pads[p].classList.add('lit');
        later(() => pads[p].classList.remove('lit'), ON);
        later(closeTrial, STEP);
        updHud();
      }

      function closeTrial() {
        if (isTarget(i)) {
          targets++;
          if (!pressed) misses++;
        }
        nextTrial();
      }

      function press() {
        if (state !== 'run' || pressed || i < 0) return;
        pressed = true;
        const t = isTarget(i);
        if (t) hits++;
        else fa++;
        const p = arr[i];
        pads[p].classList.add(t ? 'good' : 'bad');
        later(() => pads[p].classList.remove('good', 'bad'), 450);
      }

      function endSession() {
        clearTimers();
        const errors = misses + fa;
        let next = n;
        if (errors < 3) {
          verdict = 'up';
          best = Math.max(best, n);
          store.set('arcade-nback-best', best);
          next = Math.min(MAXN, n + 1);
        } else if (errors > 5) {
          verdict = 'down';
          next = Math.max(1, n - 1);
        } else {
          verdict = 'same';
        }
        state = 'result';
        n = next;
        store.set('arcade-nback-level', n);
        statusEl.textContent = '';
        paint();
      }

      function start() {
        clearTimers();
        total = 20 + n;
        arr = gen(total, n);
        i = -1;
        hits = 0;
        fa = 0;
        misses = 0;
        targets = 0;
        pressed = false;
        state = 'run';
        overlay.hidden = true;
        paint();
        later(nextTrial, 800);
      }

      function stop() {
        clearTimers();
        state = 'idle';
        paint();
      }

      function setLevel(v) {
        if (state === 'run') return;
        n = Math.min(MAXN, Math.max(1, v));
        store.set('arcade-nback-level', n);
        state = 'idle';
        paint();
      }

      function paint() {
        const g = T.nback;
        $('nb-level-label').textContent = g.level;
        $('nb-trial-label').textContent = g.trial;
        $('nb-best-label').textContent = g.best;
        stopBtn.textContent = g.stop;
        matchBtn.textContent = g.match;
        downBtn.setAttribute('aria-label', g.lower);
        upBtn.setAttribute('aria-label', g.higher);
        $('nb-hint').textContent = g.hint;
        statusEl.textContent = state === 'run' ? g.rule(fmt(n)) : '';
        if (state === 'idle') {
          overlay.hidden = false;
          ovT.textContent = g.idleT(fmt(n));
          ovS.textContent = g.idleS(fmt(n));
          ovBtn.textContent = g.play;
        } else if (state === 'result') {
          overlay.hidden = false;
          ovT.textContent = verdict === 'up' ? g.upT : verdict === 'down' ? g.downT : g.sameT;
          ovS.textContent = g.resS(fmt(hits), fmt(targets), fmt(fa), fmt(n));
          ovBtn.textContent = g.again;
        } else {
          overlay.hidden = true;
        }
        updHud();
      }

      matchBtn.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        press();
      });
      matchBtn.addEventListener('click', e => {
        if (e.detail === 0) press();
      });
      downBtn.addEventListener('click', () => setLevel(n - 1));
      upBtn.addEventListener('click', () => setLevel(n + 1));
      stopBtn.addEventListener('click', stop);
      ovBtn.addEventListener('click', () => {
        ovBtn.blur();
        start();
      });
      document.addEventListener('keydown', e => {
        if (view !== 'nback' || e.repeat) return;
        if (e.code !== 'Space' && e.code !== 'Enter') return;
        const el = e.target instanceof Element ? e.target.closest('button, a') : null;
        if (el) return;
        e.preventDefault();
        press();
      });

      return { paint, stop, best: () => best };
    })();

    const backLink = $('back-link'), backLabel = $('back-label');
    const gTitle = $('g-title'), gSub = $('g-sub');

    function bestFor(key) {
      if (key === 'seq' || key === 'digits') {
        const b = (key === 'seq' ? seqGame : digitsGame).bests();
        return b.f || b.b ? T.spanBest(b.f ? fmt(b.f) : '', b.b ? fmt(b.b) : '') : '';
      }
      const value = { snake: snakeGame, memory: memoryGame, nback: nbackGame, g2048: game2048, reaction: reactionGame }[key].best();
      if (!value) return '';
      const head = key === 'nback' ? T.levelWord + ' ' : '';
      const tail = key === 'memory' ? ' ' + T.movesWord : key === 'reaction' ? ' ms' : '';
      return T.bestLabel + ': ' + head + fmt(value) + tail;
    }

    function renderHub() {
      const gridEl = $('hub-grid');
      gridEl.innerHTML = '';
      T.hubGames.forEach((g, i) => {
        const a = document.createElement('a');
        a.className = 'card game-card';
        a.href = '#' + SLUGS[i];
        a.innerHTML = '<span class="icon">' + ICONS[i] + '</span><h3>' + g.name + '</h3><p>' + g.tag + '</p><div class="best-line">' + bestFor(VIEWS[i]) + '</div><span class="play">' + T.play + '</span>';
        gridEl.appendChild(a);
      });
      $('hub-hint').textContent = T.hubHint;
    }

    function route() {
      const prev = view;
      const slug = location.hash.replace('#', '');
      const index = SLUGS.indexOf(slug);
      view = index >= 0 ? VIEWS[index] : 'hub';

      if (prev !== view) {
        if (prev === 'snake') snakeGame.pauseIfRunning();
        if (prev === 'reaction') reactionGame.reset();
        if (prev === 'seq') seqGame.stop();
        if (prev === 'digits') digitsGame.stop();
        if (prev === 'nback') nbackGame.stop();
        if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
        window.scrollTo(0, 0);
      }

      VIEWS.forEach(k => { $('view-' + k).hidden = k !== view; });
      $('view-hub').hidden = view !== 'hub';

      if (view === 'hub') {
        renderHub();
        backLink.href = 'index.html';
        backLabel.textContent = T.backHome;
        gTitle.textContent = T.hubTitle;
        gSub.textContent = T.hubSub;
        document.title = T.hubTitle;
      } else {
        backLink.href = '#';
        backLabel.textContent = T.backArcade;
        gTitle.textContent = T[view].title;
        gSub.textContent = T[view].sub;
        document.title = T[view].title + ' · ' + T.hubTitle;
      }
    }

    function applyLanguage(l) {
      lang = l;
      store.set('lang', l);
      T = I18N[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = T.dir;
      snakeGame.paint();
      memoryGame.paint();
      seqGame.paint();
      digitsGame.paint();
      nbackGame.paint();
      game2048.paint();
      reactionGame.paint();
      route();
    }

    $('lang-toggle').addEventListener('click', () => {
      $('lang-toggle').blur();
      applyLanguage(lang === 'en' ? 'fa' : 'en');
    });
    window.addEventListener('hashchange', route);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) return;
      snakeGame.pauseIfRunning();
      reactionGame.interrupt();
      seqGame.stop();
      digitsGame.stop();
      nbackGame.stop();
    });

    memoryGame.newGame();
    game2048.newGame();
    applyLanguage(lang);
  </script>
</body>
</html>

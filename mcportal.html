<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050208">
  <title>MC Portal — باز کردن پورت سرور ماینکرفت با یه کلیک</title>
  <meta name="description" content="MC Portal: open your Minecraft server port in one click and close it when you are done. Adds and removes the Windows Firewall rules for you. Windows, Minecraft Java Edition.">
  <link rel="canonical" href="https://actually-aloy.github.io/site/mcportal">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MC Portal — open your Minecraft server port in one click">
  <meta property="og:description" content="Open and close your Minecraft server port with one click. Free for Windows.">
  <meta property="og:url" content="https://actually-aloy.github.io/site/mcportal">
  <meta property="og:image" content="https://actually-aloy.github.io/site/mcportal-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MC Portal — open your Minecraft server port in one click">
  <meta name="twitter:description" content="Open and close your Minecraft server port with one click. Free for Windows.">
  <meta name="twitter:image" content="https://actually-aloy.github.io/site/mcportal-og.jpg">
  <link rel="icon" href="mcportal-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050208;
      --text: #f3ecff;
      --muted: #b3a6c9;
      --line: rgba(255, 255, 255, 0.13);
      --cyan: #c9a2ff;
      --magenta: #9b3bff;
      --pink: #ff7ab6;
      --ink: #0a0414;
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 10%, rgba(155, 59, 255, 0.2), transparent 32%),
        radial-gradient(circle at 90% 14%, rgba(155, 59, 255, 0.16), transparent 30%),
        radial-gradient(circle at 52% 94%, rgba(90, 30, 170, 0.1), transparent 34%),
        var(--bg);
      animation: page-fade-in 0.4s ease-out;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }

    @keyframes page-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    html[lang="fa"] body {
      font-family: Vazirmatn, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: 38px 0 56px;
    }

    .glass {
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 10px);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.105), rgba(255, 255, 255, 0.045));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(22px);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
      gap: 30px;
      padding: 28px;
      align-items: center;
    }

    .intro {
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(155, 59, 255, 0.45);
    }

    .pill-btn svg {
      width: 14px;
      height: 14px;
    }

    html[dir="rtl"] .pill-btn svg {
      transform: scaleX(-1);
    }

    .lang-toggle {
      margin-inline-start: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand img {
      width: 64px;
      height: 64px;
      flex: 0 0 auto;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(155, 59, 255, 0.35);
      -webkit-user-drag: none;
    }

    h1 {
      font-size: clamp(38px, 6.4vw, 60px);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .gradient-text {
      background: linear-gradient(90deg, #b57bff, #ecd9ff, #ff9ad0, #b57bff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: enchant 6s linear infinite;
    }

    @keyframes enchant {
      to { background-position: -300% 0; }
    }

    .pitch {
      max-width: 560px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 6px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
    }

    .tag.hot {
      border-color: transparent;
      background: linear-gradient(135deg, #d9bcff, #a966ff);
      color: var(--ink);
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 180ms ease, transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(155, 59, 255, 0.45);
    }

    .btn.primary {
      border-color: transparent;
      background: linear-gradient(135deg, #d9bcff, #a966ff);
      color: var(--ink);
    }

    .btn.primary:hover {
      filter: brightness(1.06);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .btn:focus-visible,
    .pill-btn:focus-visible,
    .faq-q:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .dl-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 6% -6% 10%;
      z-index: 0;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(155, 59, 255, 0.5), rgba(155, 59, 255, 0));
      filter: blur(24px);
      pointer-events: none;
    }

    @property --fill {
      syntax: '<percentage>';
      inherits: true;
      initial-value: 0%;
    }

    .mock {
      direction: ltr;
      --p-bg: #050208;
      --p-obsidian: #0a0414;
      --p-line: #1c0d34;
      --p-accent: #9b3bff;
      --p-accent-soft: #6a1fc9;
      --p-core: #ecd9ff;
      --p-text: #d8cfe6;
      --p-dim: #8a7aa3;
      --p-card: rgba(20, 10, 34, 0.55);
      --p-card-border: rgba(155, 59, 255, 0.2);
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(155, 59, 255, 0.22);
      border-radius: 14px;
      background: radial-gradient(ellipse at 50% 30%, #150a24, var(--p-bg) 70%);
      color: var(--p-text);
      font-family: "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(155, 59, 255, 0.12);
    }


    .p-bar {
      width: 100%;
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 8px 0 14px;
      background: #0a0414;
      direction: ltr;
    }

    .p-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a3a5c;
      transition: all 0.6s ease;
    }

    .p-dot.on {
      background: var(--p-accent);
      box-shadow: 0 0 10px 2px rgba(155, 59, 255, 0.8);
    }

    .p-name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #b9a8d6;
    }

    .p-ver {
      font-size: 9px;
      letter-spacing: 1px;
      color: #6a5d80;
    }

    .p-ctl {
      display: flex;
      margin-left: auto;
      gap: 2px;
      color: #a894c4;
    }

    .p-ctl span {
      width: 30px;
      height: 26px;
      display: grid;
      place-items: center;
    }

    .p-ctl svg {
      width: 11px;
      height: 11px;
    }

    .p-wrap {
      width: 100%;
      height: 262px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 30px 4px;
    }

    .p-frame {
      position: relative;
      isolation: isolate;
      width: 54%;
      max-width: 210px;
      height: 100%;
      border-radius: 12px;
      background:
        linear-gradient(var(--p-obsidian), var(--p-obsidian)) padding-box,
        repeating-linear-gradient(0deg, var(--p-line) 0 16px, var(--p-obsidian) 16px 18px),
        repeating-linear-gradient(90deg, var(--p-line) 0 26px, var(--p-obsidian) 26px 28px);
      box-shadow: inset 0 0 0 1px rgba(155, 59, 255, 0.08), 0 0 0 rgba(155, 59, 255, 0);
      transition: box-shadow 1s ease;
    }

    .p-frame.on {
      box-shadow: inset 0 0 0 1px rgba(200, 150, 255, 0.25), 0 0 55px 6px rgba(139, 50, 255, 0.35);
    }

    .p-frame::after {
      content: "";
      position: absolute;
      inset: -14px;
      z-index: -1;
      border-radius: 26px;
      background: rgba(139, 50, 255, 0.55);
      filter: blur(34px);
      opacity: 0;
      transition: opacity 1.1s ease;
      pointer-events: none;
    }

    .p-frame.on::after {
      opacity: 0.7;
      animation: p-breathe 3.6s ease-in-out 1.1s infinite;
    }

    @keyframes p-breathe {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0.32; }
    }

    .p-surface {
      --fill: 0%;
      position: absolute;
      inset: 20px;
      border-radius: 6px;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 60%, #0a0414, #030103 75%);
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.9);
      transition: --fill 1.15s cubic-bezier(0.45, 0.05, 0.25, 1), box-shadow 1s ease;
    }

    .p-frame.on .p-surface {
      --fill: 120%;
      box-shadow: inset 0 0 26px rgba(210, 150, 255, 0.55), inset 0 0 3px rgba(240, 210, 255, 0.9);
    }

    .p-lit {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(160deg, #6a1fc9, #2a0656 80%);
      -webkit-mask-image: linear-gradient(to top, #000 calc(var(--fill) - 16%), transparent var(--fill));
      mask-image: linear-gradient(to top, #000 calc(var(--fill) - 16%), transparent var(--fill));
    }

    .p-swirl {
      position: absolute;
      left: -50%;
      top: -50%;
      width: 200%;
      height: 200%;
      filter: blur(12px);
      will-change: transform;
      animation-play-state: paused;
    }

    .p-swirl.a {
      background: conic-gradient(from 0deg, rgba(235, 190, 255, 0.75), transparent 22%, rgba(170, 90, 255, 0.6) 45%, transparent 68%, rgba(235, 190, 255, 0.75));
      animation: p-spin 15s linear infinite;
    }

    .p-swirl.b {
      background: conic-gradient(from 90deg, rgba(30, 4, 70, 0.7), transparent 30%, rgba(200, 140, 255, 0.45) 55%, transparent 80%, rgba(30, 4, 70, 0.7));
      animation: p-spin 23s linear infinite reverse;
      animation-play-state: paused;
    }

    .p-shimmer {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(115deg, transparent 0 14px, rgba(255, 225, 255, 0.1) 14px 18px, transparent 18px 34px);
      background-size: 200% 100%;
      animation: p-shimmer 6s linear infinite;
      animation-play-state: paused;
    }

    .p-frame.on .p-swirl,
    .p-frame.on .p-shimmer {
      animation-play-state: running;
    }

    @keyframes p-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes p-shimmer {
      to { background-position: -100% 0; }
    }

    .p-edge {
      position: absolute;
      left: 0;
      right: 0;
      height: 16%;
      bottom: calc(var(--fill) - 16%);
      pointer-events: none;
      background: linear-gradient(to top, rgba(255, 235, 255, 0), rgba(255, 235, 255, 0.85) 55%, rgba(255, 235, 255, 0));
      filter: blur(2px);
    }

    .p-flash {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 55%, rgba(255, 240, 255, 0.95), rgba(190, 110, 255, 0.4) 60%, transparent 85%);
    }

    .p-frame.on .p-flash {
      animation: p-flash 1.5s ease-out;
    }

    @keyframes p-flash {
      0%, 55% { opacity: 0; }
      70% { opacity: 0.6; }
      100% { opacity: 0; }
    }

    .p-particle {
      position: absolute;
      bottom: -8px;
      width: var(--size, 3px);
      height: var(--size, 3px);
      border-radius: 50%;
      background: #e6c4ff;
      box-shadow: 0 0 6px 2px rgba(200, 140, 255, 0.9);
      animation: p-rise linear forwards;
    }

    @keyframes p-rise {
      0% { transform: translate(0, 0); opacity: 0; }
      12% { opacity: 1; }
      100% { transform: translate(var(--dx), var(--rise)); opacity: 0; }
    }

    .p-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      margin-top: 8px;
    }

    .p-state {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--p-dim);
    }


    .p-state b {
      color: var(--p-core);
      font-weight: 600;
    }

    .p-ports {
      font-size: 10px;
      letter-spacing: 1px;
      color: #7a6c90;
      direction: ltr;
    }

    .p-main {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px 22px 18px;
    }

    .p-btn {
      padding: 12px 40px;
      border: 1px solid var(--p-card-border);
      border-radius: 30px;
      background: linear-gradient(180deg, #2a1147, #190a2c);
      color: var(--p-core);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
    }


    .p-btn:hover {
      border-color: rgba(200, 150, 255, 0.5);
      transform: translateY(-1px);
    }

    .p-btn.on {
      background: linear-gradient(180deg, var(--p-accent), var(--p-accent-soft));
      box-shadow: 0 0 22px rgba(155, 59, 255, 0.55);
      color: #fff;
    }

    .p-btn:focus-visible,
    .p-set-head:focus-visible,
    .p-switch input:focus-visible + .p-slider {
      outline: 2px solid #c9a2ff;
      outline-offset: 2px;
    }

    .p-set {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--p-card-border);
      border-radius: 12px;
      background: var(--p-card);
    }

    .p-set-head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border: 0;
      background: none;
      color: var(--p-dim);
      font-family: inherit;
      cursor: pointer;
    }

    .p-set-head span {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }


    .p-chev {
      width: 12px;
      height: 8px;
      transition: transform 0.25s ease;
    }

    .p-set.open .p-chev {
      transform: rotate(180deg);
    }

    .p-set-body {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      padding: 0 16px;
      transition: max-height 0.3s ease, opacity 0.25s ease;
    }

    .p-set.open .p-set-body {
      max-height: 260px;
      opacity: 1;
      padding: 0 16px 10px;
    }

    .p-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
    }

    .p-row > span {
      font-size: 12.5px;
      color: var(--p-text);
    }

    .p-switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
      direction: ltr;
    }

    .p-switch input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
      z-index: 1;
    }

    .p-slider {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: #2b1f3d;
      transition: background 0.25s ease;
    }

    .p-slider::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #cfc2e0;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .p-switch input:checked + .p-slider {
      background: var(--p-accent-soft);
    }

    .p-switch input:checked + .p-slider::before {
      transform: translateX(16px);
      background: #fff;
    }

    .mock-note {
      position: relative;
      z-index: 1;
      max-width: 400px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.7;
      text-align: center;
    }


    section.block {
      margin-top: 38px;
      scroll-margin-top: 18px;
    }

    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 4px 14px;
    }

    .head h2 {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .head span {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .grid.three {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .grid.cols3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    @media (max-width: 900px) {
      .grid.cols3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .grid.cols3 {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(18px);
      transition: transform 180ms ease, border-color 180ms ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(155, 59, 255, 0.42);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .icon {
      position: relative;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: var(--ink);
      background: linear-gradient(135deg, #d9bcff, #a966ff);
      box-shadow: 0 14px 30px rgba(155, 59, 255, 0.25);
    }

    .icon.alt {
      background: linear-gradient(135deg, #ff9ad0, #c9a2ff);
      box-shadow: 0 14px 30px rgba(255, 154, 208, 0.22);
    }

    .icon svg {
      width: 22px;
      height: 22px;
    }

    .step-num {
      margin-inline-start: auto;
      color: rgba(155, 59, 255, 0.28);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .card-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-desc {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.75;
    }

    .faq {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .faq-item {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      transition: border-color 240ms ease, background 240ms ease;
    }

    .faq-item:hover {
      border-color: rgba(155, 59, 255, 0.28);
    }

    .faq-item.open {
      border-color: rgba(155, 59, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    .faq-q {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      border: none;
      border-radius: 20px;
      background: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-align: start;
      cursor: pointer;
    }

    .faq-q:focus-visible {
      outline-offset: -2px;
    }

    .faq-icon {
      position: relative;
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      transition: transform 340ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .faq-icon::before,
    .faq-icon::after {
      content: "";
      position: absolute;
      inset-inline: 0;
      top: 50%;
      height: 2px;
      margin-top: -1px;
      border-radius: 2px;
      background: var(--cyan);
      transition: transform 340ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .faq-icon::after {
      transform: rotate(90deg);
    }

    .faq-item.open .faq-icon {
      transform: rotate(180deg);
    }

    .faq-item.open .faq-icon::after {
      transform: rotate(0deg);
    }

    .faq-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition: grid-template-rows 360ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 240ms ease, visibility 0s linear 360ms;
    }

    .faq-item.open .faq-panel {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
      transition: grid-template-rows 360ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 300ms ease 60ms, visibility 0s;
    }

    .faq-inner {
      min-height: 0;
      overflow: hidden;
    }

    .faq .answer {
      padding: 0 20px 18px;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.8;
    }

    .closing {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 28px;
    }

    .closing img {
      width: 72px;
      height: 72px;
      flex: 0 0 auto;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(155, 59, 255, 0.35);
      -webkit-user-drag: none;
    }

    .closing-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .closing h2 {
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .closing p {
      max-width: 520px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
    }

    .closing .cta-row {
      margin-top: 8px;
    }

    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 40px;
      text-align: center;
    }

    .made {
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }

    .heart {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin: 0 3px;
      vertical-align: -2px;
      color: var(--pink);
      animation: beat 1.8s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 60%, 100% { transform: scale(1); }
      20% { transform: scale(1.22); }
      40% { transform: scale(1.06); }
    }

    .legal {
      color: var(--muted);
      font-size: 12.5px;
      opacity: 0.8;
    }

    .home-link {
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.24);
      color: var(--muted);
      font-size: 15px;
      letter-spacing: -0.01em;
      transition: color 180ms ease, border-color 180ms ease;
    }

    .home-link:hover {
      color: var(--text);
      border-color: rgba(155, 59, 255, 0.55);
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }

      .faq-item, .faq-icon, .faq-icon::before, .faq-icon::after, .faq-panel, .card, .btn {
        transition: none !important;
      }
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {

      }

      .p-wrap {
        height: 230px;
      }

        padding: 14px 16px 16px;
      }
    }

        ],

        faqSub: 'همون‌هایی که معمولاً می‌پرسن',

          ['رو چی کار می‌کنه؟', 'ویندوز ۱۰ و ۱۱. برای مدیریت فایروال ویندوز از دستور خود ویندوز یعنی netsh استفاده می‌کنه.'],
          ['با نسخه‌ی Bedrock کار می‌کنه؟', 'نه، برای ماینکرفت جاوا ساخته شده. سرورهای Bedrock از UDP 19132 استفاده می‌کنن که MC Portal بازش نمی‌کنه.'],

          ['می‌شه پورت‌ها رو عوض کرد؟', 'نه. پورت سرور روی 25565 و پورت چت صوتی روی 24454 ثابته. اگه سرورت روی پورت دیگه‌ای گوش می‌ده، MC Portal کمکی بهش نمی‌کنه.'],
          ['اگه برنامه با پورت باز کرش کنه چی؟', 'دفعه‌ی بعد MC Portal جلسه‌ی جامونده رو تشخیص می‌ده، قانون‌ها رو پاک می‌کنه و یه پیام نشون می‌ده. اگه عمداً «Close port on exit» رو خاموش کرده باشی، پورت رو باز نگه می‌داره و جلسه رو دوباره برمی‌داره.'],

        endDiscord: 'سرور دیسکورد',
        endTelegram: 'تلگرام',
        footerHome: 'بازگشت به صفحه‌ی اصلی',
        madeBy: 'این پورتال رو آلوی با {heart} روشن کرده'
      }
    };

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const PERSIAN_DIGITS = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
    const LATIN_RE = /[A-Za-z][A-Za-z0-9._@+'’\/-]*(?:[  ][A-Za-z][A-Za-z0-9._@+'’\/-]*)*/g;

    let currentLang = localStorage.getItem('lang') === 'en' ? 'en' : 'fa';

    const tx = s => {
      if (currentLang !== 'fa') return esc(s);
      let out = '', last = 0, m;
      LATIN_RE.lastIndex = 0;
      while ((m = LATIN_RE.exec(s))) {
        out += esc(s.slice(last, m.index)) + '<bdi>' + esc(m[0]) + '</bdi>';
        last = m.index + m[0].length;
      }
      return out + esc(s.slice(last));
    };
    const setTx = (id, s) => { $(id).innerHTML = tx(s); };
    const fmt = n => currentLang === 'fa' ? String(n).replace(/[0-9]/g, d => PERSIAN_DIGITS[d]) : String(n);

    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const pm = { open: false, voice: true, timer: 0, count: 0 };

    function portsText() {
      return 'TCP 25565' + (pm.voice ? ' • UDP 24454' : '');
    }

    function paintMock() {
      $('p-frame').classList.toggle('on', pm.open);
      $('p-dot').classList.toggle('on', pm.open);
      const btn = $('p-btn');
      btn.classList.toggle('on', pm.open);
      btn.textContent = pm.open ? 'Close Portal' : 'Open Portal';
      $('p-state-label').textContent = 'Portal';
      $('p-state-word').textContent = pm.open ? 'Open' : 'Closed';
      $('p-ports').textContent = portsText();
    }

    function spawnParticle() {
      const host = $('p-surface');
      if (!host || host.querySelectorAll('.p-particle').length > 28) return;
      const el = document.createElement('i');
      el.className = 'p-particle';
      const size = 2 + Math.random() * 3;
      el.style.left = (6 + Math.random() * 88) + '%';
      el.style.setProperty('--size', size.toFixed(1) + 'px');
      el.style.setProperty('--dx', ((Math.random() - 0.5) * 36).toFixed(0) + 'px');
      el.style.setProperty('--rise', '-' + (90 + Math.random() * 130).toFixed(0) + 'px');
      el.style.animationDuration = (2.2 + Math.random() * 2.2).toFixed(2) + 's';
      el.addEventListener('animationend', () => el.remove());
      host.appendChild(el);
    }

    function startParticles() {
      stopParticles();
      if (reduceMotion) return;
      for (let i = 0; i < 12; i++) setTimeout(() => { if (pm.open) spawnParticle(); }, i * 60);
      pm.timer = setInterval(() => { if (pm.open && !document.hidden) spawnParticle(); }, 240);
    }

    function stopParticles() {
      clearInterval(pm.timer);
      pm.timer = 0;
    }

    function setPortal(on) {
      pm.open = on;
      paintMock();
      if (on) startParticles(); else stopParticles();
    }

    $('p-btn').addEventListener('click', () => setPortal(!pm.open));

    $('p-set-head').addEventListener('click', () => {
      const open = $('p-set').classList.toggle('open');
      $('p-set-head').setAttribute('aria-expanded', String(open));
    });

    $('p-s-voice').addEventListener('change', e => {
      pm.voice = e.target.checked;
      $('p-ports').textContent = portsText();
    });

    function renderMock() {
      const t = I18N[currentLang];
      $('p-set-title').textContent = t.setTitle;
      ['launch', 'exit', 'tray', 'voice'].forEach((k, i) => { $('p-l-' + k).textContent = t.setLabels[i]; });
      setTx('mock-note', t.mockNote);
      paintMock();
    }

    let release = null;

    function paintRelease() {
      const t = I18N[currentLang];
      document.querySelectorAll('a[data-dl]').forEach(a => {
        a.href = release ? release.url : LatestRelease.page(REPO);
      });
      const meta = $('dl-meta');
      if (!release) { meta.hidden = true; return; }
      const parts = [];
      if (release.tag) parts.push('<bdi dir="ltr">' + esc(release.tag) + '</bdi>');
      if (release.size) parts.push(fmt((release.size / 1048576).toFixed(1).replace('.', currentLang === 'fa' ? '٫' : '.')) + ' ' + t.sizeUnit);
      meta.innerHTML = parts.join(' · ');
      meta.hidden = parts.length === 0;
    }

    function renderHow(t) {
      $('how-grid').innerHTML = t.how.map(([icon, name, desc], i) => `
        <div class="card">
          <div class="card-top">
            <div class="icon">${svg(icon)}</div>
            <div class="card-name">${tx(name)}</div>
            <span class="step-num" aria-hidden="true">${fmt(i + 1)}</span>
          </div>
          <p class="card-desc">${tx(desc)}</p>
        </div>`).join('');
    }

    function renderFeatures(t) {
      $('feat-grid').innerHTML = t.feat.map(([icon, name, desc], i) => `
        <div class="card">
          <div class="card-top">
            <div class="icon${i % 2 ? ' alt' : ''}">${svg(icon)}</div>
            <div class="card-name">${tx(name)}</div>
          </div>
          <p class="card-desc">${tx(desc)}</p>
        </div>`).join('');
    }

    function renderFaq(t) {
      $('faq-list').innerHTML = t.faq.map(([q, a], i) => `
        <div class="faq-item">
          <button type="button" class="faq-q" id="faq-q-${i}" aria-expanded="false" aria-controls="faq-a-${i}">
            <span>${tx(q)}</span>
            <span class="faq-icon" aria-hidden="true"></span>
          </button>
          <div class="faq-panel" id="faq-a-${i}" role="region" aria-labelledby="faq-q-${i}">
            <div class="faq-inner"><div class="answer">${tx(a)}</div></div>
          </div>
        </div>`).join('');
    }

    $('faq-list').addEventListener('click', e => {
      const btn = e.target.closest('.faq-q');
      if (!btn) return;
      const item = btn.parentElement;
      const open = item.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    });

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      const t = I18N[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;
      document.title = t.docTitle;

      setTx('back-text', t.back);
      setTx('hero-title', t.heroTitle);
      setTx('hero-pitch', t.pitch);
      $('hero-tags').innerHTML = t.tags.map((x, i) => `<span class="tag${i === 0 ? ' hot' : ''}">${tx(x)}</span>`).join('');
      document.querySelectorAll('[data-dl-label]').forEach(el => { el.textContent = t.download; });
      setTx('cta-github', t.github);
      paintRelease();
      renderMock();

      setTx('how-title', t.howTitle);
      setTx('how-sub', t.howSub);
      renderHow(t);

      setTx('feat-title', t.featTitle);
      setTx('feat-sub', t.featSub);
      renderFeatures(t);

      setTx('faq-title', t.faqTitle);
      setTx('faq-sub', t.faqSub);
      renderFaq(t);

      setTx('end-title', t.endTitle);
      setTx('end-text', t.endText);
      setTx('end-discord', t.endDiscord);
      setTx('end-telegram', t.endTelegram);
      setTx('footer-home', t.footerHome);
      $('made-by').innerHTML = t.madeBy.split('{heart}').map(tx).join(HEART);
    }

    $('lang-toggle').addEventListener('click', () => {
      $('lang-toggle').blur();
      applyLanguage(currentLang === 'en' ? 'fa' : 'en');
    });

    applyLanguage(currentLang);

    LatestRelease.latest(REPO).then(d => {
      release = d;
      paintRelease();
    });
  </script>

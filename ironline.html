<!doctype html>
<html lang="en" data-p="green">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020a05">
  <title>Ironline</title>
  <meta name="description" content="Ironline: a mining and trading tycoon on an old CRT terminal. Dig ore, refine it, and sell into a moving market.">
  <link rel="canonical" href="https://actually-aloy.github.io/site/ironline">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ironline">
  <meta property="og:description" content="A mining and trading tycoon on an old CRT terminal. Dig ore, refine it, and time the market.">
  <meta property="og:url" content="https://actually-aloy.github.io/site/ironline">
  <meta property="og:image" content="https://actually-aloy.github.io/site/ironline-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ironline">
  <meta name="twitter:description" content="A mining and trading tycoon on an old CRT terminal. Dig ore, refine it, and time the market.">
  <meta name="twitter:image" content="https://actually-aloy.github.io/site/ironline-og.jpg">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020a05;
      --fg: #4dff8f;
      --warn: #ffb347;
      --dim: color-mix(in srgb, var(--fg) 55%, transparent);
      --line: color-mix(in srgb, var(--fg) 38%, transparent);
      --glow: 0 0 5px color-mix(in srgb, var(--fg) 60%, transparent), 0 0 16px color-mix(in srgb, var(--fg) 22%, transparent);
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    html[data-p="amber"] {
      --bg: #0a0600;
      --fg: #ffb000;
      --warn: #ff6a3d;
    }

    html[data-p="ice"] {
      --bg: #03080c;
      --fg: #9fe8ff;
      --warn: #ffb347;
    }

    * {
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: repeating-linear-gradient(to bottom, var(--bg) 0, var(--bg) 2px, color-mix(in srgb, var(--fg) 14%, var(--bg)) 2px, color-mix(in srgb, var(--fg) 14%, var(--bg)) 3px);
      border-left: 1px solid var(--line);
    }

    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--fg) 45%, var(--bg));
      border: 1px solid var(--fg);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--fg);
    }

    ::-webkit-scrollbar-corner {
      background: var(--bg);
    }

    @supports not selector(::-webkit-scrollbar) {
      html,
      #tout {
        scrollbar-width: thin;
        scrollbar-color: var(--fg) var(--bg);
      }
    }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.26) 0, rgba(0, 0, 0, 0.26) 1px, transparent 1px, transparent 3px);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 51;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    .screen {
      max-width: 1020px;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      text-shadow: var(--glow);
      animation: flick 7s infinite;
    }

    @keyframes flick {
      0%, 100% { opacity: 1; }
      46% { opacity: 1; }
      48% { opacity: 0.955; }
      50% { opacity: 0.99; }
      52% { opacity: 0.965; }
    }

    button {
      font: inherit;
      color: inherit;
      text-shadow: inherit;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.16em;
      min-width: 0;
    }

    .brand small {
      display: block;
      color: var(--dim);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
    }

    .cursor {
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .top-btns {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .back {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-decoration: none;
      cursor: pointer;
    }

    .back.on {
      border-color: var(--fg);
    }

    #tfs[hidden] {
      display: none;
    }

    #tfs svg {
      width: 18px;
      height: 18px;
    }

    #tfs .fs-out,
    #tfs[aria-pressed="true"] .fs-in {
      display: none;
    }

    #tfs[aria-pressed="true"] .fs-out {
      display: block;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0 8px;
    }

    .hud > div {
      position: relative;
      padding: 8px 10px;
      border: 1px solid var(--line);
      min-width: 0;
      cursor: help;
      outline: none;
    }

    .hud > div::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 30;
      width: max-content;
      max-width: min(300px, 88vw);
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--fg);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-line;
      text-shadow: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s;
    }

    .hud > div:nth-child(2)::after {
      left: 50%;
      transform: translateX(-50%);
    }

    .hud > div:nth-child(3)::after {
      left: auto;
      right: 0;
    }

    .hud > div:hover::after,
    .hud > div:focus::after {
      opacity: 1;
    }

    .hud > div:focus {
      border-color: var(--fg);
    }

    .hud span {
      display: block;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .hud b {
      display: block;
      font-size: 18px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      margin: 0 0 10px;
      min-height: 2.9em;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .status.bad {
      color: var(--warn);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab {
      min-height: 46px;
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--dim);
    }

    .tab[aria-selected="true"] {
      border-color: var(--fg);
      color: var(--bg);
      background: var(--fg);
      text-shadow: none;
      font-weight: 700;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .kv span:first-child {
      color: var(--dim);
      white-space: nowrap;
    }

    .kv span:last-child {
      text-align: right;
    }

    .opsbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.08em;
    }

    .opsbar[hidden] {
      display: none;
    }

    .mk {
      grid-template-columns: 1fr;
    }

    .mk-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mk-px {
      font-size: 26px;
      font-weight: 700;
    }

    .mk-px small {
      font-size: 13px;
      font-weight: 400;
      margin-left: 8px;
    }

    .mk-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--dim);
      flex-wrap: wrap;
    }

    .mk-bar .rng {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mk-bar button {
      min-height: 34px;
      min-width: 52px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 12px;
    }

    .mk-bar button[aria-pressed="true"] {
      border-color: var(--fg);
      color: var(--fg);
    }

    .mk-chart {
      position: relative;
      height: 230px;
      border: 1px solid var(--line);
    }

    .mk-chart canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
    }

    .mk-msg {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--dim);
    }

    .mk-msg[hidden] {
      display: none;
    }

    .mk-note {
      font-size: 11px;
      color: var(--dim);
      line-height: 1.5;
    }

    .grid4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .ord {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }

    .ord-f {
      display: flex;
      gap: 8px;
    }

    .ord-f input {
      flex: 1;
      min-width: 0;
      min-height: 46px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    .ord-f input:focus {
      border-color: var(--fg);
    }

    .ord-f .btn {
      flex: 0 0 auto;
      min-width: 140px;
    }

    @media (max-width: 520px) {
      .mk-bar button {
        min-width: 44px;
      }

      .grid4 .btn,
      .grid3 .btn {
        padding: 6px 2px;
        font-size: 12px;
      }

      .ord-f .btn {
        min-width: 112px;
      }

      .tab {
        font-size: 11px;
        letter-spacing: 0.04em;
        padding: 0 2px;
      }
    }

    .btn.b3 {
      height: 66px;
      min-height: 66px;
      padding: 4px 8px;
      gap: 0;
    }

    .btn {
      min-width: 0;
    }

    .btn > * {
      display: block;
      max-width: 100%;
    }

    .btn.b3 > * {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
      line-height: 1.35;
      min-height: 1.35em;
    }

    .btn.b3 .l2 {
      font-size: 12px;
    }

    .btn {
      min-height: 46px;
      padding: 6px 10px;
      border: 1px solid var(--fg);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.25;
    }

    .btn small {
      color: var(--dim);
      font-size: 11px;
      text-transform: none;
    }

    .btn:active:not(:disabled),
    .btn.press {
      background: var(--fg);
      color: var(--bg);
      text-shadow: none;
    }

    .btn:active:not(:disabled) small {
      color: var(--bg);
    }

    .btn:disabled {
      border-style: dashed;
      border-color: var(--line);
      color: var(--dim);
      cursor: default;
    }

    .btn:focus-visible,
    .back:focus-visible,
    .tab:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }

    @media (hover: hover) {
      .btn:hover:not(:disabled),
      .tab:hover:not([aria-selected="true"]),
      button.back:hover {
        background: color-mix(in srgb, var(--fg) 14%, transparent);
      }
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr));
      gap: 12px;
      align-items: start;
    }

    .cards[hidden] {
      display: none;
    }

    .card {
      padding: 12px;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .card h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .px {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
      white-space: nowrap;
    }

    .px b {
      font-size: 20px;
      font-weight: 600;
    }

    .dn {
      color: var(--warn);
    }

    .tag {
      min-width: 3ch;
      color: var(--bg);
      background: var(--fg);
      padding: 0 5px;
      font-size: 11px;
      text-shadow: none;
    }

    .tag:empty {
      display: none;
    }

    .tag.low {
      background: var(--warn);
    }

    .spark {
      overflow: hidden;
      white-space: nowrap;
      font-size: clamp(11px, 3.6vw, 15px);
      line-height: 1.1;
    }

    .row {
      display: grid;
      grid-template-columns: 8ch 1fr auto;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }

    .row > span:first-child {
      color: var(--dim);
    }

    .row > span:nth-child(2) {
      overflow: hidden;
      white-space: pre;
    }

    .vv {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
    }

    .tr {
      font-style: normal;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--dim);
    }

    .tr::before {
      content: attr(data-g);
    }

    .tr::after {
      content: ' ' attr(data-w);
    }

    .tr.up {
      color: var(--fg);
    }

    .tr.dn {
      color: var(--warn);
    }

    @media (max-width: 520px) {
      .tr::after {
        display: none;
      }
    }

    .grid2,
    .grid3 {
      display: grid;
      gap: 8px;
    }

    .grid2 {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .grid3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .lockbox {
      display: none;
    }

    .card.locked > :not(.card-head):not(.lockbox) {
      display: none;
    }

    .card.locked .px {
      display: none;
    }

    .card.locked .lockbox {
      display: block;
    }

    .card.locked {
      border-style: dashed;
      color: var(--dim);
    }

    .res h2 {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
    }

    .res h2 span {
      color: var(--dim);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .cards.eq {
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 1fr;
      align-items: stretch;
    }

    .cards.col:not([hidden]) {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .cards.eq .res .btn {
      margin-top: auto;
    }

    @media (max-width: 700px) {
      .cards.eq {
        grid-template-columns: 1fr;
      }
    }

    .seg {
      display: flex;
      gap: 6px;
    }

    .seg button {
      min-height: 34px;
      min-width: 52px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      font-size: 12px;
    }

    .seg button[aria-pressed="true"] {
      border-color: var(--fg);
      color: var(--fg);
    }

    .res p {
      flex: 1;
      margin: 0;
      color: var(--dim);
      font-size: 12.5px;
      line-height: 1.6;
    }

    .term {
      margin-top: 14px;
      border: 1px solid var(--line);
    }

    .term:focus-within {
      border-color: var(--fg);
    }

    .term h3 {
      margin: 0;
      padding: 6px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--dim);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    #tout {
      height: 240px;
      overflow-y: auto;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.5;
      overscroll-behavior: contain;
    }

    #tout div {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #tout .w {
      color: var(--warn);
    }

    #tout .t,
    #tout .d {
      color: var(--dim);
    }

    #tout .c {
      font-weight: 600;
    }

    .out {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--dim);
    }

    .out:empty {
      display: none;
    }

    .tin {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-top: 1px solid var(--line);
    }

    .tin .ps {
      white-space: nowrap;
      font-weight: 600;
    }

    .tin input {
      flex: 1;
      min-width: 0;
      height: 48px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 16px;
      text-shadow: inherit;
      caret-color: var(--fg);
    }

    .tin input::placeholder {
      color: var(--dim);
    }

    @media (min-width: 820px) {
      .screen {
        margin-top: 18px;
        padding-top: 28px;
        border-radius: 22px;
        box-shadow: inset 0 0 90px color-mix(in srgb, var(--fg) 7%, transparent);
      }

      #tout {
        height: 270px;
      }
    }

    @media (max-width: 440px) {
      .brand small {
        display: none;
      }
    }

    @media (max-width: 380px) {
      body {
        font-size: 13px;
      }

      .hud b {
        font-size: 16px;
      }

      .brand {
        font-size: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .screen,
      .cursor {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="screen" id="screen">
    <div class="top">
      <div class="brand">IRONLINE<span class="cursor">_</span><small>MINING &amp; TRADING TERMINAL</small></div>
      <div class="top-btns">
        <button type="button" class="back" id="tmus" aria-pressed="false">&#9834; OFF</button>
        <button type="button" class="back" id="tfs" aria-label="Toggle fullscreen" aria-pressed="false" hidden>
          <svg class="fs-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <svg class="fs-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
        <a class="back" href="arcade.html">&lt; ARCADE</a>
      </div>
    </div>

    <section class="hud" aria-label="Finances">
      <div tabindex="0"><span>CASH</span><b id="cash">$0</b></div>
      <div tabindex="0"><span>STOCK</span><b id="stock">$0</b></div>
      <div tabindex="0"><span>NET WORTH</span><b id="net">$0</b></div>
    </section>

    <p class="status" id="status">ALL SYSTEMS NOMINAL</p>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button type="button" class="tab" role="tab" id="tab-ops" data-tab="ops" aria-selected="true" aria-controls="cards">OPERATIONS</button>
      <button type="button" class="tab" role="tab" id="tab-res" data-tab="res" aria-selected="false" aria-controls="research">RESEARCH</button>
      <button type="button" class="tab" role="tab" id="tab-mk" data-tab="mk" aria-selected="false" aria-controls="markets">MARKETS</button>
      <button type="button" class="tab" role="tab" id="tab-bd" data-tab="bd" aria-selected="false" aria-controls="board">BOARD</button>
    </nav>

    function cleanSeries(raw, range) {
      if (!Array.isArray(raw)) throw new Error('bad data');
      const x = RANGES[range];
      const pts = raw.filter(k => k.every(Number.isFinite))
        .map(k => [k[0], k[1], Math.max(k[1], k[2], k[3], k[4]), Math.min(k[1], k[2], k[3], k[4]), k[4]])
        .sort((a, b) => a[0] - b[0]);
      if (!pts.length) throw new Error('empty');
      const last = pts[pts.length - 1][0];
      if (Date.now() - last > x.stale || last - Date.now() > 600000) throw new Error('stale');
      const out = pts.filter(k => k[0] >= last - x.win);
      if (out.length < x.min) throw new Error('too short');
      if (out[0][0] > last - x.win * 0.8) throw new Error('short coverage');
      return out;
    }

    async function btcRefresh() {
      if (BTC.busy) return;
      BTC.busy = true;
      const range = BTC.range;
      const order = PROVIDERS.slice().sort((a, b) => (b.n === BTC.src) - (a.n === BTC.src));
      let done = false;
      for (const pv of order) {
        try {
          const pts = cleanSeries(await pv.get(range), range);
          if (range !== BTC.range) { done = true; break; }
          BTC.pts = pts;
          BTC.src = pv.n;
          BTC.price = pts[pts.length - 1][4];
          BTC.at = Date.now();
          BTC.ok = true;
          S.btc.last = BTC.price;
          done = true;
          break;
        } catch (e) {}
      }
      if (!done && Date.now() - BTC.at > 180000) BTC.ok = false;
      BTC.tried = true;
      BTC.busy = false;
      if (done) checkOrder();
      renderMarkets();
      drawChart();
      render();

    const fmtPx = v => v.toLocaleString('en-US', { maximumFractionDigits: v < 100 ? 2 : 0 });

    function btcBuy(frac, at, tag) {
      if (!at && !btcLive()) return;
      const p = at || BTC.price;
      const spend = S.cash * frac;
      if (spend < 1) { if (tag) log('LIMIT BUY CANCELLED: NOT ENOUGH CASH.'); return; }
      const amt = spend * (1 - BTC_FEE) / p;
      S.cash -= spend;
      S.btc.amt += amt;
      S.btc.cost += spend;
      log((tag || '') + 'BOUGHT ' + amt.toFixed(6) + ' BTC @ $' + fmtPx(p) + ' = ' + money(spend) + ' (INCL. FEE)');
      Snd.sfx('buy');
    }

    function btcSell(frac, at, tag) {
      if (!at && !btcLive()) return;
      if (S.btc.amt <= 0) { if (tag) log('LIMIT SELL CANCELLED: NO BITCOIN LEFT.'); return; }
      const p = at || BTC.price;
      const amt = frac >= 1 ? S.btc.amt : S.btc.amt * frac;
      const proceeds = amt * p * (1 - BTC_FEE);
      const basis = S.btc.cost * (amt / S.btc.amt);
      S.btc.amt = frac >= 1 ? 0 : S.btc.amt - amt;
      S.btc.cost = frac >= 1 ? 0 : S.btc.cost - basis;
      S.cash += proceeds;
      const pl = proceeds - basis;
      log((tag || '') + 'SOLD ' + amt.toFixed(6) + ' BTC @ $' + fmtPx(p) + ' = ' + money(proceeds) + ' (' + (pl >= 0 ? '+' : '-') + money(Math.abs(pl)) + ')');
      Snd.sfx('sell');
    }

      S.btc.ord = null;
      if (o.side === 'buy') btcBuy(o.frac, at, 'LIMIT '); else btcSell(o.frac, at, 'LIMIT ');

    function smaOf(pts, n) {
      const out = new Array(pts.length).fill(NaN);
      let s = 0;
      for (let i = 0; i < pts.length; i++) {
        s += pts[i][4];
        if (i >= n) s -= pts[i - n][4];
        if (i >= n - 1) out[i] = s / n;
      }
      return out;
    }

    function drawChart() {
      const cv = mref.cv;
      if (!cv || $('markets').hidden) return;
      const pts = BTC.pts;
      const w = cv.clientWidth;
      const h = cv.clientHeight;
      if (!w || !h) return;
      const dpr = window.devicePixelRatio || 1;
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      const g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      if (!btcLive() || pts.length < 2) return;
      const cs = getComputedStyle(document.documentElement);
      const fg = cs.getPropertyValue('--fg').trim() || '#4dff8f';
      const dim = cs.getPropertyValue('--dim').trim() || '#2f9a5a';
      const line = cs.getPropertyValue('--line').trim() || '#14532d';
      const warn = cs.getPropertyValue('--warn').trim() || '#ffb347';
      const n = pts.length;
      const candle = BTC.type === 'candle';
      const ma = BTC.ma ? smaOf(pts, MA_N) : null;
      let lo = Infinity;
      let hi = 0;
      pts.forEach(k => {
        const a = candle ? k[3] : k[4];
        const b = candle ? k[2] : k[4];
        if (a < lo) lo = a;
        if (b > hi) hi = b;
      });
      const padv = (hi - lo) * 0.08 || hi * 0.001;
      lo -= padv;
      hi += padv;
      const L = 8;
      const R = 62;
      const T = 10;
      const B = 22;
      const pw = w - L - R;
      const X = i => L + (i + 0.5) / n * pw;
      const Y = v => T + (1 - (v - lo) / (hi - lo)) * (h - T - B);
      g.font = '11px "IBM Plex Mono", ui-monospace, monospace';
      g.textBaseline = 'middle';
      g.lineWidth = 1;
      for (let k = 0; k <= 4; k++) {
        const v = lo + (hi - lo) * k / 4;
        const y = Math.round(Y(v)) + 0.5;
        g.strokeStyle = line;
        g.setLineDash([3, 5]);
        g.beginPath();
        g.moveTo(L, y);
        g.lineTo(w - R, y);
        g.stroke();
        g.setLineDash([]);
        g.fillStyle = dim;
        g.textAlign = 'left';
        g.fillText(fmtPx(v), w - R + 6, y);
      }
      if (candle) {
        const bw = clamp(Math.floor(pw / n * 0.7), 1, 14);
        pts.forEach((k, i) => {
          const x = Math.round(X(i));
          const up = k[4] >= k[1];
          g.strokeStyle = g.fillStyle = up ? fg : warn;
          g.lineWidth = 1;
          g.beginPath();
          g.moveTo(x + 0.5, Y(k[2]));
          g.lineTo(x + 0.5, Y(k[3]));
          g.stroke();
          const top = Y(Math.max(k[1], k[4]));
          g.fillRect(Math.round(x - bw / 2), top, bw, Math.max(1, Y(Math.min(k[1], k[4])) - top));
        });
      } else {
        const grad = g.createLinearGradient(0, T, 0, h - B);
        grad.addColorStop(0, fg + '44');
        grad.addColorStop(1, fg + '00');
        g.beginPath();
        pts.forEach((k, i) => { if (i) g.lineTo(X(i), Y(k[4])); else g.moveTo(X(i), Y(k[4])); });
        g.lineTo(X(n - 1), h - B);
        g.lineTo(X(0), h - B);
        g.closePath();
        g.fillStyle = grad;
        g.fill();
        g.beginPath();
        pts.forEach((k, i) => { if (i) g.lineTo(X(i), Y(k[4])); else g.moveTo(X(i), Y(k[4])); });
        g.strokeStyle = fg;
        g.lineWidth = 1.6;
        g.lineJoin = 'round';
        g.shadowColor = fg;
        g.shadowBlur = 6;
        g.stroke();
        g.shadowBlur = 0;
        g.fillStyle = fg;
        g.beginPath();
        g.arc(X(n - 1), Y(pts[n - 1][4]), 3, 0, Math.PI * 2);
        g.fill();
      }
      if (ma) {
        g.beginPath();
        let started = false;
        ma.forEach((v, i) => {
          if (!isFinite(v)) return;
          if (started) g.lineTo(X(i), Y(v)); else { g.moveTo(X(i), Y(v)); started = true; }
        });
        g.strokeStyle = warn;
        g.lineWidth = 1.4;
        g.setLineDash([]);
        g.stroke();
      }
      const o = S.btc.ord;
      if (o && o.price > lo && o.price < hi) {
        const y = Math.round(Y(o.price)) + 0.5;
        g.strokeStyle = warn;
        g.setLineDash([6, 4]);
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(L, y);
        g.lineTo(w - R, y);
        g.stroke();
        g.setLineDash([]);
        g.fillStyle = warn;
        g.textAlign = 'left';
        g.fillText(o.side.toUpperCase(), L + 4, y - 7);
      }
      const fmtT = ts => {
        const d = new Date(ts);
        if (BTC.range === '1H' || BTC.range === '24H') return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        if (BTC.range === '1Y') return d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      };
      g.fillStyle = dim;
      g.textBaseline = 'alphabetic';
      [[0, 'left'], [Math.floor((n - 1) / 2), 'center'], [n - 1, 'right']].forEach(([i, al]) => {
        g.textAlign = al;
        g.fillText(fmtT(pts[i][0]), al === 'left' ? L : al === 'right' ? w - R : (L + w - R) / 2, h - 6);
      });
      if (BTC.hover >= 0 && BTC.hover < n) {
        const hx = Math.round(X(BTC.hover));
        g.strokeStyle = dim;
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(hx + 0.5, T);
        g.lineTo(hx + 0.5, h - B);
        g.stroke();
        if (!candle) {
          g.fillStyle = fg;
          g.beginPath();
          g.arc(hx, Y(pts[BTC.hover][4]), 3.5, 0, Math.PI * 2);
          g.fill();
        }
      }
    }

    function hoverAt(clientX) {

    const Snd = {
      ctx: null, master: null, bus: null, sfxBus: null, delay: null, on: false, vol: 0.8, timer: null, nextT: 0, stepN: 0, n: 0, noise: null, keep: null, ti: -1, tr: null,
      TRACKS: [
        { name: 'NIGHT SHIFT', bpm: 84, roots: [45, 41, 48, 43], q: [0, 1, 1, 1], bass: [0, 3, 6, 8, 11, 14], arp: [0, 2, 1, 3, 2, 1, 3, 2], pent: [0, 3, 5, 7, 10], arpAt: 4, drumAt: 8 },
        { name: 'COLD IRON', bpm: 96, roots: [38, 34, 41, 36], q: [0, 1, 1, 1], bass: [0, 3, 4, 7, 8, 11, 12, 14], arp: [0, 1, 2, 3, 2, 1, 2, 3], pent: [0, 3, 5, 7, 10], arpAt: 3, drumAt: 6 },
        { name: 'DEEP SHAFT', bpm: 72, roots: [40, 36, 43, 38], q: [0, 1, 1, 1], bass: [0, 6, 10], arp: [0, 2, 3, 2, 1, 2, 3, 1], pent: [0, 3, 7, 10, 12], arpAt: 6, drumAt: 12 },
        { name: 'BOOM TOWN', bpm: 104, roots: [48, 44, 51, 46], q: [0, 1, 1, 1], bass: [0, 2, 4, 6, 8, 10, 12, 14], arp: [0, 0, 2, 1, 3, 2, 1, 3], pent: [0, 3, 5, 7, 10], arpAt: 2, drumAt: 4 },
        { name: 'LAST SHIFT', bpm: 78, roots: [41, 48, 50, 46], q: [1, 1, 0, 1], bass: [0, 4, 6, 10, 12], arp: [0, 1, 2, 1, 3, 2, 1, 0], pent: [0, 2, 4, 7, 9], arpAt: 4, drumAt: 8 }
      ],
      QUAL: [[0, 3, 7], [0, 4, 7]],
      freq(m) { return 440 * Math.pow(2, (m - 69) / 12); },
      rnd(n) { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); },
      pick() {
        let i = this.ti;
        while (i === this.ti) i = Math.floor(Math.random() * this.TRACKS.length);
        this.ti = i;
        this.tr = this.TRACKS[i];
        if (this.delay) this.delay.delayTime.setValueAtTime(60 / this.tr.bpm * 0.75, this.ctx.currentTime);
      },
      init() {
        if (this.ctx) return true;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        const ctx = new AC();
        this.ctx = ctx;
        ctx.onstatechange = () => { if (this.on && ctx.state !== 'running' && !document.hidden) armWake(); };
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -16;
        comp.ratio.value = 4;
        this.master = ctx.createGain();
        this.master.gain.value = 0;
        this.master.connect(comp);
        const mk = ctx.createGain();
        mk.gain.value = 1.5;
        comp.connect(mk);
        mk.connect(ctx.destination);
        this.bus = ctx.createGain();
        this.bus.connect(this.master);
        this.sfxBus = ctx.createGain();
        this.sfxBus.gain.value = 0.5;
        this.sfxBus.connect(this.master);
        const len = Math.floor(ctx.sampleRate * 2.2);
        const ir = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = ir.getChannelData(ch);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
        }
        const conv = ctx.createConvolver();
        conv.buffer = ir;
        const wet = ctx.createGain();
        wet.gain.value = 0.3;
        this.bus.connect(conv);
        conv.connect(wet);
        wet.connect(this.master);
        this.delay = ctx.createDelay(1.5);
        this.delay.delayTime.value = 60 / 84 * 0.75;
        const fb = ctx.createGain();
        fb.gain.value = 0.34;
        const dl = ctx.createBiquadFilter();
        dl.type = 'lowpass';
        dl.frequency.value = 2200;
        this.delay.connect(dl);
        dl.connect(fb);
        fb.connect(this.delay);
        const dwet = ctx.createGain();
        dwet.gain.value = 0.5;
        dl.connect(dwet);
        dwet.connect(this.master);
        const nl = ctx.sampleRate;
        this.noise = ctx.createBuffer(1, nl, ctx.sampleRate);
        const nd = this.noise.getChannelData(0);
        for (let i = 0; i < nl; i++) nd[i] = Math.random() * 2 - 1;
        return true;
      },
      tone(type, f, t, dur, peak, opt) {
        const ctx = this.ctx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (opt && opt.slide) o.frequency.exponentialRampToValueAtTime(opt.slide, t + dur);
        if (opt && opt.detune) o.detune.value = opt.detune;
        const a = (opt && opt.a) || 0.005;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + a);
        if (opt && opt.hold) g.gain.setValueAtTime(peak, t + dur * opt.hold);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        let node = o;
        if (opt && opt.lp) {
          const f1 = ctx.createBiquadFilter();
          f1.type = 'lowpass';
          f1.frequency.value = opt.lp;
          o.connect(f1);
          node = f1;
        }
        node.connect(g);
        g.connect((opt && opt.dest) || this.bus);
        if (opt && opt.send) g.connect(this.delay);
        o.start(t);
        o.stop(t + dur + 0.05);
        this.n++;
      },
      hit(t, dur, peak, kind) {
        const ctx = this.ctx;
        const s = ctx.createBufferSource();
        s.buffer = this.noise;
        const f = ctx.createBiquadFilter();
        f.type = kind === 'hat' ? 'highpass' : 'bandpass';
        f.frequency.value = kind === 'hat' ? 7000 : 1800;
        const g = ctx.createGain();
        g.gain.setValueAtTime(peak, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f);
        f.connect(g);
        g.connect(this.bus);
        s.start(t);
        s.stop(t + dur + 0.02);
        this.n++;
      },
      sched(step, t) {
        if (step % 256 === 0 || !this.tr) this.pick();
        const tr = this.tr;
        const bar = Math.floor(step / 16);
        const s = step % 16;
        const sec = Math.floor(step / 16) % 16;
        const ci = bar % 4;
        const root = tr.roots[ci];
        const iv = this.QUAL[tr.q[ci]];
        const beat = 60 / tr.bpm;
        if (s === 0) {
          iv.forEach((x, k) => {
            this.tone('sawtooth', this.freq(root + 12 + x), t, beat * 4.2, 0.06, { a: 0.7, hold: 0.6, lp: 1100, detune: k % 2 ? 7 : -7 });
            this.tone('triangle', this.freq(root + 24 + x), t, beat * 4.2, 0.05, { a: 0.9, hold: 0.6, lp: 1800 });
          });
        }
        if (tr.bass.indexOf(s) >= 0) {
          const bn = root + (s === 11 || s === 14 ? 12 : 0);
          this.tone('sawtooth', this.freq(bn), t, beat * 0.42, 0.2, { lp: 520 });
          this.tone('sine', this.freq(root), t, beat * 0.5, 0.22);
          this.tone('triangle', this.freq(bn + 12), t, beat * 0.4, 0.1, { lp: 1400 });
        }
        if (sec >= tr.arpAt && s % 2 === 0) {
          const tones = [root + 24 + iv[0], root + 24 + iv[1], root + 24 + iv[2], root + 36 + iv[0]];
          const k = tr.arp[(s / 2) % 8];
          this.tone('square', this.freq(tones[k] + (sec >= 12 ? 12 : 0)), t, beat * 0.3, s === 0 ? 0.06 : 0.04, { lp: 2600, send: true });
        }
        if (sec >= 2 && s % 2 === 0 && this.rnd(bar * 131 + s * 17 + this.ti * 7) < (sec >= 8 ? 0.55 : 0.35)) {
          const d = Math.floor(this.rnd(bar * 53 + s * 29 + this.ti) * tr.pent.length);
          const m = root + 36 + tr.pent[d] + (this.rnd(bar + s) < 0.25 ? 12 : 0);
          this.tone('triangle', this.freq(m), t, beat * (0.5 + this.rnd(s + bar * 3) * 0.9), 0.075, { a: 0.012, lp: 3200, send: true });
        }
        if (sec >= tr.drumAt) {
          if (s === 0 || s === 8 || (s === 14 && bar % 2)) {
            this.tone('sine', 120, t, 0.2, 0.6, { slide: 42 });
            this.tone('triangle', 260, t, 0.05, 0.2, { slide: 90 });
          }
          if (s === 4 || s === 12) {
            this.hit(t, 0.14, 0.18, 'snare');
            this.tone('triangle', 190, t, 0.1, 0.1);
          }
          if (s % 4 === 2) this.hit(t, 0.04, 0.05, 'hat');
        }
      },
      pump() {
        const ctx = this.ctx;
        while (this.nextT < ctx.currentTime + 0.25) {
          this.sched(this.stepN, this.nextT);
          this.stepN++;
          this.nextT += 60 / this.tr.bpm / 4;
        }
      },
      next() {
        if (!this.on) return;
        this.stepN = (Math.floor(this.stepN / 256) + 1) * 256;
        this.nextT = this.ctx.currentTime + 0.1;
      },
      unlock() {
        const ctx = this.ctx;
        try {
          const src = ctx.createBufferSource();
          src.buffer = ctx.createBuffer(1, 1, 22050);
          src.connect(ctx.destination);
          src.start(0);
        } catch (e) {}
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
        try {
          if (!this.keep) {
            const n = 8000;
            const buf = new ArrayBuffer(44 + n * 2);
            const v = new DataView(buf);
            const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
            w(0, 'RIFF');
            v.setUint32(4, 36 + n * 2, true);
            w(8, 'WAVEfmt ');
            v.setUint32(16, 16, true);
            v.setUint16(20, 1, true);
            v.setUint16(22, 1, true);
            v.setUint32(24, 8000, true);
            v.setUint32(28, 16000, true);
            v.setUint16(32, 2, true);
            v.setUint16(34, 16, true);
            w(36, 'data');
            v.setUint32(40, n * 2, true);
            const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
            a.loop = true;
            a.setAttribute('playsinline', '');
            this.keep = a;
          }
          const pr = this.keep.play();
          if (pr && pr.catch) pr.catch(() => {});
        } catch (e) {}
      },
      kick() {
        if (!this.ctx) return;
        this.unlock();
        if (this.ctx.state !== 'running') this.ctx.resume();
      },
      apply() {
        if (!this.ctx) return;
        this.master.gain.setTargetAtTime(this.on ? this.vol : 0, this.ctx.currentTime, 0.25);
      },
      setOn(v) {
        if (v && !this.init()) { this.on = false; return false; }
        this.on = !!v;
        if (this.on) {
          this.unlock();
          if (this.ctx.state !== 'running') this.ctx.resume();
          if (!this.timer) {
            this.nextT = this.ctx.currentTime + 0.1;
            this.timer = setInterval(() => this.pump(), 40);
          }
        } else if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
          if (this.keep) this.keep.pause();
          const c = this.ctx;
          setTimeout(() => { if (!this.on && c.state === 'running') c.suspend(); }, 900);
        }
        this.apply();
        store.set(AKEY, JSON.stringify({ on: this.on, vol: this.vol }));
        return true;
      },
      setVol(v) {
        this.vol = clamp(v, 0, 1);
        this.apply();
        store.set(AKEY, JSON.stringify({ on: this.on, vol: this.vol }));
      },
      sfx(kind) {
        if (!this.on || !this.ctx || this.ctx.state !== 'running') return;
        const t = this.ctx.currentTime + 0.01;
        const d = this.sfxBus;
        if (kind === 'buy') {
          this.tone('square', 440, t, 0.09, 0.07, { dest: d, lp: 3000 });
          this.tone('square', 660, t + 0.08, 0.12, 0.07, { dest: d, lp: 3000 });
        } else if (kind === 'sell') {
          [880, 1175, 1568].forEach((f, k) => this.tone('triangle', f, t + k * 0.06, 0.14, 0.09, { dest: d }));
        } else if (kind === 'unlock') {
          [523, 659, 784, 1047].forEach((f, k) => this.tone('square', f, t + k * 0.09, 0.16, 0.06, { dest: d, lp: 3200 }));
        } else if (kind === 'alert') {
          this.tone('sawtooth', 130, t, 0.45, 0.1, { dest: d, slide: 70, lp: 600 });
        } else if (kind === 'news') {
          this.tone('sine', 988, t, 0.25, 0.07, { dest: d });
        } else if (kind === 'err') {
          this.tone('square', 110, t, 0.1, 0.06, { dest: d, lp: 500 });
        }
      }
    };

    const el = {};
    const refs = [];
    const rrefs = [];
    const brefs = [];
    const bref = {};
    let confirmUntil = 0;
    const setT = (node, text) => { if (node._t !== text) { node._t = text; node.textContent = text; } };

    function stamp() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }

    function print(text, cls, prefix) {
      const box = el.tout;
      const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      String(text).split('\n').forEach(line => {
        const d = document.createElement('div');
        if (cls) d.className = cls;
        if (prefix) {
          const t = document.createElement('span');
          t.className = 't';
          t.textContent = prefix + ' ';
          d.appendChild(t);
          d.appendChild(document.createTextNode(line));
        } else {
          d.textContent = line === '' ? ' ' : line;
        }
        box.appendChild(d);
      });
      while (box.childNodes.length > 300) box.removeChild(box.firstChild);
      if (stick) box.scrollTop = box.scrollHeight;
    }

    let lastNews = null;

    function log(msg, cls) {
      print(msg, cls || '', stamp());
      if (cls === 'w' || /^NEWS|^RICH|^POWER/.test(msg)) lastNews = { m: msg, at: S.clock };
    }

    function tickProd(dt) {
      const oc = cap() * 2;
      const mc = cap();
      S.c.forEach((c, i) => {
        if (!c.u) return;
        c.ore = Math.min(oc, c.ore + mineRate(i) * dt);
        const s = Math.min(c.ore, smeltRate(i) * dt, Math.max(0, mc - c.metal));
        c.ore -= s;
        c.metal += s;
      });
    }

    function tickMarket() {
      S.c.forEach((c, i) => {
        const d = COMM[i];
        const before = c.x;
        const tg = d.amp * Math.sin(2 * Math.PI * S.clock / d.period + d.phase);
        c.x = clamp(c.x + 0.045 * (tg - c.x) + d.vol * gauss(), -0.8, 0.9);
        c.dx = c.x - before;
      });
    }

    function sell(i, frac) {
      const c = S.c[i];
      const n = frac >= 1 ? c.metal : Math.floor(c.metal * frac * 100) / 100;
      if (n <= 0) return null;
      const p = price(i);
      const gain = n * p * shareMult();
      c.metal -= n;
      S.cash += gain;
      S.earned += gain;
      S.run += gain;
      c.x = Math.max(-0.8, c.x - 0.08 * n / (COMM[i].liq * impactDiv()));
      return { n, p, gain };
    }

    function autoSell() {
      const b = brokerLv();
      if (!b) return;
      const floor = Math.max(5, cap() * 0.25);
      S.c.forEach((c, i) => {
        if (!c.u) return;
        if (c.ovf && c.metal >= cap() * 0.995) {
          const r = sell(i, (c.metal - cap() * 0.85) / c.metal);
          if (r) {
            log('STORAGE FULL. BROKER SOLD ' + Math.floor(r.n) + ' ' + COMM[i].sym + ' @ $' + r.p.toFixed(2) + ' = ' + money(r.gain));
            Snd.sfx('sell');
          }
          return;
        }
        const m = AUTO[c.auto];
        if (!m || c.metal < floor) return;
        const p = price(i);
        const th = m * COMM[i].base;
        if (p < th) return;
        if (b >= 3 && c.dx > 0 && p < th * 1.1) return;
        const r = sell(i, b >= 2 ? 0.4 : 1);
        if (r) {
          log('BROKER SOLD ' + Math.floor(r.n) + ' ' + COMM[i].sym + ' @ $' + r.p.toFixed(2) + ' = ' + money(r.gain));
          Snd.sfx('sell');
        }
      });
    }

    function fireEvent() {
      S.nextEvent = S.clock + 40 + Math.random() * 40;
      const r = Math.random();
      const active = S.c.map((c, i) => (c.u ? i : -1)).filter(i => i >= 0);
      if (r < 0.18) {
        S.outage = outageLen();
        log('POWER OUTAGE. ALL MINES OFFLINE FOR ' + Math.ceil(S.outage) + 's.', 'w');
        Snd.sfx('alert');
        return;
      }
      if (r < 0.34) {
        const pool = active.filter(i => S.c[i].ml > 0);
        if (pool.length) {
          const i = pool[Math.floor(Math.random() * pool.length)];
          S.boost = { i, t: VEIN_LEN };
          log('RICH VEIN FOUND. ' + COMM[i].sym + ' OUTPUT x2 FOR ' + VEIN_LEN + 's.');
          Snd.sfx('news');
          return;
        }
      }
      const pool = EVENTS.filter(e => S.c[e.i].u);
      const e = pool[Math.floor(Math.random() * pool.length)];
      S.c[e.i].x = clamp(S.c[e.i].x + e.dx, -0.8, 0.9);
      log('NEWS: ' + e.m, e.dx < 0 ? 'w' : '');
      Snd.sfx(e.dx < 0 ? 'alert' : 'news');
    }

    function pushHist() {
      S.c.forEach(c => { c.h.push(c.x); if (c.h.length > HIST_LEN) c.h.shift(); });
    }

    let marketAcc = 0;
    let histAcc = 0;

    function step(dt) {
      tickProd(dt);
      S.clock += dt;
      if (S.outage > 0) {
        S.outage = Math.max(0, S.outage - dt);
        if (S.outage === 0) log('POWER RESTORED.');
      }
      if (S.boost) {
        S.boost.t -= dt;
        if (S.boost.t <= 0) { log('RICH VEIN RAN DRY.'); S.boost = null; }
      }
      marketAcc += dt;
      while (marketAcc >= 1) {
        marketAcc -= 1;
        tickMarket();
        autoSell();
        histAcc++;
        if (histAcc >= HIST_EVERY) { histAcc = 0; pushHist(); }
        if (S.clock >= S.nextEvent) fireEvent();
      }
      const nw = netWorth();
      while (S.milestone < MILESTONES.length && nw >= MILESTONES[S.milestone]) {
        log('MILESTONE: NET WORTH ' + money(MILESTONES[S.milestone]) + '.');
        Snd.sfx('unlock');
        S.milestone++;
      }
    }

    function away(secs) {
      const sec = Math.min(Math.floor(secs), awayMax());
      const sum = () => S.c.reduce((a, c) => a + c.ore + c.metal, 0);
      const before = sum();
      S.outage = 0;
      S.boost = null;
      offlineMul = 0.5;
      for (let k = 0; k < sec; k++) tickProd(1);
      offlineMul = 1;
      S.clock += sec;
      const gained = sum() - before;
      const m = Math.floor(sec / 60);
      log('AWAY ' + (sec < 60 ? sec + 's' : m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm') + '. PRODUCED ' + Math.floor(gained) + ' UNITS WHILE YOU WERE GONE.');
    }

        nextEvent: S.nextEvent, milestone: S.milestone, earned: S.earned, helped: S.helped,

      }));
    }

        r.btn = a.querySelector('button');

      });

    const bar = (f, w) => {
      const n = Math.round(clamp(f, 0, 1) * w);
      return '[' + '█'.repeat(n) + '░'.repeat(w - n) + ']';
    };

    const TREND = { up: ['▲', 'RISING'], dn: ['▼', 'FALLING'], flat: ['■', 'STEADY'] };

    function setTrend(node, rate, capacity) {
      const lim = Math.max(0.05, capacity * 0.004);
      const k = !rate || Math.abs(rate) < lim ? 'flat' : rate > 0 ? 'up' : 'dn';
      if (node._k === k) return;
      node._k = k;
      node.dataset.g = TREND[k][0];
      node.dataset.w = TREND[k][1];
      node.className = 'tr ' + k;
    }

    function trackTrend(dt) {
      if (dt <= 0 || dt > 1) {
        S.c.forEach(c => { c.po = c.ore; c.pm = c.metal; });
        return;
      }
      const ao = 1 - Math.exp(-dt / 3);
      const am = 1 - Math.exp(-dt / 4);
      S.c.forEach(c => {
        if (c.po === undefined) { c.po = c.ore; c.pm = c.metal; c.eo = 0; c.em = 0; }
        c.eo += ((c.ore - c.po) / dt - c.eo) * ao;
        c.em += ((c.metal - c.pm) / dt - c.em) * am;
        c.po = c.ore;
        c.pm = c.metal;
      });
    }

    const incHist = [];
    let incAcc = 0;

    function trackIncome(dt) {
      incAcc += dt;
      if (incAcc < 1) return;
      incAcc = 0;
      incHist.push(S.run);
      if (incHist.length > 61) incHist.shift();
    }

    const incomeRate = () => (incHist.length > 1 ? Math.max(0, (incHist[incHist.length - 1] - incHist[0]) / (incHist.length - 1)) : 0);

    function setTip(node, text) {
      const p = node.parentNode;
      if (p._tip !== text) { p._tip = text; p.dataset.tip = text; }
    }

    function updateTips(stock) {
      const lines = [];
      S.c.forEach((c, i) => { if (c.u && c.metal >= 1) lines.push(COMM[i].sym + '  ' + Math.floor(c.metal) + ' x $' + fmt(price(i)) + ' = ' + money(c.metal * price(i))); });
      setTip(el.cash, 'CASH\nMoney you can spend on levels, research and unlocks. You earn it by selling what you produce.\nINCOME (LAST MINUTE): ' + money(incomeRate()) + '/s\nEARNED THIS RUN: ' + money(S.run));
      setTip(el.stock, 'STOCK\nUnsold goods in your warehouse, valued at current market prices.\n' + (lines.length ? lines.join('\n') : 'NOTHING IN STORAGE.'));
      setTip(el.net, 'NET WORTH\nCash + stock + bitcoin.\nCASH  ' + money(S.cash) + '\nSTOCK  ' + money(stock) + '\nBITCOIN  ' + money(btcValue()) + '\nSHARE BONUS  +' + 10 * S.sharesTotal + '%');
    }

    const sparkText = c => c.h.map(x => SPARK[clamp(Math.round((x + 0.3) / 0.6 * 7), 0, 7)]).join('');

    function render() {
      let stock = 0;
      S.c.forEach((c, i) => { if (c.u) stock += c.metal * price(i); });
      setT(el.cash, money(S.cash));
      setT(el.stock, money(stock));
      setT(el.net, money(S.cash + stock + btcValue()));
      updateTips(stock);

      if (S.outage > 0) setT(el.status, 'POWER OUTAGE: MINES OFFLINE ' + Math.ceil(S.outage) + 's');
      else if (S.boost) setT(el.status, 'RICH VEIN: ' + COMM[S.boost.i].sym + ' ORE x2 FOR ' + Math.ceil(S.boost.t) + 's');
      else if (lastNews && S.clock - lastNews.at < 45) setT(el.status, lastNews.m);
      else setT(el.status, 'ALL SYSTEMS NOMINAL');
      el.status.classList.toggle('bad', S.outage > 0 || !!(lastNews && S.clock - lastNews.at < 45 && /OUTAGE|SLIDE|FALLS|SOFTENS|SLIPS|DROPS|FALL\./.test(lastNews.m) && !S.boost));

      RESEARCH.forEach((d, i) => {
        const r = rrefs[i];
        const done = d.done();
        const lock = d.locked();
        setT(r.lvl, d.level());
        setT(r.lab, d.l1());
        setT(r.lab2, d.l2());
        setT(r.cost, done ? 'complete' : lock ? 'locked' : money(d.cost()));
        r.btn.disabled = done || lock || S.cash < d.cost();
      });

      renderMarkets();
      const sg = sharesGain();
      const confirming = performance.now() < confirmUntil;
      setT(bref.lvl, 'RUN ' + (S.runs + 1));
      setT(bref.run, money(S.run));
      setT(bref.sh, S.shares + ' SPARE / ' + S.sharesTotal + ' EARNED (+' + 10 * S.sharesTotal + '%)');
      setT(bref.gain, sg + (sg === 1 ? ' SHARE' : ' SHARES'));
      setT(bref.lab, confirming ? 'CONFIRM RESET' : 'RESTRUCTURE');
      setT(bref.lab2, confirming ? 'CLICK AGAIN' : '+' + sg + (sg === 1 ? ' SHARE' : ' SHARES'));
      setT(bref.cost, sg < 1 ? 'NEEDS $5M THIS RUN' : 'SELLS EVERYTHING');
      bref.btn.disabled = sg < 1;
      BOARD.forEach((d, i) => {
        const r = brefs[i];
        const l = BD(d.id);
        const done = l >= d.max;
        setT(r.lvl, 'L' + l + '/' + d.max);
        setT(r.lab, done ? 'MAXED' : d.fx(l));
        setT(r.lab2, done ? '' : '> ' + d.fx(l + 1));
        setT(r.cost, done ? 'complete' : d.cost(l) + ' SHARES');
        r.btn.disabled = done || S.shares < d.cost(l);
      });

      const mc = cap();
      const oc = mc * 2;
      S.c.forEach((c, i) => {
        const r = refs[i];
        const d = COMM[i];
        r.card.classList.toggle('locked', !c.u);
        if (!c.u) {
          setT(r.unlockc, money(d.unlock));
          r.b_unlock.disabled = S.cash < d.unlock;
          return;
        }
        const pct = (Math.exp(c.x) - 1) * 100;
        setT(r.price, '$' + price(i).toFixed(2));
        setT(r.chg, (c.dx >= 0 ? '▲ ' : '▼ ') + (pct >= 0 ? '+' : '') + pct.toFixed(0) + '%');
        r.chg.classList.toggle('dn', c.dx < 0);
        setT(r.tag, pct >= 15 ? 'HIGH' : pct <= -15 ? 'LOW' : '');
        r.tag.classList.toggle('low', pct <= -15);
        setT(r.spark, sparkText(c));
        setT(r.orebar, bar(c.ore / oc, 14));
        setT(r.oreval, Math.floor(c.ore) + '/' + oc);
        setTrend(r.oretr, c.eo, oc);
        setTrend(r.mettr, c.em, mc);
        setT(r.metbar, bar(c.metal / mc, 14));
        setT(r.metval, c.metal >= mc - 0.01 ? 'FULL' : Math.floor(c.metal) + '/' + mc);
        const pm = plan(i, 'mine');
        const ps = plan(i, 'smelt');
        const mm = lvlMult(c.ml);
        const sm = lvlMult(c.sl);
        setT(r.minel, d.mn + ' L' + c.ml + (mm > 1 ? ' x' + mm : ''));
        setT(r.miner, '+' + fmt(mineBase(i) + rigOre(i)) + '/s');
        setT(r.minec, (pm.n > 1 ? '+' + pm.n + ' ' : '') + money(pm.cost));
        r.b_mine.disabled = S.cash < pm.cost;
        setT(r.smeltl, d.pr + ' L' + c.sl + (sm > 1 ? ' x' + sm : ''));
        setT(r.smeltr, fmt(smeltRate(i)) + '/s');
        setT(r.smeltc, (ps.n > 1 ? '+' + ps.n + ' ' : '') + money(ps.cost));
        r.b_smelt.disabled = S.cash < ps.cost;
        r.b_half.disabled = c.metal < 2;
        r.b_all.disabled = c.metal < 1;
        r.b_auto.disabled = !brokerLv();
        r.b_ovf.disabled = !brokerLv();
        setT(r.ovfl, brokerLv() ? (c.ovf ? 'WHEN FULL: SELL' : 'WHEN FULL: HOLD') : 'WHEN FULL: STOPS');
        setT(r.autol, brokerLv() ? (AUTO[c.auto] ? 'SELL ≥ ' + AUTO[c.auto].toFixed(2) + 'x BASE' : 'AUTO-SELL: OFF') : 'AUTO-SELL: NEEDS BROKER');
        let outlook = '';
        if (RS('intel')) {
          const tg = d.amp * Math.sin(2 * Math.PI * S.clock / d.period + d.phase) - c.x;
          outlook = 'OUTLOOK: ' + (tg > 0.03 ? 'RISING' : tg < -0.03 ? 'FALLING' : 'STEADY');
        }
        setT(r.out, outlook);
      });

      const musicOn = Snd.on || wakeArmed;
      setT(el.tmus, '♪ ' + (musicOn ? 'ON' : 'OFF'));
      el.tmus.classList.toggle('on', musicOn);
      el.tmus.setAttribute('aria-pressed', musicOn ? 'true' : 'false');
      const ttl = Snd.on && Snd.tr ? 'NOW PLAYING: ' + Snd.tr.name : '';
      if (el.tmus.title !== ttl) el.tmus.title = ttl;
    }

    function applyTheme() {
      document.documentElement.dataset.p = S.phos;
      const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      const m = document.querySelector('meta[name="theme-color"]');
      if (m && bg) m.setAttribute('content', bg);
    }

    function digOnce(i) {
      const c = S.c[i];
      if (!c || !c.u) return 0;
      const room = cap() * 2 - c.ore;
      if (room <= 0) return 0;
      const n = Math.min(tapYield(i), room);
      c.ore += n;
      return n;
    }

    const BUYQ = [1, 10, 25, 'max'];
    let buyQ = 0;

    function plan(i, kind) {
      const c = S.c[i];
      const d = COMM[i];
      const l = kind === 'mine' ? c.ml : c.sl;
      const q = BUYQ[buyQ];
      let cost = 0;
      let n = 0;
      if (q === 'max') {
        while (n < 1000) {
          const k = lvlCost(d, kind, l + n);
          if (cost + k > S.cash) break;
          cost += k;
          n++;
        }
        if (n === 0) { cost = lvlCost(d, kind, l); n = 1; }
      } else {
        for (; n < q; n++) cost += lvlCost(d, kind, l + n);
      }
      return { n, cost };
    }

    function buyLevel(i, kind) {
      const c = S.c[i];
      if (!c.u) return 0;
      const pl = plan(i, kind);
      if (S.cash < pl.cost) return 0;
      S.cash -= pl.cost;
      if (kind === 'mine') c.ml += pl.n; else c.sl += pl.n;
      return pl.cost;
    }

    function restructure() {
      const g = sharesGain();
      if (g < 1) return;
      S.shares += g;
      S.sharesTotal += g;
      S.runs++;
      S.cash = BD('seed') ? 2000 * Math.pow(5, BD('seed') - 1) : 0;
      S.wl = 0;
      S.rs = BD('foreman') ? { broker: 1 } : {};
      S.run = 0;
      incHist.length = 0;
      S.btc.amt = 0;
      S.btc.cost = 0;
      S.btc.ord = null;
      S.outage = 0;
      S.boost = null;
      S.nextEvent = S.clock + 25;
      S.milestone = 0;
      S.c = COMM.map(freshComm);
      S.c[0].u = true;
      for (let i = 1; i <= BD('fast') && i < COMM.length; i++) S.c[i].u = true;
      log('RESTRUCTURED. +' + g + (g === 1 ? ' SHARE' : ' SHARES') + '. ALL INCOME IS NOW +' + 10 * S.sharesTotal + '%.');
      Snd.sfx('unlock');
      save();
    }

    function unlockComm(i) {
      const c = S.c[i];
      if (c.u || S.cash < COMM[i].unlock) return false;
      S.cash -= COMM[i].unlock;
      c.u = true;
      log(COMM[i].sym + ' DESK OPENED.');
      Snd.sfx('unlock');
      return true;
    }

    function buyResearch(id) {
      const d = RESEARCH.find(x => x.id === id);
      if (!d || d.done() || S.cash < d.cost()) return false;
      S.cash -= d.cost();
      d.buy();
      return true;
    }

    const CMDS = {
      help() {
        S.helped = true;
        print([
          'commands:',
          '  help               this list',
          '  clear              clear the screen',
          '  color [name]       green, amber, ice',
          '  music on|off|next|vol <0-100>',
          '  reset              permanently delete all game data'
        ].join('\n'), 'd');
      },
      color(a) {
        const v = (a[0] || '').toLowerCase();
        if (!v) { print('current: ' + S.phos + '. options: ' + PHOS.join(', ') + '.'); return; }
        const p = PHOS.find(x => x.startsWith(v));
        if (!p) { print('options: ' + PHOS.join(', ') + '.', 'd'); Snd.sfx('err'); return; }
        S.phos = p;
        applyTheme();
        save();
        print('color set to ' + p + '.');
      },
      music(a) {
        const v = (a[0] || '').toLowerCase();
        if (v === 'vol' || v === 'volume') {
          if (a[1] === undefined || isNaN(parseInt(a[1], 10))) { print('volume: ' + Math.round(Snd.vol * 100) + '. use: music vol <0-100>'); return; }
          Snd.setVol(clamp(parseInt(a[1], 10), 0, 100) / 100);
          print('volume set to ' + Math.round(Snd.vol * 100) + '.');
          return;
        }
        if (v === 'on') {
          disarmWake();
          if (!Snd.setOn(true)) { print('audio is not available in this browser.'); return; }
          print('music on. volume ' + Math.round(Snd.vol * 100) + '.');
          return;
        }
        if (v === 'next' || v === 'skip') {
          if (!Snd.on) { print('music is off. use: music on'); return; }
          Snd.next();
          print('switching track.');
          return;
        }
        if (v === 'off') {
          disarmWake();
          Snd.setOn(false);
          print('music off.');
          return;
        }
        print('music is ' + (Snd.on || wakeArmed ? 'on' : 'off') + (Snd.on && Snd.tr ? ', playing ' + Snd.tr.name : '') + '. use: music on|off|next|vol <0-100>');
      },
      clear() {
        el.tout.textContent = '';
      },
      reset() {
        resetStage = true;
        print([
          'WARNING: this permanently deletes ALL game data:',
          'cash, desks, research, shares, board perks and your bitcoin position.',
          'there is no undo.',
          'to continue, type exactly: ' + RESET_PHRASE,
          'anything else cancels.'
        ].join('\n'), 'w');
      }
    };
    const RESET_PHRASE = 'DELETE ALL MY GAME DATA';
    let resetStage = false;

    function wipeData() {
      wiped = true;
      store.remove(KEY);
      print('all game data deleted. restarting...', 'w');
      setTimeout(() => location.reload(), 900);
    }

    function runCommand(line) {
      if (resetStage) {
        resetStage = false;
        if (line.trim().toUpperCase().replace(/\s+/g, ' ') === RESET_PHRASE) wipeData();
        else print('reset cancelled. nothing was deleted.');
        return;
      }
      const parts = line.trim().split(/\s+/);
      const name = parts.shift().toLowerCase();
      const fn = Object.prototype.hasOwnProperty.call(CMDS, name) ? CMDS[name] : null;
      if (!fn) { print('unknown command: ' + name + '. ' + HINT, 'd'); Snd.sfx('err'); return; }
      fn(parts);
    }

    const history = [];
    let hpos = 0;

    function initTerminal() {
      el.tform.addEventListener('submit', e => {
        e.preventDefault();
        const v = el.tin.value.trim();
        el.tin.value = '';
        if (!v) return;
        history.push(v);
        hpos = history.length;
        const d = document.createElement('div');
        d.className = 'c';
        d.textContent = 'ironline> ' + v;
        el.tout.appendChild(d);
        runCommand(v);
        el.tout.scrollTop = el.tout.scrollHeight;
        render();
      });
      el.tin.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (hpos > 0) hpos--;
          el.tin.value = history[hpos] || '';
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (hpos < history.length) hpos++;
          el.tin.value = history[hpos] || '';
        } else if (e.key === 'Tab') {
          e.preventDefault();
          const v = el.tin.value;
          if (v && v.indexOf(' ') < 0) {
            const m = Object.keys(CMDS).filter(k => k.startsWith(v.toLowerCase()) && k.length > 1);
            if (m.length === 1) el.tin.value = m[0] + ' ';
          }
        }
      });
      if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
        el.tout.addEventListener('click', () => { if (!String(window.getSelection()).length) el.tin.focus({ preventScroll: true }); });
      }
    }

    let holdTimer = null;
    let holdBtn = null;

    function stopHold() {
      if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
      if (holdBtn) { holdBtn.classList.remove('press'); holdBtn = null; }
    }

    function startHold(i, btn) {
      stopHold();
      holdBtn = btn;
      btn.classList.add('press');
      digOnce(i);
      holdTimer = setInterval(() => { digOnce(i); render(); }, 130);
      render();
    }

    let tab = 'ops';

    function setTab(t) {
      tab = t;
      $('cards').hidden = t !== 'ops';
      $('research').hidden = t !== 'res';
      $('markets').hidden = t !== 'mk';
      $('board').hidden = t !== 'bd';
      $('opsbar').hidden = t !== 'ops';
      if (t === 'mk') {
        renderMarkets();
        drawChart();
        if (!BTC.busy && Date.now() - BTC.at > 20000) btcRefresh();
      }
      ['ops', 'res', 'mk', 'bd'].forEach(k => $('tab-' + k).setAttribute('aria-selected', k === t ? 'true' : 'false'));
    }

    function bindUI() {
      const cardsEl = $('cards');
      cardsEl.addEventListener('pointerdown', e => {
        const b = e.target.closest('button[data-act="dig"]');
        if (!b) return;
        startHold(Number(b.closest('.card').dataset.i), b);
      });
      ['pointerup', 'pointercancel', 'blur'].forEach(ev => window.addEventListener(ev, stopHold));
      document.addEventListener('contextmenu', e => { if (e.target.closest('button')) e.preventDefault(); });

      cardsEl.addEventListener('click', e => {
        const b = e.target.closest('button[data-act]');
        if (!b || b.disabled) return;
        const i = Number(b.closest('.card').dataset.i);
        const act = b.dataset.act;
        if (act === 'dig') {
          if (e.detail === 0) digOnce(i);
        } else if (act === 'mine' || act === 'smelt') {
          if (buyLevel(i, act)) Snd.sfx('buy');
        } else if (act === 'half' || act === 'all') {
          const r = sell(i, act === 'all' ? 1 : 0.5);
          if (r) {
            log('SOLD ' + Math.floor(r.n) + ' ' + COMM[i].sym + ' @ $' + r.p.toFixed(2) + ' = ' + money(r.gain));
            Snd.sfx('sell');
          }
        } else if (act === 'auto') {
          const c = S.c[i];
          const al = brokerLv() >= 2 ? AUTO.map((v, k) => k) : AUTO_JUNIOR;
          c.auto = al[(al.indexOf(c.auto) + 1) % al.length];
        } else if (act === 'ovf') {
          S.c[i].ovf = !S.c[i].ovf;
        } else if (act === 'unlock') {
          unlockComm(i);
        }
        render();
      });

      $('research').addEventListener('click', e => {
        const b = e.target.closest('button[data-act="research"]');
        if (!b || b.disabled) return;
        buyResearch(b.closest('.card').dataset.id);
        render();
      });

      $('board').addEventListener('click', e => {
        const b = e.target.closest('button[data-act]');
        if (!b || b.disabled) return;
        if (b.dataset.act === 'restructure') {
          if (performance.now() < confirmUntil) {
            confirmUntil = 0;
            restructure();
          } else {
            confirmUntil = performance.now() + 5000;
          }
        } else {
          const id = b.closest('.card').dataset.id;
          const d = BOARD.find(x => x.id === id);
          const l = BD(id);
          if (d && l < d.max && S.shares >= d.cost(l)) {
            S.shares -= d.cost(l);
            S.bd[id] = l + 1;
            log(d.name + ' UPGRADED TO L' + (l + 1) + '.');
            Snd.sfx('unlock');
          }
        }
        render();
      });

      $('markets').addEventListener('click', e => {
        const r = e.target.closest('[data-rng]');
        if (r) {
          BTC.range = r.dataset.rng;
          BTC.pts = [];
          BTC.hover = -1;
          saveChartPrefs();
          renderMarkets();
          drawChart();
          btcRefresh();
          return;
        }
        const ct = e.target.closest('[data-ct]');
        if (ct) { BTC.type = ct.dataset.ct; saveChartPrefs(); renderMarkets(); drawChart(); return; }
        if (e.target.closest('[data-ma]')) { BTC.ma = !BTC.ma; saveChartPrefs(); renderMarkets(); drawChart(); return; }
        const os = e.target.closest('[data-os]');
        if (os) { OF.side = os.dataset.os; renderMarkets(); return; }
        const oa = e.target.closest('[data-oa]');
        if (oa) { OF.amt = Number(oa.dataset.oa); renderMarkets(); return; }
        const b = e.target.closest('[data-mk]');
        if (!b || b.disabled) return;
        const k = b.dataset.mk;
        if (k === 'place') {
          placeOrder();
        } else if (k === 'cancel') {
          S.btc.ord = null;
          log('LIMIT ORDER CANCELLED.');
        } else if (k[0] === 'b') {
          btcBuy(Number(k.slice(1)) / 100);
        } else {
          btcSell(Number(k.slice(1)) / 100);
        }
        render();
        renderMarkets();
        drawChart();
      });
      mref.cv.addEventListener('pointermove', e => hoverAt(e.clientX));
      mref.cv.addEventListener('pointerdown', e => hoverAt(e.clientX));
      mref.cv.addEventListener('pointerleave', hoverEnd);
      window.addEventListener('resize', drawChart);
      setInterval(() => { if (!document.hidden && (tab === 'mk' || S.btc.amt > 0 || S.btc.ord)) btcRefresh(); }, 30000);

      $('tbuy').addEventListener('click', e => {
        const b = e.target.closest('button[data-q]');
        if (!b) return;
        buyQ = Number(b.dataset.q);
        $('tbuy').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        render();
      });

      document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

      el.tmus.addEventListener('click', () => {
        if (Snd.on || wakeArmed) {
          disarmWake();
          Snd.setOn(false);
          print('music off.');
        } else if (Snd.setOn(true)) {
          print('music on. volume ' + Math.round(Snd.vol * 100) + '.');
        } else {
          print('audio is not available in this browser.');
        }
        render();
      });
    }

    let wakeArmed = false;
    const WAKE_EVENTS = ['pointerup', 'click', 'keydown', 'touchend'];

    function wake(e) {
      if (e && e.target && e.target.closest && e.target.closest('#tmus')) return;
      if (!Snd.on) Snd.setOn(true); else Snd.kick();
      render();
      setTimeout(() => {
        if (Snd.ctx && Snd.ctx.state === 'running') disarmWake();
        render();
      }, 400);
    }

    function armWake() {
      if (wakeArmed) return;
      wakeArmed = true;
      WAKE_EVENTS.forEach(ev => window.addEventListener(ev, wake, true));
    }

    function disarmWake() {
      if (!wakeArmed) return;
      wakeArmed = false;
      WAKE_EVENTS.forEach(ev => window.removeEventListener(ev, wake, true));
    }

    function bootLog() {
      print('IRONLINE TERMINAL ONLINE.', 'c');
      print('tap DIG on a desk to mine ore, then sell the metal when the price is HIGH.', 'd');
      print(HINT, 'd');
    }

    let last = Date.now();
    let renderAcc = 0;
    let saveAcc = 0;
    let hintAcc = 0;

    function frame() {
      const now = Date.now();
      let dt = Math.max(0, (now - last) / 1000);
      last = now;
      if (dt > 5) { away(dt); dt = 0; } else step(dt);
      trackTrend(dt);
      trackIncome(dt);
      renderAcc += dt;
      saveAcc += dt;
      hintAcc += dt;
      if (renderAcc >= 0.2 || dt === 0) { renderAcc = 0; render(); }
      if (saveAcc >= 5) { saveAcc = 0; save(); }
      if (hintAcc >= 90) {
        hintAcc = 0;
        if (!S.helped) print(HINT, 'd');
      }
    }

    build();
    initTerminal();
    bindUI();
    applyTheme();

    const pref = (() => { try { return JSON.parse(store.get(AKEY) || 'null'); } catch (e) { return null; } })();
    if (pref && typeof pref.vol === 'number') Snd.vol = clamp(pref.vol, 0, 1);

    const gap = (Date.now() - S.t) / 1000;
    bootLog();
    if (S.resetNote) {
      print('your old save was from an earlier version and has been reset because the economy was rebalanced.', 'w');
    } else if (store.get(KEY)) {
      print('session restored.', 'd');
      if (gap > 5) away(gap);
    }
    render();

    if (!pref || pref.on) {
      armWake();
      print('music starts on your first tap. the ♪ button turns it off.', 'd');
    }

    const fsRoot = document.documentElement;
    const fsRequest = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
    const fsExit = document.exitFullscreen || document.webkitExitFullscreen;
    const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

    if (fsRequest && fsExit && document.fullscreenEnabled !== false) {
      const fsBtn = $('tfs');
      fsBtn.hidden = false;
      const fsSync = () => fsBtn.setAttribute('aria-pressed', fsActive() ? 'true' : 'false');
      fsBtn.addEventListener('click', () => {
        try {
          const r = fsActive() ? fsExit.call(document) : fsRequest.call(fsRoot);
          if (r && r.catch) r.catch(() => {});
        } catch (e) {}
      });
      document.addEventListener('fullscreenchange', fsSync);
      document.addEventListener('webkitfullscreenchange', fsSync);
    }

    setInterval(frame, 100);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        save();
        if (Snd.on && Snd.ctx) Snd.ctx.suspend();
        if (Snd.keep) Snd.keep.pause();
      } else if (Snd.on && Snd.ctx) {
        Snd.ctx.resume();
        if (Snd.keep) { const pr = Snd.keep.play(); if (pr && pr.catch) pr.catch(() => {}); }
        setTimeout(() => { if (Snd.on && Snd.ctx.state !== 'running') armWake(); }, 400);
      }
    });
    window.addEventListener('pagehide', save);
  </script>
</body>
</html>

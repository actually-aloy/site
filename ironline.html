<!doctype html>
<html lang="en" data-p="green">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020a05">
  <title>Ironline</title>
  <meta name="description" content="Ironline: a mining and trading tycoon on an old CRT terminal. Dig ore, refine it, and sell into a moving market.">
  <link rel="canonical" href="https://actually-aloy.github.io/site/ironline">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ironline">
  <meta property="og:description" content="A mining and trading tycoon on an old CRT terminal. Dig ore, refine it, and time the market.">
  <meta property="og:url" content="https://actually-aloy.github.io/site/ironline">
  <meta property="og:image" content="https://actually-aloy.github.io/site/ironline-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ironline">
  <meta name="twitter:description" content="A mining and trading tycoon on an old CRT terminal. Dig ore, refine it, and time the market.">
  <meta name="twitter:image" content="https://actually-aloy.github.io/site/ironline-og.jpg">
  <link rel="icon" href="ironline-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ironline-180.png">
  <link rel="manifest" href="ironline.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020a05;
      --fg: #4dff8f;
      --warn: #ffb347;
      --dim: color-mix(in srgb, var(--fg) 55%, transparent);
      --line: color-mix(in srgb, var(--fg) 38%, transparent);
      --glow: 0 0 5px color-mix(in srgb, var(--fg) 60%, transparent), 0 0 16px color-mix(in srgb, var(--fg) 22%, transparent);
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    html[data-p="amber"] {
      --bg: #0a0600;
      --fg: #ffb000;
      --warn: #ff6a3d;
    }

    html[data-p="ice"] {
      --bg: #03080c;
      --fg: #9fe8ff;
      --warn: #ffb347;
    }

    * {
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: repeating-linear-gradient(to bottom, var(--bg) 0, var(--bg) 2px, color-mix(in srgb, var(--fg) 14%, var(--bg)) 2px, color-mix(in srgb, var(--fg) 14%, var(--bg)) 3px);
      border-left: 1px solid var(--line);
    }

    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--fg) 45%, var(--bg));
      border: 1px solid var(--fg);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--fg);
    }

    ::-webkit-scrollbar-corner {
      background: var(--bg);
    }

    @supports not selector(::-webkit-scrollbar) {
      html,
      #tout {
        scrollbar-width: thin;
        scrollbar-color: var(--fg) var(--bg);
      }
    }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.26) 0, rgba(0, 0, 0, 0.26) 1px, transparent 1px, transparent 3px);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 51;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    .screen {
      max-width: 1020px;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      text-shadow: var(--glow);
      animation: flick 7s infinite;
    }

    @keyframes flick {
      0%, 100% { opacity: 1; }
      46% { opacity: 1; }
      48% { opacity: 0.955; }
      50% { opacity: 0.99; }
      52% { opacity: 0.965; }
    }

    button {
      font: inherit;
      color: inherit;
      text-shadow: inherit;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.16em;
      min-width: 0;
    }

    .brand small {
      display: block;
      color: var(--dim);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
    }

    .cursor {
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .top-btns {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .back {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-decoration: none;
      cursor: pointer;
    }

    .back.on {
      border-color: var(--fg);
    }

    .mpill {
      position: relative;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      transition: border-color 0.2s;
    }

    .mpill.on {
      border-color: var(--fg);
    }

    .mpill .back {
      min-width: 40px;
      justify-content: center;
      border: 0;
    }

    .meq {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      width: 14px;
      height: 12px;
    }

    .meq i {
      flex: 1;
      height: 100%;
      background: currentColor;
      transform: scaleY(0.25);
      transform-origin: bottom;
      transition: transform 0.25s;
    }

    .mpill.on .meq i {
      animation: meq 0.9s ease-in-out infinite;
    }

    .mpill.on .meq i:nth-child(2) {
      animation-duration: 0.7s;
      animation-delay: -0.3s;
    }

    .mpill.on .meq i:nth-child(3) {
      animation-duration: 1.1s;
      animation-delay: -0.6s;
    }

    @keyframes meq {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1); }
    }

    .mpill .more {
      display: none;
      min-width: 26px;
      padding: 0;
      border-left: 1px solid var(--line);
      place-items: center;
    }

    .more svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s;
    }

    .mpill.open .more svg {
      transform: rotate(180deg);
    }

    .vol {
      max-width: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-width 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s;
    }

    .mpill.on .vol {
      max-width: 96px;
      opacity: 1;
    }

    @property --p {
      syntax: "<percentage>";
      inherits: true;
      initial-value: 0%;
    }

    .vol .slide {
      width: 72px;
      margin: 0 12px 0 0;
    }

    .slide {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      height: 38px;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
      --p: 0%;
      transition: --p 0.3s ease;
    }

    .slide.drag {
      transition: none;
    }

    .mpill.on .slide {
      animation: vglow 2.6s ease-in-out infinite;
    }

    @keyframes vglow {
      0%, 100% { filter: drop-shadow(0 0 0 transparent); }
      50% { filter: drop-shadow(0 0 5px var(--fg)); }
    }

    .slide::-webkit-slider-runnable-track {
      height: 5px;
      background: linear-gradient(90deg, var(--fg) var(--p), var(--line) var(--p));
    }

    .slide::-moz-range-track {
      height: 5px;
      background: linear-gradient(90deg, var(--fg) var(--p), var(--line) var(--p));
    }

    .slide::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 18px;
      margin-top: -6.5px;
      border: 0;
      border-radius: 0;
      background: var(--fg);
      box-shadow: 0 0 8px var(--fg);
      transition: transform 0.15s;
    }

    .slide::-moz-range-thumb {
      width: 10px;
      height: 18px;
      border: 0;
      border-radius: 0;
      background: var(--fg);
      box-shadow: 0 0 8px var(--fg);
      transition: transform 0.15s;
    }

    .slide:hover::-webkit-slider-thumb,
    .slide:hover::-moz-range-thumb {
      transform: scale(1.2);
    }

    .slide:active::-webkit-slider-thumb,
    .slide:active::-moz-range-thumb {
      transform: scale(1.4);
    }

    .slide:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: -3px;
    }

    @media (max-width: 520px) {
      .mpill.on .more {
        display: grid;
      }

      .mpill .vol,
      .mpill.on .vol {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 70;
        max-width: none;
        border: 1px solid var(--fg);
        background: var(--bg);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition: opacity 0.2s, transform 0.2s;
      }

      .mpill.open .vol {
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .vol .slide,
      .mpill .vol .slide {
        width: 140px;
        margin: 0 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mpill.on .meq i,
      .mpill.on .slide,
      .dots {
        animation: none;
      }
    }

    #tfs[hidden] {
      display: none;
    }

    #tfs svg {
      width: 18px;
      height: 18px;
    }

    #tfs .fs-out,
    #tfs[aria-pressed="true"] .fs-in {
      display: none;
    }

    #tfs[aria-pressed="true"] .fs-out {
      display: block;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0 8px;
    }

    .hud > div {
      position: relative;
      padding: 8px 10px;
      border: 1px solid var(--line);
      min-width: 0;
      cursor: help;
      outline: none;
    }

    .hud > div::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 30;
      width: max-content;
      max-width: min(300px, 88vw);
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--fg);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-line;
      text-shadow: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s;
    }

    .hud > div:nth-child(2)::after {
      left: 50%;
      transform: translateX(-50%);
    }

    .hud > div:nth-child(3)::after {
      left: auto;
      right: 0;
    }

    .hud > div:hover::after,
    .hud > div:focus::after {
      opacity: 1;
    }

    .hud > div:focus {
      border-color: var(--fg);
    }

    .hud span {
      display: block;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .hud b {
      display: block;
      font-size: 18px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brandcol {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }

    .savebtn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.15s;
    }

    .savebtn i {
      flex: 0 0 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--fg);
      box-shadow: 0 0 6px var(--fg);
    }

    .savebtn:hover {
      color: var(--fg);
    }

    .savebtn.bad {
      color: var(--warn);
    }

    .savebtn.bad i {
      background: var(--warn);
      box-shadow: 0 0 6px var(--warn);
    }

    .savebtn.flash i {
      animation: sflash 0.6s ease-out;
    }

    @keyframes sflash {
      0% { transform: scale(2.4); }
      100% { transform: scale(1); }
    }

    .status {
      margin: 0 0 10px;
      min-height: 2.9em;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .status.bad {
      color: var(--warn);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab {
      min-height: 46px;
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--dim);
    }

    .tab[aria-selected="true"] {
      border-color: var(--fg);
      color: var(--bg);
      background: var(--fg);
      text-shadow: none;
      font-weight: 700;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .kv span:first-child {
      color: var(--dim);
      white-space: nowrap;
    }

    .kv span:last-child {
      text-align: right;
    }

    .opsbar {
      display: flex;
      align-items: stretch;
      width: fit-content;
      max-width: 100%;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .opsbar > span {
      display: flex;
      align-items: center;
      padding: 0 12px;
      color: var(--dim);
      white-space: nowrap;
    }

    .opsbar .seg {
      border: 0;
      border-left: 1px solid var(--line);
    }

    .opsbar .seg button {
      flex: 0 1 56px;
      min-width: 44px;
      min-height: 40px;
    }

    @media (max-width: 520px) {
      .opsbar {
        width: 100%;
      }

      .opsbar > span {
        padding: 0 10px;
        font-size: 11px;
      }

      .opsbar .seg {
        flex: 1;
      }

      .opsbar .seg button {
        flex: 1 1 0;
      }
    }

    .opsbar[hidden] {
      display: none;
    }

    .mk-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }

    .mk-main,
    .mk-side {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .mk-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }

    .mk-sym {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .mk-sym small {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mk-px {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.1;
      text-align: right;
      white-space: nowrap;
    }

    .mk-px small {
      display: block;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
      min-height: 1.3em;
    }

    .tf {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--line);
    }

    .tf .t {
      flex: 1 1 0;
      min-width: 0;
      min-height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    .tf .t:hover {
      color: var(--fg);
    }

    .tf .t[aria-pressed="true"] {
      color: var(--fg);
      background: color-mix(in srgb, var(--fg) 12%, transparent);
      box-shadow: inset 0 -2px 0 var(--fg);
    }

    .tf .sep {
      flex: 0 0 1px;
      margin: 8px 0;
      background: var(--line);
    }

    .tf.ot .t {
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .mk-chart {
      position: relative;
      height: 280px;
      border: 1px solid var(--line);
    }

    .mk-chart canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
    }

    .mk-leg {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 100px;
      height: 16px;
      font-size: 10px;
      line-height: 16px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .mk-tools {
      position: absolute;
      top: 4px;
      right: 8px;
      display: flex;
      gap: 6px;
    }

    .mk-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      min-height: 22px;
      padding: 0 8px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .mk-chip:hover,
    .mk-chip[aria-expanded="true"] {
      color: var(--fg);
      border-color: var(--fg);
    }

    .mk-chip.mk-ic {
      min-width: 28px;
      padding: 0;
    }

    .mk-ic svg {
      width: 14px;
      height: 14px;
    }

    .mk-ic[data-s="line"] .i-c,
    .mk-ic[data-s="candle"] .i-l {
      display: none;
    }

    .mk-menu {
      position: absolute;
      top: 30px;
      right: 8px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-width: 190px;
      border: 1px solid var(--fg);
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 0.15s, transform 0.15s;
    }

    .mk-menu.open {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    .mk-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      padding: 0 12px;
      border: 0;
      background: transparent;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-align: left;
      cursor: pointer;
    }

    .mk-menu button::before {
      content: "";
      flex: 0 0 11px;
      height: 11px;
      border: 1px solid currentColor;
    }

    .mk-menu button[aria-pressed="true"] {
      color: var(--fg);
    }

    .mk-menu button[aria-pressed="true"]::before {
      background: currentColor;
    }

    .mk-menu button:hover {
      background: color-mix(in srgb, var(--fg) 14%, transparent);
    }

    .mk-msg {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: 0.06em;
      color: var(--dim);
      pointer-events: none;
    }

    .mk-msg[hidden],
    .mk-msg [hidden] {
      display: none;
    }

    .mk-msg a {
      color: var(--fg);
      pointer-events: auto;
      text-decoration: underline;
    }

    .dots {
      display: inline-block;
      width: 1.4em;
      overflow: hidden;
      vertical-align: bottom;
      text-align: left;
      animation: dots 1.2s steps(4) infinite;
    }

    @keyframes dots {
      from { width: 0; }
      to { width: 1.4em; }
    }

    .mk-pos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .mk-pos > div {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      padding: 7px 10px;
      background: var(--bg);
    }

    .mk-pos span {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--dim);
    }

    .mk-pos b {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mk-note {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 11px;
      color: var(--dim);
      line-height: 1.5;
    }

    .sd button[data-os="sell"][aria-pressed="true"] {
      color: var(--warn);
      background: color-mix(in srgb, var(--warn) 14%, transparent);
      box-shadow: inset 0 -2px 0 var(--warn);
    }

    .btn.sell {
      border-color: var(--warn);
      color: var(--warn);
    }

    .kv.ctl {
      align-items: center;
      min-height: 34px;
    }

    .kv.ctl span:nth-child(2) {
      margin-left: auto;

      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;

      font-weight: 700;
      letter-spacing: 0.12em;

      align-items: center;

    .tagl {
      margin: 0;
      font-size: 12px;
      color: var(--dim);
    }

    .kvs {

      gap: 5px;

      padding-top: 8px;
      font-size: 12px;
    }

      font-size: 12px;
    }

      min-width: 0;
      overflow-wrap: anywhere;
    }

    .sact {
      display: grid;
      gap: 8px;
      margin-top: auto;
    }

    .scard.locked [data-act="buy"],
    .scard.locked [data-act="camp"],
    .scard:not(.locked) [data-act="unlock"] {
      display: none;
    }

    .amodels {
      margin-top: 14px;
      border: 1px solid var(--line);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

      color: var(--warn);

      gap: 8px;

        return getJSON('https://data-api.binance.vision' + q).then(m).catch(() => getJSON('https://api.binance.com' + q).then(m));
      } },

          .then(j => j.Data.Data.map(k => cd(k.time * 1000, k.open, k.high, k.low, k.close)));

    function cleanSeries(raw, range) {
      if (!Array.isArray(raw)) throw new Error('bad data');
      const x = RANGES[range];
      const pts = raw.filter(k => k.every(Number.isFinite))
        .map(k => [k[0], k[1], Math.max(k[1], k[2], k[3], k[4]), Math.min(k[1], k[2], k[3], k[4]), k[4]])
        .sort((a, b) => a[0] - b[0]);
      if (!pts.length) throw new Error('empty');
      const last = pts[pts.length - 1][0];
      if (Date.now() - last > x.stale || last - Date.now() > 600000) throw new Error('stale');
      const out = pts.filter(k => k[0] >= last - x.win);
      if (out.length < x.min) throw new Error('too short');
      if (out[0][0] > last - x.win * 0.8) throw new Error('short coverage');
      return out;
    }

    async function btcRefresh() {
      if (BTC.busy) { BTC.again = true; return; }
      BTC.busy = true;
      const range = BTC.range;
      const order = PROVIDERS.slice().sort((a, b) => (b.n === BTC.src) - (a.n === BTC.src));
      let done = false;
      for (const pv of order) {
        try {
          const pts = cleanSeries(await pv.get(range), range);
          BTC.cache[range] = { pts, t: Date.now() };
          if (range === BTC.range) BTC.pts = pts;
          BTC.src = pv.n;
          BTC.price = pts[pts.length - 1][4];
          BTC.at = Date.now();
          BTC.ok = true;
          S.btc.last = BTC.price;
          done = true;
          break;
        } catch (e) {}
      }
      if (!done && Date.now() - BTC.at > 180000) BTC.ok = false;
      BTC.tried = true;
      BTC.busy = false;
      BTC.err = !done && range === BTC.range;
      if (done) checkOrder();
      if (BTC.again) {
        BTC.again = false;
        btcRefresh();
      } else if (BTC.err && tab === 'mk' && !BTC.rt) {
        BTC.rt = setTimeout(() => {
          BTC.rt = 0;
          if (tab === 'mk' && !BTC.busy && BTC.pts.length < 2) btcRefresh();
        }, 5000);
      }
      renderMarkets();
      drawChart();
      render();
    }

    const fmtPx = v => v.toLocaleString('en-US', { maximumFractionDigits: v < 100 ? 2 : 0 });

    function btcBuy(frac, at, tag) {
      if (!at && !btcLive()) return;
      const p = at || BTC.price;
      const spend = S.cash * frac;
      if (spend < 1) { if (tag) log('LIMIT BUY CANCELLED: NOT ENOUGH CASH.'); return; }
      const amt = spend * (1 - BTC_FEE) / p;
      S.cash -= spend;
      S.btc.amt += amt;
      S.btc.cost += spend;
      log((tag || '') + 'BOUGHT ' + amt.toFixed(6) + ' BTC @ $' + fmtPx(p) + ' = ' + money(spend) + ' (INCL. FEE)');
      Snd.sfx('buy');
    }

    function btcSell(frac, at, tag) {
      if (!at && !btcLive()) return;
      if (S.btc.amt <= 0) { if (tag) log('LIMIT SELL CANCELLED: NO BITCOIN LEFT.'); return; }
      const p = at || BTC.price;
      const amt = frac >= 1 ? S.btc.amt : S.btc.amt * frac;
      const proceeds = amt * p * (1 - BTC_FEE);
      const basis = S.btc.cost * (amt / S.btc.amt);
      S.btc.amt = frac >= 1 ? 0 : S.btc.amt - amt;
      S.btc.cost = frac >= 1 ? 0 : S.btc.cost - basis;
      S.cash += proceeds;
      const pl = proceeds - basis;
      log((tag || '') + 'SOLD ' + amt.toFixed(6) + ' BTC @ $' + fmtPx(p) + ' = ' + money(proceeds) + ' (' + (pl >= 0 ? '+' : '-') + money(Math.abs(pl)) + ')');
      Snd.sfx('sell');
    }

      if (!isFinite(p) || p <= 0) { log('ENTER A LIMIT PRICE.'); return; }
      if (TR.side === 'buy' && p >= BTC.price) { log('A BUY LIMIT MUST BE BELOW THE MARKET PRICE. SWITCH TO MARKET FOR AN INSTANT FILL.'); return; }
      if (TR.side === 'sell' && p <= BTC.price) { log('A SELL LIMIT MUST BE ABOVE THE MARKET PRICE. SWITCH TO MARKET FOR AN INSTANT FILL.'); return; }
      S.btc.ord = { side: TR.side, price: p, frac: TR.amt / 100, t: Date.now() };
      log('LIMIT ORDER PLACED: ' + TR.side.toUpperCase() + ' ' + TR.amt + '% @ $' + fmtPx(p) + '. IT FILLS WHILE THIS PAGE IS OPEN.');

    function checkOrder() {
      const o = S.btc.ord;
      if (!o || !btcLive()) return;
      const cur = BTC.price;
      let at = 0;
      if (o.side === 'buy') {
        if (cur <= o.price) at = cur;
        else if (BTC.pts.some(k => k[0] > o.t && k[3] <= o.price)) at = o.price;
      } else if (cur >= o.price) {
        at = cur;
      } else if (BTC.pts.some(k => k[0] > o.t && k[2] >= o.price)) {
        at = o.price;
      }
      if (!at) return;
      S.btc.ord = null;
      if (o.side === 'buy') btcBuy(o.frac, at, 'LIMIT '); else btcSell(o.frac, at, 'LIMIT ');
    }

    function smaOf(pts, n) {
      const out = new Array(pts.length).fill(NaN);
      let s = 0;
      for (let i = 0; i < pts.length; i++) {
        s += pts[i][4];
        if (i >= n) s -= pts[i - n][4];
        if (i >= n - 1) out[i] = s / n;
      }
      return out;
    }

    function emaArr(v, n) {
      const out = new Array(v.length).fill(NaN);
      const k = 2 / (n + 1);
      let s0 = v.findIndex(Number.isFinite);
      if (s0 < 0 || s0 + n > v.length) return out;
      let e = 0;
      for (let i = s0; i < s0 + n; i++) e += v[i];
      e /= n;
      out[s0 + n - 1] = e;
      for (let i = s0 + n; i < v.length; i++) {
        e = v[i] * k + e * (1 - k);
        out[i] = e;
      }
      return out;
    }

    function bollOf(pts, n) {
      const m = smaOf(pts, n);
      const up = new Array(pts.length).fill(NaN);
      const dn = new Array(pts.length).fill(NaN);
      for (let i = n - 1; i < pts.length; i++) {
        let q = 0;
        for (let j = i - n + 1; j <= i; j++) q += (pts[j][4] - m[i]) * (pts[j][4] - m[i]);
        const sd = Math.sqrt(q / n);
        up[i] = m[i] + 2 * sd;
        dn[i] = m[i] - 2 * sd;
      }
      return { up, dn };
    }

    function rsiOf(pts, n) {
      const out = new Array(pts.length).fill(NaN);
      if (pts.length <= n) return out;
      let ga = 0;
      let la = 0;
      for (let i = 1; i <= n; i++) {
        const d = pts[i][4] - pts[i - 1][4];
        if (d > 0) ga += d; else la -= d;
      }
      ga /= n;
      la /= n;
      out[n] = la === 0 ? 100 : 100 - 100 / (1 + ga / la);
      for (let i = n + 1; i < pts.length; i++) {
        const d = pts[i][4] - pts[i - 1][4];
        ga = (ga * (n - 1) + (d > 0 ? d : 0)) / n;
        la = (la * (n - 1) + (d < 0 ? -d : 0)) / n;
        out[i] = la === 0 ? 100 : 100 - 100 / (1 + ga / la);
      }
      return out;
    }

    function macdOf(pts) {
      const c = pts.map(k => k[4]);
      const e12 = emaArr(c, 12);
      const e26 = emaArr(c, 26);
      const m = c.map((_, i) => (Number.isFinite(e12[i]) && Number.isFinite(e26[i]) ? e12[i] - e26[i] : NaN));
      const sg = emaArr(m, 9);
      return { m, sg, hs: m.map((v, i) => (Number.isFinite(v) && Number.isFinite(sg[i]) ? v - sg[i] : NaN)) };
    }

    function drawChart() {
      const cv = mref.cv;
      if (!cv || $('markets').hidden) return;
      const pts = BTC.pts;
      const w = cv.clientWidth;
      const h = cv.clientHeight;
      if (!w || !h) return;
      const dpr = window.devicePixelRatio || 1;
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      const g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      if (!btcLive() || pts.length < 2) return;
      const cs = getComputedStyle(document.documentElement);
      const fg = cs.getPropertyValue('--fg').trim() || '#4dff8f';
      const dim = cs.getPropertyValue('--dim').trim() || '#2f9a5a';
      const line = cs.getPropertyValue('--line').trim() || '#14532d';
      const warn = cs.getPropertyValue('--warn').trim() || '#ffb347';
      const n = pts.length;
      const candle = BTC.type === 'candle';
      const ind = BTC.ind;
      const ma = ind.ma ? smaOf(pts, MA_N) : null;
      const ema = ind.ema ? emaArr(pts.map(k => k[4]), 50) : null;
      const bb = ind.bb ? bollOf(pts, 20) : null;
      const subs = [];
      if (ind.rsi) subs.push('rsi');
      if (ind.macd) subs.push('macd');
      let lo = Infinity;
      let hi = 0;
      pts.forEach((k, i) => {
        let a = candle ? k[3] : k[4];
        let b = candle ? k[2] : k[4];
        if (bb && Number.isFinite(bb.up[i])) { a = Math.min(a, bb.dn[i]); b = Math.max(b, bb.up[i]); }
        if (a < lo) lo = a;
        if (b > hi) hi = b;
      });
      const padv = (hi - lo) * 0.08 || hi * 0.001;
      lo -= padv;
      hi += padv;
      const L = 8;
      const R = 62;
      const T = 32;
      const B = 22;
      const SH = 54;
      const PB = h - B - subs.length * SH;
      const pw = w - L - R;
      const X = i => L + (i + 0.5) / n * pw;
      const Y = v => T + (1 - (v - lo) / (hi - lo)) * (PB - T);
      g.font = '11px "IBM Plex Mono", ui-monospace, monospace';
      g.textBaseline = 'middle';
      g.lineWidth = 1;
      for (let k = 0; k <= 4; k++) {
        const v = lo + (hi - lo) * k / 4;
        const y = Math.round(Y(v)) + 0.5;
        g.strokeStyle = line;
        g.setLineDash([3, 5]);
        g.beginPath();
        g.moveTo(L, y);
        g.lineTo(w - R, y);
        g.stroke();
        g.setLineDash([]);
        g.fillStyle = dim;
        g.textAlign = 'left';
        g.fillText(fmtPx(v), w - R + 6, y);
      }
      if (candle) {
        const bw = clamp(Math.floor(pw / n * 0.7), 1, 14);
        pts.forEach((k, i) => {
          const x = Math.round(X(i));
          const up = k[4] >= k[1];
          g.strokeStyle = g.fillStyle = up ? fg : warn;
          g.lineWidth = 1;
          g.beginPath();
          g.moveTo(x + 0.5, Y(k[2]));
          g.lineTo(x + 0.5, Y(k[3]));
          g.stroke();
          const top = Y(Math.max(k[1], k[4]));
          g.fillRect(Math.round(x - bw / 2), top, bw, Math.max(1, Y(Math.min(k[1], k[4])) - top));
        });
      } else {
        const grad = g.createLinearGradient(0, T, 0, PB);
        grad.addColorStop(0, fg + '44');
        grad.addColorStop(1, fg + '00');
        g.beginPath();
        pts.forEach((k, i) => { if (i) g.lineTo(X(i), Y(k[4])); else g.moveTo(X(i), Y(k[4])); });
        g.lineTo(X(n - 1), PB);
        g.lineTo(X(0), PB);
        g.closePath();
        g.fillStyle = grad;
        g.fill();
        g.beginPath();
        pts.forEach((k, i) => { if (i) g.lineTo(X(i), Y(k[4])); else g.moveTo(X(i), Y(k[4])); });
        g.strokeStyle = fg;
        g.lineWidth = 1.6;
        g.lineJoin = 'round';
        g.shadowColor = fg;
        g.shadowBlur = 6;
        g.stroke();
        g.shadowBlur = 0;
        g.fillStyle = fg;
        g.beginPath();
        g.arc(X(n - 1), Y(pts[n - 1][4]), 3, 0, Math.PI * 2);
        g.fill();
      }
      const trace = (arr, col, lw, dash, yf) => {
        g.beginPath();
        let started = false;
        arr.forEach((v, i) => {
          if (!Number.isFinite(v)) return;
          if (started) g.lineTo(X(i), yf(v)); else { g.moveTo(X(i), yf(v)); started = true; }
        });
        g.strokeStyle = col;
        g.lineWidth = lw;
        g.setLineDash(dash);

            a.setAttribute('playsinline', '');
            this.keep = a;
          }
          const pr = this.keep.play();
          if (pr && pr.catch) pr.catch(() => {});
        } catch (e) {}
      },
      kick() {
        if (!this.ctx) return;

        if (this.ctx.state !== 'running') this.ctx.resume();
      },
      apply() {
        if (!this.ctx) return;
        this.master.gain.setTargetAtTime(this.on ? this.vol : 0, this.ctx.currentTime, 0.25);
      },
      setOn(v) {
        if (v && !this.init()) { this.on = false; return false; }
        this.on = !!v;
        if (this.on) {
          this.unlock();
          if (this.ctx.state !== 'running') this.ctx.resume();
          if (!this.timer) {
            this.nextT = this.ctx.currentTime + 0.1;
            this.timer = setInterval(() => this.pump(), 40);
          }
        } else if (this.timer) {
          clearInterval(this.timer);

          if (this.keep) this.keep.pause();

    const ARM_DELAY = 3;
    const svLv = k => { const s = S.sv[k]; return s && s.u ? s.l : 0; };

    const hasAi = id => !!S.ai[id];
    const aiPerk = (id, v) => (hasAi(id) ? v * aiEff() : 0);
    const AKI = PROD.findIndex(d => d.id === 'AK');
    const secL = () => svLv(SVC.sec);
    const secBlock = () => clamp(1 - Math.pow(0.94, secL()), 0, 0.95);

    const discount = () => 1 - 0.25 * (1 - Math.exp(-svLv(SVC.fin) / 25));
    const svRevAt = (k, l) => (l ? SERV[k].rev * l * shareMult() * (k === SVC.ai ? aiEff() : 1) : 0);
    const svRev = k => svRevAt(k, svLv(k));
    const svIncome = () => SERV.reduce((a, d, k) => a + svRev(k), 0);
    const svCost = (k, l) => (SERV[k].ak ? Math.ceil(SERV[k].cost * Math.pow(1.12, l)) : Math.ceil(SERV[k].cost * Math.pow(1.15, l) * discount()));
    const svReq = k => {
      if (k === SVC.ai && svLv(SVC.cloud) < 3) return 'NEEDS CLOUD HOSTING L3';
      if (k === SVC.sec && !S.p[AKI].u) return 'NEEDS AK-47 PLANT';

    const leanMult = () => 1 - 0.08 * RS('lean');

    const pRateBase = i => { const p = S.p[i]; return p.ln * PROD[i].line.rate * lvlMult(p.ln) * (1 + 0.25 * RS('auto')) * opsMult(); };
    const pRate = i => pRateBase(i) * (S.outage > 0 ? 0 : 1);
    const pLineCost = (i, l) => Math.ceil(PROD[i].line.cost * Math.pow(1.15, l) * discount());
    const pTierCost = i => PROD[i].unlock * PTC[S.p[i].tk + 1];
    const pReqs = i => PROD[i].cin.filter(([c]) => !S.c[c].u).map(([c]) => COMM[c].sym + ' DESK')
      .concat(PROD[i].pin.filter(([j]) => !S.p[j].u).map(([j]) => PROD[j].name + ' PLANT'));

    function pInputCost(i) {

      PROD[i].pin.forEach(([j, q]) => { v += q * lm * pPrice(j); });

    const nq = q => String(+q.toPrecision(2));

        .concat(PROD[i].pin.map(([j, q]) => nq(q * lm) + ' ' + PROD[j].name));

    const fmtPrice = v => (v < 100 ? v.toFixed(2) : v < 1000 ? v.toFixed(1) : Math.round(v).toLocaleString('en-US'));
    const fmtStock = v => (v < 0.095 ? v.toFixed(3) : v < 1 ? v.toFixed(2) : v < 10 ? v.toFixed(1) : String(Math.floor(v)));
    const fmtRate = v => {

    function stockValue() {

    function feedNeed(kind, idx) {
      let n = 0;
      const lm = leanMult();
      PROD.forEach((d, j) => {
        const p = S.p[j];
        if (!p.u || !p.on || p.ln < 1) return;
        (kind === 'c' ? d.cin : d.pin).forEach(([k, q]) => { if (k === idx) n += pRateBase(j) * q * lm * 8; });

      if (kind === 'p' && idx === AKI && S.sv[SVC.sec].u) n += svCost(SVC.sec, S.sv[SVC.sec].l);

    function tickFactories(dt) {
      const lm = leanMult();
      for (let i = 0; i < PROD.length; i++) {
        const mc = pCap(i);
        const d = PROD[i];
        const p = S.p[i];
        if (!p.u) continue;
        if (!p.on || p.ln < 1) { p.st = p.on ? 'IDLE' : 'PAUSED'; p.fl = 0; continue; }
        const want = pRate(i) * dt;
        if (want <= 0) { p.st = 'OFFLINE'; p.fl = 0; continue; }
        let out = want;
        let st = 'RUNNING';
        let why = '';
        const room = mc - p.stock;
        if (room < out) { out = Math.max(0, room); st = 'FULL'; }
        for (let n = 0; n < d.cin.length; n++) {
          const a = S.c[d.cin[n][0]].metal / (d.cin[n][1] * lm);
          if (a < out) { out = a; st = 'STARVED'; why = COMM[d.cin[n][0]].sym; }
        }
        for (let n = 0; n < d.pin.length; n++) {
          const a = S.p[d.pin[n][0]].stock / (d.pin[n][1] * lm);
          if (a < out) { out = a; st = 'STARVED'; why = PROD[d.pin[n][0]].name; }
        }
        if (out > 0) {
          d.cin.forEach(([c, q]) => { S.c[c].metal = Math.max(0, S.c[c].metal - out * q * lm); });
          d.pin.forEach(([j, q]) => { S.p[j].stock = Math.max(0, S.p[j].stock - out * q * lm); });
          p.stock += out;
        }
        if (st === 'STARVED' && out >= want * 0.5) st = 'LIMITED';
        p.st = st;
        p.why = why;
        p.fl += (out / dt - p.fl) * Math.min(1, dt * 2);
        if (TRK) {
          TRK.made[i] += out;
          if (st === 'STARVED') TRK.starve[i] += dt;
          else if (st === 'FULL') TRK.fullp[i] += dt;
        }
      }
    }

    function sellProd(i, frac, keep) {
      const p = S.p[i];
      const have = Math.max(0, p.stock - (keep || 0));
      const n = frac >= 1 ? have : Math.floor(have * frac * 100) / 100;
      if (n <= 0) return null;
      const p0 = pPrice(i);
      const k = 0.08 / (PROD[i].liq * impactDiv());
      const f = k * n < 1e-6 ? 1 : (1 - Math.exp(-k * n)) / (k * n);
      const pr = p0 * f;
      const gain = n * pr * shareMult();
      p.stock -= n;
      S.cash += gain;
      S.earned += gain;
      S.run += gain;
      p.x = Math.max(-0.8, p.x - k * n);
      return { n, p: pr, gain };
    }

    function planGen(costAt, l) {
      const q = BUYQ[buyQ];
      let cost = 0;
      let n = 0;
      if (q === 'max') {
        while (n < 1000) {
          const k = costAt(l + n);
          if (cost + k > S.cash) break;
          cost += k;
          n++;
        }
        if (n === 0) { cost = costAt(l); n = 1; }
      } else {
        for (; n < q; n++) cost += costAt(l + n);
      }
      return { n, cost };
    }

    function away(secs) {

      if (exposed()) {

        for (let k = 0; k < n; k++) if (Math.random() < 0.55) rep.attacks.push(rollAttack(true));
      }
      if (raidsOn()) {
        const n = Math.min(5, Math.floor(sec / 1500));
        for (let k = 0; k < n; k++) if (Math.random() < 0.5) { const r = rollRaid(true); if (r) rep.attacks.push(r); }
      }
      if (secs >= 30) {
        const pool = EVENTS.filter(e => S.c[e.i].u).map(e => ({ m: e.m, hit: () => { S.c[e.i].x = clamp(S.c[e.i].x + e.dx * 0.6, -0.8, 0.9); } }))
          .concat(PEVENTS.filter(e => S.p[e.p].u).map(e => ({ m: e.m, hit: () => { S.p[e.p].x = clamp(S.p[e.p].x + e.dx * 0.6, -0.8, 0.9); } })));
        const nn = Math.min(3, Math.floor(sec / 900));
        for (let k = 0; k < nn && pool.length; k++) {
          const e = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
          e.hit();
          rep.news.push(e.m);
        }
        const settle = Math.min(60, 12 + Math.floor(sec / 30));
        for (let k = 0; k < settle; k++) tickMarket();
        S.c.forEach(c => { c.h = new Array(HIST_LEN).fill(c.x); });
        S.p.forEach(p => { p.h = new Array(HIST_LEN).fill(p.x); });
      }
      const gained = rep.mined.reduce((a, b) => a + b, 0) + rep.made.reduce((a, b) => a + b, 0);
      log('AWAY ' + fmtDur(sec) + '. PRODUCED ' + Math.floor(gained) + ' UNITS WHILE YOU WERE GONE.');
      if (secs >= 60) showAway(rep);
    }

    const adlg = { on: false, root: null, body: null, go: null };

    function awayView(rep) {
      const sections = [];
      let worth = 0;
      const made = [];
      S.c.forEach((c, i) => {
        if (!c.u || rep.smelt[i] < 0.5) return;
        const v = rep.smelt[i] * price(i);
        worth += v;
        made.push([COMM[i].sym, '+' + fmtStock(rep.smelt[i]), money(v), v]);
      });
      PROD.forEach((d, i) => {
        if (!S.p[i].u || rep.made[i] <= 0.0001) return;
        const v = rep.made[i] * pPrice(i);
        worth += v;
        made.push([d.name, '+' + fmtStock(rep.made[i]), money(v), v]);
      });
      made.sort((a, b) => b[3] - a[3]);
      if (made.length) sections.push({ head: 'MADE WHILE YOU WERE AWAY', rows: made.slice(0, 6), more: made.length > 6 ? '+ ' + (made.length - 6) + ' MORE' : '' });
      if (rep.svc >= 1) sections.push({ head: 'SERVICES PAID', rows: [['INCOME', '', '+' + money(rep.svc), 0]] });
      const sell = [];
      const hold = [];
      const look = (name, x, have, px) => {
        const pct = Math.exp(x) - 1;
        const v = have * px;
        if (v < 1) return;
        if (pct >= 0.15) sell.push([name, '+' + Math.round(pct * 100) + '%', money(v), v]);
        else if (pct <= -0.15) hold.push([name, Math.round(pct * 100) + '%', money(v), v]);
      };
      S.c.forEach((c, i) => { if (c.u) look(COMM[i].sym, c.x, c.metal, price(i)); });
      S.p.forEach((p, i) => { if (p.u) look(PROD[i].name, p.x, p.stock, pPrice(i)); });
      sell.sort((a, b) => b[3] - a[3]);
      hold.sort((a, b) => b[3] - a[3]);
      if (sell.length) sections.push({ head: 'PRICES ARE HIGH. SELL NOW', rows: sell.slice(0, 3), cls: 'up' });
      if (hold.length) sections.push({ head: 'PRICES ARE LOW. HOLD', rows: hold.slice(0, 3), cls: 'dn' });
      const issues = [];
      S.c.forEach((c, i) => { if (rep.fullAt[i] !== undefined) issues.push([COMM[i].sym + ' STORAGE FULL', 'AFTER ' + fmtDur(rep.fullAt[i]), '', 0]); });
      PROD.forEach((d, i) => {
        if (rep.starve[i] > 30) issues.push([d.name + ' LACKED INPUTS', fmtDur(rep.starve[i]), '', 0]);
        if (rep.fullp[i] > 30) issues.push([d.name + ' STORAGE FULL', fmtDur(rep.fullp[i]), '', 0]);
      });
      if (issues.length) sections.push({ head: 'PRODUCTION STOPPED', rows: issues.slice(0, 5), cls: 'dn', more: issues.length > 5 ? '+ ' + (issues.length - 5) + ' MORE' : '', note: 'Sell stock more often, or buy WAREHOUSE in RESEARCH.' });
      if (rep.attacks.length) {
        const bl = rep.attacks.filter(a => a.blocked).length;
        const lost = rep.attacks.reduce((a, b) => a + b.loss, 0);
        const rows = [['ATTACKS AND RAIDS', rep.attacks.length + ' (' + bl + ' STOPPED)', '', 0]];
        if (lost > 0) rows.push(['STOLEN', '', '-' + money(lost), 0]);
        sections.push({ head: 'SECURITY', rows, cls: lost > 0 ? 'dn' : '' });
      }
      if (rep.news.length) sections.push({ head: 'HEADLINES', rows: rep.news.map(m => [m, '', '', 0]), plain: true });
      return { worth, sections };
    }

    function pStatus(i) {
      const p = S.p[i];
      if (p.ln < 1) return ['NO LINES', 'warn'];
      if (!p.on) return ['PAUSED', 'warn'];
      if (S.outage > 0) return ['POWER OUT', 'warn'];
      if (p.st === 'FULL') return ['STORAGE FULL', 'warn'];
      if (p.st === 'STARVED') return ['NEEDS ' + p.why, 'warn'];
      if (p.st === 'LIMITED') return ['LIMITED: ' + p.why, ''];
      return ['RUNNING', 'ok'];
    }

    function renderProd() {
      let val = 0;
      let run = 0;
      let open = 0;
      let held = 0;
      PROD.forEach((d, i) => {
        const p = S.p[i];
        const r = prefs[i];
        const sel = pSel === i;
        r.card.classList.toggle('locked', !p.u);
        r.card.classList.toggle('sel', sel);
        r.head.setAttribute('aria-expanded', sel ? 'true' : 'false');
        const lm = leanMult();
        const inputs = d.cin.map(([c, q]) => [q, COMM[c].sym, S.c[c].metal, S.c[c].u]).concat(d.pin.map(([j, q]) => [q, PROD[j].name, S.p[j].stock, S.p[j].u]));
        inputs.forEach((x, n) => {
          setT(r['inl' + n], nq(x[0] * lm) + ' ' + x[1]);
          setT(r['inv' + n], x[3] ? 'HAVE ' + fmtStock(x[2]) : 'NOT OPEN');
          r['inv' + n].parentNode.classList.toggle('short', !x[3] || x[2] < x[0] * lm);
        });
        if (!p.u) {
          const need = pReqs(i);
          setT(r.grade, recipeText(i));
          setT(r.need, need.length ? 'NEEDS ' + need[0] + (need.length > 1 ? ' +' + (need.length - 1) + ' MORE' : '') : '');
          setT(r.needfull, need.length ? 'NEEDS FIRST: ' + need.join(', ') : '');
          setT(r.unlockc, money(d.unlock));
          r.b_unlock.disabled = need.length > 0 || S.cash < d.unlock;
          return;
        }
        open++;
        const price0 = pPrice(i);
        const pct = (Math.exp(p.x) - 1) * 100;
        setT(r.price, '$' + fmtPrice(price0));
        setT(r.chg, (p.dx >= 0 ? '▲ ' : '▼ ') + (pct >= 0 ? '+' : '') + pct.toFixed(0) + '%');
        r.chg.classList.toggle('dn', p.dx < 0);
        setT(r.tag, pct >= 15 ? 'HIGH' : pct <= -15 ? 'LOW' : '');
        r.tag.classList.toggle('low', pct <= -15);
        setT(r.grade, d.tiers[p.tk][1]);
        const cp = pCap(i);
        setT(r.stbar, bar(p.stock / cp, 8));
        setT(r.stval, p.stock >= cp - 0.01 ? 'FULL' : fmtStock(p.stock) + '/' + cp);
        held += p.stock * price0;
        const stt = pStatus(i);
        setT(r.chip, stt[0]);
        r.chip.className = 'pchip ' + stt[1];
        const flow = p.ln > 0 && p.on ? p.fl * price0 : 0;
        if (p.ln > 0 && p.on) { val += flow; run++; }
        setT(r.inc, flow > 0 ? money(flow) + '/s' : '');
        setT(r.spark, sparkText(p));
        setT(r.norm, '$' + fmtPrice(pNormal(i)));
        const ic = pInputCost(i);
        const prof = price0 - ic;
        setT(r.icost, '$' + fmtPrice(ic));
        setT(r.margin, (prof >= 0 ? '+' : '-') + '$' + fmtPrice(Math.abs(prof)) + ' (' + (prof >= 0 ? '+' : '') + Math.round(ic > 0 ? prof / ic * 100 : 0) + '%)');
        r.margin.classList.toggle('dn', prof < 0);
        setT(r.stat, stt[0] === 'RUNNING' || stt[0].startsWith('LIMITED') ? 'MAKING ' + fmtRate(p.fl) : stt[0]);
        const pl = planGen(l => pLineCost(i, l), p.ln);
        const lmu = lvlMult(p.ln);
        setT(r.linel, 'LINES L' + p.ln + (lmu > 1 ? ' x' + lmu : ''));
        setT(r.liner, fmtRate(pRateBase(i)));
        setT(r.linec, (pl.n > 1 ? '+' + pl.n + ' ' : '') + money(pl.cost));
        r.b_line.disabled = S.cash < pl.cost;
        if (p.tk >= 3) {
          setT(r.tierl, 'EQUIPMENT T3/3');
          setT(r.tierr, d.tiers[3][0]);
          setT(r.tierc, 'MAXED');
          r.b_tier.disabled = true;
        } else {
          const tc = pTierCost(i);
          setT(r.tierl, 'EQUIPMENT T' + p.tk + '/3');
          setT(r.tierr, d.tiers[p.tk + 1][0]);
          setT(r.tierc, '+' + Math.round((PTIER[p.tk + 1] / PTIER[p.tk] - 1) * 100) + '% PRICE  ' + money(tc));
          r.b_tier.disabled = S.cash < tc;
        }
        r.b_half.disabled = p.stock < 0.02;
        r.b_all.disabled = p.stock < 0.01;
        setT(r.runl, p.on ? 'PAUSE' : 'RESUME');
        r.b_run.classList.toggle('dn', !p.on);
        r.b_auto.disabled = !brokerLv();
        r.b_ovf.disabled = !brokerLv();
        const av = autoView(p, pNormal(i), price0, p.stock, feedNeed('p', i), pFloor(i));
        setT(r.autol, av[0]);
        setT(r.autos, av[1]);
        const ov = ovfView(p);
        setT(r.ovfl, ov[0]);
        setT(r.ovfs, ov[1]);
        let outlook = '';
        if (hasAi('fore') && aiEff() > 0) {
          const tg = d.amp * Math.sin(2 * Math.PI * S.clock / d.period + d.phase) - p.x;
          outlook = 'OUTLOOK: ' + (tg > 0.03 ? 'RISING' : tg < -0.03 ? 'FALLING' : 'STEADY');
        }
        setT(r.outl, outlook);
      });
      setT(pinfo.out, money(val) + '/s');
      setT(pinfo.run, run + ' OF ' + open);
      setT(pinfo.held, money(held));
    }

    function tickProd(dt) {
      const oc = cap() * 2;
      const mc = cap();
      S.c.forEach((c, i) => {
        if (!c.u) return;
        const before = c.ore;
        c.ore = Math.min(oc, c.ore + mineRate(i) * dt);
        if (TRK) TRK.mined[i] += c.ore - before;
        const s = Math.min(c.ore, smeltRate(i) * dt, Math.max(0, mc - c.metal));
        c.ore -= s;
        c.metal += s;
        if (TRK) TRK.smelt[i] += s;
        if (TRK && c.metal >= mc - 0.01 && c.ore >= oc - 0.01 && TRK.fullAt[i] === undefined) TRK.fullAt[i] = TRK.k;
      });
      tickFactories(dt);
    }

    function tickMarket() {
      S.c.forEach((c, i) => {
        const d = COMM[i];
        const before = c.x;
        const tg = d.amp * Math.sin(2 * Math.PI * S.clock / d.period + d.phase);
        c.x = clamp(c.x + 0.045 * (tg - c.x) + d.vol * gauss(), -0.8, 0.9);
        c.dx = c.x - before;
      });
      PROD.forEach((d, i) => {
        const p = S.p[i];
        const before = p.x;
        const tg = d.amp * Math.sin(2 * Math.PI * S.clock / d.period + d.phase);
        p.x = clamp(p.x + 0.045 * (tg - p.x) + d.vol * gauss(), -0.8, 0.9);
        p.dx = p.x - before;
      });
    }

    function sell(i, frac, keep) {
      const c = S.c[i];
      const have = Math.max(0, c.metal - (keep || 0));
      const n = frac >= 1 ? have : Math.floor(have * frac * 100) / 100;
      if (n <= 0) return null;
      const p0 = price(i);
      const k = 0.08 / (COMM[i].liq * impactDiv());
      const f = k * n < 1e-6 ? 1 : (1 - Math.exp(-k * n)) / (k * n);
      const p = p0 * f;
      const gain = n * p * shareMult();
      c.metal -= n;
      S.cash += gain;
      S.earned += gain;
      S.run += gain;
      c.x = Math.max(-0.8, c.x - k * n);
      return { n, p, gain };
    }

      S.c.forEach((c, i) => {
        if (!c.u || S.clock < c.arm) return;

        if (c.ovf && c.metal >= fullMark(keep, cap())) {

          }
          return;
        }
        const m = AUTO[c.auto];
        if (!m || c.metal - keep < floor) return;
        const p = price(i);
        const th = m * COMM[i].base;
        if (p < th) return;
        if (b >= 3 && c.dx > 0 && p < th * 1.1) return;

      tickProd(dt);
      S.clock += dt;
      const inc = svIncome() * dt;
      if (inc > 0) { S.cash += inc; S.earned += inc; S.run += inc; }
      if (S.camp.t > 0) { S.camp.t = Math.max(0, S.camp.t - dt); if (S.camp.t === 0) log('CAMPAIGN ENDED.'); }
      if (S.camp.cd > 0) S.camp.cd = Math.max(0, S.camp.cd - dt);

        S.outage = Math.max(0, S.outage - dt);

      if (S.boost) {
        S.boost.t -= dt;
        if (S.boost.t <= 0) { log('RICH VEIN RAN DRY.'); S.boost = null; }
      }
      marketAcc += dt;

        autoSell();
        histAcc++;

        if (S.clock >= S.nextEvent) fireEvent();

    }

    const bar = (f, w) => {
      const n = Math.round(clamp(f, 0, 1) * w);
      return '[' + '█'.repeat(n) + '░'.repeat(w - n) + ']';
    };

    const TREND = { up: ['▲', 'RISING'], dn: ['▼', 'FALLING'], flat: ['=', 'STEADY'] };

    function setTrend(node, rate) {
      const a = Math.abs(rate || 0);
      let k = node._k;
      if (!k || k === 'flat') k = a > 0.08 ? (rate > 0 ? 'up' : 'dn') : 'flat';
      else k = a < 0.03 ? 'flat' : rate > 0 ? 'up' : 'dn';
      if (node._k === k) return;
      node._k = k;
      node.dataset.g = TREND[k][0];
      node.dataset.w = TREND[k][1];
      node.className = 'tr ' + k;
    }

    function trackTrend(dt) {
      if (dt <= 0 || dt > 1) {
        S.c.forEach(c => { c.po = c.ore; c.pm = c.metal; });
        return;
      }
      const ao = 1 - Math.exp(-dt / 3);
      const am = 1 - Math.exp(-dt / 4);
      S.c.forEach(c => {
        if (c.po === undefined) { c.po = c.ore; c.pm = c.metal; c.eo = 0; c.em = 0; }
        c.eo += ((c.ore - c.po) / dt - c.eo) * ao;
        c.em += ((c.metal - c.pm) / dt - c.em) * am;
        c.po = c.ore;
        c.pm = c.metal;
      });
    }

    const incHist = [];
    let incAcc = 0;

    function trackIncome(dt) {
      incAcc += dt;
      if (incAcc < 1) return;
      incAcc = 0;
      incHist.push(S.run);
      if (incHist.length > 61) incHist.shift();
    }

    const incomeRate = () => (incHist.length > 1 ? Math.max(0, (incHist[incHist.length - 1] - incHist[0]) / (incHist.length - 1)) : 0);

    function setTip(node, text) {

      if (p._tip !== text) { p._tip = text; p.dataset.tip = text; }

    }

        const pm = plan(i, 'mine');

        const mm = lvlMult(c.ml);

        setT(r.smeltr, fmt(smeltRate(i)) + '/s');

        r.b_auto.disabled = !brokerLv();
        r.b_ovf.disabled = !brokerLv();
        const av = autoView(c, d.base, price(i), c.metal, feedNeed('c', i), autoFloor());
        setT(r.autol, av[0]);
        setT(r.autos, av[1]);
        const ov = ovfView(c);
        setT(r.ovfl, ov[0]);
        setT(r.ovfs, ov[1]);
        let outlook = '';
        if (RS('intel')) {
          const tg = d.amp * Math.sin(2 * Math.PI * S.clock / d.period + d.phase) - c.x;
          outlook = 'OUTLOOK: ' + (tg > 0.03 ? 'RISING' : tg < -0.03 ? 'FALLING' : 'STEADY');
        }
        setT(r.out, outlook);

      const musicOn = Snd.on || wakeArmed;

    function applyTheme() {
      document.documentElement.dataset.p = S.phos;
      const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      const m = document.querySelector('meta[name="theme-color"]');
      if (m && bg) m.setAttribute('content', bg);
    }

    function digOnce(i) {
      const c = S.c[i];
      if (!c || !c.u) return 0;
      const room = cap() * 2 - c.ore;
      if (room <= 0) return 0;
      const n = Math.min(tapYield(i), room);
      c.ore += n;
      return n;
    }

    const BUYQ = [1, 10, 25, 'max'];
    let buyQ = 0;

    function plan(i, kind) {
      const c = S.c[i];
      const d = COMM[i];
      const l = kind === 'mine' ? c.ml : c.sl;
      const q = BUYQ[buyQ];
      let cost = 0;
      let n = 0;
      if (q === 'max') {
        while (n < 1000) {
          const k = lvlCost(d, kind, l + n);
          if (cost + k > S.cash) break;
          cost += k;
          n++;
        }
        if (n === 0) { cost = lvlCost(d, kind, l); n = 1; }
      } else {
        for (; n < q; n++) cost += lvlCost(d, kind, l + n);
      }
      return { n, cost };
    }

    function buyLevel(i, kind) {
      const c = S.c[i];
      if (!c.u) return 0;
      const pl = plan(i, kind);
      if (S.cash < pl.cost) return 0;
      S.cash -= pl.cost;
      if (kind === 'mine') c.ml += pl.n; else c.sl += pl.n;
      return pl.cost;
    }

    function restructure() {
      const g = sharesGain();
      if (g < 1) return;
      S.shares += g;
      S.sharesTotal += g;
      S.runs++;
      S.cash = BD('seed') ? 2000 * Math.pow(5, BD('seed') - 1) : 0;
      S.wl = 0;
      S.rs = BD('foreman') ? { broker: 1 } : {};
      S.run = 0;
      incHist.length = 0;
      S.btc.amt = 0;
      S.btc.cost = 0;
      S.btc.ord = null;
      S.outage = 0;
      S.boost = null;
      S.nextEvent = S.clock + 25;
      S.milestone = 0;
      S.c = COMM.map(freshComm);
      S.p = PROD.map(freshProd);
      S.sv = SERV.map(freshSv);
      S.ai = {};
      S.camp = { t: 0, cd: 0 };
      S.sec.ddos = 0;
      S.c[0].u = true;
      for (let i = 1; i <= BD('fast') && i < COMM.length; i++) S.c[i].u = true;
      log('RESTRUCTURED. +' + g + (g === 1 ? ' SHARE' : ' SHARES') + '. ALL INCOME IS NOW +' + 10 * S.sharesTotal + '%.');
      save();
    }

    const dlg = { on: false, root: null, go: null, cancel: null, lose: null, gain: null, until: 0 };

    function buildDlg() {

        '<p>This sells your whole company and cannot be undone. The terminal will power down and restart.</p>' +
        '<div class="dcols"><div class="lose"><h3>YOU LOSE</h3><ul><li data-d="cash"></li><li data-d="btc"></li><li>ALL DESKS, FACTORIES, SERVICES, STOCK</li><li>ALL RESEARCH</li></ul></div>' +
        '<div class="keep"><h3>YOU KEEP</h3><ul><li data-d="sh"></li><li>SHARE PERKS</li><li>THE INCOME BONUS</li></ul></div></div>' +
        '<div class="dgain" data-d="gain"></div>' +

      c.id = 'crt';

      dlg.cancel.addEventListener('click', closeDlg);
      dlg.go.addEventListener('click', () => { if (!dlg.go.disabled) runSeq(); });
      d.addEventListener('pointerdown', e => { if (e.target === d) closeDlg(); });

    function fillDlg() {
      const g = sharesGain();
      setT(dlg.cash, money(S.cash) + ' CASH');
      setT(dlg.btc, S.btc.amt > 0 ? 'ALL BITCOIN (' + money(btcValue()) + ')' : 'NO BITCOIN HELD');
      setT(dlg.sh, S.sharesTotal + ' SHARES EARNED');

    function tickDlg() {
      const left = Math.ceil((dlg.until - performance.now()) / 1000);
      if (left > 0) {
        setT(dlg.go, 'WAIT ' + left);
        dlg.go.disabled = true;
      } else {
        setT(dlg.go, 'RESTRUCTURE NOW');
        dlg.go.disabled = false;
        clearInterval(dlgTimer);
        dlgTimer = 0;
      }
    }

    function openDlg() {
      if (seq || dlg.on || sharesGain() < 1) return;
      dlg.on = true;
      fillDlg();
      dlg.until = performance.now() + 3000;
      dlg.root.classList.add('show');
      tickDlg();
      dlgTimer = setInterval(tickDlg, 200);
      Snd.sfx('alert');
      dlg.cancel.focus();
    }

    function closeDlg() {
      if (!dlg.on) return;
      dlg.on = false;
      clearInterval(dlgTimer);
      dlgTimer = 0;
      dlg.root.classList.remove('show');
      bref.btn.focus();
    }

    function runSeq() {
      if (seq || !dlg.on) return;
      seq = true;
      dlg.on = false;
      clearInterval(dlgTimer);
      dlgTimer = 0;
      dlg.root.classList.remove('show');
      const scr = $('screen');
      scr.style.transformOrigin = '50% ' + Math.round(window.scrollY + window.innerHeight / 2) + 'px';
      Snd.duck(true);
      Snd.sfx('off');
      scr.classList.add('pwroff');
      setTimeout(() => {
        dlg.crt.classList.add('show');
        scr.classList.remove('pwroff');
        scr.style.visibility = 'hidden';
        restructure();
        window.scrollTo(0, 0);
        setTab('ops');
        render();
        [0, 0.45, 0.9].forEach(t => setTimeout(() => Snd.sfx('beep'), t * 1000 + 150));
        setTimeout(() => {
          dlg.crt.classList.remove('show');
          scr.style.visibility = '';
          scr.style.transformOrigin = '50% 0';
          scr.classList.add('pwron');
          Snd.sfx('on');
          setTimeout(() => {
            scr.classList.remove('pwron');
            scr.style.transformOrigin = '';
            Snd.duck(false);
            seq = false;
            render();
          }, 850);
        }, 1500);
      }, 650);
    }

    document.addEventListener('keydown', e => {
      if (seq) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (!dlg.on) return;
      if (e.key === 'Escape') {
        e.preventDefault();
        closeDlg();
      } else if (e.key === 'Tab') {
        const b = [dlg.cancel, dlg.go].filter(x => !x.disabled);
        const i = b.indexOf(document.activeElement);
        e.preventDefault();
        b[(i + (e.shiftKey ? b.length - 1 : 1)) % b.length].focus();
      }
    }, true);

    function unlockComm(i) {
      const c = S.c[i];
      if (c.u || S.cash < COMM[i].unlock) return false;
      S.cash -= COMM[i].unlock;
      c.u = true;
      log(COMM[i].sym + ' DESK OPENED.');
      Snd.sfx('unlock');
      return true;
    }

    function buyResearch(id) {
      const d = RESEARCH.find(x => x.id === id);
      if (!d || d.done() || S.cash < d.cost()) return false;
      S.cash -= d.cost();
      d.buy();
      return true;
    }

    const CMDS = {
      help() {
        S.helped = true;
        print([
          'commands:',
          '  help               this list',
          '  clear              clear the screen',
          '  color [name]       green, amber, ice',
          '  reset              permanently delete all game data'
        ].join('\n'), 'd');
      },
      color(a) {
        const v = (a[0] || '').toLowerCase();
        if (!v) { print('current: ' + S.phos + '. options: ' + PHOS.join(', ') + '.'); return; }
        const p = PHOS.find(x => x.startsWith(v));
        if (!p) { print('options: ' + PHOS.join(', ') + '.', 'd'); Snd.sfx('err'); return; }
        S.phos = p;
        applyTheme();
        save();
        print('color set to ' + p + '.');
      },
      clear() {
        el.tout.textContent = '';
      },
      reset() {
        resetStage = true;
        print([
          'WARNING: this permanently deletes ALL game data:',
          'cash, desks, research, shares, board perks and your bitcoin position.',
          'there is no undo.',
          'to continue, type exactly: ' + RESET_PHRASE,
          'anything else cancels.'
        ].join('\n'), 'w');
      }
    };
    const RESET_PHRASE = 'DELETE ALL MY GAME DATA';
    let resetStage = false;
    Object.assign(CMDS, CMDS2);

    function wipeData() {
      wiped = true;
      store.remove(KEY);
      print('all game data deleted. restarting...', 'w');
      setTimeout(() => location.reload(), 900);
    }

    function runCommand(line) {
      if (resetStage) {
        resetStage = false;
        if (line.trim().toUpperCase().replace(/\s+/g, ' ') === RESET_PHRASE) wipeData();
        else print('reset cancelled. nothing was deleted.');
        return;
      }
      const parts = line.trim().split(/\s+/);
      const name = parts.shift().toLowerCase();
      const fn = Object.prototype.hasOwnProperty.call(CMDS, name) ? CMDS[name] : null;
      if (!fn) { print('unknown command: ' + name + '. ' + HINT, 'd'); Snd.sfx('err'); return; }
      fn(parts);
    }

    const history = [];
    let hpos = 0;

    function initTerminal() {
      el.tform.addEventListener('submit', e => {
        e.preventDefault();
        const v = el.tin.value.trim();
        el.tin.value = '';
        if (!v) return;
        history.push(v);
        hpos = history.length;
        const d = document.createElement('div');
        d.className = 'c';
        d.textContent = 'ironline> ' + v;
        el.tout.appendChild(d);
        runCommand(v);
        el.tout.scrollTop = el.tout.scrollHeight;
        render();
      });
      el.tin.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (hpos > 0) hpos--;
          el.tin.value = history[hpos] || '';
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (hpos < history.length) hpos++;
          el.tin.value = history[hpos] || '';
        } else if (e.key === 'Tab') {
          e.preventDefault();
          const v = el.tin.value;
          if (v && v.indexOf(' ') < 0) {
            const m = Object.keys(CMDS).filter(k => k.startsWith(v.toLowerCase()) && k.length > 1);
            if (m.length === 1) el.tin.value = m[0] + ' ';
          }
        }
      });
      if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
        el.tout.addEventListener('click', () => { if (!String(window.getSelection()).length) el.tin.focus({ preventScroll: true }); });
      }
    }

    let holdTimer = null;
    let holdBtn = null;

    function stopHold() {
      if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
      if (holdBtn) { holdBtn.classList.remove('press'); holdBtn = null; }
    }

    function startHold(i, btn) {
      stopHold();
      holdBtn = btn;
      btn.classList.add('press');
      digOnce(i);
      holdTimer = setInterval(() => { digOnce(i); render(); }, 130);
      render();
    }

    let tab = 'ops';

    function setTab(t) {
      tab = t;
      $('cards').hidden = t !== 'ops';
      $('research').hidden = t !== 'res';
      $('markets').hidden = t !== 'mk';
      $('board').hidden = t !== 'bd';
      $('prod').hidden = t !== 'pr';
      $('serv').hidden = t !== 'sv';
      $('opsbar').hidden = !(t === 'ops' || t === 'pr' || t === 'sv');
      if (t === 'mk') {
        renderMarkets();
        drawChart();
        if (!BTC.busy && Date.now() - BTC.at > 20000) btcRefresh();
      }
      ['ops', 'pr', 'sv', 'res', 'mk', 'bd'].forEach(k => $('tab-' + k).setAttribute('aria-selected', k === t ? 'true' : 'false'));
    }

    function bindUI() {
      const cardsEl = $('cards');
      cardsEl.addEventListener('pointerdown', e => {
        const b = e.target.closest('button[data-act="dig"]');
        if (!b) return;
        startHold(Number(b.closest('.card').dataset.i), b);
      });
      ['pointerup', 'pointercancel', 'blur'].forEach(ev => window.addEventListener(ev, stopHold));
      document.addEventListener('contextmenu', e => { if (e.target.closest('button')) e.preventDefault(); });

      cardsEl.addEventListener('click', e => {
        const b = e.target.closest('button[data-act]');
        if (!b || b.disabled) return;
        const i = Number(b.closest('.card').dataset.i);
        const act = b.dataset.act;
        if (act === 'dig') {
          if (e.detail === 0) digOnce(i);
        } else if (act === 'mine' || act === 'smelt') {
          if (buyLevel(i, act)) Snd.sfx('buy');
        } else if (act === 'half' || act === 'all') {
          const r = sell(i, act === 'all' ? 1 : 0.5);
          if (r) {
            log('SOLD ' + Math.floor(r.n) + ' ' + COMM[i].sym + ' @ $' + r.p.toFixed(2) + ' = ' + money(r.gain));
            Snd.sfx('sell');
          }
        } else if (act === 'auto') {
          const c = S.c[i];
          const al = brokerLv() >= 2 ? AUTO.map((v, k) => k) : AUTO_JUNIOR;
          c.auto = al[(al.indexOf(c.auto) + 1) % al.length];
          c.arm = S.clock + ARM_DELAY;
        } else if (act === 'ovf') {
          S.c[i].ovf = (S.c[i].ovf + 1) % OVF.length;
          S.c[i].arm = S.clock + ARM_DELAY;
        } else if (act === 'unlock') {
          unlockComm(i);
        }
        render();
      });

      $('research').addEventListener('click', e => {
        const b = e.target.closest('button[data-act="research"]');
        if (!b || b.disabled) return;
        buyResearch(b.closest('.card').dataset.id);
        render();
      });

      const toggleProw = row => {
        const i = Number(row.dataset.i);
        pSel = pSel === i ? -1 : i;
        render();
      };

      $('prod').addEventListener('click', e => {
        const row = e.target.closest('.prow');
        if (!row) return;
        const i = Number(row.dataset.i);
        const b = e.target.closest('button[data-act]');
        if (!b) {
          if (e.target.closest('.phd')) toggleProw(row);
          return;
        }
        if (b.disabled) return;
        const p = S.p[i];
        const act = b.dataset.act;
        if (act === 'unlock') { if (pUnlock(i)) pSel = i; }
        else if (act === 'line') pBuyLine(i);
        else if (act === 'tier') pBuyTier(i);
        else if (act === 'half' || act === 'all') {
          const r = sellProd(i, act === 'all' ? 1 : 0.5);
          if (r) {
            log('SOLD ' + fmtStock(r.n) + ' ' + PROD[i].name + ' @ $' + fmtPrice(r.p) + ' = ' + money(r.gain));
            Snd.sfx('sell');
          }
        } else if (act === 'run') {
          p.on = !p.on;
        } else if (act === 'auto') {
          const al = brokerLv() >= 2 ? AUTO.map((v, k) => k) : AUTO_JUNIOR;
          p.auto = al[(al.indexOf(p.auto) + 1) % al.length];
          p.arm = S.clock + ARM_DELAY;
        } else if (act === 'ovf') {
          p.ovf = (p.ovf + 1) % OVF.length;
          p.arm = S.clock + ARM_DELAY;
        }
        render();
      });

      $('prod').addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const hd = e.target.closest('.phd');
        if (!hd || e.target !== hd) return;
        e.preventDefault();
        toggleProw(hd.closest('.prow'));
      });

      $('serv').addEventListener('click', e => {
        const b = e.target.closest('button[data-act]');
        if (!b || b.disabled) return;
        const act = b.dataset.act;
        if (act === 'model') { aiTrain(b.dataset.m); render(); return; }
        const card = b.closest('.scard');
        if (!card) return;
        const k = Number(card.dataset.k);
        if (act === 'unlock') svUnlock(k);
        else if (act === 'buy') svBuy(k);
        else if (act === 'camp') launchCampaign();
        render();
      });

      el.tutskip.addEventListener('click', () => { tutStop(); print('tutorial hidden. type tutorial to bring it back.', 'd'); });
      document.addEventListener('keydown', e => {
        if (adlg.on && (e.key === 'Escape' || e.key === 'Enter')) { e.preventDefault(); closeAway(); }
      }, true);

      $('board').addEventListener('click', e => {
        const b = e.target.closest('button[data-act]');
        if (!b || b.disabled) return;
        if (b.dataset.act === 'restructure') {
          openDlg();
        } else {
          const id = b.closest('.card').dataset.id;
          const d = BOARD.find(x => x.id === id);
          const l = BD(id);
          if (d && l < d.max && S.shares >= d.cost(l)) {
            S.shares -= d.cost(l);
            S.bd[id] = l + 1;
            log(d.name + ' UPGRADED TO L' + (l + 1) + '.');
            Snd.sfx('unlock');
          }
        }
        render();
      });

      $('markets').addEventListener('click', e => {
        const r = e.target.closest('[data-rng]');
        if (r) {
          BTC.range = r.dataset.rng;
          const c = BTC.cache[BTC.range];
          BTC.pts = c && Date.now() - c.t < 300000 ? c.pts : [];
          BTC.err = false;
          BTC.hover = -1;
          saveChartPrefs();
          renderMarkets();
          drawChart();
          btcRefresh();
          return;
        }
        if (e.target.closest('[data-ct]')) { BTC.type = BTC.type === 'candle' ? 'line' : 'candle'; saveChartPrefs(); renderMarkets(); drawChart(); return; }
        if (e.target.closest('[data-indm]')) {
          const o = mref.menu.classList.toggle('open');
          mref.chip.setAttribute('aria-expanded', o ? 'true' : 'false');
          return;
        }
        const ib = e.target.closest('[data-ind]');
        if (ib) { BTC.ind[ib.dataset.ind] = !BTC.ind[ib.dataset.ind]; saveChartPrefs(); renderMarkets(); drawChart(); return; }
        const os = e.target.closest('[data-os]');
        if (os) { TR.side = os.dataset.os; renderMarkets(); return; }
        const ot = e.target.closest('[data-ot]');
        if (ot) {
          TR.type = ot.dataset.ot;
          if (TR.type === 'limit' && btcLive()) mref.oprice.value = String(Math.round(BTC.price));
          renderMarkets();
          return;
        }
        const b = e.target.closest('[data-mk]');
        if (!b || b.disabled) return;
        if (b.dataset.mk === 'cancel') {
          S.btc.ord = null;
          log('LIMIT ORDER CANCELLED.');
        } else {
          btcGo();
        }
        render();
        renderMarkets();
        drawChart();
      });
      mref.slider.addEventListener('input', () => { TR.amt = Number(mref.slider.value); renderMarkets(); });
      mref.cv.addEventListener('pointermove', e => hoverAt(e.clientX));
      mref.cv.addEventListener('pointerdown', e => hoverAt(e.clientX));
      mref.cv.addEventListener('pointerleave', hoverEnd);
      window.addEventListener('resize', drawChart);
      setInterval(() => { if (!document.hidden && !BTC.busy && (tab === 'mk' || ((S.btc.amt > 0 || S.btc.ord) && Date.now() - BTC.at > 28000))) btcRefresh(); }, 10000);

      $('tbuy').addEventListener('click', e => {
        const b = e.target.closest('button[data-q]');
        if (!b) return;
        buyQ = Number(b.dataset.q);
        $('tbuy').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        render();
      });

      document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

      el.tvol.addEventListener('input', () => {
        Snd.setVol(Number(el.tvol.value) / 100);
        paintVol();
      });
      el.tvol.addEventListener('pointerdown', () => el.tvol.classList.add('drag'));
      ['pointerup', 'pointercancel', 'blur'].forEach(ev => el.tvol.addEventListener(ev, () => el.tvol.classList.remove('drag')));

      el.savebtn.addEventListener('click', () => {
        const ok = save();
        el.savebtn.classList.remove('flash');
        void el.savebtn.offsetWidth;
        el.savebtn.classList.add('flash');
        render();
      });

      el.tmore.addEventListener('click', () => {
        const o = el.mbar.classList.toggle('open');
        el.tmore.setAttribute('aria-expanded', o ? 'true' : 'false');
      });
      document.addEventListener('pointerdown', e => {
        if (mref.menu.classList.contains('open') && !e.target.closest('.mk-menu, [data-indm]')) {
          mref.menu.classList.remove('open');
          mref.chip.setAttribute('aria-expanded', 'false');
        }
        if (el.mbar.classList.contains('open') && !e.target.closest('#mbar')) {
          el.mbar.classList.remove('open');
          el.tmore.setAttribute('aria-expanded', 'false');
        }
      });

      el.tmus.addEventListener('click', () => {
        if (Snd.on && Snd.ctx && Snd.ctx.state !== 'running') {
          Snd.kick();
          setTimeout(() => {
            if (Snd.ctx.state === 'running') disarmWake();
            render();
          }, 400);
          return;
        }
        if (Snd.on || wakeArmed) {
          disarmWake();
          Snd.setOn(false);
        } else if (!Snd.setOn(true)) {
          print('audio is not available in this browser.');
        }
        render();
      });
    }

    let wakeArmed = false;
    const WAKE_EVENTS = ['pointerdown', 'pointerup', 'mousedown', 'click', 'keydown', 'touchend'];

    function wake(e) {
      if (e && e.target && e.target.closest && e.target.closest('#mbar')) return;
      if (!Snd.on) Snd.setOn(true); else Snd.kick();
      render();
      setTimeout(() => {
        if (Snd.ctx && Snd.ctx.state === 'running') disarmWake();
        render();
      }, 400);
    }

    function armWake() {
      if (wakeArmed) return;
      wakeArmed = true;
      WAKE_EVENTS.forEach(ev => window.addEventListener(ev, wake, true));
    }

    function disarmWake() {
      if (!wakeArmed) return;
      wakeArmed = false;
      WAKE_EVENTS.forEach(ev => window.removeEventListener(ev, wake, true));
    }

    function bootLog() {
      print('IRONLINE TERMINAL ONLINE.', 'c');
      print('tap DIG on a desk to mine ore, then sell the metal when the price is HIGH.', 'd');
      print(HINT, 'd');
      if (!S.fromSave) print('new here? follow the tutorial at the top of the screen.', 'd');
    }

    let last = Date.now();
    let renderAcc = 0;
    let saveAcc = 0;
    let hintAcc = 0;

    function frame() {
      const now = Date.now();
      let dt = Math.max(0, (now - last) / 1000);
      last = now;
      if (dt > 5) { away(dt); dt = 0; } else step(dt);
      trackTrend(dt);
      trackIncome(dt);
      renderAcc += dt;
      saveAcc += dt;
      hintAcc += dt;
      if (renderAcc >= 0.2 || dt === 0) { renderAcc = 0; render(); }
      if (saveAcc >= 5) { saveAcc = 0; save(); }
      if (hintAcc >= 90) {
        hintAcc = 0;
        if (!S.helped) print(HINT, 'd');
      }
    }

    build();
    initTerminal();
    bindUI();
    applyTheme();

    const pref = (() => { try { return JSON.parse(store.get(AKEY) || 'null'); } catch (e) { return null; } })();
    if (pref && typeof pref.vol === 'number') Snd.vol = clamp(pref.vol, 0, 1);

    const gap = (Date.now() - S.t) / 1000;
    bootLog();
    if (S.fromSave) SV.at = S.t;
    if (S.lostNote) {
      print('your save could not be read. a copy was kept in this browser under ' + KEY + '-backup.', 'w');
    } else if (S.partial) {
      print('part of your save could not be read, the rest was restored.', 'w');
    }
    if (S.resetNote) {
      print('your old save was from an earlier version and has been reset because the economy was rebalanced.', 'w');
    } else if (S.fromSave) {
      print('session restored.', 'd');
      if (gap > 5) away(gap);
    }
    render();

    if (!pref || pref.on) {
      Snd.setOn(true);
      armWake();
      setTimeout(() => {
        if (Snd.ctx && Snd.ctx.state === 'running') disarmWake();
        render();
      }, 700);
    }

    const fsRoot = document.documentElement;
    const fsRequest = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
    const fsExit = document.exitFullscreen || document.webkitExitFullscreen;
    const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

    if (fsRequest && fsExit && document.fullscreenEnabled !== false) {
      const fsBtn = $('tfs');
      fsBtn.hidden = false;
      const fsSync = () => fsBtn.setAttribute('aria-pressed', fsActive() ? 'true' : 'false');
      fsBtn.addEventListener('click', () => {
        try {
          const r = fsActive() ? fsExit.call(document) : fsRequest.call(fsRoot);
          if (r && r.catch) r.catch(() => {});
        } catch (e) {}
      });
      document.addEventListener('fullscreenchange', fsSync);
      document.addEventListener('webkitfullscreenchange', fsSync);
    }

    setInterval(frame, 100);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        save();
        if (Snd.on && Snd.ctx) Snd.ctx.suspend();
        if (Snd.keep) Snd.keep.pause();
      } else if (Snd.on && Snd.ctx) {
        Snd.ctx.resume();
        if (Snd.keep) { const pr = Snd.keep.play(); if (pr && pr.catch) pr.catch(() => {}); }
        setTimeout(() => { if (Snd.on && Snd.ctx.state !== 'running') armWake(); }, 400);
      }
    });
    window.addEventListener('pagehide', save);

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('ironline-sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>

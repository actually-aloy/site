<!doctype html>
<html lang="en" data-p="green">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020a05">
  <title>Ironline</title>
  <meta name="description" content="Ironline: a mining and trading tycoon on an old CRT terminal. Dig ore, refine it, and sell into a moving market.">
  <link rel="canonical" href="https://actually-aloy.github.io/site/ironline">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ironline">
  <meta property="og:description" content="A mining and trading tycoon on an old CRT terminal. Dig ore, refine it, and time the market.">
  <meta property="og:url" content="https://actually-aloy.github.io/site/ironline">
  <meta property="og:image" content="https://actually-aloy.github.io/site/ironline-og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ironline">
  <meta name="twitter:description" content="A mining and trading tycoon on an old CRT terminal. Dig ore, refine it, and time the market.">
  <meta name="twitter:image" content="https://actually-aloy.github.io/site/ironline-og.jpg">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020a05;
      --fg: #4dff8f;
      --warn: #ffb347;
      --dim: color-mix(in srgb, var(--fg) 55%, transparent);
      --line: color-mix(in srgb, var(--fg) 38%, transparent);
      --glow: 0 0 5px color-mix(in srgb, var(--fg) 60%, transparent), 0 0 16px color-mix(in srgb, var(--fg) 22%, transparent);
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    html[data-p="amber"] {
      --bg: #0a0600;
      --fg: #ffb000;
      --warn: #ff6a3d;
    }

    html[data-p="ice"] {
      --bg: #03080c;
      --fg: #9fe8ff;
      --warn: #ffb347;
    }

    * {
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: repeating-linear-gradient(to bottom, var(--bg) 0, var(--bg) 2px, color-mix(in srgb, var(--fg) 14%, var(--bg)) 2px, color-mix(in srgb, var(--fg) 14%, var(--bg)) 3px);
      border-left: 1px solid var(--line);
    }

    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--fg) 45%, var(--bg));
      border: 1px solid var(--fg);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--fg);
    }

    ::-webkit-scrollbar-corner {
      background: var(--bg);
    }

    @supports not selector(::-webkit-scrollbar) {
      html,
      #tout {
        scrollbar-width: thin;
        scrollbar-color: var(--fg) var(--bg);
      }
    }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.45;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.26) 0, rgba(0, 0, 0, 0.26) 1px, transparent 1px, transparent 3px);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 51;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    .screen {
      max-width: 1020px;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      text-shadow: var(--glow);
      animation: flick 7s infinite;
    }

    @keyframes flick {
      0%, 100% { opacity: 1; }
      46% { opacity: 1; }
      48% { opacity: 0.955; }
      50% { opacity: 0.99; }
      52% { opacity: 0.965; }
    }

    button {
      font: inherit;
      color: inherit;
      text-shadow: inherit;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.16em;
      min-width: 0;
    }

    .brand small {
      display: block;
      color: var(--dim);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
    }

    .cursor {
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .top-btns {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .back {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-decoration: none;
      cursor: pointer;
    }

    .back.on {
      border-color: var(--fg);
    }

    .mpill {
      position: relative;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      transition: border-color 0.2s;
    }

    .mpill.on {
      border-color: var(--fg);
    }

    .mpill .back {
      min-width: 40px;
      justify-content: center;
      border: 0;
    }

    .meq {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      width: 14px;
      height: 12px;
    }

    .meq i {
      flex: 1;
      height: 100%;
      background: currentColor;
      transform: scaleY(0.25);
      transform-origin: bottom;
      transition: transform 0.25s;
    }

    .mpill.on .meq i {
      animation: meq 0.9s ease-in-out infinite;
    }

    .mpill.on .meq i:nth-child(2) {
      animation-duration: 0.7s;
      animation-delay: -0.3s;
    }

    .mpill.on .meq i:nth-child(3) {
      animation-duration: 1.1s;
      animation-delay: -0.6s;
    }

    @keyframes meq {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1); }
    }

    .mpill .more {
      display: none;
      min-width: 26px;
      padding: 0;
      border-left: 1px solid var(--line);
      place-items: center;
    }

    .more svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s;
    }

    .mpill.open .more svg {
      transform: rotate(180deg);
    }

    .vol {
      max-width: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-width 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s;
    }

    .mpill.on .vol {
      max-width: 96px;
      opacity: 1;
    }

    @property --p {
      syntax: "<percentage>";
      inherits: true;
      initial-value: 0%;
    }

    .vol .slide {
      width: 72px;
      margin: 0 12px 0 0;
    }

    .slide {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      height: 38px;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
      --p: 0%;
      transition: --p 0.3s ease;
    }

    .slide.drag {
      transition: none;
    }

    .mpill.on .slide {
      animation: vglow 2.6s ease-in-out infinite;
    }

    @keyframes vglow {
      0%, 100% { filter: drop-shadow(0 0 0 transparent); }
      50% { filter: drop-shadow(0 0 5px var(--fg)); }
    }

    .slide::-webkit-slider-runnable-track {
      height: 5px;
      background: linear-gradient(90deg, var(--fg) var(--p), var(--line) var(--p));
    }

    .slide::-moz-range-track {
      height: 5px;
      background: linear-gradient(90deg, var(--fg) var(--p), var(--line) var(--p));
    }

    .slide::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 18px;
      margin-top: -6.5px;
      border: 0;
      border-radius: 0;
      background: var(--fg);
      box-shadow: 0 0 8px var(--fg);
      transition: transform 0.15s;
    }

    .slide::-moz-range-thumb {
      width: 10px;
      height: 18px;
      border: 0;
      border-radius: 0;
      background: var(--fg);
      box-shadow: 0 0 8px var(--fg);
      transition: transform 0.15s;
    }

    .slide:hover::-webkit-slider-thumb,
    .slide:hover::-moz-range-thumb {
      transform: scale(1.2);
    }

    .slide:active::-webkit-slider-thumb,
    .slide:active::-moz-range-thumb {
      transform: scale(1.4);
    }

    .slide:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: -3px;
    }

    @media (max-width: 520px) {
      .mpill.on .more {
        display: grid;
      }

      .mpill .vol,
      .mpill.on .vol {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 70;
        max-width: none;
        border: 1px solid var(--fg);
        background: var(--bg);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition: opacity 0.2s, transform 0.2s;
      }

      .mpill.open .vol {
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }

      .vol .slide,
      .mpill .vol .slide {
        width: 140px;
        margin: 0 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mpill.on .meq i,
      .mpill.on .slide,
      .dots {
        animation: none;
      }
    }

    #tfs[hidden] {
      display: none;
    }

    #tfs svg {
      width: 18px;
      height: 18px;
    }

    #tfs .fs-out,
    #tfs[aria-pressed="true"] .fs-in {
      display: none;
    }

    #tfs[aria-pressed="true"] .fs-out {
      display: block;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0 8px;
    }

    .hud > div {
      position: relative;
      padding: 8px 10px;
      border: 1px solid var(--line);
      min-width: 0;
      cursor: help;
      outline: none;
    }

    .hud > div::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 30;
      width: max-content;
      max-width: min(300px, 88vw);
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--fg);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-line;
      text-shadow: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s;
    }

    .hud > div:nth-child(2)::after {
      left: 50%;
      transform: translateX(-50%);
    }

    .hud > div:nth-child(3)::after {
      left: auto;
      right: 0;
    }

    .hud > div:hover::after,
    .hud > div:focus::after {
      opacity: 1;
    }

    .hud > div:focus {
      border-color: var(--fg);
    }

    .hud span {
      display: block;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .hud b {
      display: block;
      font-size: 18px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brandcol {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      min-width: 0;
    }

    .savebtn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.15s;
    }

    .savebtn i {
      flex: 0 0 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--fg);
      box-shadow: 0 0 6px var(--fg);
    }

    .savebtn:hover {
      color: var(--fg);
    }

    .savebtn.bad {
      color: var(--warn);
    }

    .savebtn.bad i {
      background: var(--warn);
      box-shadow: 0 0 6px var(--warn);
    }

    .savebtn.flash i {
      animation: sflash 0.6s ease-out;
    }

    @keyframes sflash {
      0% { transform: scale(2.4); }
      100% { transform: scale(1); }
    }

    .status {
      margin: 0 0 10px;
      min-height: 2.9em;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .status.bad {
      color: var(--warn);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab {
      min-height: 46px;
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--dim);
    }

    .tab[aria-selected="true"] {
      border-color: var(--fg);
      color: var(--bg);
      background: var(--fg);
      text-shadow: none;
      font-weight: 700;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .kv span:first-child {
      color: var(--dim);
      white-space: nowrap;
    }

    .kv span:last-child {
      text-align: right;
    }

    .opsbar {
      display: flex;
      align-items: stretch;
      width: fit-content;
      max-width: 100%;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .opsbar > span {
      display: flex;
      align-items: center;
      padding: 0 12px;
      color: var(--dim);
      white-space: nowrap;
    }

    .opsbar .seg {
      border: 0;
      border-left: 1px solid var(--line);
    }

    .opsbar .seg button {
      flex: 0 1 56px;
      min-width: 44px;
      min-height: 40px;
    }

    @media (max-width: 520px) {
      .opsbar {
        width: 100%;
      }

      .opsbar > span {
        padding: 0 10px;
        font-size: 11px;
      }

      .opsbar .seg {
        flex: 1;
      }

      .opsbar .seg button {
        flex: 1 1 0;
      }
    }

    .opsbar[hidden] {
      display: none;
    }

    .mk-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }

    .mk-main,
    .mk-side {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .mk-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }

    .mk-sym {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .mk-sym small {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mk-px {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.1;
      text-align: right;
      white-space: nowrap;
    }

    .mk-px small {
      display: block;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.3;
      min-height: 1.3em;
    }

    .tf {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--line);
    }

    .tf .t {
      flex: 1 1 0;
      min-width: 0;
      min-height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    .tf .t:hover {
      color: var(--fg);
    }

    .tf .t[aria-pressed="true"] {
      color: var(--fg);
      background: color-mix(in srgb, var(--fg) 12%, transparent);
      box-shadow: inset 0 -2px 0 var(--fg);
    }

    .tf .sep {
      flex: 0 0 1px;
      margin: 8px 0;
      background: var(--line);
    }

    .tf.ot .t {
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .mk-chart {
      position: relative;
      height: 280px;
      border: 1px solid var(--line);
    }

    .mk-chart canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
    }

    .mk-leg {
      position: absolute;
      top: 6px;
      left: 8px;
      right: 100px;
      height: 16px;
      font-size: 10px;
      line-height: 16px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .mk-tools {
      position: absolute;
      top: 4px;
      right: 8px;
      display: flex;
      gap: 6px;
    }

    .mk-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      min-height: 22px;
      padding: 0 8px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .mk-chip:hover,
    .mk-chip[aria-expanded="true"] {
      color: var(--fg);
      border-color: var(--fg);
    }

    .mk-chip.mk-ic {
      min-width: 28px;
      padding: 0;
    }

    .mk-ic svg {
      width: 14px;
      height: 14px;
    }

    .mk-ic[data-s="line"] .i-c,
    .mk-ic[data-s="candle"] .i-l {
      display: none;
    }

    .mk-menu {
      position: absolute;
      top: 30px;
      right: 8px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      min-width: 190px;
      border: 1px solid var(--fg);
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 0.15s, transform 0.15s;
    }

    .mk-menu.open {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    .mk-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      padding: 0 12px;
      border: 0;
      background: transparent;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-align: left;
      cursor: pointer;
    }

    .mk-menu button::before {
      content: "";
      flex: 0 0 11px;
      height: 11px;
      border: 1px solid currentColor;
    }

    .mk-menu button[aria-pressed="true"] {
      color: var(--fg);
    }

    .mk-menu button[aria-pressed="true"]::before {
      background: currentColor;
    }

    .mk-menu button:hover {
      background: color-mix(in srgb, var(--fg) 14%, transparent);
    }

    .mk-msg {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: 0.06em;
      color: var(--dim);
      pointer-events: none;
    }

    .mk-msg[hidden],
    .mk-msg [hidden] {
      display: none;
    }

    .mk-msg a {
      color: var(--fg);
      pointer-events: auto;
      text-decoration: underline;
    }

    .dots {
      display: inline-block;
      width: 1.4em;
      overflow: hidden;
      vertical-align: bottom;
      text-align: left;
      animation: dots 1.2s steps(4) infinite;
    }

    @keyframes dots {
      from { width: 0; }
      to { width: 1.4em; }
    }

    .mk-pos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .mk-pos > div {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      padding: 7px 10px;
      background: var(--bg);
    }

    .mk-pos span {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--dim);
    }

    .mk-pos b {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mk-note {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 11px;
      color: var(--dim);
      line-height: 1.5;
    }

    .sd button[data-os="sell"][aria-pressed="true"] {
      color: var(--warn);
      background: color-mix(in srgb, var(--warn) 14%, transparent);
      box-shadow: inset 0 -2px 0 var(--warn);
    }

    .btn.sell {
      border-color: var(--warn);
      color: var(--warn);
    }

    .kv.ctl {
      align-items: center;
      min-height: 34px;
    }

    .kv.ctl span:nth-child(2) {
      margin-left: auto;
    }

    .kv input:not(.slide) {
      width: 160px;
      min-height: 34px;

    function smaOf(pts, n) {
      const out = new Array(pts.length).fill(NaN);
      let s = 0;
      for (let i = 0; i < pts.length; i++) {
        s += pts[i][4];
        if (i >= n) s -= pts[i - n][4];
        if (i >= n - 1) out[i] = s / n;
      }
      return out;
    }

    function emaArr(v, n) {
      const out = new Array(v.length).fill(NaN);
      const k = 2 / (n + 1);
      let s0 = v.findIndex(Number.isFinite);
      if (s0 < 0 || s0 + n > v.length) return out;
      let e = 0;
      for (let i = s0; i < s0 + n; i++) e += v[i];
      e /= n;
      out[s0 + n - 1] = e;
      for (let i = s0 + n; i < v.length; i++) {
        e = v[i] * k + e * (1 - k);
        out[i] = e;
      }
      return out;
    }

    function bollOf(pts, n) {
      const m = smaOf(pts, n);
      const up = new Array(pts.length).fill(NaN);
      const dn = new Array(pts.length).fill(NaN);
      for (let i = n - 1; i < pts.length; i++) {
        let q = 0;
        for (let j = i - n + 1; j <= i; j++) q += (pts[j][4] - m[i]) * (pts[j][4] - m[i]);
        const sd = Math.sqrt(q / n);
        up[i] = m[i] + 2 * sd;
        dn[i] = m[i] - 2 * sd;
      }
      return { up, dn };
    }

    function rsiOf(pts, n) {
      const out = new Array(pts.length).fill(NaN);
      if (pts.length <= n) return out;
      let ga = 0;
      let la = 0;
      for (let i = 1; i <= n; i++) {
        const d = pts[i][4] - pts[i - 1][4];
        if (d > 0) ga += d; else la -= d;
      }
      ga /= n;
      la /= n;
      out[n] = la === 0 ? 100 : 100 - 100 / (1 + ga / la);
      for (let i = n + 1; i < pts.length; i++) {
        const d = pts[i][4] - pts[i - 1][4];
        ga = (ga * (n - 1) + (d > 0 ? d : 0)) / n;
        la = (la * (n - 1) + (d < 0 ? -d : 0)) / n;
        out[i] = la === 0 ? 100 : 100 - 100 / (1 + ga / la);
      }
      return out;
    }

    function macdOf(pts) {
      const c = pts.map(k => k[4]);
      const e12 = emaArr(c, 12);
      const e26 = emaArr(c, 26);
      const m = c.map((_, i) => (Number.isFinite(e12[i]) && Number.isFinite(e26[i]) ? e12[i] - e26[i] : NaN));
      const sg = emaArr(m, 9);
      return { m, sg, hs: m.map((v, i) => (Number.isFinite(v) && Number.isFinite(sg[i]) ? v - sg[i] : NaN)) };
    }

    function drawChart() {
      const cv = mref.cv;
      if (!cv || $('markets').hidden) return;
      const pts = BTC.pts;
      const w = cv.clientWidth;
      const h = cv.clientHeight;
      if (!w || !h) return;
      const dpr = window.devicePixelRatio || 1;
      cv.width = Math.round(w * dpr);
      cv.height = Math.round(h * dpr);
      const g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      if (!btcLive() || pts.length < 2) return;
      const cs = getComputedStyle(document.documentElement);
      const fg = cs.getPropertyValue('--fg').trim() || '#4dff8f';
      const dim = cs.getPropertyValue('--dim').trim() || '#2f9a5a';
      const line = cs.getPropertyValue('--line').trim() || '#14532d';
      const warn = cs.getPropertyValue('--warn').trim() || '#ffb347';
      const n = pts.length;
      const candle = BTC.type === 'candle';
      const ind = BTC.ind;
      const ma = ind.ma ? smaOf(pts, MA_N) : null;
      const ema = ind.ema ? emaArr(pts.map(k => k[4]), 50) : null;
      const bb = ind.bb ? bollOf(pts, 20) : null;
      const subs = [];
      if (ind.rsi) subs.push('rsi');
      if (ind.macd) subs.push('macd');
      let lo = Infinity;
      let hi = 0;
      pts.forEach((k, i) => {
        let a = candle ? k[3] : k[4];
        let b = candle ? k[2] : k[4];
        if (bb && Number.isFinite(bb.up[i])) { a = Math.min(a, bb.dn[i]); b = Math.max(b, bb.up[i]); }
        if (a < lo) lo = a;
        if (b > hi) hi = b;
      });
      const padv = (hi - lo) * 0.08 || hi * 0.001;
      lo -= padv;
      hi += padv;
      const L = 8;
      const R = 62;
      const T = 32;
      const B = 22;
      const SH = 54;
      const PB = h - B - subs.length * SH;
      const pw = w - L - R;
      const X = i => L + (i + 0.5) / n * pw;
      const Y = v => T + (1 - (v - lo) / (hi - lo)) * (PB - T);
      g.font = '11px "IBM Plex Mono", ui-monospace, monospace';
      g.textBaseline = 'middle';
      g.lineWidth = 1;
      for (let k = 0; k <= 4; k++) {
        const v = lo + (hi - lo) * k / 4;
        const y = Math.round(Y(v)) + 0.5;
        g.strokeStyle = line;
        g.setLineDash([3, 5]);
        g.beginPath();
        g.moveTo(L, y);
        g.lineTo(w - R, y);
        g.stroke();
        g.setLineDash([]);
        g.fillStyle = dim;
        g.textAlign = 'left';
        g.fillText(fmtPx(v), w - R + 6, y);
      }
      if (candle) {
        const bw = clamp(Math.floor(pw / n * 0.7), 1, 14);
        pts.forEach((k, i) => {
          const x = Math.round(X(i));
          const up = k[4] >= k[1];
          g.strokeStyle = g.fillStyle = up ? fg : warn;
          g.lineWidth = 1;
          g.beginPath();
          g.moveTo(x + 0.5, Y(k[2]));
          g.lineTo(x + 0.5, Y(k[3]));
          g.stroke();
          const top = Y(Math.max(k[1], k[4]));
          g.fillRect(Math.round(x - bw / 2), top, bw, Math.max(1, Y(Math.min(k[1], k[4])) - top));
        });
      } else {
        const grad = g.createLinearGradient(0, T, 0, PB);
        grad.addColorStop(0, fg + '44');
        grad.addColorStop(1, fg + '00');
        g.beginPath();
        pts.forEach((k, i) => { if (i) g.lineTo(X(i), Y(k[4])); else g.moveTo(X(i), Y(k[4])); });
        g.lineTo(X(n - 1), PB);
        g.lineTo(X(0), PB);
        g.closePath();
        g.fillStyle = grad;
        g.fill();
        g.beginPath();
        pts.forEach((k, i) => { if (i) g.lineTo(X(i), Y(k[4])); else g.moveTo(X(i), Y(k[4])); });
        g.strokeStyle = fg;
        g.lineWidth = 1.6;
        g.lineJoin = 'round';
        g.shadowColor = fg;
        g.shadowBlur = 6;
        g.stroke();
        g.shadowBlur = 0;
        g.fillStyle = fg;
        g.beginPath();
        g.arc(X(n - 1), Y(pts[n - 1][4]), 3, 0, Math.PI * 2);
        g.fill();
      }
      const trace = (arr, col, lw, dash, yf) => {
        g.beginPath();
        let started = false;
        arr.forEach((v, i) => {
          if (!Number.isFinite(v)) return;
          if (started) g.lineTo(X(i), yf(v)); else { g.moveTo(X(i), yf(v)); started = true; }
        });
        g.strokeStyle = col;
        g.lineWidth = lw;
        g.setLineDash(dash);
        g.stroke();
        g.setLineDash([]);
      };
      if (bb) {
        const i0 = bb.up.findIndex(Number.isFinite);
        if (i0 >= 0) {
          g.beginPath();
          for (let i = i0; i < n; i++) g.lineTo(X(i), Y(bb.up[i]));
          for (let i = n - 1; i >= i0; i--) g.lineTo(X(i), Y(bb.dn[i]));
          g.closePath();
          g.globalAlpha = 0.1;
          g.fillStyle = '#5ad1ff';
          g.fill();
          g.globalAlpha = 1;
        }
        trace(bb.up, '#5ad1ff', 1, [4, 3], Y);
        trace(bb.dn, '#5ad1ff', 1, [4, 3], Y);
      }
      if (ma) trace(ma, warn, 1.4, [], Y);
      if (ema) trace(ema, '#ff7ad9', 1.4, [], Y);
      const o = S.btc.ord;
      if (o && o.price > lo && o.price < hi) {
        const y = Math.round(Y(o.price)) + 0.5;
        g.strokeStyle = warn;
        g.setLineDash([6, 4]);
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(L, y);
        g.lineTo(w - R, y);
        g.stroke();
        g.setLineDash([]);
        g.fillStyle = warn;
        g.textAlign = 'left';
        g.fillText(o.side.toUpperCase(), L + 4, y - 7);
      }
      const ax = RANGES[BTC.range].ax;
      const fmtT = ts => {
        const d = new Date(ts);
        if (ax === 'h') return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        if (ax === 'y') return d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      };
      const tag = (txt, x, y, al, bg, fgc) => {
        const tw = g.measureText(txt).width + 10;
        const tx = al === 'center' ? x - tw / 2 : x;
        g.fillStyle = bg;
        g.fillRect(tx, y - 9, tw, 18);
        g.fillStyle = fgc;
        g.textAlign = 'left';
        g.textBaseline = 'middle';
        g.fillText(txt, tx + 5, y);
      };
      {
        const lp = pts[n - 1][4];
        const ly = clamp(Y(lp), T + 9, PB - 9);
        g.strokeStyle = fg;
        g.globalAlpha = 0.4;
        g.setLineDash([2, 4]);
        g.beginPath();
        g.moveTo(L, Math.round(ly) + 0.5);
        g.lineTo(w - R, Math.round(ly) + 0.5);
        g.stroke();
        g.setLineDash([]);
        g.globalAlpha = 1;
        tag(fmtPx(lp), w - R + 2, ly, 'left', fg, cs.getPropertyValue('--bg').trim() || '#000');
      }
      const hi_ = BTC.hover >= 0 && BTC.hover < n ? BTC.hover : n - 1;
      const num = v => (Number.isFinite(v) ? v.toFixed(2) : '--');
      subs.forEach((kind, idx) => {
        const pt = PB + idx * SH;
        const ty = pt + 16;
        const by = pt + SH - 6;
        g.strokeStyle = line;
        g.lineWidth = 1;
        g.setLineDash([]);
        g.beginPath();
        g.moveTo(L, Math.round(pt) + 0.5);
        g.lineTo(w - R, Math.round(pt) + 0.5);
        g.stroke();
        g.fillStyle = dim;
        g.textAlign = 'left';
        g.textBaseline = 'middle';
        if (kind === 'rsi') {
          const r = rsiOf(pts, 14);
          const YR = v => by - v / 100 * (by - ty);
          [30, 70].forEach(v => {
            g.strokeStyle = line;
            g.setLineDash([3, 5]);
            g.beginPath();
            g.moveTo(L, Math.round(YR(v)) + 0.5);
            g.lineTo(w - R, Math.round(YR(v)) + 0.5);
            g.stroke();
            g.setLineDash([]);
            g.fillStyle = dim;
            g.fillText(String(v), w - R + 6, YR(v));
          });
          trace(r, fg, 1.3, [], YR);
          g.fillStyle = dim;
          g.fillText('RSI 14  ' + num(r[hi_]), L + 2, pt + 9);
        } else {
          const m = macdOf(pts);
          let mx = 0;
          [m.m, m.sg, m.hs].forEach(a => a.forEach(v => { if (Number.isFinite(v) && Math.abs(v) > mx) mx = Math.abs(v); }));
          mx = mx || 1;
          const mid = (ty + by) / 2;
          const YM = v => mid - v / mx * (by - ty) / 2;
          g.strokeStyle = line;
          g.setLineDash([3, 5]);
          g.beginPath();
          g.moveTo(L, Math.round(mid) + 0.5);
          g.lineTo(w - R, Math.round(mid) + 0.5);
          g.stroke();
          g.setLineDash([]);
          const bw = clamp(Math.floor(pw / n * 0.6), 1, 8);
          m.hs.forEach((v, i) => {
            if (!Number.isFinite(v)) return;
            g.globalAlpha = 0.5;
            g.fillStyle = v >= 0 ? fg : warn;
            const y0 = YM(0);
            const y1 = YM(v);
            g.fillRect(Math.round(X(i) - bw / 2), Math.min(y0, y1), bw, Math.max(1, Math.abs(y1 - y0)));
            g.globalAlpha = 1;
          });
          trace(m.m, fg, 1.3, [], YM);
          trace(m.sg, warn, 1.3, [], YM);
          g.fillStyle = dim;
          g.fillText('MACD  ' + num(m.m[hi_]) + '  SIG ' + num(m.sg[hi_]) + '  HIST ' + num(m.hs[hi_]), L + 2, pt + 9);
        }
      });
      g.fillStyle = dim;
      g.textBaseline = 'alphabetic';
      [[0, 'left'], [Math.floor((n - 1) / 2), 'center'], [n - 1, 'right']].forEach(([i, al]) => {
        g.textAlign = al;
        g.fillText(fmtT(pts[i][0]), al === 'left' ? L : al === 'right' ? w - R : (L + w - R) / 2, h - 6);
      });
      if (BTC.hover >= 0 && BTC.hover < n) {
        const hx = Math.round(X(BTC.hover));
        g.strokeStyle = dim;
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(hx + 0.5, T);
        g.lineTo(hx + 0.5, h - B);
        g.stroke();
        if (!candle) {
          g.fillStyle = fg;
          g.beginPath();
          g.arc(hx, Y(pts[BTC.hover][4]), 3.5, 0, Math.PI * 2);
          g.fill();
        }
        const hk = pts[BTC.hover];
        const tt = new Date(hk[0]);
        const lbl = RANGES[BTC.range].tm
          ? tt.toLocaleString('en-US', { month: 'short', day: 'numeric' }) + ' ' + String(tt.getHours()).padStart(2, '0') + ':' + String(tt.getMinutes()).padStart(2, '0')
          : tt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const lw = g.measureText(lbl).width + 10;
        tag(lbl, clamp(hx, L + lw / 2, w - R - lw / 2), h - 10, 'center', dim, cs.getPropertyValue('--bg').trim() || '#000');
      }
    }

    function hoverAt(clientX) {
      const pts = BTC.pts;
      if (!btcLive() || pts.length < 2) return;
      const rect = mref.cv.getBoundingClientRect();
      const L = 8;
      const R = 62;
      const f = (clientX - rect.left - L) / (rect.width - L - R);
      BTC.hover = clamp(Math.floor(f * pts.length), 0, pts.length - 1);
      renderMarkets();
      drawChart();
    }

    function hoverEnd() {
      BTC.hover = -1;
      renderMarkets();
      drawChart();
    }

    const BROKER_NAMES = ['NONE', 'JUNIOR', 'SENIOR', 'TRADER'];

    const BOARD = [
      { id: 'seed', name: 'SEED CAPITAL', max: 5, cost: l => [1, 2, 4, 8, 16][l],
        desc: 'Start every run with extra cash.',
        fx: l => (l ? money(2000 * Math.pow(5, l - 1)) : 'NONE') },
      { id: 'foreman', name: 'FOREMAN', max: 1, cost: () => 3,
        desc: 'Start every run with a Junior broker already hired.',
        fx: l => (l ? 'JUNIOR BROKER' : 'NONE') },
      { id: 'fast', name: 'FAST TRACK', max: 3, cost: l => [5, 15, 40][l],
        desc: 'Start every run with more desks already open.',
        fx: l => ['NONE', 'COPPER', 'COPPER, SILVER', 'COPPER, SILVER, OIL'][l] },
      { id: 'watch', name: 'NIGHT WATCH', max: 5, cost: l => [2, 4, 8, 16, 32][l],
        desc: 'Your mines keep producing for longer while you are away.',
        fx: l => (2 + 2 * l) + 'h AWAY' }
    ];

    function mk(o) {
      const lv = () => (o.id === 'warehouse' ? S.wl : RS(o.id));
      const d = {
        id: o.id, name: o.name, desc: o.desc,
        level: () => 'L' + lv() + (isFinite(o.max) ? '/' + o.max : ''),
        cost: () => (o.id === 'warehouse' ? capCost() : Math.ceil(o.base * Math.pow(o.growth, lv()))),
        done: () => lv() >= o.max,
        locked: () => !!o.req && RS(o.req.id) < o.req.lv,

    const Snd = {
      ctx: null, master: null, bus: null, sfxBus: null, delay: null, on: false, vol: 0.1, timer: null, nextT: 0, stepN: 0, n: 0, noise: null, keep: null, ti: -1, tr: null,
      TRACKS: [
        { name: 'NIGHT SHIFT', bpm: 84, roots: [45, 41, 48, 43], q: [0, 1, 1, 1], bass: [0, 3, 6, 8, 11, 14], arp: [0, 2, 1, 3, 2, 1, 3, 2], pent: [0, 3, 5, 7, 10], arpAt: 4, drumAt: 8 },
        { name: 'COLD IRON', bpm: 96, roots: [38, 34, 41, 36], q: [0, 1, 1, 1], bass: [0, 3, 4, 7, 8, 11, 12, 14], arp: [0, 1, 2, 3, 2, 1, 2, 3], pent: [0, 3, 5, 7, 10], arpAt: 3, drumAt: 6 },
        { name: 'DEEP SHAFT', bpm: 72, roots: [40, 36, 43, 38], q: [0, 1, 1, 1], bass: [0, 6, 10], arp: [0, 2, 3, 2, 1, 2, 3, 1], pent: [0, 3, 7, 10, 12], arpAt: 6, drumAt: 12 },
        { name: 'BOOM TOWN', bpm: 104, roots: [48, 44, 51, 46], q: [0, 1, 1, 1], bass: [0, 2, 4, 6, 8, 10, 12, 14], arp: [0, 0, 2, 1, 3, 2, 1, 3], pent: [0, 3, 5, 7, 10], arpAt: 2, drumAt: 4 },
        { name: 'LAST SHIFT', bpm: 78, roots: [41, 48, 50, 46], q: [1, 1, 0, 1], bass: [0, 4, 6, 10, 12], arp: [0, 1, 2, 1, 3, 2, 1, 0], pent: [0, 2, 4, 7, 9], arpAt: 4, drumAt: 8 }
      ],
      QUAL: [[0, 3, 7], [0, 4, 7]],
      freq(m) { return 440 * Math.pow(2, (m - 69) / 12); },
      rnd(n) { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); },
      pick() {
        let i = this.ti;
        while (i === this.ti) i = Math.floor(Math.random() * this.TRACKS.length);
        this.ti = i;
        this.tr = this.TRACKS[i];
        if (this.delay) this.delay.delayTime.setValueAtTime(60 / this.tr.bpm * 0.75, this.ctx.currentTime);
      },
      init() {
        if (this.ctx) return true;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        const ctx = new AC();
        this.ctx = ctx;
        ctx.onstatechange = () => { if (this.on && ctx.state !== 'running' && !document.hidden) armWake(); };
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -16;
        comp.ratio.value = 4;
        this.master = ctx.createGain();
        this.master.gain.value = 0;
        this.master.connect(comp);
        const mk = ctx.createGain();
        mk.gain.value = 1.5;
        comp.connect(mk);
        mk.connect(ctx.destination);
        this.bus = ctx.createGain();
        this.bus.connect(this.master);
        this.sfxBus = ctx.createGain();
        this.sfxBus.gain.value = 0.5;
        this.sfxBus.connect(this.master);
        const len = Math.floor(ctx.sampleRate * 2.2);
        const ir = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = ir.getChannelData(ch);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
        }
        const conv = ctx.createConvolver();
        conv.buffer = ir;
        const wet = ctx.createGain();
        wet.gain.value = 0.3;
        this.bus.connect(conv);
        conv.connect(wet);
        wet.connect(this.master);
        this.delay = ctx.createDelay(1.5);
        this.delay.delayTime.value = 60 / 84 * 0.75;
        const fb = ctx.createGain();
        fb.gain.value = 0.34;
        const dl = ctx.createBiquadFilter();
        dl.type = 'lowpass';
        dl.frequency.value = 2200;
        this.delay.connect(dl);
        dl.connect(fb);
        fb.connect(this.delay);
        const dwet = ctx.createGain();
        dwet.gain.value = 0.5;
        dl.connect(dwet);
        dwet.connect(this.master);
        const nl = ctx.sampleRate;
        this.noise = ctx.createBuffer(1, nl, ctx.sampleRate);
        const nd = this.noise.getChannelData(0);
        for (let i = 0; i < nl; i++) nd[i] = Math.random() * 2 - 1;
        return true;
      },
      tone(type, f, t, dur, peak, opt) {
        const ctx = this.ctx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (opt && opt.slide) o.frequency.exponentialRampToValueAtTime(opt.slide, t + dur);
        if (opt && opt.detune) o.detune.value = opt.detune;
        const a = (opt && opt.a) || 0.005;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + a);
        if (opt && opt.hold) g.gain.setValueAtTime(peak, t + dur * opt.hold);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        let node = o;
        if (opt && opt.lp) {
          const f1 = ctx.createBiquadFilter();
          f1.type = 'lowpass';
          f1.frequency.value = opt.lp;
          o.connect(f1);
          node = f1;
        }
        node.connect(g);
        g.connect((opt && opt.dest) || this.bus);
        if (opt && opt.send) g.connect(this.delay);
        o.start(t);
        o.stop(t + dur + 0.05);
        this.n++;
      },
      hit(t, dur, peak, kind) {
        const ctx = this.ctx;
        const s = ctx.createBufferSource();
        s.buffer = this.noise;
        const f = ctx.createBiquadFilter();
        f.type = kind === 'hat' ? 'highpass' : 'bandpass';
        f.frequency.value = kind === 'hat' ? 7000 : 1800;
        const g = ctx.createGain();
        g.gain.setValueAtTime(peak, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f);
        f.connect(g);
        g.connect(this.bus);
        s.start(t);
        s.stop(t + dur + 0.02);
        this.n++;
      },
      sched(step, t) {
        if (step % 256 === 0 || !this.tr) this.pick();
        const tr = this.tr;
        const bar = Math.floor(step / 16);
        const s = step % 16;
        const sec = Math.floor(step / 16) % 16;
        const ci = bar % 4;
        const root = tr.roots[ci];
        const iv = this.QUAL[tr.q[ci]];
        const beat = 60 / tr.bpm;
        if (s === 0) {
          iv.forEach((x, k) => {
            this.tone('sawtooth', this.freq(root + 12 + x), t, beat * 4.2, 0.06, { a: 0.7, hold: 0.6, lp: 1100, detune: k % 2 ? 7 : -7 });
            this.tone('triangle', this.freq(root + 24 + x), t, beat * 4.2, 0.05, { a: 0.9, hold: 0.6, lp: 1800 });
          });
        }
        if (tr.bass.indexOf(s) >= 0) {
          const bn = root + (s === 11 || s === 14 ? 12 : 0);
          this.tone('sawtooth', this.freq(bn), t, beat * 0.42, 0.2, { lp: 520 });
          this.tone('sine', this.freq(root), t, beat * 0.5, 0.22);
          this.tone('triangle', this.freq(bn + 12), t, beat * 0.4, 0.1, { lp: 1400 });
        }
        if (sec >= tr.arpAt && s % 2 === 0) {
          const tones = [root + 24 + iv[0], root + 24 + iv[1], root + 24 + iv[2], root + 36 + iv[0]];
          const k = tr.arp[(s / 2) % 8];
          this.tone('square', this.freq(tones[k] + (sec >= 12 ? 12 : 0)), t, beat * 0.3, s === 0 ? 0.06 : 0.04, { lp: 2600, send: true });
        }
        if (sec >= 2 && s % 2 === 0 && this.rnd(bar * 131 + s * 17 + this.ti * 7) < (sec >= 8 ? 0.55 : 0.35)) {
          const d = Math.floor(this.rnd(bar * 53 + s * 29 + this.ti) * tr.pent.length);
          const m = root + 36 + tr.pent[d] + (this.rnd(bar + s) < 0.25 ? 12 : 0);
          this.tone('triangle', this.freq(m), t, beat * (0.5 + this.rnd(s + bar * 3) * 0.9), 0.075, { a: 0.012, lp: 3200, send: true });
        }
        if (sec >= tr.drumAt) {
          if (s === 0 || s === 8 || (s === 14 && bar % 2)) {
            this.tone('sine', 120, t, 0.2, 0.6, { slide: 42 });
            this.tone('triangle', 260, t, 0.05, 0.2, { slide: 90 });
          }
          if (s === 4 || s === 12) {
            this.hit(t, 0.14, 0.18, 'snare');
            this.tone('triangle', 190, t, 0.1, 0.1);
          }
          if (s % 4 === 2) this.hit(t, 0.04, 0.05, 'hat');
        }
      },
      pump() {
        const ctx = this.ctx;
        while (this.nextT < ctx.currentTime + 0.25) {
          this.sched(this.stepN, this.nextT);
          this.stepN++;
          this.nextT += 60 / this.tr.bpm / 4;
        }
      },
      next() {
        if (!this.on) return;

        this.nextT = this.ctx.currentTime + 0.1;
      },
      unlock() {
        const ctx = this.ctx;
        try {
          const src = ctx.createBufferSource();
          src.buffer = ctx.createBuffer(1, 1, 22050);
          src.connect(ctx.destination);
          src.start(0);

        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
        try {
          if (!this.keep) {
            const n = 8000;
            const buf = new ArrayBuffer(44 + n * 2);
            const v = new DataView(buf);
            const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
            w(0, 'RIFF');
            v.setUint32(4, 36 + n * 2, true);
            w(8, 'WAVEfmt ');
            v.setUint32(16, 16, true);
            v.setUint16(20, 1, true);
            v.setUint16(22, 1, true);
            v.setUint32(24, 8000, true);
            v.setUint32(28, 16000, true);
            v.setUint16(32, 2, true);
            v.setUint16(34, 16, true);
            w(36, 'data');
            v.setUint32(40, n * 2, true);
            const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
            a.loop = true;
            a.setAttribute('playsinline', '');
            this.keep = a;
          }
          const pr = this.keep.play();
          if (pr && pr.catch) pr.catch(() => {});
        } catch (e) {}
      },
      kick() {
        if (!this.ctx) return;
        this.unlock();
        if (this.ctx.state !== 'running') this.ctx.resume();
      },
      apply() {
        if (!this.ctx) return;
        this.master.gain.setTargetAtTime(this.on ? this.vol : 0, this.ctx.currentTime, 0.25);
      },
      setOn(v) {
        if (v && !this.init()) { this.on = false; return false; }

        if (this.on) {

          if (!this.timer) {

            this.timer = setInterval(() => this.pump(), 40);
          }
        } else if (this.timer) {
          clearInterval(this.timer);
          this.timer = null;
          if (this.keep) this.keep.pause();
          const c = this.ctx;
          setTimeout(() => { if (!this.on && c.state === 'running') c.suspend(); }, 900);
        }
        this.apply();
        store.set(AKEY, JSON.stringify({ on: this.on, vol: this.vol }));
        return true;
      },
      duck(v) {
        if (!this.ctx) return;
        this.bus.gain.cancelScheduledValues(this.ctx.currentTime);
        this.bus.gain.setTargetAtTime(v ? 0 : 1, this.ctx.currentTime, v ? 0.04 : 0.6);
      },
      setVol(v) {
        this.vol = clamp(v, 0, 1);
        this.apply();
        store.set(AKEY, JSON.stringify({ on: this.on, vol: this.vol }));
      },
      sfx(kind) {
        if (!this.on || !this.ctx || this.ctx.state !== 'running') return;
        const t = this.ctx.currentTime + 0.01;

          this.tone('square', 440, t, 0.09, 0.07, { dest: d, lp: 3000 });
          this.tone('square', 660, t + 0.08, 0.12, 0.07, { dest: d, lp: 3000 });
        } else if (kind === 'sell') {
          [880, 1175, 1568].forEach((f, k) => this.tone('triangle', f, t + k * 0.06, 0.14, 0.09, { dest: d }));
        } else if (kind === 'unlock') {
          [523, 659, 784, 1047].forEach((f, k) => this.tone('square', f, t + k * 0.09, 0.16, 0.06, { dest: d, lp: 3200 }));
        } else if (kind === 'alert') {
          this.tone('sawtooth', 130, t, 0.45, 0.1, { dest: d, slide: 70, lp: 600 });
        } else if (kind === 'news') {
          this.tone('sine', 988, t, 0.25, 0.07, { dest: d });
        } else if (kind === 'off') {
          this.tone('sawtooth', 1800, t, 0.55, 0.12, { dest: d, slide: 50, lp: 2600 });

          this.tone('square', 1046, t, 0.18, 0.09, { dest: d, lp: 3500, hold: 0.8 });

          this.tone('sawtooth', 60, t, 0.5, 0.1, { dest: d, slide: 1500, lp: 2400 });

    };

    const el = {};
    const refs = [];
    const rrefs = [];
    const brefs = [];
    const bref = {};
    let seq = false;
    let dlgTimer = 0;
    const setT = (node, text) => { if (node._t !== text) { node._t = text; node.textContent = text; } };

    function stamp() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }

    function print(text, cls, prefix) {
      const box = el.tout;
      const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      String(text).split('\n').forEach(line => {
        const d = document.createElement('div');
        if (cls) d.className = cls;
        if (prefix) {
          const t = document.createElement('span');
          t.className = 't';
          t.textContent = prefix + ' ';
          d.appendChild(t);
          d.appendChild(document.createTextNode(line));
        } else {
          d.textContent = line === '' ? ' ' : line;
        }
        box.appendChild(d);
      });
      while (box.childNodes.length > 300) box.removeChild(box.firstChild);
      if (stick) box.scrollTop = box.scrollHeight;
    }

    let lastNews = null;

    function log(msg, cls) {
      print(msg, cls || '', stamp());
      if (cls === 'w' || /^NEWS|^RICH|^POWER/.test(msg)) lastNews = { m: msg, at: S.clock };
    }

    function tickProd(dt) {
      const oc = cap() * 2;
      const mc = cap();
      S.c.forEach((c, i) => {
        if (!c.u) return;
        c.ore = Math.min(oc, c.ore + mineRate(i) * dt);
        const s = Math.min(c.ore, smeltRate(i) * dt, Math.max(0, mc - c.metal));
        c.ore -= s;
        c.metal += s;
      });
    }

    function tickMarket() {
      S.c.forEach((c, i) => {
        const d = COMM[i];
        const before = c.x;
        const tg = d.amp * Math.sin(2 * Math.PI * S.clock / d.period + d.phase);
        c.x = clamp(c.x + 0.045 * (tg - c.x) + d.vol * gauss(), -0.8, 0.9);
        c.dx = c.x - before;
      });
    }

    function sell(i, frac) {
      const c = S.c[i];
      const n = frac >= 1 ? c.metal : Math.floor(c.metal * frac * 100) / 100;
      if (n <= 0) return null;
      const p0 = price(i);
      const k = 0.08 / (COMM[i].liq * impactDiv());
      const f = k * n < 1e-6 ? 1 : (1 - Math.exp(-k * n)) / (k * n);
      const p = p0 * f;
      const gain = n * p * shareMult();
      c.metal -= n;
      S.cash += gain;
      S.earned += gain;
      S.run += gain;
      c.x = Math.max(-0.8, c.x - k * n);
      return { n, p, gain };
    }

    const autoFloor = () => Math.max(1, Math.ceil(cap() * 0.1));

    function autoSell() {
      const b = brokerLv();
      if (!b) return;
      const floor = autoFloor();
      S.c.forEach((c, i) => {
        if (!c.u) return;
        if (c.ovf && c.metal >= cap() * 0.995) {
          const r = sell(i, OVF[c.ovf]);
          if (r) {
            log('STORAGE FULL. BROKER SOLD ' + Math.floor(r.n) + ' ' + COMM[i].sym + ' @ $' + r.p.toFixed(2) + ' = ' + money(r.gain));
            Snd.sfx('sell');
          }
          return;
        }
        const m = AUTO[c.auto];
        if (!m || c.metal < floor) return;
        const p = price(i);
        const th = m * COMM[i].base;
        if (p < th) return;
        if (b >= 3 && c.dx > 0 && p < th * 1.1) return;
        const r = sell(i, AUTO_STAGE[b]);
        if (r) {
          log('BROKER SOLD ' + Math.floor(r.n) + ' ' + COMM[i].sym + ' @ $' + r.p.toFixed(2) + ' = ' + money(r.gain));
          Snd.sfx('sell');
        }
      });
    }

    function fireEvent() {
      S.nextEvent = S.clock + 40 + Math.random() * 40;
      const r = Math.random();
      const active = S.c.map((c, i) => (c.u ? i : -1)).filter(i => i >= 0);
      if (r < 0.18) {
        S.outage = outageLen();
        log('POWER OUTAGE. ALL MINES OFFLINE FOR ' + Math.ceil(S.outage) + 's.', 'w');
        Snd.sfx('alert');
        return;
      }
      if (r < 0.34) {
        const pool = active.filter(i => S.c[i].ml > 0);
        if (pool.length) {
          const i = pool[Math.floor(Math.random() * pool.length)];
          S.boost = { i, t: VEIN_LEN };
          log('RICH VEIN FOUND. ' + COMM[i].sym + ' OUTPUT x2 FOR ' + VEIN_LEN + 's.');
          Snd.sfx('news');
          return;
        }
      }
      const pool = EVENTS.filter(e => S.c[e.i].u);
      const e = pool[Math.floor(Math.random() * pool.length)];
      S.c[e.i].x = clamp(S.c[e.i].x + e.dx, -0.8, 0.9);
      log('NEWS: ' + e.m, e.dx < 0 ? 'w' : '');
      Snd.sfx(e.dx < 0 ? 'alert' : 'news');
    }

    function pushHist() {
      S.c.forEach(c => { c.h.push(c.x); if (c.h.length > HIST_LEN) c.h.shift(); });
    }

    let marketAcc = 0;
    let histAcc = 0;

    function step(dt) {
      tickProd(dt);
      S.clock += dt;
      if (S.outage > 0) {
        S.outage = Math.max(0, S.outage - dt);
        if (S.outage === 0) log('POWER RESTORED.');
      }
      if (S.boost) {
        S.boost.t -= dt;
        if (S.boost.t <= 0) { log('RICH VEIN RAN DRY.'); S.boost = null; }
      }
      marketAcc += dt;
      while (marketAcc >= 1) {
        marketAcc -= 1;
        tickMarket();
        autoSell();
        histAcc++;
        if (histAcc >= HIST_EVERY) { histAcc = 0; pushHist(); }
        if (S.clock >= S.nextEvent) fireEvent();
      }
      const nw = netWorth();
      while (S.milestone < MILESTONES.length && nw >= MILESTONES[S.milestone]) {

      S.outage = 0;
      S.boost = null;
      offlineMul = 0.5;
      for (let k = 0; k < sec; k++) tickProd(1);
      offlineMul = 1;
      S.clock += sec;
      const gained = sum() - before;
      const m = Math.floor(sec / 60);
      log('AWAY ' + (sec < 60 ? sec + 's' : m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm') + '. PRODUCED ' + Math.floor(gained) + ' UNITS WHILE YOU WERE GONE.');

    const bar = (f, w) => {
      const n = Math.round(clamp(f, 0, 1) * w);
      return '[' + '█'.repeat(n) + '░'.repeat(w - n) + ']';
    };

    const TREND = { up: ['▲', 'RISING'], dn: ['▼', 'FALLING'], flat: ['=', 'STEADY'] };

    function setTrend(node, rate) {
      const a = Math.abs(rate || 0);
      let k = node._k;
      if (!k || k === 'flat') k = a > 0.08 ? (rate > 0 ? 'up' : 'dn') : 'flat';
      else k = a < 0.03 ? 'flat' : rate > 0 ? 'up' : 'dn';
      if (node._k === k) return;
      node._k = k;
      node.dataset.g = TREND[k][0];
      node.dataset.w = TREND[k][1];
      node.className = 'tr ' + k;
    }

    function trackTrend(dt) {
      if (dt <= 0 || dt > 1) {
        S.c.forEach(c => { c.po = c.ore; c.pm = c.metal; });
        return;
      }
      const ao = 1 - Math.exp(-dt / 3);
      const am = 1 - Math.exp(-dt / 4);
      S.c.forEach(c => {
        if (c.po === undefined) { c.po = c.ore; c.pm = c.metal; c.eo = 0; c.em = 0; }
        c.eo += ((c.ore - c.po) / dt - c.eo) * ao;
        c.em += ((c.metal - c.pm) / dt - c.em) * am;
        c.po = c.ore;
        c.pm = c.metal;
      });
    }

    const incHist = [];
    let incAcc = 0;

    function trackIncome(dt) {
      incAcc += dt;
      if (incAcc < 1) return;
      incAcc = 0;
      incHist.push(S.run);
      if (incHist.length > 61) incHist.shift();
    }

    const incomeRate = () => (incHist.length > 1 ? Math.max(0, (incHist[incHist.length - 1] - incHist[0]) / (incHist.length - 1)) : 0);

    function digOnce(i) {
      const c = S.c[i];
      if (!c || !c.u) return 0;
      const room = cap() * 2 - c.ore;
      if (room <= 0) return 0;
      const n = Math.min(tapYield(i), room);
      c.ore += n;
      return n;
    }

    const BUYQ = [1, 10, 25, 'max'];
    let buyQ = 0;

    function plan(i, kind) {
      const c = S.c[i];
      const d = COMM[i];
      const l = kind === 'mine' ? c.ml : c.sl;
      const q = BUYQ[buyQ];
      let cost = 0;
      let n = 0;
      if (q === 'max') {
        while (n < 1000) {
          const k = lvlCost(d, kind, l + n);
          if (cost + k > S.cash) break;
          cost += k;
          n++;
        }
        if (n === 0) { cost = lvlCost(d, kind, l); n = 1; }
      } else {
        for (; n < q; n++) cost += lvlCost(d, kind, l + n);
      }
      return { n, cost };
    }

    function buyLevel(i, kind) {
      const c = S.c[i];
      if (!c.u) return 0;
      const pl = plan(i, kind);
      if (S.cash < pl.cost) return 0;
      S.cash -= pl.cost;
      if (kind === 'mine') c.ml += pl.n; else c.sl += pl.n;
      return pl.cost;
    }

      incHist.length = 0;
      S.btc.amt = 0;
      S.btc.cost = 0;
      S.btc.ord = null;
      S.outage = 0;
      S.boost = null;
      S.nextEvent = S.clock + 25;
      S.milestone = 0;
      S.c = COMM.map(freshComm);
      S.c[0].u = true;
      for (let i = 1; i <= BD('fast') && i < COMM.length; i++) S.c[i].u = true;
      log('RESTRUCTURED. +' + g + (g === 1 ? ' SHARE' : ' SHARES') + '. ALL INCOME IS NOW +' + 10 * S.sharesTotal + '%.');
      save();

      dlg.on = true;
      fillDlg();
      dlg.until = performance.now() + 3000;
      dlg.root.classList.add('show');
      tickDlg();
      dlgTimer = setInterval(tickDlg, 200);
      Snd.sfx('alert');
      dlg.cancel.focus();
    }

    function closeDlg() {
      if (!dlg.on) return;
      dlg.on = false;
      clearInterval(dlgTimer);
      dlgTimer = 0;
      dlg.root.classList.remove('show');
      bref.btn.focus();
    }

    function runSeq() {
      if (seq || !dlg.on) return;
      seq = true;
      dlg.on = false;
      clearInterval(dlgTimer);
      dlgTimer = 0;
      dlg.root.classList.remove('show');
      const scr = $('screen');
      scr.style.transformOrigin = '50% ' + Math.round(window.scrollY + window.innerHeight / 2) + 'px';
      Snd.duck(true);
      Snd.sfx('off');
      scr.classList.add('pwroff');
      setTimeout(() => {
        dlg.crt.classList.add('show');
        scr.classList.remove('pwroff');
        scr.style.visibility = 'hidden';
        restructure();
        window.scrollTo(0, 0);
        setTab('ops');
        render();
        [0, 0.45, 0.9].forEach(t => setTimeout(() => Snd.sfx('beep'), t * 1000 + 150));
        setTimeout(() => {
          dlg.crt.classList.remove('show');
          scr.style.visibility = '';
          scr.style.transformOrigin = '50% 0';
          scr.classList.add('pwron');
          Snd.sfx('on');
          setTimeout(() => {
            scr.classList.remove('pwron');
            scr.style.transformOrigin = '';
            Snd.duck(false);
            seq = false;
            render();
          }, 850);
        }, 1500);
      }, 650);
    }

    document.addEventListener('keydown', e => {
      if (seq) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (!dlg.on) return;
      if (e.key === 'Escape') {
        e.preventDefault();
        closeDlg();
      } else if (e.key === 'Tab') {
        const b = [dlg.cancel, dlg.go].filter(x => !x.disabled);
        const i = b.indexOf(document.activeElement);
        e.preventDefault();
        b[(i + (e.shiftKey ? b.length - 1 : 1)) % b.length].focus();
      }
    }, true);

    function unlockComm(i) {
      const c = S.c[i];
      if (c.u || S.cash < COMM[i].unlock) return false;
      S.cash -= COMM[i].unlock;
      c.u = true;
      log(COMM[i].sym + ' DESK OPENED.');
      Snd.sfx('unlock');
      return true;
    }

    function buyResearch(id) {
      const d = RESEARCH.find(x => x.id === id);
      if (!d || d.done() || S.cash < d.cost()) return false;
      S.cash -= d.cost();
      d.buy();
      return true;
    }

    const CMDS = {
      help() {
        S.helped = true;
        print([
          'commands:',
          '  help               this list',
          '  clear              clear the screen',
          '  color [name]       green, amber, ice',
          '  reset              permanently delete all game data'
        ].join('\n'), 'd');
      },
      color(a) {
        const v = (a[0] || '').toLowerCase();
        if (!v) { print('current: ' + S.phos + '. options: ' + PHOS.join(', ') + '.'); return; }
        const p = PHOS.find(x => x.startsWith(v));
        if (!p) { print('options: ' + PHOS.join(', ') + '.', 'd'); Snd.sfx('err'); return; }
        S.phos = p;
        applyTheme();
        save();
        print('color set to ' + p + '.');
      },
      clear() {
        el.tout.textContent = '';
      },
      reset() {
        resetStage = true;
        print([
          'WARNING: this permanently deletes ALL game data:',
          'cash, desks, research, shares, board perks and your bitcoin position.',
          'there is no undo.',
          'to continue, type exactly: ' + RESET_PHRASE,
          'anything else cancels.'
        ].join('\n'), 'w');
      }
    };
    const RESET_PHRASE = 'DELETE ALL MY GAME DATA';
    let resetStage = false;

    function wipeData() {
      wiped = true;
      store.remove(KEY);
      print('all game data deleted. restarting...', 'w');
      setTimeout(() => location.reload(), 900);
    }

    function runCommand(line) {
      if (resetStage) {
        resetStage = false;
        if (line.trim().toUpperCase().replace(/\s+/g, ' ') === RESET_PHRASE) wipeData();
        else print('reset cancelled. nothing was deleted.');
        return;
      }
      const parts = line.trim().split(/\s+/);
      const name = parts.shift().toLowerCase();
      const fn = Object.prototype.hasOwnProperty.call(CMDS, name) ? CMDS[name] : null;
      if (!fn) { print('unknown command: ' + name + '. ' + HINT, 'd'); Snd.sfx('err'); return; }
      fn(parts);
    }

    const history = [];
    let hpos = 0;

    function initTerminal() {
      el.tform.addEventListener('submit', e => {
        e.preventDefault();
        const v = el.tin.value.trim();
        el.tin.value = '';
        if (!v) return;
        history.push(v);
        hpos = history.length;
        const d = document.createElement('div');
        d.className = 'c';
        d.textContent = 'ironline> ' + v;
        el.tout.appendChild(d);
        runCommand(v);
        el.tout.scrollTop = el.tout.scrollHeight;
        render();
      });
      el.tin.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (hpos > 0) hpos--;
          el.tin.value = history[hpos] || '';
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (hpos < history.length) hpos++;
          el.tin.value = history[hpos] || '';
        } else if (e.key === 'Tab') {
          e.preventDefault();
          const v = el.tin.value;
          if (v && v.indexOf(' ') < 0) {
            const m = Object.keys(CMDS).filter(k => k.startsWith(v.toLowerCase()) && k.length > 1);
            if (m.length === 1) el.tin.value = m[0] + ' ';
          }
        }
      });
      if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
        el.tout.addEventListener('click', () => { if (!String(window.getSelection()).length) el.tin.focus({ preventScroll: true }); });
      }
    }

    let holdTimer = null;
    let holdBtn = null;

    function stopHold() {
      if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
      if (holdBtn) { holdBtn.classList.remove('press'); holdBtn = null; }
    }

    function startHold(i, btn) {
      stopHold();
      holdBtn = btn;
      btn.classList.add('press');
      digOnce(i);
      holdTimer = setInterval(() => { digOnce(i); render(); }, 130);
      render();
    }

    let tab = 'ops';

    function setTab(t) {
      tab = t;
      $('cards').hidden = t !== 'ops';
      $('research').hidden = t !== 'res';
      $('markets').hidden = t !== 'mk';
      $('board').hidden = t !== 'bd';
      $('opsbar').hidden = t !== 'ops';
      if (t === 'mk') {
        renderMarkets();
        drawChart();
        if (!BTC.busy && Date.now() - BTC.at > 20000) btcRefresh();
      }
      ['ops', 'res', 'mk', 'bd'].forEach(k => $('tab-' + k).setAttribute('aria-selected', k === t ? 'true' : 'false'));
    }

    function bindUI() {
      const cardsEl = $('cards');
      cardsEl.addEventListener('pointerdown', e => {
        const b = e.target.closest('button[data-act="dig"]');
        if (!b) return;
        startHold(Number(b.closest('.card').dataset.i), b);
      });
      ['pointerup', 'pointercancel', 'blur'].forEach(ev => window.addEventListener(ev, stopHold));
      document.addEventListener('contextmenu', e => { if (e.target.closest('button')) e.preventDefault(); });

      cardsEl.addEventListener('click', e => {
        const b = e.target.closest('button[data-act]');
        if (!b || b.disabled) return;
        const i = Number(b.closest('.card').dataset.i);
        const act = b.dataset.act;
        if (act === 'dig') {
          if (e.detail === 0) digOnce(i);
        } else if (act === 'mine' || act === 'smelt') {
          if (buyLevel(i, act)) Snd.sfx('buy');
        } else if (act === 'half' || act === 'all') {
          const r = sell(i, act === 'all' ? 1 : 0.5);
          if (r) {
            log('SOLD ' + Math.floor(r.n) + ' ' + COMM[i].sym + ' @ $' + r.p.toFixed(2) + ' = ' + money(r.gain));
            Snd.sfx('sell');
          }
        } else if (act === 'auto') {
          const c = S.c[i];
          const al = brokerLv() >= 2 ? AUTO.map((v, k) => k) : AUTO_JUNIOR;
          c.auto = al[(al.indexOf(c.auto) + 1) % al.length];
        } else if (act === 'ovf') {
          S.c[i].ovf = (S.c[i].ovf + 1) % OVF.length;
        } else if (act === 'unlock') {
          unlockComm(i);
        }
        render();
      });

      $('research').addEventListener('click', e => {
        const b = e.target.closest('button[data-act="research"]');
        if (!b || b.disabled) return;
        buyResearch(b.closest('.card').dataset.id);
        render();
      });

      $('board').addEventListener('click', e => {
        const b = e.target.closest('button[data-act]');
        if (!b || b.disabled) return;
        if (b.dataset.act === 'restructure') {
          openDlg();
        } else {
          const id = b.closest('.card').dataset.id;
          const d = BOARD.find(x => x.id === id);
          const l = BD(id);
          if (d && l < d.max && S.shares >= d.cost(l)) {
            S.shares -= d.cost(l);
            S.bd[id] = l + 1;
            log(d.name + ' UPGRADED TO L' + (l + 1) + '.');
            Snd.sfx('unlock');
          }
        }
        render();
      });

      $('markets').addEventListener('click', e => {
        const r = e.target.closest('[data-rng]');
        if (r) {
          BTC.range = r.dataset.rng;
          const c = BTC.cache[BTC.range];
          BTC.pts = c && Date.now() - c.t < 300000 ? c.pts : [];
          BTC.err = false;
          BTC.hover = -1;
          saveChartPrefs();
          renderMarkets();
          drawChart();
          btcRefresh();
          return;
        }
        if (e.target.closest('[data-ct]')) { BTC.type = BTC.type === 'candle' ? 'line' : 'candle'; saveChartPrefs(); renderMarkets(); drawChart(); return; }
        if (e.target.closest('[data-indm]')) {
          const o = mref.menu.classList.toggle('open');
          mref.chip.setAttribute('aria-expanded', o ? 'true' : 'false');
          return;
        }
        const ib = e.target.closest('[data-ind]');
        if (ib) { BTC.ind[ib.dataset.ind] = !BTC.ind[ib.dataset.ind]; saveChartPrefs(); renderMarkets(); drawChart(); return; }
        const os = e.target.closest('[data-os]');
        if (os) { TR.side = os.dataset.os; renderMarkets(); return; }
        const ot = e.target.closest('[data-ot]');
        if (ot) {
          TR.type = ot.dataset.ot;
          if (TR.type === 'limit' && btcLive()) mref.oprice.value = String(Math.round(BTC.price));
          renderMarkets();
          return;
        }
        const b = e.target.closest('[data-mk]');
        if (!b || b.disabled) return;
        if (b.dataset.mk === 'cancel') {
          S.btc.ord = null;
          log('LIMIT ORDER CANCELLED.');
        } else {
          btcGo();
        }
        render();
        renderMarkets();
        drawChart();
      });
      mref.slider.addEventListener('input', () => { TR.amt = Number(mref.slider.value); renderMarkets(); });
      mref.cv.addEventListener('pointermove', e => hoverAt(e.clientX));
      mref.cv.addEventListener('pointerdown', e => hoverAt(e.clientX));
      mref.cv.addEventListener('pointerleave', hoverEnd);
      window.addEventListener('resize', drawChart);
      setInterval(() => { if (!document.hidden && !BTC.busy && (tab === 'mk' || ((S.btc.amt > 0 || S.btc.ord) && Date.now() - BTC.at > 28000))) btcRefresh(); }, 10000);

      $('tbuy').addEventListener('click', e => {
        const b = e.target.closest('button[data-q]');
        if (!b) return;
        buyQ = Number(b.dataset.q);
        $('tbuy').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        render();
      });

      document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

      el.tvol.addEventListener('input', () => {
        Snd.setVol(Number(el.tvol.value) / 100);
        paintVol();
      });
      el.tvol.addEventListener('pointerdown', () => el.tvol.classList.add('drag'));
      ['pointerup', 'pointercancel', 'blur'].forEach(ev => el.tvol.addEventListener(ev, () => el.tvol.classList.remove('drag')));

      el.savebtn.addEventListener('click', () => {
        const ok = save();
        el.savebtn.classList.remove('flash');
        void el.savebtn.offsetWidth;
        el.savebtn.classList.add('flash');
        render();
      });

      el.tmore.addEventListener('click', () => {
        const o = el.mbar.classList.toggle('open');
        el.tmore.setAttribute('aria-expanded', o ? 'true' : 'false');
      });
      document.addEventListener('pointerdown', e => {
        if (mref.menu.classList.contains('open') && !e.target.closest('.mk-menu, [data-indm]')) {
          mref.menu.classList.remove('open');
          mref.chip.setAttribute('aria-expanded', 'false');
        }
        if (el.mbar.classList.contains('open') && !e.target.closest('#mbar')) {
          el.mbar.classList.remove('open');
          el.tmore.setAttribute('aria-expanded', 'false');
        }
      });

      el.tmus.addEventListener('click', () => {
        if (Snd.on && Snd.ctx && Snd.ctx.state !== 'running') {
          Snd.kick();
          setTimeout(() => {
            if (Snd.ctx.state === 'running') disarmWake();
            render();
          }, 400);
          return;
        }
        if (Snd.on || wakeArmed) {
          disarmWake();
          Snd.setOn(false);
        } else if (!Snd.setOn(true)) {
          print('audio is not available in this browser.');
        }
        render();
      });
    }

    let wakeArmed = false;
    const WAKE_EVENTS = ['pointerdown', 'pointerup', 'mousedown', 'click', 'keydown', 'touchend'];

    function wake(e) {
      if (e && e.target && e.target.closest && e.target.closest('#mbar')) return;
      if (!Snd.on) Snd.setOn(true); else Snd.kick();
      render();
      setTimeout(() => {
        if (Snd.ctx && Snd.ctx.state === 'running') disarmWake();
        render();
      }, 400);
    }

    function armWake() {
      if (wakeArmed) return;
      wakeArmed = true;
      WAKE_EVENTS.forEach(ev => window.addEventListener(ev, wake, true));
    }

    function disarmWake() {
      if (!wakeArmed) return;
      wakeArmed = false;
      WAKE_EVENTS.forEach(ev => window.removeEventListener(ev, wake, true));
    }

    function bootLog() {
      print('IRONLINE TERMINAL ONLINE.', 'c');
      print('tap DIG on a desk to mine ore, then sell the metal when the price is HIGH.', 'd');
      print(HINT, 'd');
    }

    let last = Date.now();
    let renderAcc = 0;
    let saveAcc = 0;
    let hintAcc = 0;

    function frame() {
      const now = Date.now();
      let dt = Math.max(0, (now - last) / 1000);
      last = now;
      if (dt > 5) { away(dt); dt = 0; } else step(dt);
      trackTrend(dt);
      trackIncome(dt);
      renderAcc += dt;
      saveAcc += dt;
      hintAcc += dt;
      if (renderAcc >= 0.2 || dt === 0) { renderAcc = 0; render(); }
      if (saveAcc >= 5) { saveAcc = 0; save(); }
      if (hintAcc >= 90) {
        hintAcc = 0;
        if (!S.helped) print(HINT, 'd');
      }
    }

    build();
    initTerminal();
    bindUI();
    applyTheme();

    const pref = (() => { try { return JSON.parse(store.get(AKEY) || 'null'); } catch (e) { return null; } })();
    if (pref && typeof pref.vol === 'number') Snd.vol = clamp(pref.vol, 0, 1);

    const gap = (Date.now() - S.t) / 1000;
    bootLog();
    if (S.fromSave) SV.at = S.t;
    if (S.lostNote) {
      print('your save could not be read. a copy was kept in this browser under ' + KEY + '-backup.', 'w');
    } else if (S.partial) {
      print('part of your save could not be read, the rest was restored.', 'w');
    }
    if (S.resetNote) {
      print('your old save was from an earlier version and has been reset because the economy was rebalanced.', 'w');
    } else if (S.fromSave) {
      print('session restored.', 'd');
      if (gap > 5) away(gap);
    }
    render();

    if (!pref || pref.on) {
      Snd.setOn(true);
      armWake();
      setTimeout(() => {
        if (Snd.ctx && Snd.ctx.state === 'running') disarmWake();
        render();
      }, 700);
    }

    const fsRoot = document.documentElement;
    const fsRequest = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
    const fsExit = document.exitFullscreen || document.webkitExitFullscreen;
    const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

    if (fsRequest && fsExit && document.fullscreenEnabled !== false) {
      const fsBtn = $('tfs');
      fsBtn.hidden = false;
      const fsSync = () => fsBtn.setAttribute('aria-pressed', fsActive() ? 'true' : 'false');
      fsBtn.addEventListener('click', () => {
        try {
          const r = fsActive() ? fsExit.call(document) : fsRequest.call(fsRoot);
          if (r && r.catch) r.catch(() => {});
        } catch (e) {}
      });
      document.addEventListener('fullscreenchange', fsSync);
      document.addEventListener('webkitfullscreenchange', fsSync);
    }

    setInterval(frame, 100);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        save();
        if (Snd.on && Snd.ctx) Snd.ctx.suspend();
        if (Snd.keep) Snd.keep.pause();
      } else if (Snd.on && Snd.ctx) {
        Snd.ctx.resume();
        if (Snd.keep) { const pr = Snd.keep.play(); if (pr && pr.catch) pr.catch(() => {}); }
        setTimeout(() => { if (Snd.on && Snd.ctx.state !== 'running') armWake(); }, 400);
      }
    });
    window.addEventListener('pagehide', save);
  </script>
</body>
</html>
